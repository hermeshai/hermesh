name: relay-image
# The relay image for linux/amd64 and linux/arm64, on Docker Hub
# (hermeshai/hermesh-relay, where the README sends people) and on ghcr.io.
# The tagged release builds on GHCR. Promotion copies the image to Docker Hub.
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
permissions:
  contents: read
  packages: write
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Cross-compiled in the Dockerfile: ARM servers too, no emulation.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/relay/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/hermesh-relay:${{ inputs.version }}

name: promote
# Makes a prerelease that has been tried the latest release: from then on
# every machine and Mac app updates to it, and the install command and the
# relay image's latest are it (docs/development.md, Releasing). Run it by
# hand: gh workflow run promote.yml -f tag=v0.1.2
# Repository secret: DOCKERHUB_TOKEN, as relay-image.yml.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: the prerelease to promote, e.g. v0.1.2
        type: string
        required: true
permissions:
  contents: write
  packages: write
concurrency: release-${{ inputs.tag }}
env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  TAG: ${{ inputs.tag }}
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check the prerelease's files once more
        run: |
          if [ "$(gh release view "$TAG" --json isDraft,isPrerelease --jq '"\(.isDraft) \(.isPrerelease)"')" != "false true" ]; then
            echo "::error::$TAG is not a published prerelease"
            exit 1
          fi
          gh release download "$TAG" --dir "$RUNNER_TEMP/release"
          ./scripts/release-check.sh "$RUNNER_TEMP/release" "$TAG"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          username: hermeshai
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # The image the release built and tried, not a new build.
      - name: the relay image, on Docker Hub and as latest
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          docker buildx imagetools create -t "hermeshai/hermesh-relay:$TAG" -t hermeshai/hermesh-relay:latest \
            -t "ghcr.io/$OWNER/hermesh-relay:latest" "ghcr.io/$OWNER/hermesh-relay:$TAG"
      - name: the latest release
        run: gh release edit "$TAG" --prerelease=false --latest
      - name: what installs read now
        run: |
          for i in $(seq 30); do
            if [ "$(curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/version" 2>/dev/null)" = "${TAG#v}" ]; then
              echo "✓ $TAG is the latest release"
              exit 0
            fi
            sleep 10
          done
          echo "::error::releases/latest does not serve $TAG"
          exit 1

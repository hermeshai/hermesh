name: fixture diagnostic
on:
  push:
    branches: [codex/windows-fixture-startup]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: node --version
      - run: cargo build --manifest-path her/Cargo.toml -p her-cli -p her-mock
      - run: go test ./e2e -count=1 -v -timeout 30m

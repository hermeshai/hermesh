name: release
# A v* tag becomes a release in three steps (docs/development.md, Releasing):
#   1. a draft, with its notes; the builds upload their files to it;
#   2. once every file is there and right (scripts/release-check.sh), a
#      prerelease: nothing installed takes it, only whoever asks for it;
#   3. promoted by hand (promote.yml) once it has been tried: the latest
#      release, which every machine, Mac app and install command then takes.
# A failed run leaves a draft, and the latest release as it was.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
concurrency: release-${{ github.ref_name }}
env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  TAG: ${{ github.ref_name }}
jobs:
  # The version's highlights for users, in English and Chinese, from the app's
  # catalogs (apps/desktop/src/locales/*/releases.json): nothing is built
  # without them, and they become the release's text, with a link to every
  # change since the last release.
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: the draft release, with its notes
        run: |
          node apps/desktop/scripts/release-notes.mjs "$TAG" > "$RUNNER_TEMP/notes.md"
          prev="$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)"
          if [ -n "$prev" ]; then
            printf '\n**All changes**: https://github.com/%s/compare/%s...%s\n' "$GITHUB_REPOSITORY" "$prev" "$TAG" >> "$RUNNER_TEMP/notes.md"
          fi
          case "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || true)" in
            true) gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md" ;; # the workflow run again
            false) echo "::error::$TAG is published already; tag a new version"; exit 1 ;;
            *) gh release create "$TAG" --draft --prerelease --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" ;;
          esac
  binaries:
    needs: notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build and sign
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          umask 077
          printf '%s\n' "$RELEASE_SIGNING_KEY" > /tmp/release.key
          VERSION=${GITHUB_REF_NAME} RELEASE_SIGNING_KEY_FILE=/tmp/release.key ./scripts/release.sh
          rm -f /tmp/release.key
      - run: gh release upload "$TAG" dist/release/* --clobber
  # This version's image, on ghcr.io; promoting the release copies it to
  # Docker Hub, where the README sends people, and makes it latest.
  relay-image:
    needs: notes
    uses: ./.github/workflows/relay-image.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit
  # Hermesh.app (Electron + hermeshd + the signer): Developer ID signing and notarization. Repository secrets needed:
  #   MACOS_DEVELOPER_ID_P12           the "Developer ID Application" certificate exported with its private key as .p12, base64-encoded
  #   MACOS_DEVELOPER_ID_P12_PASSWORD  the password set when exporting the .p12
  #   APPLE_API_KEY_P8                 App Store Connect API key (full text of the .p8 file), used for notarization
  #   APPLE_API_KEY_ID / APPLE_API_ISSUER_ID
  #   MACOS_SIGNER_PROFILE             optional: the signer's Developer ID provisioning profile, base64-encoded (keeps the root key in the Keychain)
  # Official releases require the certificate and notarization key; local builds may omit them.
  # One DMG per architecture for installation, plus the zip and feed installed apps read (docs/desktop-app.md §6.5–6.7).
  mac-app:
    needs: notes
    strategy:
      matrix:
        arch: [arm64, x64]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # the certificate is imported into a temporary keychain, deleted when the job ends
      - name: prepare Developer ID signing and notarization
        env:
          P12: ${{ secrets.MACOS_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          if [ -z "$P12" ]; then
            echo "::error::MACOS_DEVELOPER_ID_P12 is required to sign the release"
            exit 1
          fi
          if [ -z "$API_KEY_P8" ] || [ -z "$API_KEY_ID" ] || [ -z "$API_ISSUER_ID" ]; then
            echo "::error::APPLE_API_KEY_P8, APPLE_API_KEY_ID and APPLE_API_ISSUER_ID are required to notarize the release"
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          umask 077
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/developer-id.p12"
          # let codesign use the key without a prompt (nobody clicks "Allow" in CI)
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' '/Developer ID Application/ { print $2; exit }')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::MACOS_DEVELOPER_ID_P12 holds no \"Developer ID Application\" certificate"
            exit 1
          fi
          echo "HERMESH_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          printf '%s\n' "$API_KEY_P8" > "$RUNNER_TEMP/notary-key.p8"
          {
            echo "HERMESH_NOTARY_KEY_PATH=$RUNNER_TEMP/notary-key.p8"
            echo "HERMESH_NOTARY_KEY_ID=$API_KEY_ID"
            echo "HERMESH_NOTARY_ISSUER=$API_ISSUER_ID"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: corepack enable && pnpm install --frozen-lockfile
      - name: signer provisioning profile
        env:
          PROFILE: ${{ secrets.MACOS_SIGNER_PROFILE }}
        run: |
          if [ -n "$PROFILE" ]; then
            printf '%s' "$PROFILE" | base64 --decode > "$RUNNER_TEMP/signer.provisionprofile"
            echo "HERMESH_SIGNER_PROFILE=$RUNNER_TEMP/signer.provisionprofile" >> "$GITHUB_ENV"
          else
            echo "::warning::MACOS_SIGNER_PROFILE is not set: the signer keeps the root key's Secure Enclave handle in a file"
          fi
      - name: build, sign, notarize
        run: VERSION="${GITHUB_REF_NAME#v}" HERMESH_ARCH=${{ matrix.arch }} node apps/desktop/scripts/build-app.mjs
      # The runner is Apple silicon: it can run the arm64 app.
      - name: check the packaged app
        if: matrix.arch == 'arm64'
        run: HERMESH_DESKTOP_APP="$PWD/dist/Hermesh.app" HERMESH_DESKTOP_DMG="$PWD/dist/Hermesh-macos-arm64.dmg" go test ./e2e -run TestDesktopPackaged -count=1 -v -timeout 15m
      - name: clean up signing keychain and key
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then security delete-keychain "$SIGNING_KEYCHAIN" || true; fi
          rm -f "$RUNNER_TEMP/notary-key.p8"
      - run: gh release upload "$TAG" "dist/Hermesh-macos-${{ matrix.arch }}.dmg" "dist/Hermesh-macos-${{ matrix.arch }}.zip" "dist/RELEASES-darwin-${{ matrix.arch }}.json" --clobber
  # Every file there and right, then a prerelease.
  publish:
    needs: [binaries, relay-image, mac-app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check the draft's files
        run: |
          gh release download "$TAG" --dir "$RUNNER_TEMP/release"
          ./scripts/release-check.sh "$RUNNER_TEMP/release" "$TAG"
      - run: gh release edit "$TAG" --draft=false --prerelease

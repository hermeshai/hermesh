name: ci
on:
  push:
    branches: [main]
  pull_request:
  # By hand, on any branch: Windows work is tried on Windows runners there
  # before it reaches main (docs/windows.md).
  workflow_dispatch:
jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: lint
        run: make lint
      - name: contract compatibility
        if: github.event_name == 'pull_request'
        run: go tool buf breaking --against '.git#branch=origin/main'
      - name: unit tests
        run: make test
      - name: end-to-end (scripted agents)
        run: make e2e
        env:
          # Race-detector binaries on one runner: a data race fails the test.
          HERMESH_E2E_RACE: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
  # Windows (docs/windows.md): what is ported so far.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: unit tests
        run: go test ./cmd/... ./internal/... ./pkg/... -count=1
        env:
          HERMESH_PANEL_SHOTS: ${{ runner.temp }}/panel
      # The signer's panel as the tests drew it, to look at against its design.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signer-panel
          path: ${{ runner.temp }}/panel
          if-no-files-found: ignore
      - name: install.ps1 and the signer
        run: go test ./e2e -run '^(TestWindowsInstall|TestWindowsSigner)$' -count=1 -v
  # Windows on Arm: the signer, whose panel draws through Windows' own APIs.
  windows-arm:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: the signer
        run: go test ./cmd/hermesh-signer -count=1 -v
        env:
          HERMESH_PANEL_SHOTS: ${{ runner.temp }}/panel
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signer-panel-arm64
          path: ${{ runner.temp }}/panel
          if-no-files-found: ignore
  # The end-to-end suite on Windows, being ported (docs/windows.md, W1): its
  # failures do not fail the run yet.
  windows-e2e:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: end-to-end (scripted agents)
        run: go test ./e2e -count=1 -timeout 30m
  # The desktop app (Electron) and the macOS signer: types, unit tests, and
  # their end-to-end tests driving the real app against the real daemon.
  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - name: types and unit tests
        run: make test-app
      - name: end-to-end (desktop app and signer)
        run: go test ./e2e -run 'TestDesktop|TestSigner' -count=1 -v -timeout 30m
  # The desktop app on Windows (docs/windows.md, W2): its end-to-end spec
  # against the real daemon, then the package, installed in Developer Mode
  # with its aliases checked. Its failures do not fail the run yet.
  windows-app:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: end-to-end (desktop app)
        run: go test ./e2e -run '^TestDesktop$' -count=1 -v -timeout 30m
      - name: package
        run: node apps/desktop/scripts/package-win.mjs
      - name: install it, open it, uninstall it
        shell: pwsh
        run: apps/desktop/scripts/check-windows-setup.ps1 dist/Hermesh-windows-x64-setup.exe
      # Two builds, the older updating to the newer from a feed signed with a key of the test's.
      - name: update between two builds
        shell: bash
        run: |
          openssl ecparam -name prime256v1 -genkey -noout -out "$RUNNER_TEMP/test.key"
          openssl ec -in "$RUNNER_TEMP/test.key" -pubout -out "$RUNNER_TEMP/test.pub"
          export HERMESH_UPDATE_FEED=http://127.0.0.1:8765 HERMESH_RELEASE_URL=http://127.0.0.1:8765
          export HERMESH_RELEASE_PUBKEY_FILE="$RUNNER_TEMP/test.pub" RELEASE_SIGNING_KEY_FILE="$RUNNER_TEMP/test.key"
          VERSION=0.0.1 HERMESH_DIST=dist/older node apps/desktop/scripts/package-win.mjs
          VERSION=0.0.2 HERMESH_DIST=dist/newer node apps/desktop/scripts/package-win.mjs
          pwsh -File apps/desktop/scripts/check-windows-update.ps1 dist/older/Hermesh-windows-x64-setup.exe dist/newer 0.0.2
      # For Windows on Arm PCs and VMs (this runner can't run it).
      - name: package for arm64
        run: node apps/desktop/scripts/package-win.mjs
        env:
          HERMESH_ARCH: arm64
      - uses: actions/upload-artifact@v4
        with:
          name: Hermesh-windows-setup
          path: dist/Hermesh-windows-*-setup.exe

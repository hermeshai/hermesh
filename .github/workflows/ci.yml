name: ci
on:
  push:
    branches: [main]
  pull_request:
  # By hand, on any branch: Windows work is tried on Windows runners there
  # before it reaches main (docs/windows.md).
  workflow_dispatch:
jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: lint
        run: make lint
      - name: contract compatibility
        if: github.event_name == 'pull_request'
        run: go tool buf breaking --against '.git#branch=origin/main'
      - name: unit tests
        run: make test
      - name: end-to-end (scripted agents)
        run: make e2e
        env:
          # Race-detector binaries on one runner: a data race fails the test.
          HERMESH_E2E_RACE: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
  # Windows (docs/windows.md): what is ported so far.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: unit tests
        run: go test ./cmd/... ./internal/... ./pkg/... -count=1
      - name: install.ps1 and the signer
        run: go test ./e2e -run '^(TestWindowsInstall|TestWindowsSigner)$' -count=1 -v
  # The end-to-end suite on Windows, being ported (docs/windows.md, W1): its
  # failures do not fail the run yet.
  windows-e2e:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: end-to-end (scripted agents)
        run: go test ./e2e -count=1 -timeout 30m
  # The desktop app (Electron) and the macOS signer: types, unit tests, and
  # their end-to-end tests driving the real app against the real daemon.
  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - name: types and unit tests
        run: make test-app
      - name: end-to-end (desktop app and signer)
        run: go test ./e2e -run 'TestDesktop|TestSigner' -count=1 -v -timeout 30m
  # The desktop app on Windows (docs/windows.md, W2): its end-to-end spec
  # against the real daemon, then the package, installed in Developer Mode
  # with its aliases checked. Its failures do not fail the run yet.
  windows-app:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: end-to-end (desktop app)
        run: go test ./e2e -run '^TestDesktop$' -count=1 -v -timeout 30m
      - name: package
        run: node apps/desktop/scripts/package-win.mjs
      - name: install it and find its programs
        shell: pwsh
        run: |
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v AllowDevelopmentWithoutDevLicense /d 1
          Add-AppxPackage -Register dist\Hermesh-windows-x64\AppxManifest.xml
          $p = Get-AppxPackage Hermesh
          $p | Format-List Name, Version, InstallLocation
          # Aliases don't start in the runner's session (as winget's don't there): they exist, and the programs run.
          foreach ($cli in 'hermesh', 'hermeshd') {
            if (-not (Test-Path "$env:LOCALAPPDATA\Microsoft\WindowsApps\$cli.exe")) { throw "no $cli alias" }
            & (Join-Path $p.InstallLocation "bin\$cli.exe") version
            if ($LASTEXITCODE -ne 0) { throw "$cli" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Hermesh-windows-x64
          path: dist/Hermesh-windows-x64.msix

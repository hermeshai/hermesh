name: ci
on:
  push:
    branches: [perf/verify-ci-concurrency-20261121]

concurrency:
  # Only the opening run and fresh commits share the PR's group.
  group: ci-${{ github.event_name == 'pull_request' && github.run_attempt == '1' && github.event.action != 'reopened' && format('pr-{0}', github.event.number) || github.event_name == 'push' && github.run_attempt == '1' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == '1' && github.event.action == 'synchronize' || github.event_name == 'push' && github.run_attempt == '1' }}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: sleep 240

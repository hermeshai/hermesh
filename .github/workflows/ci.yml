name: ci
on:
  push:
    branches: [main]
  pull_request:
  # By hand, on any branch: Windows work is tried on Windows runners there
  # before it reaches main (docs/windows.md).
  workflow_dispatch:

concurrency:
  # Only the opening run and fresh commits share the PR's group.
  group: ci-${{ github.event_name == 'pull_request' && github.run_attempt == '1' && github.event.action != 'reopened' && format('pr-{0}', github.event.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == '1' && github.event.action == 'synchronize' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.route.outputs.mode }}
      go: ${{ steps.route.outputs.go }}
      screen_linux: ${{ steps.route.outputs.screen_linux }}
      windows: ${{ steps.route.outputs.windows }}
      windows_arm: ${{ steps.route.outputs.windows_arm }}
      windows_e2e: ${{ steps.route.outputs.windows_e2e }}
      app: ${{ steps.route.outputs.app }}
      windows_app: ${{ steps.route.outputs.windows_app }}
      ios: ${{ steps.route.outputs.ios }}
      win_package: ${{ steps.route.outputs.win_package }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Select jobs
        id: route
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Use the base revision's rules. The first PR to add them runs in full.
          router="$RUNNER_TEMP/ci-route.py"
          decision=mode=full
          if [ "$GITHUB_EVENT_NAME" = pull_request ] &&
             git show "$PR_BASE_SHA:scripts/ci/route.py" > "$router" 2>/dev/null &&
             result=$(python3 -I "$router" "$GITHUB_EVENT_NAME" "$PR_BASE_SHA" "$PR_HEAD_SHA"); then
            decision="$result"
          fi
          printf '%s\n' "$decision" | tee -a "$GITHUB_OUTPUT"
      - name: Routing regression tests
        run: python3 -I scripts/ci/test_route.py

  ios-demo:
    needs: changes
    if: needs.changes.outputs.mode == 'full' || needs.changes.outputs.ios == 'true'
    # The app already uses iOS 27.1 layout APIs; macos-latest still selects the 26.x SDK.
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - name: Release reviewer demo, offline state tests and preference isolation
        run: apps/ios/scripts/test-demo.sh "$RUNNER_TEMP/ios-demo"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-demo-release
          path: |
            ${{ runner.temp }}/ios-demo/*.log
            ${{ runner.temp }}/ios-demo/review.xcresult
          if-no-files-found: ignore
  go:
    needs: changes
    if: needs.changes.outputs.mode == 'full' || needs.changes.outputs.go == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: lint
        run: make lint
      - name: contract compatibility
        if: github.event_name == 'pull_request'
        run: go tool buf breaking --against '.git#branch=origin/main'
      - name: unit tests
        run: make test
      - name: installer terminal interaction
        run: python3 scripts/test_install.py
      - name: end-to-end (scripted agents)
        run: make e2e
        env:
          # Race-detector binaries on one runner: a data race fails the test.
          HERMESH_E2E_RACE: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
  # Computer Control's helper for Linux (docs/computer-control-linux.md): its
  # own tests, then end to end on X11, Sway and GNOME in containers.
  screen-linux:
    needs: changes
    if: needs.changes.outputs.mode == 'full' || needs.changes.outputs.screen_linux == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: lint and unit tests
        run: |
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' apps/screen/linux/rust-toolchain.toml)"
          docker run --rm -v "$PWD/apps/screen/linux:/src" -w /src -e RUSTFLAGS="-C target-feature=-crt-static" "rust:$toolchain-alpine" \
            sh -c 'apk add --no-cache build-base nasm >/dev/null && cargo fmt --check && cargo clippy --locked --release --all-targets -- -D warnings && cargo test --locked --release'
      - name: end to end
        run: go test ./e2e -run TestLinuxScreen -count=1 -v -timeout 30m
        env:
          HERMESH_DOCKER: "1"
  # Windows (docs/windows.md): what is ported so far.
  windows:
    needs: changes
    if: needs.changes.outputs.mode == 'full' || needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: unit tests
        run: go test ./cmd/... ./internal/... ./pkg/... -count=1
        env:
          HERMESH_PANEL_SHOTS: ${{ runner.temp }}/panel
      # The signer's panel as the tests drew it, to look at against its design.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signer-panel
          path: ${{ runner.temp }}/panel
          if-no-files-found: ignore
      - name: install.ps1 and the signer
        run: go test ./e2e -run '^(TestWindowsInstall|TestWindowsSigner)$' -count=1 -v
  # Windows on Arm: the signer, whose panel draws through Windows' own APIs.
  windows-arm:
    needs: changes
    if: needs.changes.outputs.mode == 'full' || needs.changes.outputs.windows_arm == 'true'
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: the signer
        run: go test ./cmd/hermesh-signer -count=1 -v
        env:
          HERMESH_PANEL_SHOTS: ${{ runner.temp }}/panel
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signer-panel-arm64
          path: ${{ runner.temp }}/panel
          if-no-files-found: ignore
  # The end-to-end suite on Windows, being ported (docs/windows.md, W1): its
  # failures do not fail the run yet.
  windows-e2e:
    needs: changes
    if: needs.changes.outputs.mode == 'full' || needs.changes.outputs.windows_e2e == 'true'
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: her -> target
          key: ci-windows-e2e-${{ hashFiles('her/rust-toolchain.toml', 'her/.cargo/config.toml') }}
          cache-on-failure: true
      - name: Build Her for its end-to-end tests
        shell: bash
        env:
          NIMBLEOFFICE_TOKEN: ${{ secrets.NIMBLEOFFICE_TOKEN }}
        run: |
          if [ -n "$NIMBLEOFFICE_TOKEN" ]; then
            git config --global url."https://x-access-token:${NIMBLEOFFICE_TOKEN}@github.com/Eliseowzy/nimbleoffice".insteadOf "https://github.com/Eliseowzy/nimbleoffice"
            export CARGO_NET_GIT_FETCH_WITH_CLI=true
          fi
          cargo build --manifest-path her/Cargo.toml -p her-cli -p her-mock
      - name: end-to-end (scripted agents)
        run: go test ./e2e -count=1 -timeout 30m
  # The desktop app (Electron) and the macOS signer: types, unit tests, and
  # their end-to-end tests driving the real app against the real daemon.
  app:
    needs: changes
    if: needs.changes.outputs.mode == 'full' || needs.changes.outputs.app == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - name: types and unit tests
        run: make test-app
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: her -> target
          key: ci-app-${{ hashFiles('her/rust-toolchain.toml', 'her/.cargo/config.toml') }}
          cache-on-failure: true
      - name: Build Her for its dedicated desktop fixtures
        env:
          NIMBLEOFFICE_TOKEN: ${{ secrets.NIMBLEOFFICE_TOKEN }}
        run: |
          if [ -n "$NIMBLEOFFICE_TOKEN" ]; then
            git config --global url."https://x-access-token:${NIMBLEOFFICE_TOKEN}@github.com/Eliseowzy/nimbleoffice".insteadOf "https://github.com/Eliseowzy/nimbleoffice"
            export CARGO_NET_GIT_FETCH_WITH_CLI=true
          fi
          cargo build --manifest-path her/Cargo.toml -p her-cli -p her-mock
      - name: end-to-end (desktop app and signer)
        run: go test ./e2e -run 'TestDesktop|TestSigner' -count=1 -v -timeout 30m
  # The desktop app on Windows (docs/windows.md, W2): its end-to-end spec
  # against the real daemon, then the package, installed in Developer Mode
  # with its aliases checked. Its failures do not fail the run yet.
  windows-app:
    needs: changes
    if: needs.changes.outputs.mode == 'full' || needs.changes.outputs.windows_app == 'true'
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: end-to-end (desktop app)
        run: go test ./e2e -run '^TestDesktop$' -count=1 -v -timeout 30m
      # The PPT and Word engines are a private repository (her/Cargo.toml): cargo fetches it with this token.
      - name: Read access to the NimbleOffice fork
        shell: bash
        env:
          NIMBLEOFFICE_TOKEN: ${{ secrets.NIMBLEOFFICE_TOKEN }}
        run: |
          if [ -z "$NIMBLEOFFICE_TOKEN" ]; then
            echo "::warning::NIMBLEOFFICE_TOKEN is not set: cargo cannot fetch github.com/Eliseowzy/nimbleoffice"
            exit 0
          fi
          git config --global url."https://x-access-token:${NIMBLEOFFICE_TOKEN}@github.com/Eliseowzy/nimbleoffice".insteadOf "https://github.com/Eliseowzy/nimbleoffice"
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: her -> target
          key: ci-windows-app-${{ hashFiles('her/rust-toolchain.toml', 'her/.cargo/config.toml') }}
          cache-on-failure: true
      # her is built once, with the profile that takes the least of this job's time.
      - name: package
        run: node apps/desktop/scripts/package-win.mjs
        env:
          HERMESH_HER_PROFILE: release
      - name: install it, open it, uninstall it
        shell: pwsh
        run: apps/desktop/scripts/check-windows-setup.ps1 dist/Hermesh-windows-x64-setup.exe
      # Two builds, the older updating to the newer from a feed signed with a key of the test's.
      - name: update between two builds
        shell: bash
        run: |
          openssl ecparam -name prime256v1 -genkey -noout -out "$RUNNER_TEMP/test.key"
          openssl ec -in "$RUNNER_TEMP/test.key" -pubout -out "$RUNNER_TEMP/test.pub"
          export HERMESH_UPDATE_FEED=http://127.0.0.1:8765 HERMESH_RELEASE_URL=http://127.0.0.1:8765
          export HERMESH_RELEASE_PUBKEY_FILE="$RUNNER_TEMP/test.pub" RELEASE_SIGNING_KEY_FILE="$RUNNER_TEMP/test.key"
          export HER=her/target/x86_64-pc-windows-msvc/release/her.exe
          VERSION=0.0.1 HERMESH_DIST=dist/older node apps/desktop/scripts/package-win.mjs
          VERSION=0.0.2 HERMESH_DIST=dist/newer node apps/desktop/scripts/package-win.mjs
          pwsh -File apps/desktop/scripts/check-windows-update.ps1 dist/older/Hermesh-windows-x64-setup.exe dist/newer 0.0.2
      # For Windows on Arm PCs and VMs (this runner can't run it).
      - name: package for arm64
        if: needs.changes.outputs.mode == 'full' || needs.changes.outputs.win_package == 'true'
        run: node apps/desktop/scripts/package-win.mjs
        env:
          HERMESH_ARCH: arm64
          HERMESH_HER_PROFILE: release
      - uses: actions/upload-artifact@v4
        with:
          name: Hermesh-windows-setup
          path: dist/Hermesh-windows-*-setup.exe

  ci-ok:
    if: always()
    needs: [changes, go, screen-linux, windows, windows-arm, app, ios-demo]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Reject cancelled runs
        if: cancelled()
        run: |
          echo "::error::CI was cancelled"
          exit 1
      - name: Check required job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -e '
            . as $needs | .changes as $changes | $changes.outputs.mode as $mode
            | if $changes.result != "success" then error("changes: \($changes.result)")
              elif $mode != "full" and $mode != "routed" then error("Invalid CI mode: \($mode)")
              else
                {go: "go", "screen-linux": "screen_linux", windows: "windows",
                 "windows-arm": "windows_arm", app: "app", "ios-demo": "ios"}
                | to_entries
                | map(.key as $job
                    | $changes.outputs[.value] as $flag
                    | (if $mode == "full" or $flag == "true" then "success"
                       elif $flag == "false" then "skipped"
                       else error("\($job): missing or invalid routing flag") end) as $expected
                    | $needs[$job].result as $actual
                    | if $actual == $expected then "\($job): \($actual)"
                      else error("\($job): expected \($expected), got \($actual)") end)
              end
          ' <<< "$NEEDS"

name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run all checks and the full integration suites
        type: boolean
        default: false

concurrency:
  # A refreshed PR includes its previous changes. Each push has a separate diff.
  group: ci-${{ github.event_name == 'pull_request' && github.run_attempt == '1' && github.event.action != 'reopened' && format('pr-{0}', github.event.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == '1' && github.event.action == 'synchronize' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.route.outputs.mode }}
      go: ${{ steps.route.outputs.go }}
      screen_linux: ${{ steps.route.outputs.screen_linux }}
      windows: ${{ steps.route.outputs.windows }}
      windows_arm: ${{ steps.route.outputs.windows_arm }}
      windows_e2e: ${{ steps.route.outputs.windows_e2e }}
      app: ${{ steps.route.outputs.app }}
      windows_app: ${{ steps.route.outputs.windows_app }}
      ios: ${{ steps.route.outputs.ios }}
      ios_suite: ${{ steps.route.outputs.ios_suite }}
      packaging: ${{ steps.route.outputs.packaging }}
      mac_native: ${{ steps.route.outputs.mac_native }}
      go_macos: ${{ steps.route.outputs.go_macos }}
      go_e2e: ${{ steps.route.outputs.go_e2e }}
      her_integration: ${{ steps.route.outputs.her_integration }}
      desktop_e2e: ${{ steps.route.outputs.desktop_e2e }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: ${{ github.event_name == 'push' }}
      - name: Select jobs
        id: route
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FULL: ${{ inputs.full }}
        run: |
          router=scripts/ci/route.py
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            router="$RUNNER_TEMP/ci-route.py"
            git show "$BASE:scripts/ci/route.py" > "$router" || true
          elif [ "$GITHUB_EVENT_NAME" = push ] && ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE" || true
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            BASE=$(git rev-parse HEAD^ 2>/dev/null) || BASE=''
          fi
          decision=mode=full
          if [ "$FULL" != true ] &&
             result=$(python3 -I "$router" "$GITHUB_EVENT_NAME" "$BASE" "$HEAD_SHA") &&
             grep -Eq '^packaging=(true|false)$' <<< "$result"; then
            decision="$result"
          fi
          printf '%s\n' "$decision" | tee -a "$GITHUB_OUTPUT"
      - name: Validate Her public content and generated reference
        if: steps.route.outputs.mode == 'full' || steps.route.outputs.her_static == 'true'
        run: |
          sh her/tools/check-public.sh
          node her/tools/gen-protocol-docs.mjs --check
      - name: Routing regression tests
        run: python3 -I scripts/ci/test_route.py

  ios-demo:
    needs: changes
    if: needs.changes.outputs.mode == 'full' || needs.changes.outputs.ios == 'true'
    # The app already uses iOS 27.1 layout APIs; macos-latest still selects the 26.x SDK.
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - name: Review demo on the simulator
        env:
          SUITE: ${{ inputs.full && 'full' || needs.changes.outputs.ios_suite || 'smoke' }}
        run: apps/ios/scripts/test-demo.sh "$RUNNER_TEMP/ios-demo" "$SUITE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-demo-release
          path: |
            ${{ runner.temp }}/ios-demo/*.log
            ${{ runner.temp }}/ios-demo/review.xcresult
          if-no-files-found: ignore
  go:
    needs: changes
    if: needs.changes.outputs.mode == 'full' || needs.changes.outputs.go == 'true'
    strategy:
      matrix:
        os: ${{ fromJSON((needs.changes.outputs.mode == 'full' || needs.changes.outputs.go_macos == 'true') && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: lint
        run: make lint
      - name: contract compatibility
        if: github.event_name == 'pull_request'
        run: go tool buf breaking --against '.git#branch=origin/main'
      - name: unit tests
        run: make test
      - name: installer terminal interaction
        run: python3 scripts/test_install.py
      - name: end-to-end (scripted agents)
        if: inputs.full || needs.changes.outputs.go_e2e == 'true'
        run: make e2e
        env:
          # Race-detector binaries on one runner: a data race fails the test.
          HERMESH_E2E_RACE: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
      - name: Relay, daemon and CLI user journey
        if: ${{ !inputs.full && needs.changes.outputs.go_e2e != 'true' }}
        run: go test ./e2e -run '^Test(UserJourney|MobileNetwork)$' -count=1 -timeout 10m
  # Computer Control's helper for Linux (docs/computer-control-linux.md): its
  # own tests, then end to end on X11, Sway and GNOME in containers.
  screen-linux:
    needs: changes
    if: needs.changes.outputs.mode == 'full' || needs.changes.outputs.screen_linux == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: lint and unit tests
        run: |
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' apps/screen/linux/rust-toolchain.toml)"
          docker run --rm -v "$PWD/apps/screen/linux:/src" -w /src -e RUSTFLAGS="-C target-feature=-crt-static" "rust:$toolchain-alpine" \
            sh -c 'apk add --no-cache build-base nasm >/dev/null && cargo fmt --check && cargo clippy --locked --release --all-targets -- -D warnings && cargo test --locked --release'
      - name: end to end
        run: go test ./e2e -run TestLinuxScreen -count=1 -v -timeout 30m
        env:
          HERMESH_DOCKER: "1"
  # Windows (docs/windows.md): what is ported so far.
  windows:
    needs: changes
    if: needs.changes.outputs.mode == 'full' || needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: unit tests
        run: go test ./cmd/... ./internal/... ./pkg/... -count=1
        env:
          HERMESH_PANEL_SHOTS: ${{ runner.temp }}/panel
      # The signer's panel as the tests drew it, to look at against its design.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signer-panel
          path: ${{ runner.temp }}/panel
          if-no-files-found: ignore
      - name: install.ps1 and the signer
        run: go test ./e2e -run '^(TestWindowsInstall|TestWindowsSigner)$' -count=1 -v
  # Windows on Arm: the signer, whose panel draws through Windows' own APIs.
  windows-arm:
    needs: changes
    if: needs.changes.outputs.mode == 'full' || needs.changes.outputs.windows_arm == 'true'
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: the signer
        run: go test ./cmd/hermesh-signer -count=1 -v
        env:
          HERMESH_PANEL_SHOTS: ${{ runner.temp }}/panel
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signer-panel-arm64
          path: ${{ runner.temp }}/panel
          if-no-files-found: ignore
  # The end-to-end suite on Windows, being ported (docs/windows.md, W1): its
  # failures do not fail the run yet.
  windows-e2e:
    needs: changes
    if: inputs.full || needs.changes.outputs.windows_e2e == 'true'
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: her -> target
          key: ci-windows-e2e-${{ hashFiles('her/rust-toolchain.toml', 'her/.cargo/config.toml') }}
          cache-on-failure: true
      - name: Build Her for its end-to-end tests
        shell: bash
        env:
          NIMBLEOFFICE_TOKEN: ${{ secrets.NIMBLEOFFICE_TOKEN }}
        run: |
          if [ -n "$NIMBLEOFFICE_TOKEN" ]; then
            git config --global url."https://x-access-token:${NIMBLEOFFICE_TOKEN}@github.com/Eliseowzy/nimbleoffice".insteadOf "https://github.com/Eliseowzy/nimbleoffice"
            export CARGO_NET_GIT_FETCH_WITH_CLI=true
          fi
          cargo build --manifest-path her/Cargo.toml -p her-cli -p her-mock
      - name: end-to-end (scripted agents)
        run: go test ./e2e -count=1 -timeout 30m
  # Type checks, desktop unit tests and Electron against the real daemon.
  app:
    needs: changes
    if: needs.changes.outputs.mode == 'full' || needs.changes.outputs.app == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - name: types and unit tests
        run: make test-app-js
      - name: Cache Cargo dependencies
        if: inputs.full || needs.changes.outputs.her_integration == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: her -> target
          key: ci-app-${{ hashFiles('her/rust-toolchain.toml', 'her/.cargo/config.toml') }}
          cache-on-failure: true
      - name: Build Her for its dedicated desktop fixtures
        if: inputs.full || needs.changes.outputs.her_integration == 'true'
        env:
          NIMBLEOFFICE_TOKEN: ${{ secrets.NIMBLEOFFICE_TOKEN }}
        run: |
          if [ -n "$NIMBLEOFFICE_TOKEN" ]; then
            git config --global url."https://x-access-token:${NIMBLEOFFICE_TOKEN}@github.com/Eliseowzy/nimbleoffice".insteadOf "https://github.com/Eliseowzy/nimbleoffice"
            export CARGO_NET_GIT_FETCH_WITH_CLI=true
          fi
          cargo build --manifest-path her/Cargo.toml -p her-cli -p her-mock
      - name: end-to-end (Her consent and coding agents)
        if: inputs.full || needs.changes.outputs.her_integration == 'true'
        run: |
          test -x her/target/debug/her
          test -x her/target/debug/her-mock
          go test ./e2e -run '^Test(HerConsentRefusalAllowsDirectCodingAndMobileAnswers|HerCodingHandoffRespectsApprovalAndGrant|CodingAgentAnswerRejection|PushHerNotices)$' -count=1 -v -timeout 10m
      - name: Custom MCP connectors through the owner and execution host
        if: inputs.full || needs.changes.outputs.her_integration == 'true'
        run: go test ./e2e -run '^TestHerCommandConnector$' -count=1 -v -timeout 5m
      - name: Custom MCP connectors in the console
        if: inputs.full || needs.changes.outputs.her_integration == 'true'
        run: pnpm --filter @hermesh/her-console e2e --grep 'custom HTTP and stdio connectors'
      - name: Electron shell against the daemon
        if: ${{ !inputs.full && needs.changes.outputs.desktop_e2e != 'true' }}
        run: go test ./e2e -run '^TestDesktop$/^shell$' -count=1 -v -timeout 10m
      - name: end-to-end (desktop app and signer)
        if: inputs.full || needs.changes.outputs.desktop_e2e == 'true'
        run: go test ./e2e -run 'TestDesktop|TestSigner' -count=1 -v -timeout 30m
  windows-app:
    needs: changes
    if: needs.changes.outputs.mode == 'full' || needs.changes.outputs.windows_app == 'true'
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: end-to-end (desktop app)
        run: go test ./e2e -run '^TestDesktop$' -count=1 -v -timeout 30m

  mac-native:
    needs: changes
    if: needs.changes.outputs.mode == 'full' || needs.changes.outputs.mac_native == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: swift test --package-path apps/screen/macos
      - run: swift test --package-path apps/signer/macos
      - run: go test ./e2e -run '^TestSignerApp$' -count=1 -v -timeout 10m

  packaging:
    needs: changes
    if: needs.changes.outputs.mode == 'full' || needs.changes.outputs.packaging == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate release workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -shellcheck= -pyflakes= .github/workflows/{release,relay-image,promote}.yml
      - name: Check packaging scripts and test their dependencies
        run: |
          for file in apps/desktop/scripts/*.mjs; do node --check "$file"; done
          for file in scripts/release*.sh apps/ios/scripts/testflight.sh; do bash -n "$file"; done
          node --test apps/desktop/scripts/*.test.mjs
      - name: Parse installer checks
        shell: pwsh
        run: |
          Get-ChildItem apps/desktop/scripts/*.ps1 | ForEach-Object {
            $errors = $null
            $null = [Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors) { throw ($errors -join "`n") }
          }

  ci-ok:
    if: always()
    needs: [changes, go, screen-linux, windows, windows-arm, app, ios-demo, mac-native, packaging]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Reject cancelled runs
        if: cancelled()
        run: |
          echo "::error::CI was cancelled"
          exit 1
      - name: Check required job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -e '
            . as $needs | .changes as $changes | $changes.outputs.mode as $mode
            | if $changes.result != "success" then error("changes: \($changes.result)")
              elif $mode != "full" and $mode != "routed" then error("Invalid CI mode: \($mode)")
              else
                {go: "go", "screen-linux": "screen_linux", windows: "windows",
                 "windows-arm": "windows_arm", app: "app", "ios-demo": "ios",
                 "mac-native": "mac_native", packaging: "packaging"}
                | to_entries
                | map(.key as $job
                    | $changes.outputs[.value] as $flag
                    | (if $mode == "full" or $flag == "true" then "success"
                       elif $flag == "false" then "skipped"
                       else error("\($job): missing or invalid routing flag") end) as $expected
                    | $needs[$job].result as $actual
                    | if $actual == $expected then "\($job): \($actual)"
                      else error("\($job): expected \($expected), got \($actual)") end)
              end
          ' <<< "$NEEDS"

syntax = "proto3";

package hermesh.session.v1;

import "google/protobuf/timestamp.proto";
import "hermesh/identity/v1/identity.proto";
import "hermesh/options/v1/options.proto";

// SessionService is the unified session and provider control plane served both
// on each execution machine (over E2E tunnels) and on each owner device (over
// local IPC / loopback with local projection caching and offline outbox).
service SessionService {
  rpc ListProviders(ListProvidersRequest) returns (ListProvidersResponse) {
    option (hermesh.options.v1.access) = ACCESS_READ;
  }
  rpc UpsertProviderInstance(UpsertProviderInstanceRequest) returns (UpsertProviderInstanceResponse) {
    option (hermesh.options.v1.access) = ACCESS_WRITE;
  }
  rpc RemoveProviderInstance(RemoveProviderInstanceRequest) returns (RemoveProviderInstanceResponse) {
    option (hermesh.options.v1.access) = ACCESS_WRITE;
  }

  rpc StartSession(StartSessionRequest) returns (StartSessionResponse) {
    option (hermesh.options.v1.access) = ACCESS_WRITE;
  }
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse) {
    option (hermesh.options.v1.access) = ACCESS_READ;
  }
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse) {
    option (hermesh.options.v1.access) = ACCESS_READ;
  }
  rpc WatchSessions(WatchSessionsRequest) returns (stream WatchSessionsResponse) {
    option (hermesh.options.v1.access) = ACCESS_READ;
  }
  rpc SubscribeSession(SubscribeSessionRequest) returns (stream SessionEvent) {
    option (hermesh.options.v1.access) = ACCESS_READ;
  }

  rpc DispatchMessage(DispatchMessageRequest) returns (DispatchMessageResponse) {
    option (hermesh.options.v1.access) = ACCESS_WRITE;
  }
  // DeliverMessage delivers a cryptographically signed inbox.v1.Message from
  // another agent of the owner into the session.
  rpc DeliverMessage(DeliverMessageRequest) returns (DeliverMessageResponse) {
    option (hermesh.options.v1.access) = ACCESS_WRITE;
  }
  rpc InterruptSession(InterruptSessionRequest) returns (InterruptSessionResponse) {
    option (hermesh.options.v1.access) = ACCESS_WRITE;
  }
  rpc StopBackgroundTask(StopBackgroundTaskRequest) returns (StopBackgroundTaskResponse) {
    option (hermesh.options.v1.access) = ACCESS_WRITE;
  }
  rpc ManageQueue(ManageQueueRequest) returns (ManageQueueResponse) {
    option (hermesh.options.v1.access) = ACCESS_WRITE;
  }
  rpc UpdateSession(UpdateSessionRequest) returns (UpdateSessionResponse) {
    option (hermesh.options.v1.access) = ACCESS_WRITE;
  }
  rpc RespondRuntimeRequest(RespondRuntimeRequestRequest) returns (RespondRuntimeRequestResponse) {
    option (hermesh.options.v1.access) = ACCESS_WRITE;
  }

  rpc ListCheckpoints(ListCheckpointsRequest) returns (ListCheckpointsResponse) {
    option (hermesh.options.v1.access) = ACCESS_READ;
  }
  rpc RollbackCheckpoint(RollbackCheckpointRequest) returns (RollbackCheckpointResponse) {
    option (hermesh.options.v1.access) = ACCESS_WRITE;
  }
  rpc GetDiff(GetDiffRequest) returns (GetDiffResponse) {
    option (hermesh.options.v1.access) = ACCESS_READ;
  }
  rpc ForkSession(ForkSessionRequest) returns (ForkSessionResponse) {
    option (hermesh.options.v1.access) = ACCESS_WRITE;
  }
  rpc DeleteSession(DeleteSessionRequest) returns (DeleteSessionResponse) {
    option (hermesh.options.v1.access) = ACCESS_WRITE;
  }

  rpc UploadBlob(UploadBlobRequest) returns (UploadBlobResponse) {
    option (hermesh.options.v1.access) = ACCESS_WRITE;
  }
  rpc DownloadBlob(DownloadBlobRequest) returns (DownloadBlobResponse) {
    option (hermesh.options.v1.access) = ACCESS_READ;
  }
  rpc ListOutbox(ListOutboxRequest) returns (ListOutboxResponse) {
    option (hermesh.options.v1.access) = ACCESS_READ;
  }

  // A session's files (docs/session-files.md §6), read when opened: as a turn
  // left them (its checkpoint), or as they are now. Only the session's folder.
  rpc ResolveFiles(ResolveFilesRequest) returns (ResolveFilesResponse) {
    option (hermesh.options.v1.access) = ACCESS_READ;
  }
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse) {
    option (hermesh.options.v1.access) = ACCESS_READ;
  }
  rpc ReadFile(ReadFileRequest) returns (ReadFileResponse) {
    option (hermesh.options.v1.access) = ACCESS_READ;
  }
  rpc ReadFileBytes(ReadFileBytesRequest) returns (ReadFileBytesResponse) {
    option (hermesh.options.v1.access) = ACCESS_READ;
  }
}

enum SessionStatus {
  SESSION_STATUS_UNSPECIFIED = 0;
  SESSION_STATUS_QUEUED = 1;
  SESSION_STATUS_PREPARING = 2;
  SESSION_STATUS_RUNNING = 3;
  SESSION_STATUS_IDLE = 4;
  // Read-only: no messages until unarchived.
  SESSION_STATUS_ARCHIVED = 5;
  reserved 6, 7;
  // The last run failed or crashed; the next message continues in the session.
  SESSION_STATUS_CRASHED = 8;
  // A run is paused waiting on a RuntimeRequest (approval, question, plan, or secret).
  SESSION_STATUS_WAITING_INPUT = 9;
}

// FailureKind classifies why a run or session failed.
enum FailureKind {
  FAILURE_KIND_UNSPECIFIED = 0;
  FAILURE_KIND_AUTH = 1;
  FAILURE_KIND_QUOTA = 2;
  FAILURE_KIND_RATE_LIMIT = 3;
  FAILURE_KIND_PROVIDER_ERROR = 4;
  FAILURE_KIND_NETWORK = 5;
  FAILURE_KIND_CONTEXT_OVERFLOW = 6;
  FAILURE_KIND_MODEL_UNAVAILABLE = 7;
  FAILURE_KIND_INVALID_REQUEST = 8;
  FAILURE_KIND_REFUSED = 9;
  FAILURE_KIND_LIMIT_REACHED = 10;
  FAILURE_KIND_RESUME_REJECTED = 11;
  FAILURE_KIND_AGENT_CRASHED = 12;
  FAILURE_KIND_STALLED = 13;
  FAILURE_KIND_TIMEOUT = 14;
  FAILURE_KIND_START_FAILED = 15;
  FAILURE_KIND_UNKNOWN = 16;
  FAILURE_KIND_INTERRUPTED = 17;
  FAILURE_KIND_BASE_REF_UNAVAILABLE = 18;
}

message Failure {
  FailureKind kind = 1;
  string message = 2;
  bool retryable = 3;
  uint32 retry_after_seconds = 4;
  string hint = 5;
  uint32 http_status = 6;
}

enum ActorKind {
  ACTOR_KIND_UNSPECIFIED = 0;
  ACTOR_KIND_OWNER = 1;
  ACTOR_KIND_HER = 2;
  ACTOR_KIND_EXTERNAL_AGENT = 3;
  ACTOR_KIND_SUBAGENT = 4;
  ACTOR_KIND_SYSTEM = 5;
}

message Actor {
  ActorKind kind = 1;
  string id = 2;
  string label = 3;
  string grant_id = 4;
}

enum InteractionMode {
  INTERACTION_MODE_UNSPECIFIED = 0;
  INTERACTION_MODE_CODE = 1;
  INTERACTION_MODE_PLAN = 2;
}

message OptionValue {
  oneof kind {
    string string_value = 1;
    bool bool_value = 2;
  }
}

message ModelSelection {
  string instance_id = 1;
  string model = 2;
  map<string, OptionValue> options = 3;
}

enum OptionDescriptorType {
  OPTION_DESCRIPTOR_TYPE_UNSPECIFIED = 0;
  OPTION_DESCRIPTOR_TYPE_SELECT = 1;
  OPTION_DESCRIPTOR_TYPE_BOOLEAN = 2;
}

message OptionChoice {
  string id = 1;
  string label = 2;
  string description = 3;
  bool is_default = 4;
}

message OptionDescriptor {
  string id = 1;
  string label = 2;
  string description = 3;
  OptionDescriptorType type = 4;
  string role = 5;
  repeated OptionChoice choices = 6;
  OptionValue current_value = 7;
}

message ProviderCapabilities {
  bool in_session_model_switch = 1;
  bool in_session_option_switch = 2;
  bool in_session_mode_switch = 3;
  bool mid_turn_steer = 4;
  bool live_approval = 5;
  bool live_user_input = 6;
  bool native_resume = 7;
  bool native_fork = 8;
  bool conversation_rollback = 9;
  bool supports_images = 10;
  bool supports_files = 11;
  bool reports_context_window = 12;
  repeated hermesh.identity.v1.RuntimeMode supported_runtime_modes = 13;
}

message ModelCatalogEntry {
  string slug = 1;
  string name = 2;
  string short_name = 3;
  string badge = 4;
  bool is_custom = 5;
  bool is_default = 6;
  bool is_legacy = 7;
  string min_cli_version = 8;
  repeated OptionDescriptor option_descriptors = 9;
}

message SlashCommand {
  string name = 1;
  string description = 2;
  string input_hint = 3;
}

message SkillEntry {
  string name = 1;
  string description = 2;
  string path = 3;
  bool user_invocable = 4;
}

enum CompatibilityStatus {
  COMPATIBILITY_STATUS_UNSPECIFIED = 0;
  COMPATIBILITY_STATUS_SUPPORTED = 1;
  COMPATIBILITY_STATUS_GRACEFUL = 2;
  COMPATIBILITY_STATUS_UNSUPPORTED = 3;
  COMPATIBILITY_STATUS_BROKEN = 4;
}

message ProviderInstance {
  string instance_id = 1;
  string driver = 2;
  string acp_flavor = 3;
  string display_name = 4;
  bool enabled = 5;
  bool installed = 6;
  bool authenticated = 7;
  string auth_label = 8;
  string version = 9;
  CompatibilityStatus compatibility = 10;
  string compatibility_message = 11;
  ProviderCapabilities capabilities = 12;
  repeated ModelCatalogEntry models = 13;
  repeated OptionDescriptor workspace_options = 14;
  repeated SlashCommand slash_commands = 15;
  repeated SkillEntry skills = 16;
  string binary_path = 17;
  repeated string launch_args = 18;
  map<string, string> redacted_env = 19;
}

message ProviderInstanceConfig {
  string instance_id = 1;
  string driver = 2;
  string acp_flavor = 3;
  string display_name = 4;
  bool enabled = 5;
  string binary_path = 6;
  repeated string launch_args = 7;
  map<string, string> env = 8;
  repeated string custom_models = 9;
}

message WorkspaceStrategy {
  hermesh.identity.v1.Workspace mode = 1;
  string base_ref = 2;
  string branch = 3;
  string worktree_path = 4;
  bool from_remote = 5;
}

message SessionLineage {
  string parent_session_id = 1;
  uint32 forked_from_run_ordinal = 2;
  string relationship = 3;
  bool controllable = 4;
}

message ContextWindowUsage {
  uint64 input_tokens = 1;
  uint64 output_tokens = 2;
  uint64 cache_read_tokens = 3;
  uint64 context_used_tokens = 4;
  uint64 context_limit_tokens = 5;
}

message DiffStat {
  uint32 files_changed = 1;
  uint32 insertions = 2;
  uint32 deletions = 3;
}

message Usage {
  uint64 input_tokens = 1;
  uint64 output_tokens = 2;
  double cost_usd = 3;
}

// What a trusted device is told on its lock screen, sealed to its notice key.
message Notice {
  // "question", "failure", "turn_done", "session_started", "pairing" or "her".
  string kind = 1;
  google.protobuf.Timestamp at = 2;
  string session_id = 3;
  string title = 4;
  string grant = 5;
  string agent = 6;
  string project = 7;
  string machine = 8;
  Question question = 9;
  FailureKind failure = 10;
  string failure_message = 11;
  uint32 turn = 12;
  DiffStat diff_stat = 13;
  hermesh.identity.v1.PairingKind pairing_kind = 14;
  string pairing_label = 15;
  string verification_code = 16;
  string pairing_code = 17;
  string her_kind = 18;
  string machine_id = 19;
  string bot_id = 20;
  string bot_name = 21;
  string text = 22;
}

message Question {
  string question_id = 1;
  uint32 turn = 2;
  repeated QuestionItem items = 3;
  google.protobuf.Timestamp asked_at = 4;
  google.protobuf.Timestamp expires_at = 5;
  bool local_answer_available = 6;
}

message QuestionItem {
  string id = 1;
  string header = 2;
  string text = 3;
  repeated QuestionOption options = 4;
  bool multi_select = 5;
  bool allow_other = 6;
  bool secret = 7;
  bool optional = 8;
}

message QuestionOption {
  string label = 1;
  string description = 2;
  string id = 3;
}

message Answer {
  string item_id = 1;
  repeated string selected = 2;
  string text = 3;
}

enum QuestionResolution {
  QUESTION_RESOLUTION_UNSPECIFIED = 0;
  QUESTION_RESOLUTION_ANSWERED = 1;
  QUESTION_RESOLUTION_DECLINED = 2;
  QUESTION_RESOLUTION_TIMED_OUT = 3;
  QUESTION_RESOLUTION_CANCELLED = 4;
}

message QuestionResolved {
  string question_id = 1;
  QuestionResolution resolution = 2;
  string by = 3;
  repeated Answer answers = 4;
}

message SessionProgress {
  uint32 turn_count = 1;
  string phase = 2;
  string last_message_excerpt = 3;
  string current_tool = 4;
  DiffStat diff_stat = 5;
  Usage usage = 6;
  uint64 last_event_seq = 7;
  Failure last_failure = 8;
  Question pending_question = 9;
  google.protobuf.Timestamp turn_started_at = 10;
}

// Session is the unified coding-agent session record across all initiators
// (owner UI, Her, MCP, CLI).
message Session {
  string session_id = 1;
  string machine_id = 2;
  string project_id = 3;
  string agent = 4;
  reserved 5;
  reserved "preset";
  SessionStatus status = 6;
  string created_by = 7;
  SessionProgress progress = 8;
  string provider_session_ref = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  string error = 12;
  string branch = 13;
  hermesh.identity.v1.Workspace workspace = 14;
  string result = 15;
  string title = 16;
  string created_as = 17;
  string model = 18;
  string effort = 19;

  bool title_renamed = 20;
  ModelSelection model_selection = 21;
  hermesh.identity.v1.RuntimeMode runtime_mode = 22;
  hermesh.identity.v1.RuntimeMode effective_runtime_mode = 23;
  hermesh.identity.v1.RuntimeMode max_runtime_mode = 24;
  InteractionMode interaction_mode = 25;
  WorkspaceStrategy workspace_strategy = 26;
  string active_provider_session_id = 27;
  Actor actor = 28;
  SessionLineage lineage = 29;
  bool queue_held = 30;
  uint32 queued_run_count = 31;
  string active_run_id = 32;
  string pending_request_id = 33;
  ContextWindowUsage context_usage = 34;
  bool pinned = 35;
  bool offline_queued = 36;
  google.protobuf.Timestamp archived_at = 37;
  uint32 active_background_count = 38;
  uint32 active_daemon_count = 39;
}

enum SessionView {
  SESSION_VIEW_UNSPECIFIED = 0;
  SESSION_VIEW_BASIC = 1;
  SESSION_VIEW_FULL = 2;
}

message SessionCursor {
  google.protobuf.Timestamp updated_at = 1;
  string session_id = 2;
}

message ProviderSession {
  string provider_session_id = 1;
  string session_id = 2;
  string instance_id = 3;
  string driver = 4;
  string native_session_id = 5;
  string resume_cursor = 6;
  uint32 synced_run_ordinal = 7;
  bool process_alive = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

enum DispatchIntent {
  DISPATCH_INTENT_UNSPECIFIED = 0;
  DISPATCH_INTENT_AUTO = 1;
  DISPATCH_INTENT_START = 2;
  DISPATCH_INTENT_STEER = 3;
  DISPATCH_INTENT_QUEUE = 4;
  DISPATCH_INTENT_FRESH_CONTEXT = 5;
}

enum RunStatus {
  RUN_STATUS_UNSPECIFIED = 0;
  RUN_STATUS_PREPARING = 1;
  RUN_STATUS_QUEUED = 2;
  RUN_STATUS_RUNNING = 3;
  RUN_STATUS_WAITING_REQUEST = 4;
  RUN_STATUS_COMPLETED = 5;
  RUN_STATUS_INTERRUPTED = 6;
  RUN_STATUS_FAILED = 7;
  RUN_STATUS_CANCELLED = 8;
  RUN_STATUS_ROLLED_BACK = 9;
}

message AttachmentRef {
  string blob_sha256 = 1;
  string name = 2;
  string mime_type = 3;
  uint64 size_bytes = 4;
}

message Run {
  string run_id = 1;
  string session_id = 2;
  uint32 ordinal = 3;
  RunStatus status = 4;
  double queue_order = 5;
  Actor author = 6;
  string author_conversation = 7;
  string prompt = 8;
  repeated AttachmentRef attachments = 9;
  DispatchIntent intent = 10;
  ModelSelection model_selection = 11;
  hermesh.identity.v1.RuntimeMode runtime_mode = 12;
  InteractionMode interaction_mode = 13;
  string provider_session_id = 14;
  string checkpoint_id = 15;
  string handoff_summary = 16;
  ContextWindowUsage usage = 17;
  Failure failure = 18;
  string error_code = 19;
  string error_message = 20;
  optional uint32 question_timeout_seconds = 21;
  google.protobuf.Timestamp created_at = 22;
  google.protobuf.Timestamp started_at = 23;
  google.protobuf.Timestamp completed_at = 24;
  string wake_reason = 25;
}

enum RuntimeRequestKind {
  RUNTIME_REQUEST_KIND_UNSPECIFIED = 0;
  RUNTIME_REQUEST_KIND_TOOL_APPROVAL = 1;
  RUNTIME_REQUEST_KIND_USER_INPUT = 2;
  RUNTIME_REQUEST_KIND_PLAN_REVIEW = 3;
  RUNTIME_REQUEST_KIND_SECRET_INPUT = 4;
}

enum RuntimeRequestStatus {
  RUNTIME_REQUEST_STATUS_UNSPECIFIED = 0;
  RUNTIME_REQUEST_STATUS_PENDING = 1;
  RUNTIME_REQUEST_STATUS_RESOLVED = 2;
  RUNTIME_REQUEST_STATUS_DISMISSED = 3;
  RUNTIME_REQUEST_STATUS_EXPIRED = 4;
}

enum ResponseMode {
  RESPONSE_MODE_UNSPECIFIED = 0;
  RESPONSE_MODE_LIVE_RPC = 1;
  RESPONSE_MODE_RESUME_TURN = 2;
}

enum ApprovalDecision {
  APPROVAL_DECISION_UNSPECIFIED = 0;
  APPROVAL_DECISION_ACCEPT_ONCE = 1;
  APPROVAL_DECISION_ACCEPT_FOR_SESSION = 2;
  APPROVAL_DECISION_DECLINE = 3;
  APPROVAL_DECISION_CANCEL_TURN = 4;
}

message ToolApprovalPayload {
  string tool_category = 1;
  string tool_name = 2;
  string command = 3;
  string target_path = 4;
  string diff_preview = 5;
  string reason = 6;
  bool outside_workspace = 7;
  string rule_key = 8;
}

message UserInputPayload {
  repeated QuestionItem questions = 1;
}

message PlanReviewPayload {
  string plan_id = 1;
  string title = 2;
  string markdown = 3;
}

message SecretInputPayload {
  string label = 1;
  string reason = 2;
  string placeholder = 3;
  string delivery = 4;
}

message QuestionAnswer {
  repeated string selected_options = 1;
  string custom_text = 2;
  repeated AttachmentRef attachments = 3;
}

message RuntimeRequest {
  string request_id = 1;
  string session_id = 2;
  string run_id = 3;
  RuntimeRequestKind kind = 4;
  RuntimeRequestStatus status = 5;
  ResponseMode response_mode = 6;
  ToolApprovalPayload approval = 7;
  UserInputPayload user_input = 8;
  PlanReviewPayload plan_review = 9;
  SecretInputPayload secret_input = 10;
  ApprovalDecision resolved_decision = 11;
  string resolved_feedback = 12;
  map<string, QuestionAnswer> resolved_answers = 13;
  QuestionResolution question_resolution = 14;
  Actor resolved_by = 15;
  google.protobuf.Timestamp expires_at = 16;
  google.protobuf.Timestamp created_at = 17;
  google.protobuf.Timestamp resolved_at = 18;
}

enum TurnItemKind {
  TURN_ITEM_KIND_UNSPECIFIED = 0;
  TURN_ITEM_KIND_USER_MESSAGE = 1;
  TURN_ITEM_KIND_ASSISTANT_MESSAGE = 2;
  TURN_ITEM_KIND_REASONING = 3;
  TURN_ITEM_KIND_TOOL_CALL = 4;
  TURN_ITEM_KIND_COMMAND_EXECUTION = 5;
  TURN_ITEM_KIND_FILE_CHANGE = 6;
  TURN_ITEM_KIND_PROPOSED_PLAN = 7;
  TURN_ITEM_KIND_TODO_LIST = 8;
  TURN_ITEM_KIND_RUNTIME_REQUEST = 9;
  TURN_ITEM_KIND_HANDOFF = 10;
  TURN_ITEM_KIND_MODEL_SWITCH = 11;
  TURN_ITEM_KIND_CHECKPOINT = 12;
  TURN_ITEM_KIND_SYSTEM_NOTICE = 13;
  TURN_ITEM_KIND_ERROR = 14;
  TURN_ITEM_KIND_MESSAGE_RECEIVED = 15;
  TURN_ITEM_KIND_MESSAGE_SENT = 16;
  // Where the session works, set up at its first turn (TurnItem.workspace).
  TURN_ITEM_KIND_WORKSPACE = 17;
}

message TodoStep {
  string id = 1;
  string text = 2;
  string status = 3;
}

message TurnItem {
  string item_id = 1;
  string session_id = 2;
  string run_id = 3;
  uint64 seq = 4;
  TurnItemKind kind = 5;
  string status = 6;
  Actor actor = 7;
  string text = 8;
  bool streaming = 9;
  repeated AttachmentRef attachments = 10;
  string tool_name = 11;
  string command = 12;
  int32 exit_code = 13;
  string output = 14;
  bool output_truncated = 15;
  string output_blob_sha256 = 16;
  uint64 output_size = 17;
  string file_path = 18;
  string diff = 19;
  uint32 additions = 20;
  uint32 deletions = 21;
  string plan_title = 22;
  repeated TodoStep todo_steps = 23;
  string request_id = 24;
  string checkpoint_id = 25;
  ModelSelection from_selection = 26;
  ModelSelection to_selection = 27;
  string handoff_strategy = 28;
  string mail_message_id = 29;
  string mail_address = 30;
  string mail_name = 31;
  string mail_delivered = 32;
  string mail_in_reply_to = 33;
  Failure failure = 34;
  google.protobuf.Timestamp created_at = 35;
  google.protobuf.Timestamp updated_at = 36;
  WorkspaceStep workspace = 37;
}

// What a session's first turn did to the project's folder before the agent started: a
// worktree made (after fetching its base, if asked), a branch switched to in the folder
// itself, or the folder kept as it is. The item's status is "running", "completed" or
// "failed"; a failure is its `failure` and `text`.
message WorkspaceStep {
  hermesh.identity.v1.Workspace mode = 1;
  WorkspaceAction action = 2;
  // The branch the session works on: the worktree's own, or the folder's.
  string branch = 3;
  // A worktree's base, as resolved ("origin/main" once fetched).
  string base_ref = 4;
  // The folder's branch before a switch.
  string previous_branch = 5;
  // The folder the agent works in.
  string path = 6;
}

enum WorkspaceAction {
  WORKSPACE_ACTION_UNSPECIFIED = 0;
  // Fetching a worktree's base from origin; followed by CREATE.
  WORKSPACE_ACTION_FETCH = 1;
  WORKSPACE_ACTION_CREATE = 2;
  WORKSPACE_ACTION_SWITCH = 3;
  // In place, on the branch the folder is on.
  WORKSPACE_ACTION_KEEP = 4;
}

// Value types used by UI conversation step reducers.
message ToolCall {
  string call_id = 1;
  string kind = 2;
  string name = 3;
  string summary = 4;
  string decision = 5;
  string reason = 6;
}

message ToolResult {
  string call_id = 1;
  string summary = 2;
  bool is_error = 3;
  bool truncated = 4;
  bool preview = 5;
  uint64 size = 6;
  string blob_sha256 = 7;
}

message TurnCompleted {
  uint32 turn = 1;
  string result = 2;
  bool is_error = 3;
  Usage usage = 4;
  DiffStat diff_stat = 5;
  string commit = 6;
  Failure failure = 7;
}

message ErrorEvent {
  string message = 1;
  Failure failure = 2;
}

message CheckpointFile {
  string path = 1;
  string status = 2;
  uint32 additions = 3;
  uint32 deletions = 4;
}

message Checkpoint {
  string checkpoint_id = 1;
  string session_id = 2;
  string run_id = 3;
  uint32 run_ordinal = 4;
  string git_tree_oid = 5;
  string head_oid = 6;
  repeated CheckpointFile files = 7;
  google.protobuf.Timestamp created_at = 8;
}

enum BackgroundTaskKind {
  BACKGROUND_TASK_KIND_UNSPECIFIED = 0;
  BACKGROUND_TASK_KIND_COMMAND = 1;
  BACKGROUND_TASK_KIND_SUBAGENT = 2;
  BACKGROUND_TASK_KIND_SCHEDULE = 3;
  BACKGROUND_TASK_KIND_DAEMON = 4;
}

enum BackgroundTaskStatus {
  BACKGROUND_TASK_STATUS_UNSPECIFIED = 0;
  BACKGROUND_TASK_STATUS_RUNNING = 1;
  BACKGROUND_TASK_STATUS_COMPLETED = 2;
  BACKGROUND_TASK_STATUS_FAILED = 3;
  BACKGROUND_TASK_STATUS_STOPPED = 4;
}

enum BackgroundTaskStopScope {
  BACKGROUND_TASK_STOP_SCOPE_UNSPECIFIED = 0;
  BACKGROUND_TASK_STOP_SCOPE_SINGLE = 1;
  BACKGROUND_TASK_STOP_SCOPE_SESSION = 2;
}

message BackgroundTask {
  string task_id = 1;
  string session_id = 2;
  string run_id = 3;
  string item_id = 4;
  BackgroundTaskKind kind = 5;
  BackgroundTaskStatus status = 6;
  string title = 7;
  string command = 8;
  string output_tail = 9;
  string summary = 10;
  optional int32 exit_code = 11;
  bool awaited = 12;
  BackgroundTaskStopScope stop_scope = 13;
  google.protobuf.Timestamp started_at = 14;
  google.protobuf.Timestamp updated_at = 15;
  google.protobuf.Timestamp completed_at = 16;
}

message SessionEvent {
  uint64 seq = 1;
  string session_id = 2;
  string type = 3;
  Session session = 4;
  Run run = 5;
  TurnItem item = 6;
  RuntimeRequest request = 7;
  Checkpoint checkpoint = 8;
  string text_delta = 9;
  string target_item_id = 10;
  google.protobuf.Timestamp occurred_at = 11;
  BackgroundTask background_task = 12;
}

message SessionProjection {
  Session session = 1;
  repeated Run runs = 2;
  repeated TurnItem items = 3;
  repeated RuntimeRequest requests = 4;
  repeated Checkpoint checkpoints = 5;
  repeated ProviderSession provider_sessions = 6;
  repeated BackgroundTask background_tasks = 7;
}


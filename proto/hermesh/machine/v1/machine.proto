syntax = "proto3";

package hermesh.machine.v1;

import "google/protobuf/timestamp.proto";
import "hermesh/identity/v1/identity.proto";
import "hermesh/options/v1/options.proto";
import "hermesh/session/v1/session.proto";

// MachineService is served by every machine over E2E tunnels.
service MachineService {
  rpc GetInfo(GetInfoRequest) returns (GetInfoResponse) {
    option (hermesh.options.v1.access) = ACCESS_READ;
  }
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse) {
    option (hermesh.options.v1.access) = ACCESS_READ;
  }
  // Watch sends the caller's view of this machine (the sessions it may
  // read, its projects, the machine's state), then each change, until the
  // caller leaves (docs/state-sync.md §3.3). The first message comes at
  // once, carrying only what changed since resume_token, so the caller
  // knows the watch is in place.
  rpc Watch(WatchRequest) returns (stream WatchResponse) {
    option (hermesh.options.v1.access) = ACCESS_READ;
  }
  // PullWork sends the work this machine counted that changed since
  // after, for the keys the caller may read: whole hours, keys and
  // sessions. Owner devices keep a copy (docs/work-stats.md §6).
  rpc PullWork(PullWorkRequest) returns (PullWorkResponse) {
    option (hermesh.options.v1.access) = ACCESS_READ;
  }
  // PunchDirect asks the machine to send UDP hole-punch packets from its
  // direct QUIC endpoints toward the owner device's candidate UDP endpoints
  // so stateful IPv6/NAT firewalls allow direct QUIC handshakes (owner-only).
  rpc PunchDirect(PunchDirectRequest) returns (PunchDirectResponse) {
    option (hermesh.options.v1.access) = ACCESS_READ;
  }
}

message WatchRequest {
  // From the last message applied; empty: start fresh.
  bytes resume_token = 1;
  // A fresh start sends what ListSessions' first page holds: the newest
  // limit sessions (0: 50) and every unsettled one.
  uint32 limit = 2;
  hermesh.session.v1.SessionView view = 3;
  // The sent_at of the last message applied, as the machine sent it. If
  // resume_token is refused (the machine started again), the reset also
  // carries the sessions deleted since then.
  google.protobuf.Timestamp held_at = 4;
}

message WatchResponse {
  // Set on the first message of a fresh start, or when resume_token was
  // refused: replace everything held of this machine.
  bool reset = 1;
  // Added or changed.
  repeated hermesh.session.v1.Session sessions = 2;
  repeated string deleted_session_ids = 3;
  // With reset: where older sessions start (ListSessions before).
  hermesh.session.v1.SessionCursor next = 4;
  // Added or changed (without base), and removed.
  repeated Project projects = 5;
  repeated string removed_project_ids = 6;
  // With the first message, and when it changed.
  MachineStatus status = 7;
  // Every message: resume from here.
  bytes resume_token = 8;
  // Every message: the machine's clock when it sent it (for held_at).
  google.protobuf.Timestamp sent_at = 9;
  // Every message: where the machine's counts of work are (PullWork).
  uint64 work_seq = 10;
}

message PullWorkRequest {
  // The store the caller holds (empty: none) and the seq it holds.
  bytes store = 1;
  uint64 after = 2;
  // With after 0: only hours from this one on (unix seconds / 3600), for a
  // device that keeps less history than the machine.
  int64 from_hour = 3;
}

message PullWorkResponse {
  // Another than the request's: drop what you hold of this machine first.
  bytes store = 1;
  // This answer brings the caller up to seq; with more, ask again from it.
  uint64 seq = 2;
  bool more = 3;
  repeated WorkKey keys = 4;
  repeated WorkSession sessions = 5;
  // Each replaces what the caller holds of that hour.
  repeated WorkHour hours = 6;
}

// Who did work: the client (who started a session, or asked for a turn),
// the coding agent and the project.
message WorkKey {
  uint32 key = 1;
  string client = 2;
  string agent = 3;
  string project_id = 4;
}

message WorkSession {
  uint32 session = 1;
  // Its key: who started it.
  uint32 key = 2;
  hermesh.session.v1.SessionStatus status = 3;
  // Its last turn failed (not an interruption).
  bool failed = 4;
}

message WorkHour {
  // Unix seconds / 3600.
  int64 hour = 1;
  repeated WorkPresence presence = 2;
  repeated WorkMeasure measures = 3;
}

// A session at work (a turn in progress) in a quarter of the hour (0-3).
message WorkPresence {
  uint32 quarter = 1;
  uint32 key = 2;
  uint32 session = 3;
}

// What turns of one key did in a quarter of the hour (0-3): those that
// ended there, of them failed, their tokens, and the seconds turns were in
// progress there.
message WorkMeasure {
  uint32 quarter = 1;
  uint32 key = 2;
  uint32 turns = 3;
  uint32 failed_turns = 4;
  uint64 input_tokens = 5;
  uint64 output_tokens = 6;
  uint32 busy_seconds = 7;
}

message GetInfoRequest {
  // An owner's device asks the machine to check its coding agents again
  // now (installed, version, signed in), and waits for it: Check Again.
  bool recheck = 1;
}

message GetInfoResponse {
  string machine_id = 1;
  string machine_name = 2;
  MachineStatus status = 3;
}

// A machine's state, for those it lets in end to end (agents and the
// owner's devices); the relay never sees it.
message MachineStatus {
  string name = 12;
  uint32 protocol_version = 1;
  string platform = 2;
  repeated AgentStatus agents = 3;
  uint32 running_sessions = 4;
  uint32 max_sessions = 5;
  bool paused = 6;
  string version = 7;
  // Live sessions by status: "queued", "preparing", "running", "idle", ...
  map<string, uint32> sessions = 9;
  reserved 8, 10, 11;
  reserved "host", "agent_processes", "started_at";
  // What keeps this machine from working as it should (none while healthy),
  // so every screen of the owner can say what is wrong and how to fix it.
  repeated MachineProblem problems = 13;
  // Her on this machine (docs/her-server.md §6.2). Sent to the owner's
  // devices only, never to agents.
  HerStatus her = 14;
  // Computer Control on this machine (docs/computer-control.md). Sent to
  // the owner's devices only, never to agents.
  ScreenStatus screen = 15;
  // Direct LAN IPv4 / public IPv6 E2E tunnel endpoints (host:port) for
  // bypassing the relay when reachable. Sent to the owner's devices only.
  repeated string direct_addrs = 16;
  // Direct LAN IPv4 / public IPv6 E2E QUIC/HTTP3 UDP endpoints (host:port)
  // offering 1-RTT handshakes, independent non-HoL streams, and connection
  // migration. Sent to the owner's devices only.
  repeated string direct_quic_addrs = 17;
  // It serves hermesh.thread.v2.ThreadService (docs/thread-composer.md §5.2);
  // unset on a machine from before it, which the apps take as "update it".
  bool threads = 18;
  // The broadest permission mode its threads may run in, whoever starts them
  // (SetMaxRuntimeMode); UNSPECIFIED: no limit of its own.
  hermesh.identity.v1.RuntimeMode max_runtime_mode = 19;
  // The MachineAdminService methods this hermeshd answers ("ListWorkspaces"),
  // from the handlers it registers (docs/version-skew.md §6.1). Empty: a
  // machine from before the list, which may answer some of them.
  repeated string methods = 20;
}

// ScreenStatus is whether the owner's devices can see and operate this
// machine's screen (hermesh.screen.v1.ScreenService).
message ScreenStatus {
  // The machine is a Mac and has the helper that captures its screen.
  bool available = 1;
  // The device in control now, as it named itself; empty when none is.
  string viewer = 2;
  // The machine takes a viewer's candidates after its offer
  // (ScreenService.Candidates): the offer need not wait for them.
  bool candidates_later = 3;
}

// HerStatus is Her on a machine, as its hermeshd last saw her.
message HerStatus {
  // The owner turned Her on for this machine (SetHer).
  bool enabled = 1;
  // her is running and answers.
  bool running = 2;
  // her's version.
  string version = 3;
  // At least one model connection works, so the assistants can answer.
  bool model_ready = 4;
  // Why this machine can't run Her ("windows", "no her"), or empty.
  string unsupported = 5;
  // Messages and approval requests the owner has not looked at, over all
  // assistants, as her counts them (bots/read).
  uint32 unread = 6;
  // The newest message from an assistant, for a notification.
  HerLatest latest = 7;
  // Why her is not running although Her is on, or empty.
  string error = 8;
  // Her's client key on this machine (SPKI DER), for the owner's device to
  // sign her grant with (docs/her-mesh.md §3); empty on a machine that
  // can't run her.
  bytes client_public_key = 9;
  // Her holds a grant this machine accepts: she can use the owner's
  // computers and agents.
  bool mesh = 10;
  // Her was on here once and her data is still on the machine: turned on
  // again she carries on, or it can be erased (SetHer erase,
  // docs/her-server.md §5.6).
  bool data = 11;
  // The methods of her's protocol the owner's devices may call here: those
  // this her answers and this hermeshd lets through (docs/version-skew.md
  // §6.1). Empty means unknown (her not running, or one too old to list
  // them), never "none".
  repeated string methods = 12;
}

// HerLatest is the newest thing an assistant sent the owner.
message HerLatest {
  // her's bot id, and the assistant's name.
  string bot_id = 1;
  string bot_name = 2;
  // Its first words, at most 200 characters.
  string text = 3;
  google.protobuf.Timestamp at = 4;
  HerLatestKind kind = 5;
  // The owner muted the assistant (her's BotSummary.muted): no device
  // notifies them of it.
  bool muted = 6;
}

enum HerLatestKind {
  HER_LATEST_KIND_UNSPECIFIED = 0;
  HER_LATEST_KIND_MESSAGE = 1;
  // It asks the owner to choose.
  HER_LATEST_KIND_QUESTION = 2;
  // It waits for an approval.
  HER_LATEST_KIND_APPROVAL = 3;
}

message MachineProblem {
  MachineProblemKind kind = 1;
  // PROCESSES and FILES: how many are in use, out of how many; DISK: bytes
  // free, out of the disk's size.
  uint64 used = 2;
  uint64 limit = 3;
  // PROCESSES: the program whose ended processes nobody reaped hold most of
  // them (its name), and how many it holds.
  string culprit = 4;
  uint32 culprit_count = 5;
  // What went wrong, as the system said it (SHELL_PATH: why the login
  // shell's PATH could not be read).
  string detail = 6;
}

enum MachineProblemKind {
  MACHINE_PROBLEM_KIND_UNSPECIFIED = 0;
  // The user's processes are at (or near) their limit: no new program can
  // start, so no coding agent can.
  MACHINE_PROBLEM_KIND_PROCESSES = 1;
  // The disk with Hermesh's data is nearly full: worktrees and the session
  // store can't grow.
  MACHINE_PROBLEM_KIND_DISK = 2;
  // hermeshd is near its limit of open files.
  MACHINE_PROBLEM_KIND_FILES = 3;
  // The login shell's PATH could not be read, so agents installed where
  // only it says (nvm, npm, …) are not found.
  MACHINE_PROBLEM_KIND_SHELL_PATH = 4;
}

message AgentStatus {
  string name = 1;
  bool available = 2;
  string version = 3;
  bool logged_in = 4;
  reserved 5;
  reserved "sandbox_available";
  string detail = 6;
  // A check of this agent is under way; the rest is what the last check
  // found, if any (an agent never checked yet is not available).
  bool checking = 7;
  // The models it offers, as it says, to pick defaults and a session's
  // model from.
  repeated AgentModel models = 8;
  // What its sessions here run with when the client names no model.
  hermesh.identity.v1.AgentDefaults defaults = 9;
  // Its own configuration, which empty defaults follow, as far as the
  // agent tells it.
  hermesh.identity.v1.AgentDefaults own = 10;
  // Why it is not available (detail: what the system or the agent said).
  AgentProblem problem = 11;
  // Where it was found, when it was.
  string binary = 12;
  // No longer sent: models (with models_state) are every agent's list now.
  repeated AgentModelCatalog model_catalogs = 13 [deprecated = true];
  // What models are: "known" (the agent's own list, as of
  // models_observed_at_unix_ms), "unsupported" (it offers no choice of
  // model), "auth_required" (it must be signed in to tell) or "error" (it
  // could not tell); empty when it was not asked (or a machine from before).
  string models_state = 14;
  int64 models_observed_at_unix_ms = 15;
  // What it last said of its account's limits, from a session here
  // (docs/overview-usage.md §7); unset: it never said. The owner's only.
  AgentLimits limits = 16;
}

// An agent's rate limits as it said them.
message AgentLimits {
  // The shortest first.
  repeated LimitWindow windows = 1;
  // Its plan, when it says (Codex: "pro").
  string plan = 2;
  google.protobuf.Timestamp observed_at = 3;
}

message LimitWindow {
  uint32 minutes = 1;
  // 0 to 100.
  uint32 used_percent = 2;
  google.protobuf.Timestamp resets_at = 3;
}

// AgentModelCatalog is no longer sent (AgentStatus.model_catalogs).
message AgentModelCatalog {
  option deprecated = true;
  // project/session address, or "isolated" for a probe with no project data.
  string scope = 1;
  // acp_initialize, acp_options, acp_session, or acp_update.
  string source = 2;
  // known (including zero models), unknown, session_required, auth_required,
  // timeout, or error. Failures can retain an expired previous observation.
  string state = 3;
  repeated AgentModel models = 4;
  // Initial selection of a NEW session, before Hermesh applies overrides.
  // Never inferred from a resumed session or subsequent model changes.
  string default_model = 5;
  string current_model = 6;
  int64 observed_at_unix_ms = 7;
  int64 expires_at_unix_ms = 8;
}

enum AgentProblem {
  AGENT_PROBLEM_UNSPECIFIED = 0;
  AGENT_PROBLEM_NOT_FOUND = 1;
  // Its desktop app is installed but not the command line tool Hermesh
  // runs (detail: the app).
  AGENT_PROBLEM_APP_WITHOUT_CLI = 2;
  // Found, but it could not start: the machine can't start new programs.
  AGENT_PROBLEM_NO_PROCESSES = 3;
  // Found, but it did not answer in time.
  AGENT_PROBLEM_TIMED_OUT = 4;
  // Found, but what runs it is missing (detail: e.g. "node").
  AGENT_PROBLEM_MISSING_RUNTIME = 5;
  // Found, but it failed (detail: the first line it printed).
  AGENT_PROBLEM_FAILED = 6;
}

message AgentModel {
  // What the agent takes as its model (e.g. "opus", "gpt-6-astra").
  string id = 1;
  string name = 2;
  // The reasoning efforts it supports.
  repeated string efforts = 3;
}

message ListProjectsRequest {}

message Project {
  string project_id = 1;
  // Only for WORKSPACE_WORKTREE projects.
  string default_base_ref = 2;
  hermesh.identity.v1.Workspace workspace = 3;
  // The project directory on the machine.
  string path = 4;
  // What the project is, in the owner's words.
  string description = 5;
  // What a new session's worktree starts from: the default base ref, with
  // HEAD resolved to the branch checked out now (or its short commit).
  // Worktree projects only.
  string base = 6;
  // Sessions with a turn in progress in this project (queued, running, or
  // waiting for an answer).
  uint32 active_sessions = 7;
  // The coding agents that may work in it; empty: all.
  repeated string agents = 8;
  // Its folder is a git repository's top level now, whatever its workspace:
  // a session of an in-place project may still take its own worktree.
  bool repo = 9;
}

message ListProjectsResponse {
  repeated Project projects = 1;
}

// MachineAdminService is only available to the owner device principal.
service MachineAdminService {
  rpc ApplyAdminCommand(ApplyAdminCommandRequest) returns (ApplyAdminCommandResponse) {
    option (hermesh.options.v1.access) = ACCESS_WRITE;
  }
  rpc PushRevocations(PushRevocationsRequest) returns (PushRevocationsResponse) {
    option (hermesh.options.v1.access) = ACCESS_WRITE;
  }
  // The git repositories under the home folder, for Add a Project: read
  // when the person opens it, never kept (docs/onboarding.md §5.5).
  rpc ListRepos(ListReposRequest) returns (ListReposResponse) {
    option (hermesh.options.v1.access) = ACCESS_WRITE;
  }
  // The folders in one folder, for Add a Project's folder browser: read
  // when the person opens it, never kept.
  rpc ListFolders(ListFoldersRequest) returns (ListFoldersResponse) {
    option (hermesh.options.v1.access) = ACCESS_WRITE;
  }
  // One short fixed turn of a coding agent in a scratch folder, to prove it
  // is installed and signed in: no session, project or grant is involved.
  rpc TestAgent(TestAgentRequest) returns (TestAgentResponse) {
    option (hermesh.options.v1.access) = ACCESS_WRITE;
  }
  // Gives this machine's Her her grant (docs/her-mesh.md §3.3). The owner's
  // devices only; the grant is root-signed and checked by the machine: for
  // its own Her key, with its own machine id.
  rpc SetHerGrant(SetHerGrantRequest) returns (SetHerGrantResponse) {
    option (hermesh.options.v1.access) = ACCESS_WRITE;
  }
  // The sessions' checkouts on this machine, their size and whether each can
  // be released now (docs/settings-environments.md §5.7). Scanning reads
  // every file: the owner asks for it, or takes the last scan (cached).
  rpc ListWorkspaces(ListWorkspacesRequest) returns (ListWorkspacesResponse) {
    option (hermesh.options.v1.access) = ACCESS_WRITE;
  }
  // Removes idle sessions' checkouts; each session's branch stays, and its
  // next message checks it out again. One that cannot be released is kept
  // and says why; the others go on.
  rpc ReleaseWorkspaces(ReleaseWorkspacesRequest) returns (ReleaseWorkspacesResponse) {
    option (hermesh.options.v1.access) = ACCESS_WRITE;
  }
}

// Why a session's checkout cannot be released now.
enum WorkspaceBlock {
  // It can be released.
  WORKSPACE_BLOCK_UNSPECIFIED = 0;
  // The session is running, waits for an answer or has messages waiting.
  WORKSPACE_BLOCK_BUSY = 1;
  // Uncommitted changes or untracked files: its branch does not have them.
  WORKSPACE_BLOCK_CHANGES = 2;
  // Files Git ignores that cannot be made again (.env, keys), unlike
  // node_modules and the like.
  WORKSPACE_BLOCK_LOCAL_FILES = 3;
  // It is not, or no longer, verifiably this session's checkout on its branch.
  WORKSPACE_BLOCK_UNVERIFIED = 4;
}

message Workspace {
  string session_id = 1;
  string project_id = 2;
  // The session's title.
  string title = 3;
  string path = 4;
  uint64 size_bytes = 5;
  // Why the size could not be read; the rest of the scan still counts.
  string size_error = 6;
  hermesh.session.v1.SessionStatus status = 7;
  // When the session last changed.
  google.protobuf.Timestamp last_active = 8;
  WorkspaceBlock block = 9;
  // The first file behind block, relative to the checkout.
  string block_path = 10;
}

message ListWorkspacesRequest {
  // The last scan, when there is one; otherwise this scans.
  bool cached = 1;
}

message ListWorkspacesResponse {
  // Largest first.
  repeated Workspace workspaces = 1;
  google.protobuf.Timestamp scanned_at = 2;
  // Idle checkouts are released by themselves after a week.
  bool auto_release = 3;
}

message ReleaseWorkspacesRequest {
  repeated string session_ids = 1;
}

message WorkspaceRelease {
  string session_id = 1;
  bool released = 2;
  // Why it was kept.
  WorkspaceBlock block = 3;
  string block_path = 4;
  // Something else went wrong (it was kept).
  string error = 5;
}

message ReleaseWorkspacesResponse {
  repeated WorkspaceRelease results = 1;
}

message ListReposRequest {}

message ListReposResponse {
  repeated Repo repos = 1;
}

message Repo {
  // As the person writes it: "~/app".
  string path = 1;
  string branch = 2;
  google.protobuf.Timestamp last_commit = 3;
}

message ListFoldersRequest {
  // "~/code", or a full path; empty or "~" is the home folder.
  string path = 1;
  // Folders whose name starts with a dot too.
  bool hidden = 2;
}

message ListFoldersResponse {
  // The folder listed, as the person writes it: "~/code".
  string path = 1;
  repeated Folder folders = 2;
  // The files in it, counted, not listed.
  int32 files = 3;
  // Whether it is a git repository, its branch checked out, and its local
  // branches by name.
  bool repo = 4;
  string branch = 5;
  repeated string branches = 6;
  // Its full path, links resolved, as a project made of it records it.
  string full_path = 7;
  // A repository's default branch: what origin/HEAD points at, else main or
  // master when there is one; empty when neither tells.
  string default_branch = 8;
  // The branches checked out in its other worktrees (a session's, say): one
  // can't be checked out here too.
  repeated string worktree_branches = 9;
}

message Folder {
  string name = 1;
  // As the person writes it: "~/code/app".
  string path = 2;
  // Whether it is a git repository, and its branch checked out.
  bool repo = 3;
  string branch = 4;
  // A folder macOS asks the person about before an app reads it (Desktop,
  // Documents…): opening it shows that question on the Mac.
  bool protected = 5;
}

message TestAgentRequest {
  string agent = 1;
}

message TestAgentResponse {
  bool ok = 1;
  // The coding agent's answer, or why it gave none.
  string reply = 2;
  uint32 millis = 3;
}

message ApplyAdminCommandRequest {
  // Signed AdminCommand.
  hermesh.identity.v1.Signed command = 1;
  // Or, for the machine's settings, the command itself: adding or removing
  // a project and pausing are configuration, not permissions (a grant is
  // full trust on its machines; projects tell agents what to use), so the
  // owner's trusted devices send them over their own connection without a
  // root signature. Renaming still needs a signed machine cert.
  hermesh.identity.v1.AdminCommand settings = 2;
}

message ApplyAdminCommandResponse {
  string message = 1;
}

message PushRevocationsRequest {
  hermesh.identity.v1.RevocationList revocations = 1;
  // A longer root chain, if any.
  hermesh.identity.v1.RootChain root_chain = 2;
}

message PushRevocationsResponse {
  bool applied = 1;
}

message SetHerGrantRequest {
  // Signed Grant with her_machine_id.
  hermesh.identity.v1.Signed grant = 1;
  // The owner's root chain, when the grant's signing key is newer than the
  // one the machine knows.
  hermesh.identity.v1.RootChain root_chain = 2;
}

message SetHerGrantResponse {}

message PunchDirectRequest {
  // Candidate client UDP host:port endpoints (e.g. "[2408:...]:54321").
  repeated string targets = 1;
}

message PunchDirectResponse {
  // Current direct QUIC host:port endpoints listening on this machine.
  repeated string direct_quic_addrs = 1;
}

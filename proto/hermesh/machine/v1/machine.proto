syntax = "proto3";

package hermesh.machine.v1;

import "google/protobuf/timestamp.proto";
import "hermesh/identity/v1/identity.proto";
import "hermesh/options/v1/options.proto";
import "hermesh/session/v1/session.proto";

// MachineService is served by every machine over E2E tunnels.
service MachineService {
  rpc GetInfo(GetInfoRequest) returns (GetInfoResponse) {
    option (hermesh.options.v1.access) = ACCESS_READ;
  }
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse) {
    option (hermesh.options.v1.access) = ACCESS_READ;
  }
  // Watch sends the caller's view of this machine (the sessions it may
  // read, its projects, the machine's state), then each change, until the
  // caller leaves (docs/state-sync.md §3.3). The first message comes at
  // once, carrying only what changed since resume_token, so the caller
  // knows the watch is in place.
  rpc Watch(WatchRequest) returns (stream WatchResponse) {
    option (hermesh.options.v1.access) = ACCESS_READ;
  }
}

message WatchRequest {
  // From the last message applied; empty: start fresh.
  bytes resume_token = 1;
  // A fresh start sends what ListSessions' first page holds: the newest
  // limit sessions (0: 50) and every unsettled one.
  uint32 limit = 2;
  hermesh.session.v1.SessionView view = 3;
  // The sent_at of the last message applied, as the machine sent it. If
  // resume_token is refused (the machine started again), the reset also
  // carries the sessions deleted since then.
  google.protobuf.Timestamp held_at = 4;
}

message WatchResponse {
  // Set on the first message of a fresh start, or when resume_token was
  // refused: replace everything held of this machine.
  bool reset = 1;
  // Added or changed.
  repeated hermesh.session.v1.Session sessions = 2;
  repeated string deleted_session_ids = 3;
  // With reset: where older sessions start (ListSessions before).
  hermesh.session.v1.SessionCursor next = 4;
  // Added or changed (without base), and removed.
  repeated Project projects = 5;
  repeated string removed_project_ids = 6;
  // With the first message, and when it changed.
  MachineStatus status = 7;
  // Every message: resume from here.
  bytes resume_token = 8;
  // Every message: the machine's clock when it sent it (for held_at).
  google.protobuf.Timestamp sent_at = 9;
}

message GetInfoRequest {
  // An owner's device asks the machine to check its coding agents again
  // now (installed, version, signed in), and waits for it: Check Again.
  bool recheck = 1;
}

message GetInfoResponse {
  string machine_id = 1;
  string machine_name = 2;
  MachineStatus status = 3;
}

// A machine's state, for those it lets in end to end (agents and the
// owner's devices); the relay never sees it.
message MachineStatus {
  string name = 12;
  uint32 protocol_version = 1;
  string platform = 2;
  repeated AgentStatus agents = 3;
  uint32 running_sessions = 4;
  uint32 max_sessions = 5;
  bool paused = 6;
  string version = 7;
  // Live sessions by status: "queued", "preparing", "running", "idle", ...
  map<string, uint32> sessions = 9;
  reserved 8, 10, 11;
  reserved "host", "agent_processes", "started_at";
  // What keeps this machine from working as it should (none while healthy),
  // so every screen of the owner can say what is wrong and how to fix it.
  repeated MachineProblem problems = 13;
}

message MachineProblem {
  MachineProblemKind kind = 1;
  // PROCESSES and FILES: how many are in use, out of how many; DISK: bytes
  // free, out of the disk's size.
  uint64 used = 2;
  uint64 limit = 3;
  // PROCESSES: the program whose ended processes nobody reaped hold most of
  // them (its name), and how many it holds.
  string culprit = 4;
  uint32 culprit_count = 5;
  // What went wrong, as the system said it (SHELL_PATH: why the login
  // shell's PATH could not be read).
  string detail = 6;
}

enum MachineProblemKind {
  MACHINE_PROBLEM_KIND_UNSPECIFIED = 0;
  // The user's processes are at (or near) their limit: no new program can
  // start, so no coding agent can.
  MACHINE_PROBLEM_KIND_PROCESSES = 1;
  // The disk with Hermesh's data is nearly full: worktrees and the session
  // store can't grow.
  MACHINE_PROBLEM_KIND_DISK = 2;
  // hermeshd is near its limit of open files.
  MACHINE_PROBLEM_KIND_FILES = 3;
  // The login shell's PATH could not be read, so agents installed where
  // only it says (nvm, npm, …) are not found.
  MACHINE_PROBLEM_KIND_SHELL_PATH = 4;
}

message AgentStatus {
  string name = 1;
  bool available = 2;
  string version = 3;
  bool logged_in = 4;
  reserved 5;
  reserved "sandbox_available";
  string detail = 6;
  // A check of this agent is under way; the rest is what the last check
  // found, if any (an agent never checked yet is not available).
  bool checking = 7;
  // The models it offers, to pick defaults from (Claude Code and Codex).
  repeated AgentModel models = 8;
  // What its sessions here run with when the client names no model.
  hermesh.identity.v1.AgentDefaults defaults = 9;
  // Its own configuration, which empty defaults follow, as far as the
  // agent tells it (Codex).
  hermesh.identity.v1.AgentDefaults own = 10;
  // Why it is not available (detail: what the system or the agent said).
  AgentProblem problem = 11;
  // Where it was found, when it was.
  string binary = 12;
}

enum AgentProblem {
  AGENT_PROBLEM_UNSPECIFIED = 0;
  AGENT_PROBLEM_NOT_FOUND = 1;
  // Its desktop app is installed but not the command line tool Hermesh
  // runs (detail: the app).
  AGENT_PROBLEM_APP_WITHOUT_CLI = 2;
  // Found, but it could not start: the machine can't start new programs.
  AGENT_PROBLEM_NO_PROCESSES = 3;
  // Found, but it did not answer in time.
  AGENT_PROBLEM_TIMED_OUT = 4;
  // Found, but what runs it is missing (detail: e.g. "node").
  AGENT_PROBLEM_MISSING_RUNTIME = 5;
  // Found, but it failed (detail: the first line it printed).
  AGENT_PROBLEM_FAILED = 6;
}

message AgentModel {
  // What the agent takes as its model (e.g. "opus", "gpt-6-astra").
  string id = 1;
  string name = 2;
  // The reasoning efforts it supports.
  repeated string efforts = 3;
}

message ListProjectsRequest {}

message Project {
  string project_id = 1;
  // Only for WORKSPACE_WORKTREE projects.
  string default_base_ref = 2;
  hermesh.identity.v1.Workspace workspace = 3;
  // The project directory on the machine.
  string path = 4;
  // What the project is, in the owner's words.
  string description = 5;
  // What a new session's worktree starts from: the default base ref, with
  // HEAD resolved to the branch checked out now (or its short commit).
  // Worktree projects only.
  string base = 6;
  // Sessions with a turn in progress in this project (queued, running, or
  // waiting for an answer).
  uint32 active_sessions = 7;
  // The coding agents that may work in it; empty: all.
  repeated string agents = 8;
}

message ListProjectsResponse {
  repeated Project projects = 1;
}

// MachineAdminService is only available to the owner device principal.
service MachineAdminService {
  rpc ApplyAdminCommand(ApplyAdminCommandRequest) returns (ApplyAdminCommandResponse) {
    option (hermesh.options.v1.access) = ACCESS_WRITE;
  }
  rpc PushRevocations(PushRevocationsRequest) returns (PushRevocationsResponse) {
    option (hermesh.options.v1.access) = ACCESS_WRITE;
  }
  // The git repositories under the home folder, for Add a Project: read
  // when the person opens it, never kept (docs/onboarding.md §5.5).
  rpc ListRepos(ListReposRequest) returns (ListReposResponse) {
    option (hermesh.options.v1.access) = ACCESS_WRITE;
  }
  // One short fixed turn of a coding agent in a scratch folder, to prove it
  // is installed and signed in: no session, project or grant is involved.
  rpc TestAgent(TestAgentRequest) returns (TestAgentResponse) {
    option (hermesh.options.v1.access) = ACCESS_WRITE;
  }
}

message ListReposRequest {}

message ListReposResponse {
  repeated Repo repos = 1;
}

message Repo {
  // As the person writes it: "~/app".
  string path = 1;
  string branch = 2;
  google.protobuf.Timestamp last_commit = 3;
}

message TestAgentRequest {
  string agent = 1;
}

message TestAgentResponse {
  bool ok = 1;
  // The coding agent's answer, or why it gave none.
  string reply = 2;
  uint32 millis = 3;
}

message ApplyAdminCommandRequest {
  // Signed AdminCommand.
  hermesh.identity.v1.Signed command = 1;
  // Or, for the machine's settings, the command itself: adding or removing
  // a project and pausing are configuration, not permissions (a grant is
  // full trust on its machines; projects tell agents what to use), so the
  // owner's trusted devices send them over their own connection without a
  // root signature. Renaming still needs a signed machine cert.
  hermesh.identity.v1.AdminCommand settings = 2;
}

message ApplyAdminCommandResponse {
  string message = 1;
}

message PushRevocationsRequest {
  hermesh.identity.v1.RevocationList revocations = 1;
  // A longer root chain, if any.
  hermesh.identity.v1.RootChain root_chain = 2;
}

message PushRevocationsResponse {
  bool applied = 1;
}

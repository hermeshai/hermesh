syntax = "proto3";

package hermesh.screen.v1;

// Computer Control (docs/computer-control.md): the owner's devices see and
// operate a Mac that runs hermeshd. The picture and the input travel between
// the two ends as WebRTC, directly where a path exists. ScreenService is only
// the handshake: it is served by the machine's hermeshd over the end-to-end
// tunnel, to the owner's devices only (agents get PermissionDenied), so the
// relay can neither read nor replace what the two ends agree on.
service ScreenService {
  // Starts a session, or moves a live one to another network path. The
  // viewer sends its offer with its candidates gathered, the machine
  // answers with its own. The offer asks for one video track and opens the
  // data channels "input" (ordered, reliable: Input from the viewer,
  // ScreenEvent from the machine) and "pointer" (unordered, unreliable:
  // Input holding a Move). A machine serves one viewer: a new session ends
  // the one before.
  rpc Connect(ConnectRequest) returns (ConnectResponse);
  // The candidates each end found after its half of Connect, which then
  // carried its local addresses alone (candidates_later): a path between
  // local addresses is checked without waiting for the relay's STUN and
  // TURN servers. The viewer calls it once it has a TURN address, or after
  // two seconds; the machine adds the viewer's and answers with its own
  // once it has as much. An address can come later than that (a slow TURN
  // server, its second transport): the viewer calls again, with all it has
  // by then, until both ends have found all of theirs.
  rpc Candidates(CandidatesRequest) returns (CandidatesResponse);
}

message ConnectRequest {
  // The viewer's SDP offer.
  string offer = 1;
  // Empty for a new session. A live session's id for an offer that restarts
  // ICE (the viewer's network changed).
  string session_id = 2;
  // The viewer's name, for the notice on the machine.
  string viewer = 3;
  // Whether the picture has the pointer in it. A viewer that draws its own
  // (trackpad mode) asks for none.
  bool pointer = 4;
  // The offer went as soon as the viewer's local addresses were in it; the
  // rest follow in Candidates, and the machine may answer the same way. A
  // machine that does not know this field gathers all of its own first.
  bool candidates_later = 5;
}

message ConnectResponse {
  // The machine's SDP answer.
  string answer = 1;
  string session_id = 2;
  // The machine takes the viewer's other candidates in Candidates and
  // gives the rest of its own there. Unset by a machine that does not: it
  // knows the viewer's local addresses alone until an offer with all of the
  // viewer's candidates restarts ICE.
  bool candidates_later = 3;
}

message CandidatesRequest {
  string session_id = 1;
  // The ICE username fragment of the offer these belong to. The machine
  // refuses them (FailedPrecondition) once a later offer has come.
  string ufrag = 2;
  // All of the viewer's candidates so far, each as a "candidate:" line.
  repeated string candidates = 3;
  // The viewer has found all of its candidates.
  bool complete = 4;
  // How many of the machine's candidates the viewer has from the call
  // before. A machine that has no more yet waits up to a second for one.
  uint32 have = 5;
  // What the viewer found of its own side, for the machine's log, where
  // the owner can read why a session took the path it did: how long the
  // offer took to be answered, and how its network maps its packets
  // (internal/screen's probeNAT). Not used for anything else.
  string network = 6;
}

message CandidatesResponse {
  // All of the machine's candidates so far, each as a "candidate:" line.
  repeated string candidates = 1;
  // The machine has found all of its candidates.
  bool complete = 2;
  // The machine takes this call again as either end finds more. Unset by
  // a machine that answers once: the viewer then calls again only to give
  // candidates of its own.
  bool again = 3;
}

// What the viewer does, sent on a data channel. Positions are fractions of
// the display, from its top left corner.
message Input {
  oneof event {
    Move move = 1;
    Button button = 2;
    Wheel wheel = 3;
    Key key = 4;
    Text text = 5;
    ShowPointer show_pointer = 6;
    Clipboard clipboard = 7;
  }
}

// The pointer moved. While a button is down it drags.
message Move {
  double x = 1;
  double y = 2;
}

enum MouseButton {
  MOUSE_BUTTON_UNSPECIFIED = 0;
  MOUSE_BUTTON_LEFT = 1;
  MOUSE_BUTTON_RIGHT = 2;
}

// A mouse button went down or up.
message Button {
  double x = 1;
  double y = 2;
  MouseButton button = 3;
  bool down = 4;
  // 1 for a click, 2 for the second click of a double click.
  uint32 clicks = 5;
}

// Scrolling, in points of the display: positive dy moves down the page.
message Wheel {
  double x = 1;
  double y = 2;
  double dx = 3;
  double dy = 4;
}

enum NamedKey {
  NAMED_KEY_UNSPECIFIED = 0;
  NAMED_KEY_RETURN = 1;
  NAMED_KEY_TAB = 2;
  NAMED_KEY_SPACE = 3;
  NAMED_KEY_BACKSPACE = 4;
  NAMED_KEY_ESCAPE = 5;
  NAMED_KEY_LEFT = 6;
  NAMED_KEY_RIGHT = 7;
  NAMED_KEY_DOWN = 8;
  NAMED_KEY_UP = 9;
  NAMED_KEY_DELETE = 10;
  NAMED_KEY_HOME = 11;
  NAMED_KEY_END = 12;
  NAMED_KEY_PAGE_UP = 13;
  NAMED_KEY_PAGE_DOWN = 14;
}

// One key pressed and released, with the modifiers held meanwhile: a named
// key, or the key that types character on the standard layout (a shortcut
// such as Command-C).
message Key {
  NamedKey key = 1;
  string character = 2;
  bool command = 3;
  bool option = 4;
  bool control = 5;
  bool shift = 6;
}

// Text entered as it is, whatever keyboard the machine has selected.
message Text {
  string text = 1;
  // How the machine pastes what it can't type as keys (GNOME takes no
  // character its keyboard layout lacks: those are pasted): as an app
  // pastes, or as a terminal does.
  Paste paste = 2;
}

// How the machine pastes: the shortcut it presses once its clipboard holds
// the text.
enum Paste {
  // Not at all: the text only goes to the machine's clipboard.
  PASTE_UNSPECIFIED = 0;
  // As an app pastes: Command-V on a Mac, Ctrl+V on Linux.
  PASTE_APP = 1;
  // As a terminal pastes: Ctrl+Shift+V on Linux, Command-V on a Mac.
  PASTE_TERMINAL = 2;
}

// Text on a clipboard. From the viewer: the phone's clipboard, given to
// the machine's, then pasted there as paste says. From the machine (in a
// ScreenEvent): what was copied there while the viewer was in control.
// At most clipboardMax bytes (60000: a data channel message).
message Clipboard {
  string text = 1;
  Paste paste = 2;
}

// Whether the picture has the pointer in it, from now on.
message ShowPointer {
  bool shown = 1;
}

// What the machine tells the viewer, on the "input" channel.
message ScreenEvent {
  oneof event {
    Format format = 1;
    State state = 2;
    Clipboard clipboard = 3;
  }
}

// The picture's size in pixels.
message Format {
  uint32 width = 1;
  uint32 height = 2;
}

// Why there is no picture, or what the viewer can't do.
message State {
  // Empty while the picture comes. Else: "screen_recording" (the permission
  // is off on the machine), "no_display", "capture", "encoder", "ended"
  // (another viewer took over, or the machine stopped the session).
  string error = 1;
  string detail = 2;
  // Whether the machine can post the viewer's input (Accessibility).
  bool can_control = 3;
}

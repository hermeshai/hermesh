syntax = "proto3";

package hermesh.relay.v1;

import "google/protobuf/timestamp.proto";
import "hermesh/identity/v1/identity.proto";

// ---------------------------------------------------------------------------
// Connection setup (WSS /v1/connect), exchanged as length-prefixed frames
// before yamux starts.

message Challenge {
  bytes nonce = 1;
  string relay_id = 2;
  google.protobuf.Timestamp server_time = 3;
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_MACHINE = 1;
  ROLE_CLIENT = 2;
  ROLE_OWNER = 3;
}

message Hello {
  Role role = 1;
  hermesh.identity.v1.Credentials credentials = 2;
  // Signature by the subject key over
  // "hermesh-admit-v1\0" || relay_id || "\0" || nonce || "\0" || role.
  bytes proof = 3;
  uint32 protocol_version = 4;
}

message HelloResult {
  bool ok = 1;
  string error = 2;
}

enum StreamKind {
  STREAM_KIND_UNSPECIFIED = 0;
  // Control stream: the opener speaks HTTP/2 + Connect to the relay.
  STREAM_KIND_CONTROL = 1;
  // Tunnel to a machine: raw bytes, E2E TLS inside.
  STREAM_KIND_TUNNEL = 2;
}

// StreamHeader prefixes every yamux stream (4-byte big-endian length + proto).
message StreamHeader {
  StreamKind kind = 1;
  // Tunnel target, set by the opener.
  string machine_id = 2;
  // Set by the relay when it forwards a tunnel to the machine.
  Role principal_role = 3;
  string subject_id = 4;
  string tunnel_id = 5;
  string trace_id = 6;
}

// ---------------------------------------------------------------------------
// Public HTTP API (no credentials yet).

service RelayPublicService {
  rpc GetInfo(GetInfoRequest) returns (GetInfoResponse);
  rpc Claim(ClaimRequest) returns (ClaimResponse);
  rpc SubmitPairing(SubmitPairingRequest) returns (SubmitPairingResponse);
  // Long poll: returns when the pairing completes or after ~25s.
  rpc WaitPairing(WaitPairingRequest) returns (WaitPairingResponse);
  // A device, machine or agent that got an erase order says it is erasing.
  rpc AckErase(AckEraseRequest) returns (AckEraseResponse);
}

message GetInfoRequest {
  // A hosted center: an owner to ask about. The response names it, with
  // its current root cert, only while the center serves it; a device whose
  // owner started over learns so and may pair with another. Ignored by a
  // self-hosted relay, which has one owner.
  string owner_id = 1;
}

message GetInfoResponse {
  string relay_id = 1;
  string owner_id = 2;
  bool claimed = 3;
  uint32 protocol_version = 4;
  // The owner's root chain (public; verified by clients against the owner
  // id they pinned).
  hermesh.identity.v1.RootChain root_chain = 5;
  // A hosted center: many owners, no claim; pairing requests need not name
  // an owner because an account claims them.
  bool hosted = 6;
  // Hosted center: where the owner enters pairing codes.
  string console_url = 7;
  // The owner erased everything (docs/erase-everything.md): its signed
  // EraseOrder, kept 90 days after the relay forgot the owner, with
  // root_chain as it was then, so a device whose chain is older can verify
  // it. owner_id and claimed are then unset.
  hermesh.identity.v1.Signed erase_order = 8;
  // Who acked that order, by EraseAck.subject.
  repeated string erase_acks = 9;
}

message AckEraseRequest {
  // A signed EraseAck, by the key in it.
  hermesh.identity.v1.Signed ack = 1;
}

message AckEraseResponse {}

message ClaimRequest {
  string claim_code = 1;
  hermesh.identity.v1.RootChain root_chain = 2;
  hermesh.identity.v1.Signed device_cert = 3;
  // Hosted center: the PKCE verifier of a link code made for an app that
  // signed in through the browser.
  string claim_verifier = 4;
  // Hosted center: this device, already one of the owner's, signs in again
  // (it signed out). The account of the link code must be that owner's;
  // nothing is linked or changed.
  bool resume = 5;
}

message ClaimResponse {
  string relay_id = 1;
}

message SubmitPairingRequest {
  // Signed PairingRequest (self-signed by the subject key).
  hermesh.identity.v1.Signed request = 1;
}

message SubmitPairingResponse {
  string code = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message WaitPairingRequest {
  string code = 1;
  // Hosted center: the owner the requester already saw the claim for (and
  // showed the verification code of). Unset, the call returns as soon as
  // the request is claimed; set, it waits for the signed credential.
  string known_owner_id = 2;
}

message WaitPairingResponse {
  bool done = 1;
  bool expired = 2;
  // Signed MachineCert or Grant, plus the current root cert.
  hermesh.identity.v1.Credentials credentials = 3;
  // Hosted center: an account claimed the request for this owner. The
  // requester does not trust this: it shows the verification code computed
  // from its key and owner_id, and the owner compares it on the signer.
  bool claimed = 4;
  string owner_id = 5;
  hermesh.identity.v1.RootChain root_chain = 6;
  // Masked account name, e.g. "y***@gmail.com" (informational).
  string account_hint = 7;
}

// ---------------------------------------------------------------------------
// Control services, served by the relay on CONTROL streams.

message MachineEntry {
  hermesh.identity.v1.Signed machine_cert = 1;
  bool online = 2;
  google.protobuf.Timestamp last_seen = 3;
  // What the machine reported (ReportStatus); its state (coding agents,
  // sessions, pausing) is asked of it end to end, never told the relay.
  reserved 4;
  reserved "status";
  string name = 5;
  string version = 6;
}

// ClientEntry is a personal agent that is not revoked (revoked ones are
// forgotten; the revocation list refuses them).
message ClientEntry {
  hermesh.identity.v1.Signed grant = 1;
  bool online = 2;
  google.protobuf.Timestamp last_seen = 3;
  // Always false since revoked agents are no longer listed.
  bool revoked = 4;
  // The grant's machine_ids without removed machines ("*" stays). The signed
  // grant keeps them until the owner signs a new version, but a removed
  // machine's id can never come back.
  repeated string machine_ids = 5;
  // The agent's contact card, as a trusted device last published it, and
  // that device's cert.
  hermesh.identity.v1.Signed card = 6;
  hermesh.identity.v1.Signed card_device_cert = 7;
}

service MachineControlService {
  rpc ReportStatus(ReportStatusRequest) returns (ReportStatusResponse);
  rpc WatchUpdates(WatchUpdatesRequest) returns (stream MachineUpdate);
  // The machine leaves its owner (a Mac that was a machine only): the relay
  // removes it as a trusted device would. Removing only lowers permissions,
  // so it needs no signature. The relay drops the machine's connections as
  // it does, possibly before answering.
  rpc Leave(LeaveRequest) returns (LeaveResponse);
  // Notices for the owner's trusted devices, each sealed to one of them
  // (PushTargets): the relay hands them to the push service.
  rpc Notify(NotifyRequest) returns (NotifyResponse);
}

message LeaveRequest {}

message NotifyRequest {
  repeated SealedNotice notices = 1;
}

message NotifyResponse {}

// A session.v1.Notice HPKE-sealed to one device's notice key.
message SealedNotice {
  // The device (its device key's fingerprint) whose registration to use.
  string device_key_id = 1;
  // The HPKE encapsulated key followed by the ciphertext.
  bytes sealed = 2;
  // "question", "failure", "turn_done" or "pairing": what the push service
  // is told about urgency, nothing about the content.
  string kind = 3;
  // Groups one session's notices (a hash, not the session id).
  string thread = 4;
}

// Where to send notices, and to whom: the owner's push registrations, each
// with the device cert that certifies its key.
message PushTargets {
  repeated PushTarget targets = 1;
}

message PushTarget {
  hermesh.identity.v1.Signed registration = 1;
  hermesh.identity.v1.Signed device_cert = 2;
}

message LeaveResponse {}

// Sent when the machine connects and when it is renamed: all a relay knows
// of a machine besides whether it is online.
message ReportStatusRequest {
  reserved 1;
  reserved "status";
  // The machine's name as it calls itself (a hint here: agents check it on
  // their end-to-end connection to the machine).
  string name = 2;
  // hermeshd's version.
  string version = 3;
}

message ReportStatusResponse {}

message WatchUpdatesRequest {}

message MachineUpdate {
  oneof update {
    hermesh.identity.v1.RootChain root_chain = 1;
    hermesh.identity.v1.RevocationList revocations = 2;
    hermesh.identity.v1.Signed machine_cert = 3;
    PushTargets push_targets = 4;
    MachineGrants grants = 5;
  }
}

// The owner-signed grants that cover this machine (each verified by it), all
// of them: sent when it connects and again whenever one is published or
// revoked. A machine shows them as who may start sessions on it; it still
// checks the grant each client presents.
message MachineGrants {
  repeated hermesh.identity.v1.Signed grants = 1;
}

service ClientControlService {
  rpc WhoAmI(WhoAmIRequest) returns (WhoAmIResponse);
  rpc ListMachines(ListMachinesRequest) returns (ListMachinesResponse);
  rpc GetLatestGrant(GetLatestGrantRequest) returns (GetLatestGrantResponse);
}

message WhoAmIRequest {}

message WhoAmIResponse {
  string subject_id = 1;
  Role role = 2;
  string owner_id = 3;
}

message ListMachinesRequest {
  bool online_only = 1;
}

message ListMachinesResponse {
  repeated MachineEntry machines = 1;
  hermesh.identity.v1.RootChain root_chain = 2;
}

message GetLatestGrantRequest {}

message GetLatestGrantResponse {
  hermesh.identity.v1.Signed grant = 1;
  hermesh.identity.v1.RootChain root_chain = 2;
  bool revoked = 3;
  // Messages waiting in the client's inbox: every command says so.
  uint32 inbox_waiting = 4;
}

service OwnerControlService {
  rpc GetPairingRequest(GetPairingRequestRequest) returns (GetPairingRequestResponse);
  // Pending pairing requests bound to this owner: made with its connection
  // address, or claimed by its account. The owner's signer shows them
  // without anyone typing a code.
  rpc ListPairingRequests(ListPairingRequestsRequest) returns (ListPairingRequestsResponse);
  // A request made without an owner (a bare center URL): the owner typed its
  // code on its own device. A hosted center binds it to the caller; one
  // already bound to the caller is returned as is. The requester checks the
  // binding with the verification code.
  rpc ClaimPairingRequest(ClaimPairingRequestRequest) returns (ClaimPairingRequestResponse);
  rpc CompletePairing(CompletePairingRequest) returns (CompletePairingResponse);
  rpc ListMachines(ListMachinesRequest) returns (ListMachinesResponse);
  rpc ListClients(ListClientsRequest) returns (ListClientsResponse);
  // WatchOwner sends what ListMachines, ListClients and ListPairingRequests
  // return, then each again whenever it changed, until the connection ends
  // (docs/state-sync.md §3.2): the owner's devices follow it instead of
  // polling those three.
  rpc WatchOwner(WatchOwnerRequest) returns (stream OwnerUpdate);
  rpc PublishGrant(PublishGrantRequest) returns (PublishGrantResponse);
  rpc PublishMachineCert(PublishMachineCertRequest) returns (PublishMachineCertResponse);
  rpc Revoke(RevokeRequest) returns (RevokeResponse);
  // A longer root chain: a trusted device joined or was removed.
  rpc PublishRootChain(PublishRootChainRequest) returns (PublishRootChainResponse);
  // The owner erases everything (docs/erase-everything.md): the relay keeps
  // the signed order for 10 minutes, forgets the owner, and every peer of
  // it is refused, and shown the order in that time.
  rpc EraseOwner(EraseOwnerRequest) returns (EraseOwnerResponse);
  // The account this owner belongs to, as its devices may show it: a
  // center's account's email and picture ("" for a self-hosted relay).
  // Erasing everything has the owner type the email to confirm.
  rpc GetAccount(GetAccountRequest) returns (GetAccountResponse);
  // The address of this relay's MCP gateway, with the key in its path:
  // only the owner's devices learn it (docs/mcp-gateway.md §13).
  rpc GetMCP(GetMCPRequest) returns (GetMCPResponse);
  // This device's push registration, signed by its device key: replaces
  // its earlier one. An empty token stops its notices.
  rpc RegisterPush(RegisterPushRequest) returns (RegisterPushResponse);
  // Contact cards for the owner's agents, signed by this device's device
  // key (docs/agent-messages.md §4): each replaces the agent's earlier one.
  rpc PublishCards(PublishCardsRequest) returns (PublishCardsResponse);
  // Doorbells (docs/agent-names.md §7), set by a trusted device: the
  // webhook rung when messages wait for an agent or a name under it. Served
  // by the MCP gateway; a relay without it answers Unimplemented.
  rpc ListWakes(ListWakesRequest) returns (ListWakesResponse);
  // Rings the webhook once with a check; keeps it if the check passes, or
  // if asked to anyway.
  rpc SetWake(SetWakeRequest) returns (SetWakeResponse);
  rpc CheckWake(CheckWakeRequest) returns (CheckWakeResponse);
  rpc ClearWake(ClearWakeRequest) returns (ClearWakeResponse);
  // What a wake link (an agent's `message wake`) is for.
  rpc OpenWakeLink(OpenWakeLinkRequest) returns (OpenWakeLinkResponse);
}

// Wake is a doorbell: a webhook rung when messages wait for an address. Its
// key is never shown again.
message Wake {
  string client_id = 1;
  // The name under the agent; "" for the agent itself.
  string name = 2;
  string url = 3;
  // "on", or "broken" (it stopped ringing: reason).
  string state = 4;
  string reason = 5;
  google.protobuf.Timestamp last_ring_at = 6;
  // The webhook's last answer (an HTTP status), 0 before it rang.
  int32 last_status = 7;
  // Messages waiting for the address: for the agent itself, also those of
  // every name without a doorbell of its own, which it wakes too.
  uint32 waiting = 8;
  // Its last rings, newest first.
  repeated WakeRing recent = 9;
}

// WakeRing is one time a doorbell rang.
message WakeRing {
  google.protobuf.Timestamp at = 1;
  // A try the owner asked for (setting it up, or CheckWake); else messages
  // waited.
  bool check = 2;
  // The name the waiting messages were for.
  string as = 3;
  // The webhook's answer (an HTTP status), 0 when it couldn't be reached.
  int32 status = 4;
}

// WakeCheck is how a webhook answered a check.
message WakeCheck {
  bool ok = 1;
  int32 status = 2;
  // What went wrong, for the owner.
  string reason = 3;
}

message ListWakesRequest {
  // One agent's; empty for all the owner's agents.
  string client_id = 1;
}

message ListWakesResponse {
  repeated Wake wakes = 1;
}

message SetWakeRequest {
  // The address, or a wake link's code naming it.
  string client_id = 1;
  string name = 2;
  string code = 3;
  string url = 4;
  // The Authorization header the webhook expects ("Bearer <key>"), if any.
  string authorization = 5;
  // Keep it even if the check fails, marked broken.
  bool keep = 6;
}

message SetWakeResponse {
  // Unset when the check failed and it wasn't kept.
  Wake wake = 1;
  WakeCheck check = 2;
  // What signs its rings (Standard Webhooks), shown this once, for a
  // webhook that checks signatures; empty when it wasn't kept.
  string signing_secret = 3;
}

message CheckWakeRequest {
  string client_id = 1;
  string name = 2;
}

message CheckWakeResponse {
  Wake wake = 1;
  WakeCheck check = 2;
}

message ClearWakeRequest {
  string client_id = 1;
  string name = 2;
}

message ClearWakeResponse {}

message OpenWakeLinkRequest {
  string code = 1;
}

message OpenWakeLinkResponse {
  string client_id = 1;
  string name = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message PublishCardsRequest {
  repeated hermesh.identity.v1.Signed cards = 1;
}

message PublishCardsResponse {}

message RegisterPushRequest {
  hermesh.identity.v1.Signed registration = 1;
}

message RegisterPushResponse {}

message GetPairingRequestRequest {
  string code = 1;
}

message GetPairingRequestResponse {
  hermesh.identity.v1.Signed request = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message ClaimPairingRequestRequest {
  string code = 1;
}

message ClaimPairingRequestResponse {
  hermesh.identity.v1.Signed request = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message ListPairingRequestsRequest {}

message ListPairingRequestsResponse {
  repeated PendingPairing pairings = 1;
}

message PendingPairing {
  string code = 1;
  hermesh.identity.v1.Signed request = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message CompletePairingRequest {
  string code = 1;
  // Signed MachineCert (machine pairing) or Signed Grant (client pairing).
  hermesh.identity.v1.Signed credential = 2;
}

message CompletePairingResponse {}

message WatchOwnerRequest {}

// Each list whole, in the first message and whenever it changed (unset: as
// before). Pairing requests expire by their expires_at; none is sent for
// that.
message OwnerUpdate {
  ListMachinesResponse machines = 1;
  ListClientsResponse clients = 2;
  ListPairingRequestsResponse pairings = 3;
}

message ListClientsRequest {}

message ListClientsResponse {
  repeated ClientEntry clients = 1;
}

message PublishGrantRequest {
  hermesh.identity.v1.Signed grant = 1;
}

message PublishGrantResponse {}

message PublishMachineCertRequest {
  hermesh.identity.v1.Signed machine_cert = 1;
}

message PublishMachineCertResponse {}

message RevokeRequest {
  hermesh.identity.v1.RevocationList revocations = 1;
}

message RevokeResponse {}

message PublishRootChainRequest {
  hermesh.identity.v1.RootChain root_chain = 1;
}

message PublishRootChainResponse {}

message EraseOwnerRequest {
  // A signed EraseOrder, by one of the owner's root keys.
  hermesh.identity.v1.Signed order = 1;
}

message EraseOwnerResponse {}

message GetAccountRequest {}

message GetAccountResponse {
  string account = 1;
  // The account's picture, from the provider it signs in with (GitHub,
  // Google): a URL for its devices to show ("" when it has none, and on a
  // self-hosted relay).
  string avatar_url = 2;
}

message GetMCPRequest {}

message GetMCPResponse {
  // "" when this relay serves no MCP of its own (a hosted center's is at
  // a fixed address, mcp.hermesh.io).
  string url = 1;
}

// MessageService is the post office (docs/agent-messages.md §5), served on
// the client and machine control streams: the caller's inbox is the
// identity the relay admitted. The relay keeps sealed messages until their
// recipient acknowledges them, at most 30 days, and never opens them.
service MessageService {
  // The caller's InboxRegistration, signed by its identity key.
  rpc Register(RegisterInboxRequest) returns (RegisterInboxResponse);
  // The owner's inboxes: agents with their cards, machines with their certs.
  rpc Contacts(ContactsRequest) returns (ContactsResponse);
  rpc Send(SendSealedRequest) returns (SendSealedResponse);
  // The caller's waiting messages, oldest first.
  rpc Fetch(FetchMessagesRequest) returns (FetchMessagesResponse);
  // Marks waiting messages taken: those a peeking caller was shown.
  rpc Take(TakeMessagesRequest) returns (TakeMessagesResponse);
  // Handled messages, each with what became of it; the relay forgets them.
  rpc Ack(AckMessagesRequest) returns (AckMessagesResponse);
  // How many messages wait, at once and again whenever one arrives.
  rpc Watch(WatchInboxRequest) returns (stream WatchInboxResponse);
  // What became of messages, by id (any of the owner's inboxes may ask:
  // ids are random, so only their sender knows them).
  rpc Status(MessageStatusRequest) returns (MessageStatusResponse);
  // A one-time link for the owner to set up the caller's doorbell, under
  // the caller's name (docs/agent-names.md §7.2). Served by the MCP gateway.
  rpc WakeLink(WakeLinkRequest) returns (WakeLinkResponse);
}

message WakeLinkRequest {
  string name = 1;
}

message WakeLinkResponse {
  // The page the owner opens; empty where there is none (a self-hosted
  // relay): the owner sets it up in the Mac app.
  string link = 1;
  google.protobuf.Timestamp expires_at = 2;
}

// SealedMessage is an inbox.v1.SignedMessage HPKE-sealed to its inbox's key
// (DHKEM(X25519, HKDF-SHA256), HKDF-SHA256, AES-128-GCM, info
// "hermesh-message-v1" followed by the inbox and the message id).
message SealedMessage {
  string inbox = 1;
  string message_id = 2;
  bytes sealed = 3;
  // Set by the relay.
  google.protobuf.Timestamp received_at = 4;
  // The doorbell to ring (docs/agent-names.md §7.1): set by the sender when
  // the address has one, to its name ("" for the agent itself). Otherwise
  // absent, and the name stays sealed.
  optional string ring = 5;
}

message RegisterInboxRequest {
  hermesh.identity.v1.Signed registration = 1;
}

message RegisterInboxResponse {}

message ContactsRequest {}

message ContactsResponse {
  repeated hermesh.identity.v1.Contact contacts = 1;
  hermesh.identity.v1.RootChain root_chain = 2;
  // Addresses with a doorbell, by agent: senders put the name on the
  // envelope (SealedMessage.ring). Not signed: a wrong one costs a ring.
  repeated Woken woken = 3;
}

message Woken {
  string inbox = 1;
  // "" for the agent itself.
  repeated string names = 2;
}

message SendSealedRequest {
  SealedMessage message = 1;
}

message SendSealedResponse {}

message FetchMessagesRequest {
  // At most this many (default and most: 50).
  uint32 limit = 1;
  // Pass over this many of the oldest first: the next page.
  uint32 skip = 2;
  // Leave them waiting: an agent with several names takes only its own
  // (Take), so the others' receipts stay true (docs/agent-names.md §6).
  bool peek = 3;
}

message TakeMessagesRequest {
  repeated string message_ids = 1;
}

message TakeMessagesResponse {}

message FetchMessagesResponse {
  repeated SealedMessage messages = 1;
  // More are waiting.
  bool more = 2;
}

message MessageAck {
  string message_id = 1;
  // "handled", "held" or "refused".
  string outcome = 2;
}

message AckMessagesRequest {
  repeated MessageAck acks = 1;
}

message AckMessagesResponse {}

message WatchInboxRequest {}

message WatchInboxResponse {
  uint32 waiting = 1;
}

message MessageStatusRequest {
  repeated string message_ids = 1;
}

message MessageState {
  string message_id = 1;
  // "waiting", "taken", "handled", "held", "refused", "expired", or
  // "unknown" for an id the post office never had or no longer remembers.
  string state = 2;
  google.protobuf.Timestamp at = 3;
}

message MessageStatusResponse {
  repeated MessageState states = 1;
}

<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
:root{--bg:#f9f9fb;--fg:#1b1c22;--fg2:#5b5d66;--fg3:#4b4d57;--card:#fff;--line:rgba(0,0,0,.08);--bar:#f0f1f4;--accent:#3d5bff;--accent-off:#a7b4ff;--btn:#fff;--btn-line:rgba(0,0,0,.14);--warn:#a45605;--warn-mark:#d0700a;--danger:#d7333f;
  --aurora:linear-gradient(135deg,rgba(8,145,178,.14),rgba(47,107,240,.12),rgba(109,60,240,.14));color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#202024;--fg:#ececf1;--fg2:#a3a5b0;--fg3:#c4c6d0;--card:#2a2a2f;--line:rgba(255,255,255,.08);--bar:#1a1a1d;--accent:#5b79ff;--accent-off:#36407a;--btn:#2c2c31;--btn-line:rgba(255,255,255,.14);--warn:#ffab3d;--warn-mark:#ffab3d;--danger:#ff6670;
  --aurora:linear-gradient(135deg,rgba(34,225,201,.2),rgba(62,123,255,.18),rgba(123,97,255,.22));color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:"Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI",system-ui,sans-serif;font-size:14px;user-select:none;cursor:default}
#panel{width:520px;display:flex;flex-direction:column}
main{display:flex;flex-direction:column;gap:18px;padding:20px 32px 24px}
main.dim{opacity:.55}
.hero{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.caption{font-size:12px;color:var(--fg2)}
h1{margin:0;font-size:20px;font-weight:600;line-height:1.35}
.why{margin:0;color:var(--fg2);line-height:1.6;max-width:420px}
.code{border-radius:12px;padding:10px;background:var(--aurora);display:flex;flex-direction:column;gap:8px}
.tiles{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px}
.tile{background:var(--card);border-radius:8px;padding:10px 0;text-align:center;font-family:"Cascadia Mono",Consolas,monospace;font-size:24px;font-weight:600;letter-spacing:2px;box-shadow:0 1px 1px rgba(0,0,0,.08);user-select:text}
.code-foot{display:flex;justify-content:space-between;font-size:12px}
.code-foot span:first-child{color:var(--fg3)}
.code-foot span:last-child{font-weight:600}
.facts{background:var(--card);border:1px solid var(--line);border-radius:10px}
.fact{display:flex;align-items:baseline;gap:10px;padding:10px 14px}
.fact+.fact{border-top:1px solid var(--line)}
.fact .k{color:var(--fg2);flex:none;min-width:72px}
.fact .v{flex:1;overflow-wrap:anywhere;user-select:text}
.link{align-self:flex-start;border:0;background:none;padding:0;color:var(--accent);font:inherit;font-size:13px;cursor:pointer}
.cards{display:flex;flex-direction:column;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.card b{font-weight:600}
.card .small{color:var(--fg2);font-size:13px;line-height:1.5;overflow-wrap:anywhere}
.card .code{margin:6px 0}
.card .tile{font-size:18px;padding:6px 0}
.warn{display:flex;gap:8px;color:var(--warn);font-size:13px;line-height:1.5}
.warn svg{flex:none;margin-top:2px}
footer{display:flex;align-items:center;gap:10px;padding:16px 24px;background:var(--bar);border-top:1px solid var(--line)}
footer .note{flex:1;font-size:13px;color:var(--fg3)}
button.b{height:32px;min-width:96px;padding:0 16px;border-radius:4px;border:1px solid var(--btn-line);background:var(--btn);color:var(--fg);font:inherit;font-size:14px}
button.b.primary{border:0;background:var(--accent);color:#fff;font-weight:600}
button.b:disabled{opacity:.5}
button.b.primary:disabled{background:var(--accent-off);opacity:1}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid rgba(61,91,255,.25);border-top-color:var(--accent);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error{display:flex;gap:16px;padding:24px 32px}
.error p{margin:8px 0 0;color:var(--fg3);line-height:1.6}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div id="panel"></div>
<script>
"use strict";
// What the signer shows (cmd/hermesh-signer/web_windows.go hands it in as
// window.__state): text only ever goes in as text, never as markup.
const S = window.__state, W = S.words, root = document.getElementById("panel");
const svgNS = "http://www.w3.org/2000/svg";
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function svg(w, h, paths) {
  const s = document.createElementNS(svgNS, "svg");
  s.setAttribute("width", w); s.setAttribute("height", h); s.setAttribute("viewBox", "0 0 " + w + " " + h); s.setAttribute("aria-hidden", "true");
  for (const [tag, attrs] of paths) { const p = document.createElementNS(svgNS, tag); for (const k in attrs) p.setAttribute(k, attrs[k]); s.appendChild(p); }
  return s;
}
const shield = () => svg(40, 40, [["path", { d: "M20 4 L33 9 V19 C33 27 27.5 33 20 36 C12.5 33 7 27 7 19 V9 Z", fill: "var(--accent)" }],
  ["path", { d: "M14 20 L18.5 24.5 L26.5 15.5", stroke: "#fff", "stroke-width": "2.6", fill: "none", "stroke-linecap": "round", "stroke-linejoin": "round" }]]);
const warnMark = () => svg(16, 16, [["path", { d: "M8 1.8 L15 14 H1 Z", fill: "var(--warn-mark)" }], ["path", { d: "M8 6 V9.5", stroke: "#fff", "stroke-width": "1.4", "stroke-linecap": "round" }], ["circle", { cx: "8", cy: "11.7", r: "0.8", fill: "#fff" }]]);
const helloMark = () => svg(20, 20, [["rect", { x: "2.5", y: "2.5", width: "15", height: "15", rx: "4", stroke: "var(--fg2)", fill: "none" }], ["circle", { cx: "7.5", cy: "8.5", r: "0.9", fill: "var(--fg2)" }],
  ["circle", { cx: "12.5", cy: "8.5", r: "0.9", fill: "var(--fg2)" }], ["path", { d: "M7 12.2 C8.6 13.6 11.4 13.6 13 12.2", stroke: "var(--fg2)", fill: "none", "stroke-linecap": "round" }]]);
const errorMark = () => svg(32, 32, [["circle", { cx: "16", cy: "16", r: "14", fill: "var(--danger)" }], ["path", { d: "M11 11 L21 21 M21 11 L11 21", stroke: "#fff", "stroke-width": "2.4", "stroke-linecap": "round" }]]);

// "Label: value" (or "标签：值") as a row; a line without a label as the whole row.
function fact(line) {
  const m = /^([^:：]{1,24})[:：]\s*(.*)$/.exec(line), r = el("div", "fact");
  if (m) { r.append(el("span", "k", m[1]), el("span", "v", m[2])); } else { r.append(el("span", "v", line)); }
  return r;
}
function facts(lines) { const f = el("div", "facts"); lines.forEach((l) => f.appendChild(fact(l))); return f; }
function codeBlock(code, small) {
  const b = el("div", "code"), tiles = el("div", "tiles");
  code.split("-").forEach((g) => tiles.appendChild(el("div", "tile", g)));
  b.appendChild(tiles);
  if (!small) { const foot = el("div", "code-foot"); foot.append(el("span", null, W.code), el("span", null, W.match)); b.appendChild(foot); }
  return b;
}
function warning(text) { const w = el("div", "warn"); w.append(warnMark(), el("span", null, text)); return w; }
function cardBox(c, code = true) {
  const b = el("div", "card");
  b.appendChild(el("b", null, c.Title));
  if (c.Code && code) b.appendChild(codeBlock(c.Code, true));
  (c.Lines || []).forEach((l) => b.appendChild(el("span", "small", l)));
  if (c.Why) b.appendChild(el("span", "small", c.Why));
  if (c.Warning) b.appendChild(warning(c.Warning));
  return b;
}

let main, approveBtn, denyBtn, note, noteMark;
function confirmView() {
  const cards = S.cards, own = cards.length > 1 && cards.every((c) => c.Own), hero = own || cards.length === 1 ? cards[0] : null;
  main = el("main");
  const h = el("div", "hero");
  h.appendChild(shield());
  if (own) h.appendChild(el("span", "caption", W.ownCaption));
  h.appendChild(el("h1", null, hero ? hero.Title : W.several.replace("%d", cards.length)));
  if (hero && hero.Why) h.appendChild(el("p", "why", hero.Why));
  main.appendChild(h);
  if (hero) {
    if (hero.Code) main.appendChild(codeBlock(hero.Code));
    const lines = own ? (hero.Lines || []).slice(0, 1).concat([W.along + "：" + cards.slice(1).map((c) => c.Title).join("、")]) : hero.Lines || [];
    if (lines.length) main.appendChild(facts(lines));
    if (hero.Warning) main.appendChild(warning(hero.Warning));
    if (own) {
      const list = el("div", "cards"), toggle = el("button", "link", W.details + " ›");
      list.hidden = true;
      cards.forEach((c) => list.appendChild(cardBox(c, false))); // its code is above
      toggle.onclick = () => { list.hidden = !list.hidden; toggle.textContent = list.hidden ? W.details + " ›" : W.hideDetails; fit(); };
      main.append(toggle, list);
    }
  } else {
    const list = el("div", "cards");
    cards.forEach((c) => list.appendChild(cardBox(c)));
    main.appendChild(list);
  }
  const bar = el("footer");
  noteMark = el("span"); noteMark.appendChild(helloMark());
  note = el("span", "note", W.helloAfter);
  denyBtn = el("button", "b", W.deny);
  approveBtn = el("button", "b primary", W.approve);
  denyBtn.onclick = () => deny();
  approveBtn.onclick = () => { waiting(); approve(); };
  bar.append(noteMark, note, denyBtn, approveBtn);
  root.append(main, bar);
  denyBtn.focus(); // Enter denies: approving takes a deliberate click
}
// While Windows Hello asks; and back when it was cancelled.
window.waiting = () => { main.classList.add("dim"); approveBtn.disabled = denyBtn.disabled = true; noteMark.replaceChildren(el("div", "spin")); note.textContent = W.helloWaiting; };
window.ready = () => { main.classList.remove("dim"); approveBtn.disabled = denyBtn.disabled = false; noteMark.replaceChildren(helloMark()); note.textContent = W.helloAfter; denyBtn.focus(); };

function errorView() {
  const box = el("div", "error"), text = el("div");
  text.append(el("h1", null, S.title));
  text.appendChild(el("p", null, S.message));
  box.append(errorMark(), text);
  const bar = el("footer");
  bar.appendChild(el("span", "note"));
  if (S.hello) { const b = el("button", "b", W.openSignIn); b.onclick = () => openSignIn(); bar.appendChild(b); }
  const ok = el("button", "b primary", W.ok);
  ok.onclick = () => done();
  bar.appendChild(ok);
  root.append(box, bar);
  ok.focus();
}

// The window takes the page's height.
function fit() { resize(Math.ceil(root.getBoundingClientRect().height)); }
document.addEventListener("keydown", (e) => { if (e.key === "Escape") S.kind === "error" ? done() : deny(); });
if (S.kind === "error") errorView(); else confirmView();
theme(matchMedia("(prefers-color-scheme: dark)").matches);
fit();
</script>
</body>
</html>

<!doctype html>
<!-- The page the iPhone app draws Mermaid diagrams on, off screen (Views/Session/Diagram.swift):
     the desktop app's Mermaid and its settings (session/markdown/mermaid-render.ts), so a diagram
     looks the same on both. It loads nothing but the script beside it. -->
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'">
<style>
  html, body { margin: 0; padding: 0; }
  svg { display: block; }
  .node rect, .node polygon, .node circle, .node path { filter: none !important; }
  .node rect { rx: 8px; ry: 8px; }
</style>
<script src="mermaid.min.js"></script>
</head>
<body>
<div id="out"></div>
<script>
  let serial = 0;
  function prepareDiagram(source) {
    if (!source.includes("<")) return source;
    let out = "", copied = 0, inQuote = false, open = 0, commentEnd = -1, noCommentEnd = false;
    for (let i = 0, n = source.length; i < n; i++) {
      const ch = source[i];
      if (ch === "\n") { inQuote = false; open = 0; commentEnd = -1; noCommentEnd = false; }
      else if (i === commentEnd) { out += source.slice(copied, i) + "#gt;"; copied = i + 1; commentEnd = -1; }
      else if (ch === '"' && (inQuote || open === 0)) { inQuote = !inQuote; open = 0; }
      else if (!inQuote && (ch === "[" || ch === "]" || ch === "{" || ch === "}")) { open = 0; }
      else if (ch === "<") {
        if (source.startsWith("!--", i + 1)) {
          if (!noCommentEnd && i > commentEnd) {
            const nl = source.indexOf("\n", i + 4), close = source.indexOf("-->", i + 4);
            if (close !== -1 && (nl === -1 || close < nl)) commentEnd = close + 2;
            else noCommentEnd = true;
          }
          out += source.slice(copied, i) + "#lt;"; copied = i + 1; continue;
        }
        if (source[i + 1] === "<") {
          let j = i + 2;
          while (j < n && (source[j] === " " || source[j] === "\t")) j++;
          if (j < n && /[a-zA-Z]/.test(source[j])) {
            let k = j + 1;
            while (k < n && /[\w -]/.test(source[k])) k++;
            if (source[k] === ">" && source[k + 1] === ">") { i = k + 1; continue; }
          }
        }
        if ((source[i + 1] === "b" || source[i + 1] === "B") && (source[i + 2] === "r" || source[i + 2] === "R")) {
          let j = i + 3;
          while (j < n && (source[j] === " " || source[j] === "\t")) j++;
          if (source[j] === "/") j++;
          if (source[j] === ">") {
            if (j - i !== 4 || source.slice(i, j + 1) !== "<br/>") { out += source.slice(copied, i) + "<br/>"; copied = j + 1; }
            i = j; continue;
          }
        }
        const next = source[i + 1];
        if (next && /[a-zA-Z/!?]/.test(next)) { out += source.slice(copied, i) + "#lt;"; copied = i + 1; open++; }
      } else if (ch === ">" && open > 0) {
        const prev = source[i - 1];
        if (!inQuote && (prev === "-" || prev === "=" || prev === "." || prev === "|")) open = 0;
        else { out += source.slice(copied, i) + "#gt;"; copied = i + 1; open--; }
      }
    }
    return copied === 0 ? source : out + source.slice(copied);
  }
  // Draws a diagram at its own size and says how large it is.
  async function draw(source, dark) {
    mermaid.initialize({
      startOnLoad: false, securityLevel: "strict", suppressErrorRendering: true,
      theme: "base", maxTextSize: 20000, maxEdges: 400,
      htmlLabels: false, fontFamily: 'system-ui, "PingFang SC", sans-serif',
      themeVariables: {
        darkMode: dark, background: dark ? "#18181B" : "#FFFFFF",
        primaryColor: dark ? "#232833" : "#F6F7FA", primaryTextColor: dark ? "#E8ECF4" : "#0B1633",
        primaryBorderColor: dark ? "#7AB0FF" : "#1A5CE6", lineColor: dark ? "#9AA3B5" : "#626775",
        secondaryColor: dark ? "#29292D" : "#F4F4F7", tertiaryColor: dark ? "#323237" : "#EBEBF0",
        fontSize: "14px", edgeLabelBackground: dark ? "#18181B" : "#FFFFFF",
      },
      flowchart: { htmlLabels: false, useMaxWidth: false, padding: 16 },
      sequence: { useMaxWidth: false },
    });
    const { svg } = await mermaid.render(`hermesh-diagram-${++serial}`, prepareDiagram(source));
    const out = document.getElementById("out");
    document.body.style.background = dark ? "#18181B" : "#FFFFFF";
    out.innerHTML = svg;
    const drawn = out.firstElementChild;
    // Some kinds of diagram come as wide as the page: give each the size it was drawn at.
    const box = drawn.viewBox.baseVal;
    if (box && box.width > 0 && box.height > 0) {
      drawn.setAttribute("width", box.width);
      drawn.setAttribute("height", box.height);
      drawn.style.maxWidth = "none";
    }
    const size = drawn.getBoundingClientRect();
    return { width: Math.ceil(size.width), height: Math.ceil(size.height) };
  }
</script>
</body>
</html>

# Built-in providers, and corrections to the public model catalog.
#
# A provider says how to reach it and how it speaks: endpoint, authentication, `compat`. Which
# models it offers comes from its own model list. Each model's details come from the public
# catalog (catalog/public, refreshed by `cargo run -p her-llm --example sync_catalog`): the row
# of this channel (`catalog_id`), else the row of the model's maker.
# Model entries here fix what the catalog lacks or gets wrong; say why next to each. A provider's
# first entry is also the model a session starts on when this is the first usable provider and no
# `model` is configured: pick one that suits everyday work, neither the dearest nor the weakest.
# `thinking_format` is how the channel's thinking switch and budget are sent; left out, a model
# can still be given its named efforts. Override or extend anything in ~/.her/models.toml.
# Prices are per million tokens in the provider's currency (or the entry's `currency`); the
# catalog's are US dollars. See docs/kernel/model-catalog-design.md.

[providers.deepseek]
name = "DeepSeek"
api = "openai-chat"
base_url = "https://api.deepseek.com"
api_key_env = "DEEPSEEK_API_KEY"
currency = "CNY"
catalog_id = "deepseek"
compat = { max_tokens_field = "max_tokens", thinking_format = "deepseek" }

# The catalog names them after a dated build; her shows the product names.
[[providers.deepseek.models]]
id = "deepseek-flash"
name = "DeepSeek-V4.1-Flash"

[[providers.deepseek.models]]
id = "deepseek-v4-pro"
name = "DeepSeek-V4-Pro"

# The same account through the Anthropic-compatible endpoint: it shares DeepSeek's list.
[providers.deepseek-anthropic]
name = "DeepSeek (Anthropic-compatible endpoint)"
api = "anthropic-messages"
base_url = "https://api.deepseek.com/anthropic"
api_key_env = "DEEPSEEK_API_KEY"
currency = "CNY"
catalog_id = "deepseek"
list_from = "deepseek"

[[providers.deepseek-anthropic.models]]
id = "deepseek-flash"
name = "DeepSeek-V4.1-Flash"


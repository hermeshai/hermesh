[providers.volcengine-agent-plan]
name = "Volcengine Ark Agent Plan"
api = "openai-chat"
base_url = "https://ark.cn-beijing.volces.com/api/plan/v3"
api_key_env = "VOLCENGINE_AGENT_PLAN_API_KEY"
list_models = false
plan = { key_url = "https://ark.volcengine.com/region:cn-beijing/openManagement" }
compat = { thinking_format = "deepseek", max_tokens_field = "max_tokens" }

# The catalog does not know this routing name; the numbers are the plan's documented ones.
[[providers.volcengine-agent-plan.models]]
id = "ark-code-latest"
name = "Ark Auto"
context_window = 256000
max_output_tokens = 32768
input = ["text", "image"]

# The catalog only lists its dated builds. Levels: Ark's chat parameters for doubao-seed-2-1.
[[providers.volcengine-agent-plan.models]]
id = "doubao-seed-2.1-pro"
name = "Doubao Seed 2.1 Pro"
context_window = 1024000
max_output_tokens = 65536
input = ["text", "image"]
reasoning = true
thinking = ["off", "minimal", "low", "medium", "high", "xhigh", "max"]

# Ark's documented window for this plan; the catalog's row for the model is the maker's.
[[providers.volcengine-agent-plan.models]]
id = "glm-5.3"
name = "GLM-5.3"
context_window = 1024000
max_output_tokens = 65536


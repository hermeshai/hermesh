[package]
name = "her-connections"
description = "In-process model connections and isolated product authorization adapters."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["local-accounts"]
# Connections through other apps' sign-ins on this computer: the desktop app's, not the public CLI's.
local-accounts = []

[dependencies]
tracing.workspace = true
her-llm.workspace = true
her-protocol.workspace = true
async-trait.workspace = true
chrono.workspace = true
dirs.workspace = true
parking_lot.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true
url.workspace = true
ring = "0.17"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
zeroize = "1"
base64.workspace = true
async-stream.workspace = true
futures.workspace = true
rsa = "0.9"
rand08 = { package = "rand", version = "0.8" }
md-5 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
security-framework-sys = "2"
core-foundation = "0.10"

[dev-dependencies]
tracing-subscriber.workspace = true
tempfile.workspace = true
wiremock.workspace = true

[lints]
workspace = true

[package]
name = "her-docs"
description = "Documents opened beside a conversation (docs/desktop/document-editor-design.md, spreadsheet-design.md): the shared model, DocStore, the PDF backend on PDFium and the spreadsheet backend on her-sheet, run in a worker process."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
pdfium-render = { version = "0.9.5", default-features = false, features = ["pdfium_7881", "thread_safe"] }
base64.workspace = true
her-protocol.workspace = true
her-sheet.workspace = true
her-slide.workspace = true
her-word.workspace = true
parking_lot.workspace = true
png.workspace = true
schemars.workspace = true
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
betteroffice-pptx.workspace = true
docx-edit.workspace = true
md-5.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true

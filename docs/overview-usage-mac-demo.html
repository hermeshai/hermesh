<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>概览重构 · Mac</title>
<style>
:root{--font:"Google Sans Flex","Google Sans",system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;--mono:ui-monospace,"SF Mono",Menlo,monospace}
/* The Mac app's own tokens (apps/desktop/src/renderer/src/styles/app.css, overview/overview.css). */
[data-theme=light]{
  --fa:.17;--fb:0;--gbase:var(--win2);--glass:none;--glass-bd:none;--glow:none;
  --page:#e8eaf0;--page-fg:#1b1c22;--page-fg2:#62646f;--page-bd:rgba(0,0,0,.08);
  --win:#fff;--win2:#f4f4f7;--side:#f4f4f7;
  --l1:rgba(0,0,0,.86);--l2:rgba(0,0,0,.54);--l3:rgba(0,0,0,.32);--l4:rgba(0,0,0,.14);
  --sep:rgba(0,0,0,.075);--fill:rgba(0,0,0,.045);--fill2:rgba(0,0,0,.075);--fill3:rgba(0,0,0,.12);
  --side-sel:rgba(0,0,0,.075);--accent:#3d5bff;--accent-t:#2d4ae6;--accent-bg:rgba(61,91,255,.10);--tint:#3d5bff;
  --green:#17924f;--orange:#d0700a;--orange-bg:rgba(230,126,10,.12);--red:#d7333f;--red-bg:rgba(215,51,63,.10);
  --menu-solid:#f8f8fa;--menu-bd:rgba(0,0,0,.10);
  --shadow-win:0 0 0 .5px rgba(0,0,0,.20),0 18px 50px rgba(10,20,50,.22),0 6px 16px rgba(10,20,50,.10);
  --a1:#7682e6;--a2:#5fb0de;--live:#5f6b85;--lm-node:#ffffff;--lm-node-bd:rgba(0,0,0,.09);--lm-line:rgba(0,0,0,.12);--lm-hover:rgba(0,0,0,.28);
  --v:#2d4ae6;--v-bg:rgba(61,91,255,.10);--d:#a35a00;--d-bg:rgba(230,126,10,.14);
}
[data-theme=dark]{
  --fa:.085;--fb:0;--gbase:var(--win2);--glass:none;--glass-bd:inset 0 1px 0 rgba(255,255,255,.05);--glow:none;
  --page:#0d0e12;--page-fg:#ececf1;--page-fg2:#9a9ca8;--page-bd:rgba(255,255,255,.08);
  --win:#1e1e21;--win2:#29292d;--side:#25252a;
  --l1:rgba(255,255,255,.88);--l2:rgba(255,255,255,.55);--l3:rgba(255,255,255,.32);--l4:rgba(255,255,255,.14);
  --sep:rgba(255,255,255,.09);--fill:rgba(255,255,255,.05);--fill2:rgba(255,255,255,.085);--fill3:rgba(255,255,255,.14);
  --side-sel:rgba(255,255,255,.1);--accent:#4a66ff;--accent-t:#8fa2ff;--accent-bg:rgba(91,121,255,.16);--tint:#8fa2ff;
  --green:#3fcf86;--orange:#ffab3d;--orange-bg:rgba(255,171,61,.14);--red:#ff6670;--red-bg:rgba(255,102,112,.13);
  --menu-solid:#2c2c30;--menu-bd:rgba(255,255,255,.12);
  --shadow-win:0 0 0 .5px rgba(255,255,255,.14),0 18px 50px rgba(0,0,0,.5),0 6px 16px rgba(0,0,0,.3);
  --a1:#8f9bf0;--a2:#7fc4ea;--live:#a7b1c7;--lm-node:#323237;--lm-node-bd:rgba(255,255,255,.08);--lm-line:rgba(255,255,255,.13);--lm-hover:rgba(255,255,255,.3);
  --v:#9fb0ff;--v-bg:rgba(91,121,255,.2);--d:#f0b565;--d-bg:rgba(255,171,61,.16);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--page-fg);font:14px/1.5 var(--font);padding-bottom:70px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
svg{display:block}
h1,h2,h3,p,ul{margin:0;padding:0}
code{font-family:var(--mono);font-size:12px}
.top{max-width:1220px;margin:0 auto;padding:22px 24px 14px;display:flex;gap:24px;align-items:flex-end;flex-wrap:wrap}
.top h1{font-size:20px;font-weight:650}
.top p{color:var(--page-fg2);font-size:13px;margin-top:4px;max-width:760px}
.ctl{margin-left:auto;display:flex;gap:12px;align-items:center}
.pseg{display:inline-flex;background:var(--fill2);border-radius:999px;padding:2px;gap:1px}
.pseg button{height:24px;padding:0 12px;border-radius:999px;font-size:12.5px}
.pseg button.on{background:var(--win);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.tg{display:inline-flex;gap:8px;align-items:center;font-size:12.5px;color:var(--page-fg2);cursor:pointer}
.tg i{width:30px;height:18px;border-radius:9px;background:var(--fill3);position:relative}
.tg i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .2s}
.tg.on i{background:var(--green)}.tg.on i::after{transform:translateX(12px)}
.new{display:inline-flex;align-items:center;height:16px;padding:0 6px;border-radius:8px;font:600 10.5px/1 var(--font);margin-left:6px;vertical-align:1px;white-space:nowrap}
.new.v{color:var(--v);background:var(--v-bg)}.new.d{color:var(--d);background:var(--d-bg)}
.marks-off .win .new{display:none}
.wrap{overflow-x:auto;padding:4px 24px 26px}
.notes{max-width:1220px;margin:0 auto;padding:0 24px}
.notes .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 34px}
.notes h2{font-size:15px;font-weight:650;margin:22px 0 8px}
.notes ul{padding-left:18px;color:var(--page-fg2);font-size:13px;line-height:1.75}
.notes p{color:var(--page-fg2);font-size:13px;line-height:1.75}
.notes b{color:var(--page-fg);font-weight:600}
table.map{border-collapse:collapse;font-size:12.5px;color:var(--page-fg2);width:100%}
table.map td,table.map th{border-bottom:1px solid var(--page-bd);padding:7px 10px 7px 0;text-align:left;vertical-align:top}
table.map th{color:var(--page-fg);font-weight:600;white-space:nowrap}
table.map td:first-child{color:var(--page-fg);white-space:nowrap}

/* ---------- The window ---------- */
.win{position:relative;width:1180px;height:820px;margin:0 auto;display:flex;background:var(--win);border-radius:12px;box-shadow:var(--shadow-win);overflow:hidden;font:13px/1.38 var(--font);color:var(--l1)}
.tl{position:absolute;left:13px;top:16px;display:flex;gap:8px;z-index:5}
.tl i{width:12px;height:12px;border-radius:50%;background:var(--fill3)}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round;flex:none}
.logo{flex:none;display:inline-flex;align-items:center;justify-content:center;background-size:cover;color:#fff;font-weight:600}
.side{width:260px;flex:none;background:var(--side);border-right:.5px solid var(--sep);display:flex;flex-direction:column;min-height:0}
.side-top{height:44px;flex:none}
.side-nav{padding:0 8px 6px;display:flex;flex-direction:column;gap:2px;flex:none}
.nav-i{display:flex;align-items:center;gap:9px;height:32px;padding:0 9px;border-radius:8px;font-size:14px;width:100%}
.nav-i .ic{width:18px;height:18px}
.nav-i.sel{background:var(--side-sel)}
.nav-i:hover:not(.sel){background:var(--fill)}
.nav-i .marks{margin-left:auto;display:inline-flex;align-items:center;gap:7px;font-size:11.5px;color:var(--l2);font-variant-numeric:tabular-nums}
.dot-w{width:7px;height:7px;border-radius:50%;background:var(--orange);display:inline-block}
.ring{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--l4);border-top-color:var(--l2);animation:turn 1s linear infinite;display:inline-block;flex:none}
@keyframes turn{to{transform:rotate(360deg)}}
.side-list{flex:1;min-height:0;padding:0 8px 8px;display:flex;flex-direction:column;gap:1px;overflow:hidden}
.grp-h{font-size:12px;color:var(--l2);padding:12px 10px 4px}
.s-row{display:flex;align-items:center;gap:8px;min-height:28px;padding:3px 9px;border-radius:8px;font-size:13px}
.s-row span.t{min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-row small{font-size:11.5px;color:var(--l2);white-space:nowrap}
.side-foot{height:52px;flex:none;display:flex;align-items:center;gap:9px;margin:0 6px 6px;padding:0 10px 0 8px;border-top:.5px solid var(--sep)}
.av{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--fill2);color:var(--l2);font-size:11px;flex:none}
.who b{font-weight:500;font-size:13px;display:block}.who span{font-size:11.5px;color:var(--l2)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.ctool{height:44px;flex:none}
.cscroll{flex:1;overflow-y:auto;min-height:0}
.cscroll::-webkit-scrollbar{width:0}
.ov{padding:0 24px 32px;display:flex;flex-direction:column;gap:22px;max-width:980px;margin:0 auto}
.ov-h{display:flex;align-items:center;justify-content:space-between;gap:16px;height:32px;margin-bottom:-6px}
.ov-t{display:flex;align-items:baseline;gap:10px}
.ov-h h1{font-size:26px;font-weight:700;letter-spacing:-.01em}
.ov-h span{color:var(--l2)}
.sec-h{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:13px;font-weight:600}
.sec-h .n{font-weight:400;color:var(--l2);font-variant-numeric:tabular-nums}
.sec-h .end{margin-left:auto;display:flex;gap:6px;align-items:center;font-weight:400;color:var(--l2)}
.card{background:var(--win2);border-radius:14px}
.btn{height:28px;padding:0 12px;border-radius:7px;background:var(--fill2);font-size:13px;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}
.btn:hover{background:var(--fill3)}
.btn.p{background:var(--accent);color:#fff;font-weight:500}
.link{color:var(--accent-t)}

/* what needs the owner: the list the Mac draws today (styles/app.css .arow) */
.arow{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:.5px solid var(--sep)}
.arow:first-child{border-top:0}
.arow .ai{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none;margin-right:4px}
.arow .ai.a{background:var(--accent-bg);color:var(--accent-t)}.arow .ai.y{background:var(--orange-bg);color:var(--orange)}.arow .ai.r{background:var(--red-bg);color:var(--red)}
.arow .at{flex:1;min-width:0;margin-right:4px}
.arow .at b{font-weight:600;font-size:13.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow .at>span{font-size:12px;color:var(--l2);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter{height:6px;border-radius:3px;background:var(--fill2);overflow:hidden}
.meter u{display:block;height:100%;border-radius:3px;background:var(--accent)}
.meter.warn u{background:var(--orange)}

/* the link map */
.lmap{overflow:hidden}
.lmap-top{display:flex;align-items:center;gap:8px;padding:12px 14px 0}
.lmap-top b{font-size:14px;font-weight:600}
.lmap-box{position:relative}
.lmap-stage{position:absolute;left:50%;top:0;transform-origin:top center;margin-left:-410px}
.lmap-stage>svg{position:absolute;left:0;top:0;overflow:visible}
.lm-edge{fill:none;stroke:var(--lm-line);stroke-width:1;transition:opacity .25s}
.lm-flow{fill:none;stroke:var(--live);stroke-width:1.3;stroke-linecap:round;opacity:.55;transition:opacity .25s}
.lm-dot{transition:opacity .25s}
.lmap-hub{position:absolute;display:flex;flex-direction:column;align-items:center;gap:2px}
.lmap-icon{border-radius:24%;display:flex;align-items:center;justify-content:center;margin-bottom:8px;background:linear-gradient(180deg,#ffffff,#eef0f5);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08),0 4px 14px rgba(0,0,0,.1)}
[data-theme=dark] .lmap-icon{background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,0) 45%),linear-gradient(180deg,#262833,#0b0c12);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16),0 6px 18px rgba(0,0,0,.28)}
.lmap-hub b{font-size:12.5px;font-weight:600;white-space:nowrap}
.lmap-hub span{display:flex;align-items:center;gap:4px;font-size:10.5px;color:var(--l2);white-space:nowrap}
.lm-node{position:absolute;display:flex;align-items:center;gap:9px;padding:0 10px 0 9px;border-radius:12px;background:var(--lm-node);box-shadow:inset 0 0 0 .8px var(--lm-node-bd);transition:opacity .25s,box-shadow .15s;transform:translateY(-50%)}
.lm-node:hover{box-shadow:inset 0 0 0 .8px var(--lm-hover)}
.lm-node.pin{background:color-mix(in srgb,var(--accent) 8%,var(--lm-node));box-shadow:0 0 0 1.5px var(--accent),0 2px 10px color-mix(in srgb,var(--accent) 22%,transparent)}
.lm-node .lm-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.lm-node .lm-t b{font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lm-node .lm-t small{font-size:10.5px;color:var(--l2)}
.lm-node .lm-t small.soon{color:var(--orange)}
.lm-node .lm-ic{color:var(--l2);display:flex;flex:none}
.lm-node.more{justify-content:center;background:none;box-shadow:none;color:var(--l2);font-size:12px}
.lm-agents{display:flex;gap:3px}
.lmap.focus .dim{opacity:.12}

.shim{background:linear-gradient(90deg,var(--l1) 0%,var(--l1) 35%,var(--l3) 50%,var(--l1) 65%,var(--l1) 100%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 2.4s linear infinite}
@keyframes shim{from{background-position:100% 0}to{background-position:-50% 0}}
@media (prefers-reduced-motion:reduce){.shim{animation:none;color:var(--l1);background:none}}

/* lists of sessions */
.row{display:flex;align-items:center;gap:12px;padding:9px 14px;border-top:.5px solid var(--sep)}
.row:first-child{border-top:0}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-weight:500;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tx span{display:block;font-size:12px;color:var(--l2)}
.row .st{font-size:12px;color:var(--l2);display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.row .st i{width:7px;height:7px;border-radius:50%;background:var(--red)}
.row .st.wait i{background:var(--orange)}
.row .end{font-size:12px;color:var(--l2);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.row .end em{font-style:normal;color:var(--l3)}
.ghostc{display:block;width:100%;border-radius:14px;outline:1px dashed var(--l3);outline-offset:-1px;padding:14px 16px}
.ghostc b{display:block;font-size:13.5px;font-weight:600;color:var(--accent-t)}
.ghostc small{display:block;font-size:12px;color:var(--l2);margin-top:2px}

/* statistics */
.seg{display:inline-flex;background:var(--fill2);border-radius:8px;padding:2px}
.seg button{height:24px;padding:0 16px;border-radius:6px;font-size:13px;text-align:center}
.seg button.on{background:var(--win);box-shadow:0 1px 2px rgba(0,0,0,.14);font-weight:500}
[data-theme=dark] .seg button.on{background:var(--fill3)}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.pb{height:26px;padding:0 7px 0 10px;border-radius:7px;background:var(--fill2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pb:hover{background:var(--fill3)}
.pb.on{background:var(--accent-bg);color:var(--accent-t)}
.pb svg{width:9px;height:12px;color:var(--l2)}
.pb.on svg{color:var(--accent-t)}
.filters>i{width:1px;height:16px;background:var(--sep)}
/* a measure a row: its number over its chart, as the system's own charts are */
.stack{display:flex;flex-direction:column;gap:12px}
[data-glass=full][data-theme=light]{--fa:.42;--fb:.42;--gbase:none;--glass:linear-gradient(135deg,rgba(255,255,255,.62),rgba(255,255,255,.34));--glass-bd:inset 0 0 0 1px rgba(255,255,255,.75),0 6px 22px rgba(60,70,140,.09)}
[data-glass=full][data-theme=dark]{--fa:.2;--fb:.2;--gbase:none;--glass:linear-gradient(135deg,rgba(255,255,255,.075),rgba(255,255,255,.028));--glass-bd:inset 0 0 0 1px rgba(255,255,255,.085),inset 0 1px 0 rgba(255,255,255,.14)}
[data-glass=full]{--glow:0 0 14px color-mix(in srgb,var(--a1) 55%,transparent)}
/* glass over one colour field, as the Her cards are: the field stands still behind the window and each card shows the part it covers */
.glass{position:relative;isolation:isolate;border-radius:14px;background:var(--gbase)}
.glass::before{content:"";position:absolute;inset:0;z-index:-2;border-radius:inherit;background-attachment:fixed;
  background-image:radial-gradient(34% 40% at 30% 16%,rgb(143 155 240/var(--fa)),transparent 78%),radial-gradient(30% 36% at 86% 22%,rgb(242 155 192/var(--fb)),transparent 78%),radial-gradient(36% 40% at 62% 62%,rgb(127 196 234/var(--fa)),transparent 78%),radial-gradient(34% 38% at 28% 92%,rgb(181 156 242/var(--fb)),transparent 78%)}
.glass::after{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;pointer-events:none;background:var(--glass);box-shadow:var(--glass-bd)}
/* a measure a row: its number at the leading side, its chart beside it; in a narrow window the chart goes under */
.mc{display:flex;flex-wrap:wrap;gap:18px 36px;padding:18px 22px 14px}
.mc .lead{flex:0 0 260px;display:flex;flex-direction:column;min-width:0}
.mc .pl{flex:1 1 360px;min-width:0}
.mc .ttl{font-size:13px;font-weight:600;color:var(--l2)}
.big{display:flex;align-items:baseline;gap:8px;margin-top:8px}
.big b{font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.big span{color:var(--l2)}
.dl{font-size:12px;color:var(--l2);margin-top:6px;white-space:nowrap;font-variant-numeric:tabular-nums}
.facts{display:flex;gap:22px;margin-top:auto;padding-top:14px}
.facts small{display:block;font-size:11.5px;color:var(--l2);white-space:nowrap}
.facts b{display:block;font-size:14px;font-weight:600;margin-top:1px;white-space:nowrap;font-variant-numeric:tabular-nums}
.plot{position:relative;height:116px;margin:8px 40px 0 0}
.gl{position:absolute;left:0;right:0;border-top:.5px solid var(--sep)}
.gl span{position:absolute;left:100%;top:-8px;padding-left:8px;font-size:10.5px;color:var(--l3);white-space:nowrap;font-variant-numeric:tabular-nums}
.slots{position:absolute;inset:0;display:flex}
.sl{flex:1;min-width:0;display:flex;align-items:flex-end;justify-content:center;border-radius:6px 6px 0 0}
.sl[data-tip]:hover{background:var(--fill)}
.sl u{width:min(42%,20px);min-height:4px;border-radius:99px 99px 3px 3px;background:color-mix(in srgb,var(--live) 46%,transparent)}
.sl:hover u{background:color-mix(in srgb,var(--live) 78%,transparent)}
.sl.now u{background:linear-gradient(180deg,var(--a2),var(--a1));box-shadow:var(--glow)}
.xl{display:flex;margin:6px 40px 0 0;height:15px;font-size:11px;color:var(--l3);font-variant-numeric:tabular-nums}
.xl span{flex:1;min-width:0;text-align:center;white-space:nowrap}
.xl span.n{color:var(--l1);font-weight:500}
.yr{padding:14px 16px 14px}
.yr .hd{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--l2);font-variant-numeric:tabular-nums;margin-bottom:12px}
.yr .hd b{font-size:13px;font-weight:600;color:var(--l1)}
.grid{display:grid;grid-template-rows:repeat(7,auto);grid-template-columns:repeat(53,minmax(0,1fr));grid-auto-flow:column;gap:3px}
.grid u{aspect-ratio:1;border-radius:2.5px}
.months{display:flex;justify-content:space-between;font-size:11px;color:var(--l3);margin-top:6px}
.scale{display:flex;align-items:center;justify-content:flex-end;gap:3px;font-size:11px;color:var(--l3);margin-top:8px}
.scale u{width:11px;height:11px;border-radius:2.5px}.scale u:first-of-type{margin-left:4px}.scale u:last-of-type{margin-right:4px}
.foot{font-size:12px;color:var(--l2);line-height:1.5}
/* limits: a row an agent, its windows beside its name; in a narrow window they go under it */
.qc{display:flex;flex-wrap:wrap;align-items:center;gap:20px 36px;padding:20px 22px}
.qid{flex:0 0 220px;display:flex;gap:12px;align-items:flex-start;min-width:0}
.qid .tx{min-width:0}
.qid .nm{display:block;font-size:16px;font-weight:700;white-space:nowrap}
.qid small{display:block;font-size:11.5px;color:var(--l2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.qid .badge{margin-top:9px}
.qc .none{font-size:12px;color:var(--l2)}
.qws{flex:1 1 420px;min-width:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:22px 40px}
.qt{font-size:12px;font-weight:600;color:var(--l2)}
.qn{display:flex;align-items:baseline;margin-top:4px}
.qn b{font-size:38px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.qn i{font-style:normal;font-size:17px;font-weight:600;margin-left:2px}
.qn small{font-size:12px;color:var(--l2);margin-left:7px}
.trk{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:7px 10px;margin-top:12px}
.trk small{font-size:10.5px;color:var(--l3)}
/* the allowance in ticks, the time as a thin line under it */
.ticks{height:16px;background:var(--fill2);-webkit-mask:repeating-linear-gradient(90deg,#000 0 3px,transparent 3px 6px);mask:repeating-linear-gradient(90deg,#000 0 3px,transparent 3px 6px)}
.ticks u{display:block;height:100%;width:calc(var(--n)*1%);background:linear-gradient(90deg,var(--a1),var(--a2));background-size:calc(10000%/var(--n)) 100%}
.qw.warn .ticks u{background:var(--orange)}
.time{height:3px;border-radius:2px;background:var(--fill2)}
.time u{display:block;height:100%;border-radius:2px;background:var(--l3)}
.qr{font-size:11.5px;color:var(--l2);margin-top:9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.badge{flex:none;height:20px;padding:0 7px;border-radius:10px;font-size:11.5px;font-weight:600;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.badge.warn{color:var(--orange);background:var(--orange-bg)}
.badge.plan{color:var(--l2);background:var(--fill2);font-weight:500}

/* menus and tips, as the system's */
.shade{position:absolute;inset:0;z-index:19}
.mm{position:absolute;z-index:20;min-width:210px;background:var(--menu-solid);border-radius:8px;box-shadow:0 0 0 .5px var(--menu-bd),0 10px 30px rgba(0,0,0,.25),0 2px 6px rgba(0,0,0,.1);padding:5px;font-size:13px}
.mm button{display:flex;align-items:center;gap:6px;width:100%;min-height:24px;padding:3px 8px 3px 6px;border-radius:5px;line-height:1.3}
.mm button>svg.ck{width:12px;height:12px;visibility:hidden;flex:none}
.mm button.on>svg.ck{visibility:visible}
.mm button span{flex:1;min-width:0}
.mm button small{display:block;font-size:11.5px;color:var(--l2);font-variant-numeric:tabular-nums}
.mm button .go{width:8px;height:10px;color:var(--l3);flex:none}
.mm button:hover,.mm button.open{background:var(--accent);color:#fff}
.mm button:hover small,.mm button.open small,.mm button:hover .go,.mm button.open .go{color:rgba(255,255,255,.75)}
.mm hr{border:0;border-top:.5px solid var(--sep);margin:5px 8px}
.tip{position:absolute;z-index:18;background:var(--menu-solid);border-radius:7px;padding:5px 9px;box-shadow:0 0 0 .5px var(--menu-bd),0 6px 18px rgba(0,0,0,.22);transform:translate(-50%,-100%);white-space:nowrap;pointer-events:none;font-size:12px}
.tip b{display:block;font-weight:600}
.tip span{color:var(--l2);font-variant-numeric:tabular-nums}
</style>
</head>

<header class="top">

    <h1>概览重构 · Mac</h1>
    <p>和 iPhone 同一套：概览只讲现在；用量和额度是概览页的另外两个视图，不占侧边栏。Mac 上用列表，不用卡片；链路图保留「项目」一列。窗口里都能点：右上角切视图，行尾的按钮、链路图的节点、筛选菜单。右边可以切换窗口宽度，看布局怎么跟着变。</p>

// ---------- Statistics ----------
/** A measure over time: a thin capsule a bucket, muted, the last one in the field's colours; a ruled scale at the trailing edge. */
function chart(q,key){
  const now=q.hourly?NOWH:q.nb-1,raw=Math.max(1,...q.buckets.map(b=>b[key]));
  const p=10**Math.floor(Math.log10(raw)),top=key==='sess'&&raw<10?[2,4,6,8,10].find(v=>v>=raw):[1,2,5,10].find(m=>m*p>=raw)*p;
  const lab=v=>key==='tok'?tokens(v).replace('.0',''):String(v),val=b=>key==='tok'?tokens(b.tok)+' token':b.sess+' 个任务运行过';
  const name=i=>q.hourly?(i===NOWH?'现在':i%6===0&&Math.abs(i-NOWH)>1?i+' 时':''):i===now?'今天':q.nb===7?wd(dateOf(q.d0+i)):(now-i)%7===0?mds(dateOf(q.d0+i)):'';
  return `<div class="plot">${[1,.5,0].map(f=>`<div class="gl" style="bottom:${f*100}%"><span>${lab(top*f)}</span></div>`).join('')}<div class="slots">${
    q.buckets.map((b,i)=>i>now?'<i class="sl"></i>':`<i class="sl ${i===now?'now':''}" data-tip="${esc(bucketName(q,i))}|${val(b)}">${b[key]?`<u style="height:${b[key]/top*100}%"></u>`:''}</i>`).join('')}</div></div>
  <div class="xl">${q.buckets.map((b,i)=>`<span class="${i===now?'n':''}">${name(i)}</span>`).join('')}</div>`;
}
const HEAT=['var(--fill2)',...[24,44,68,100].map(p=>`color-mix(in srgb,var(--a1) ${p}%,transparent)`)];
function yearGrid(){
  const weeks=53,first=T-dateOf(T).getDay()-(weeks-1)*7,day=Array(DAYS).fill(0);
  for(const s of S)if(match(s))for(const t of s.turns)day[t.d]+=t.i+t.o;
  const top=Math.max(1,...day.slice(Math.max(first,0)));
  let cells='',active=0,months=[],last=-1;
  for(let i=first;i<first+weeks*7;i++){
    if(i>T||i<0){cells+='<u></u>';continue}
    const d=dateOf(i);if((i-first)%7===0&&d.getMonth()!==last){last=d.getMonth();months.push(`${last+1}月`)}
    const lv=day[i]?1+Math.min(3,Math.floor(day[i]/top*4)):0;if(day[i])active++;
    cells+=`<u style="background:${HEAT[lv]}" data-tip="${md(d)} ${wd(d)}|${day[i]?tokens(day[i])+' token':'没有用量'}"></u>`}
  let streak=0;for(let i=T;i>=0&&day[i];i--)streak++;
  return `<div class="glass yr"><div class="hd"><b>近一年</b><span>活跃天数 ${active} · 连续使用 ${streak} 天</span></div><div class="grid">${cells}</div><div class="months">${months.map(m=>`<span>${m}</span>`).join('')}</div><div class="scale">少${HEAT.map(c=>`<u style="background:${c}"></u>`).join('')}多</div></div>`;
}
/** The page's head: its three views are segments of it, so the numbers take no place of the sidebar's. */
function head(){return `<div class="ov-h"><div class="ov-t"><h1>概览</h1><span>11月23日 周一</span></div><div class="seg">${[['home','实时'],['usage','用量'],['quota','额度']].map(([k,v])=>`<button class="${st.page===k?'on':''}" data-go="${k}">${v}</button>`).join('')}</div></div>`}
/** The limits, a view of their own: a row an agent, the one with the least left first. A window says what is left of it twice, of its allowance and of its time, so that one is read against the other. */

    ${p.wins.length?`<div class="qws">${p.wins.map(w).join('')}</div>`:'<div class="none">它没有提供额度信息</div>'}</div>`).join('')}</div>

}

  <div><h2>只讲用了多少</h2><ul><li>这一页全是<b>过去的累计</b>：选一个时间范围，再按 Agent 提供方、环境 / 项目、发起方筛。筛选在最上面一行，管整页。</li><li><b>额度不在这里</b>：它是此刻的状态，不随筛选变，有自己的视图。</li><li><b>一个指标一行</b>：左边是数、和上一周期的比较、细项，右边是图。7 天时整页一屏放得下。</li></ul></div>
  <div><h2>样子</h2><ul><li><b>卡片还是普通的卡片</b>，只在底色上带一点很淡的淡紫和天蓝，整页共用一片，每张卡露出它盖住的那一块。没有玻璃高光，没有粉色。右上角「克制 / 上一版」可以对比。</li><li><b>柱子是细的圆头柱</b>，灰蓝色，和概览链路线同一个颜色；只有今天 / 现在那一根有颜色。</li><li>右侧两条刻度线和数值，下面是周几或日期。鼠标停在柱子或格子上，显示那一小时或那一天的数。</li></ul></div>
  <div><h2>跟着窗口宽度变</h2><ul><li>窗口窄时图落到数的下面，筛选折成两行。</li><li>「近一年」的格子等比缩小，始终是 53 周（Mac 本地留 400 天的数据；手机是 18 周）。</li></ul>
  <h2>和 iPhone 一样的</h2><ul><li>四个筛选和它们的选项、环境 / 项目两级菜单、每个指标的数和细项、和上一周期比。</li></ul></div></div>`,
  quota:`<div class="cols">
  <div><h2>只讲还剩多少</h2><ul><li>这一页回答一个问题：<b>还能不能接着用</b>。没有时间范围，没有筛选。</li><li><b>一个提供方一行</b>，剩得最少的排最前；快用完的有橙色标记，刻度也是橙色。</li><li>首页「需要你处理」里的「额度快用完」，点「查看」到这里。</li></ul></div>
  <div><h2>一个窗口两条</h2><ul><li><b>额度</b>：一排刻度，亮着的是剩下的。</li><li><b>时间</b>：下面一条细线，是这个窗口离重置还剩多少时间。</li><li>两条上下对着看：额度剩得比时间少，就是用得比时间快，会在重置前用完。Claude Code 的 5 小时窗口就是这样。</li><li><b>「时间」这条是新画出来的</b>：数据就是原来那行「16:40 重置」，没有新增字段；iPhone 上现在只有文字。</li></ul></div>
  <div><h2>跟着窗口宽度变</h2><ul><li>宽窗口：名字在左，两个窗口并排在右。窄窗口：窗口落到名字下面。</li></ul>
  <h2>和 iPhone 一样的</h2><ul><li>同样的提供方、窗口、剩余和重置时间；iPhone 上也是「用量 | 额度」分开。</li></ul></div></div>`,

};
if(location.hash){const[page,range,theme,width]=location.hash.slice(1).split(',');if(width)win.style.width=width+'px',$('#width').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.w===width));if(VIEW[page])st.page=page;if(RANGE[range])st.range=range;if(theme){document.documentElement.dataset.theme=theme;$('#theme').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.t===theme))}}
render();
</script>

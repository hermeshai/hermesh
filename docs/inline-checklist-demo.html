<title>B2 全展开随流任务脊柱 · 零折叠精修对比原型</title>
<style>
@font-face {
  font-family: "Google Sans Flex";
  src: url("../apps/desktop/src/renderer/src/assets/fonts/google-sans-flex.ttf") format("truetype");
  font-style: oblique 0deg 10deg;
  font-weight: 100 1000;
}
@font-face {
  font-family: "Google Sans Code";
  src: url("../apps/desktop/src/renderer/src/assets/fonts/google-sans-code.ttf") format("truetype");
  font-weight: 300 800;
}

:root {
  --font-mac: "Google Sans Flex", "Google Sans", -apple-system, BlinkMacSystemFont, "PingFang SC", system-ui, sans-serif;
  --font-ios: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", system-ui, sans-serif;

  --ease: cubic-bezier(.22, 1, .36, 1);
  --sp-1: 8px;
  --sp-2: 13px;
  --conv-w: 728px;

}

/* ---------- Pure Black (Onyx deep black in app.css + iPhone OLED #000) ---------- */
[data-theme="black"] {
  --page: #090a0e;
  --page-fg: #ededf2;
  --page-fg2: #9498a6;
  --page-card: #121319;
  --page-bd: rgba(255,255,255,.085);
  --page-btn: rgba(255,255,255,.075);
  --page-bar: rgba(16,17,23,.90);

  --win: #070709;
  --win-rgb: 7,7,9;
  --bub: #1f1f24;
  --bub-fg: #f5f5f7;
  --pill: #15151a;
  --pill-bd: rgba(255,255,255,.085);
  --cmp-hi: rgba(255,255,255,.05);
  --cmp-lift: 0 0 0 1px rgba(255,255,255,.085), 0 8px 24px -8px rgba(0,0,0,.45);
  --slice-sh: 0 0 0 1px rgba(255,255,255,.10), 0 24px 64px rgba(0,0,0,.75);

  --ios-bg: #000000;
  --ios-bg-rgb: 0,0,0;
  --glass: rgba(34,34,39,.78);
  --glass-pill: rgba(30,30,35,.82);
  --glass-sh: 0 0 0 .5px rgba(255,255,255,.13), inset 0 .5px 0 rgba(255,255,255,.12), 0 10px 28px rgba(0,0,0,.6);

  --l1: #f5f5f7;
  --l2: #bcbdc6;
  --l3: #7f818a;
  --l4: rgba(255,255,255,.16);
  --sep: rgba(255,255,255,.075);
  --spine-done: rgba(122,174,102,.30);
  --spine-todo: rgba(255,255,255,.075);
  --fill: rgba(255,255,255,.044);
  --fill2: rgba(255,255,255,.08);
  --fill3: rgba(255,255,255,.13);
  --code: rgba(255,255,255,.075);

  --accent: #4a66ff;
  --accent-t: #8ab4f8;
  --accent-bg: rgba(74,102,255,.16);
  --ok: #7aae66;
  --ok-bg: rgba(122,174,102,.14);
  --danger: #ff6670;
  --danger-bg: rgba(255,102,112,.14);

  --aurora-g0: #22e1c9; --aurora-g1: #00d0de; --aurora-g2: #00b9f1;
  --aurora-g3: #009cfe; --aurora-g4: #3e7bff; --aurora-g5: #5175ff;
  --aurora-g6: #616eff; --aurora-g7: #6e68ff; --aurora-g8: #7b61ff;
  --beam-opacity: 0.72;
  --beam-blend: plus-lighter;
}

  --ios-bg: #000000;

  --glass: rgba(36,36,41,.78);
  --glass-pill: rgba(32,32,37,.82);
  --glass-sh: 0 0 0 .5px rgba(255,255,255,.13), inset 0 .5px 0 rgba(255,255,255,.12), 0 10px 28px rgba(0,0,0,.55);

  --l1: #f0f0ed;
  --l2: #b2b2ad;
  --l3: #8a8a85;
  --l4: rgba(255,255,255,.16);

  --spine-done: rgba(122,174,102,.32);
  --spine-todo: rgba(255,255,255,.085);
  --fill: rgba(255,255,255,.05);

  --code: rgba(255,255,255,.075);

  --accent: #4a66ff;
  --accent-t: #8ab4f8;
  --accent-bg: rgba(74,102,255,.17);
  --ok: #7aae66;
  --ok-bg: rgba(122,174,102,.14);
  --danger: #ff6670;

  --aurora-g0: #22e1c9; --aurora-g1: #00d0de; --aurora-g2: #00b9f1;
  --aurora-g3: #009cfe; --aurora-g4: #3e7bff; --aurora-g5: #5175ff;
  --aurora-g6: #616eff; --aurora-g7: #6e68ff; --aurora-g8: #7b61ff;
  --beam-opacity: 0.68;
  --beam-blend: plus-lighter;
}

/* ---------- Soft Light ("柔白", app.css data-light-style="soft") ---------- */
[data-theme="soft"] {
  --page: #e4e6ec;
  --page-fg: #202127;
  --page-fg2: #60636d;
  --page-card: #f4f5f7;
  --page-bd: rgba(32,33,39,.09);
  --page-btn: rgba(32,33,39,.07);
  --page-bar: rgba(244,245,247,.90);

  --win: #f4f5f7;
  --win-rgb: 244,245,247;
  --bub: #e7ebf2;
  --bub-fg: #202127;
  --pill: #ffffff;
  --pill-bd: rgba(32,33,39,.10);
  --cmp-hi: rgba(255,255,255,.8);
  --cmp-lift: 0 0 0 1px rgba(32,33,39,.09), 0 6px 18px -8px rgba(32,33,39,.10);
  --slice-sh: 0 0 0 .5px rgba(32,33,39,.14), 0 20px 52px rgba(20,24,40,.11);

  --ios-bg: #f4f5f7;
  --ios-bg-rgb: 244,245,247;
  --glass: rgba(255,255,255,.78);
  --glass-pill: rgba(255,255,255,.86);
  --glass-sh: 0 0 0 .5px rgba(32,33,39,.09), inset 0 .5px 0 rgba(255,255,255,.9), 0 8px 24px rgba(32,33,39,.09);

  --l1: #202127;
  --l2: #5b5e68;
  --l3: #7f838f;
  --l4: rgba(32,33,39,.17);
  --sep: rgba(32,33,39,.075);
  --spine-done: rgba(23,146,79,.28);
  --spine-todo: rgba(32,33,39,.08);
  --fill: rgba(32,33,39,.04);

  --accent-t: #285fb8;

  --ok: #17924f;

  --aurora-g0: #0891b2; --aurora-g1: #008cc2; --aurora-g2: #0084d3;

  --aurora-g6: #5356f3; --aurora-g7: #614af2; --aurora-g8: #6d3cf0;
  --beam-opacity: 0.78;

/* ---------- Pure Light ---------- */
[data-theme="light"] {
  --page: #e8eaf0;
  --page-fg: #1b1c22;
  --page-fg2: #5d606d;
  --page-card: #ffffff;
  --page-bd: rgba(0,0,0,.085);
  --page-btn: rgba(20,24,40,.065);
  --page-bar: rgba(245,246,250,.90);

  --win: #ffffff;
  --win-rgb: 255,255,255;
  --bub: #eef1f8;
  --bub-fg: #1b1c22;
  --pill: #ffffff;
  --pill-bd: rgba(0,0,0,.105);
  --cmp-hi: transparent;
  --cmp-lift: 0 .5px 1px rgba(0,0,0,.05), 0 3px 10px rgba(10,20,50,.06);
  --slice-sh: 0 0 0 .5px rgba(0,0,0,.15), 0 20px 52px rgba(10,20,50,.12);

  --ios-bg: #ffffff;
  --ios-bg-rgb: 255,255,255;
  --glass: rgba(250,250,252,.82);
  --glass-pill: rgba(255,255,255,.88);
  --glass-sh: 0 0 0 .5px rgba(0,0,0,.095), inset 0 .5px 0 rgba(255,255,255,.85), 0 10px 28px rgba(20,24,40,.10);

  --l1: rgba(0,0,0,.88);
  --l2: rgba(0,0,0,.56);
  --l3: rgba(0,0,0,.36);
  --l4: rgba(0,0,0,.16);
  --sep: rgba(0,0,0,.08);
  --spine-done: rgba(23,146,79,.28);
  --spine-todo: rgba(0,0,0,.085);
  --fill: rgba(0,0,0,.042);
  --fill2: rgba(0,0,0,.075);
  --fill3: rgba(0,0,0,.12);
  --code: rgba(0,0,0,.055);

  --accent: #3d5bff;
  --accent-t: #2d4ae6;
  --accent-bg: rgba(61,91,255,.10);
  --ok: #17924f;
  --ok-bg: rgba(23,146,79,.11);
  --danger: #d7333f;
  --danger-bg: rgba(215,51,63,.10);

  --aurora-g0: #0891b2; --aurora-g1: #008cc2; --aurora-g2: #0084d3;
  --aurora-g3: #0079e3; --aurora-g4: #2f6bf0; --aurora-g5: #4361f2;
  --aurora-g6: #5356f3; --aurora-g7: #614af2; --aurora-g8: #6d3cf0;
  --beam-opacity: 0.78;
  --beam-blend: multiply;

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--page);
  color: var(--page-fg);
  font: 14px/1.55 var(--font-mac);
  font-variation-settings: "ROND" 0, "slnt" 0, "wdth" 94;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 112px;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
svg { display: block; flex: none; }

/* ---------- Hermesh Emergence Mark + Shimmer ---------- */
.hm-mark { flex: none; display: inline-block; }
.hm-seq .hm-beam {
  opacity: .26;
  mix-blend-mode: normal;
  animation: hm-seq 1.25s linear infinite;
}
.hm-seq .hm-b1 { animation-delay: .41s; }
.hm-seq .hm-b2 { animation-delay: .82s; }
@keyframes hm-seq {
  0%, 62%, 100% { opacity: .26; }
  30% { opacity: 1; }
}
.shimmer {
  -webkit-mask-image: linear-gradient(90deg, #000 36%, rgba(0,0,0,.32) 50%, #000 64%);
  mask-image: linear-gradient(90deg, #000 36%, rgba(0,0,0,.32) 50%, #000 64%);
  -webkit-mask-size: 280% 100%;
  mask-size: 280% 100%;
  animation: sweep 2.4s linear infinite;
}
@keyframes sweep {
  from { -webkit-mask-position: 100% 0; mask-position: 100% 0; }
  to { -webkit-mask-position: 0 0; mask-position: 0 0; }
}

/* Optional Alignment Guide Overlay */
.show-guides .guide-col {
  box-shadow: inset 1px 0 0 rgba(255, 70, 120, .38), inset -1px 0 0 rgba(255, 70, 120, .38);
}
.show-guides .guide-axis { position: relative; }
.show-guides .guide-axis::after {
  content: "";
  position: absolute;
  top: 0; bottom: 0;
  left: 26px; /* 18px icon slot + 8px gap = exact x=26px text start axis */
  border-left: 1px dashed rgba(74, 150, 255, .45);
  pointer-events: none;
}

/* ---------- Page Header ---------- */
.page-head {
  max-width: 1340px;
  margin: 0 auto;
  padding: 20px 24px 10px;
}
.page-head h1 {
  margin: 0;
  font-size: 19.5px;
  font-weight: 650;
  letter-spacing: -.01em;
}
.page-head .lead {
  margin: 6px 0 13px;
  color: var(--page-fg2);
  font-size: 13px;
  max-width: 98ch;
  line-height: 1.65;
}
.scheme-tabs {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  padding: 4px;
  border-radius: 12px;
  background: var(--page-card);
  border: 1px solid var(--page-bd);
  width: fit-content;
}
.scheme-tab {
  height: 32px;
  padding: 0 13px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  color: var(--page-fg2);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: background .16s, color .16s;
}
.scheme-tab:hover { color: var(--page-fg); background: var(--fill); }
.scheme-tab.on { background: var(--accent); color: #fff; font-weight: 600; }
.scheme-tab .rec {
  font-size: 10.5px;
  line-height: 15px;
  padding: 0 5px;
  border-radius: 4px;
  background: rgba(255,255,255,.22);
  color: inherit;
  font-weight: 600;
}
.scheme-tab:not(.on) .rec { background: var(--ok-bg); color: var(--ok); }

/* ---------- Stage ---------- */
.stage-wrap {
  max-width: 1340px;
  margin: 0 auto;
  padding: 6px 24px 24px;
}
.scheme-banner {
  background: var(--page-card);
  border: 1px solid var(--page-bd);
  border-radius: 14px;
  padding: 13px 18px;
  margin-bottom: 16px;
  display: grid;
  grid-template-columns: 1.15fr 1fr 1fr;
  gap: 12px 24px;
}
@media (max-width: 960px) { .scheme-banner { grid-template-columns: 1fr; } }
.sb-col h2 {
  margin: 0 0 4px;
  font-size: 15px;
  font-weight: 650;
  display: flex;
  align-items: center;
  gap: 8px;
}
.sb-col h3 { margin: 0 0 4px; font-size: 12.5px; font-weight: 650; color: var(--page-fg); }
.sb-col p { margin: 0; font-size: 12.5px; line-height: 1.6; color: var(--page-fg2); }
.tag-pill {
  font-size: 11px;
  line-height: 18px;
  padding: 0 7px;
  border-radius: 999px;
  font-weight: 600;
}
.tag-pill.good { background: var(--ok-bg); color: var(--ok); }
.tag-pill.info { background: var(--accent-bg); color: var(--accent-t); }
.tag-pill.base { background: var(--fill2); color: var(--page-fg2); }

.devices-row {
  display: flex;
  gap: 26px;
  align-items: flex-start;
  justify-content: center;
  flex-wrap: wrap;
}
.dev-block { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.dev-block.mac-block { flex: 1 1 700px; max-width: 832px; }
.dev-block.ios-block { flex: 0 0 auto; }
.dev-caption {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 4px;
  font-size: 12px;
  color: var(--page-fg2);
}
.dev-caption b { color: var(--page-fg); font-weight: 600; }

/* ==========================================================================
   MAC WINDOW: Exact 728px Conversation Inside 768px Composer Grid
   ========================================================================== */
.mac-win {
  position: relative;
  height: 620px;
  border-radius: 16px;
  background: var(--win);
  box-shadow: var(--slice-sh);
  overflow: hidden;
  font-family: var(--font-mac);
  color: var(--l1);
  display: flex;
  flex-direction: column;
}
.mac-titlebar {
  height: 40px;
  padding: 0 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: .5px solid var(--sep);
  flex: none;
  z-index: 6;
}
.tl-dots { display: flex; gap: 7px; margin-right: 4px; }
.tl-dots i { width: 11px; height: 11px; border-radius: 50%; background: var(--fill3); display: block; }
.mac-title { font-size: 13px; font-weight: 600; }
.mac-sub {
  font-family: var(--mono);
  font-size: 11.5px;
  color: var(--l3);
  padding: 1px 7px;
  border-radius: 5px;
  background: var(--fill);
}
.mac-chat {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 20px 52px 142px;
  scrollbar-width: none;
}
.mac-chat::-webkit-scrollbar { display: none; }
.mac-dbody {
  max-width: var(--conv-w);
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
}
.m-ubub {
  align-self: flex-end;
  max-width: 80%;
  background: var(--bub);
  color: var(--bub-fg);
  border-radius: 14px;
  padding: 9px 15px;
  font-size: 14px;
  line-height: 1.6;
  margin-bottom: 2px;
}
.m-tool {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 13.5px;
  line-height: 20px;
  color: var(--l2);
}
.m-tool code, .inline-code {
  font-family: var(--mono);
  font-size: .88em;
  background: var(--code);
  padding: 1px 5px;
  border-radius: 4px;
  word-break: normal;
  overflow-wrap: break-word;
  box-decoration-break: clone;
  -webkit-box-decoration-break: clone;
}
.m-am {
  font-size: 14.5px;
  line-height: 1.65;
  color: var(--l1);
}
.m-am code {
  font-family: var(--mono);
  font-size: .88em;
  background: var(--code);
  padding: 1px 5px;
  border-radius: 4px;
}
.mac-zone {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  z-index: 5;
  pointer-events: none;
  padding: 28px 32px 16px;
  background: linear-gradient(to bottom, rgba(var(--win-rgb), 0), rgba(var(--win-rgb), .92) 26px, var(--win) 40px);
}
.mac-zcol { pointer-events: auto; max-width: var(--cmp-w); margin: 0 auto; }
.mac-cmp {
  background: var(--pill);
  border-radius: 18px;
  box-shadow: inset 0 .5px 0 var(--cmp-hi), 0 0 0 .5px var(--pill-bd), var(--cmp-lift);
  display: flex;
  flex-direction: column;
}
.mac-cmp-in {
  min-height: 50px;
  padding: 13px 17px 5px;
  font-size: 14.5px;
  line-height: 21px;
  color: var(--l3);
}
.mac-cmp-bar { display: flex; align-items: center; padding: 0 8px 8px 9px; gap: 2px; }
.mac-ib { width: 32px; height: 32px; border-radius: 50%; color: var(--l3); display: inline-flex; align-items: center; justify-content: center; }
.mac-pick { height: 28px; padding: 0 8px; border-radius: 8px; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--l1); }
.mac-pick img { width: 15px; height: 15px; border-radius: 4px; }
.mac-pick .lvl { color: var(--l3); }
.mac-pick .lvl::before { content: "·"; margin-right: 5px; }
.mac-stop {
  width: 30px; height: 30px; margin: 1px 3px 1px 1px; border-radius: 50%;
  color: var(--l1); box-shadow: inset 0 0 0 1.5px var(--l4);
  display: inline-flex; align-items: center; justify-content: center;
}
.mac-send { width: 30px; height: 30px; margin: 1px; border-radius: 50%; color: var(--l3); display: inline-flex; align-items: center; justify-content: center; }

.g18 {
  width: 18px;
  height: 20px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: none;
}
.status-chip {
  font-family: var(--font-mac);
  font-size: 11px;
  line-height: 16px;
  padding: 0 5.5px;
  border-radius: 4px;
  font-weight: 550;
  margin-left: 6px;
}
.status-chip.run { background: var(--accent-bg); color: var(--accent-t); margin-left: 0; }
.status-chip.skip { background: var(--fill2); color: var(--l3); }

/* ==========================================================================
   B2 ALL-EXPANDED INLINE SPINE: S0 (Baseline) vs S1 (Refined) vs S2 (Dashed)
   ========================================================================== */
.b2-spine {
  position: relative;
  display: flex;
  flex-direction: column;
}

/* --- S0 Baseline (what happens right after deleting fold code without visual polish):
   single continuous ::before line shoots past last icon when last step wraps / has subFocus! --- */
.b2-spine.s0 { padding-top: 8px; }
.b2-spine.s0.spined::before {
  content: "";
  position: absolute;
  left: 8.5px;
  top: 18px;
  bottom: 10px;
  width: 1px;
  background: var(--sep);
  pointer-events: none;
}
.b2-spine.s0 .b2-node { padding: 3.5px 0; }
.b2-spine.s0 .b2-node.active { padding: 4.5px 0; }
.b2-spine.s0 .b2-glyph {
  width: 18px; height: 20px;
  background: var(--win);
  display: flex; align-items: center; justify-content: center;
  position: relative; z-index: 1;
}
.phone .b2-spine.s0 .b2-glyph { background: var(--ios-bg); }
.b2-spine.s0 .b2-passive-txt { font-size: 13px; line-height: 20px; color: var(--l3); overflow-wrap: break-word; }
.b2-spine.s0 .b2-node.pending .b2-passive-txt { color: var(--l2); opacity: .78; }

/* --- S1 & S2 Refined All-Expanded Spine:
   1. Per-node segment between icon centers -> ZERO dangling tail on last step!
   2. Traversed segment (completed -> next) subtly tinted/solid vs upcoming segment softer/dashed.
   3. Three-tier hierarchy: muted sage-green check + compact 12.5px completed rows ->
      breathing active focal row (6.5px vertical rhythm + 14px medium + 2-line shimmer subFocus) ->
      crisp hollow ring + calm secondary upcoming rows. --- */
.b2-spine.refined {
  padding-top: 5px;
}
.b2-node {
  position: relative;
  display: grid;
  grid-template-columns: 18px minmax(0, 1fr);
  column-gap: 8px;
  align-items: start;
  min-width: 0;
}
.b2-spine.refined .b2-node {
  padding: 2.5px 0;
}
.b2-spine.refined .b2-node.active {
  padding: 6px 0; /* Breathing room around the active step so the eye anchors immediately */
}
.b2-spine.refined .b2-glyph {
  width: 18px;
  height: 19px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  z-index: 1;
}
.b2-spine.refined .b2-node.active .b2-glyph {
  height: 20px;
}
/* Segment from current node's icon bottom to next node's icon top — NEVER drawn on :last-child! */
.b2-spine.refined .b2-node:not(:last-child)::after {
  content: "";
  position: absolute;
  left: 8.5px;
  top: 20px;
  bottom: -4px;
  width: 1px;
  background: var(--spine-todo);
  pointer-events: none;
}
.b2-spine.refined .b2-node.active:not(:last-child)::after {
  top: 24px;
}
/* Traversed rail between completed/skipped steps */
.b2-spine.refined .b2-node.traversed:not(:last-child)::after {
  background: var(--spine-done);
}
/* Dashed future rail after active step (fused into both S1 & S2!) */
.b2-spine.refined .b2-node.future-seg:not(:last-child)::after {
  background: none;
  border-left: 1px dashed var(--l4);
}

.b2-active-main {
  min-width: 0;
  font-size: 14px;
  line-height: 20px;
  color: var(--l1);
  font-weight: 520;
  overflow-wrap: break-word;
}
.phone .b2-active-main { font-size: 14.5px; line-height: 20.5px; }
.b2-node.failed .b2-active-main { color: var(--danger); }

.b2-inline-meta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  margin-left: 7px;
  font-family: var(--mono);
  font-size: 11.5px;
  font-weight: 450;
  color: var(--l3);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  vertical-align: baseline;
}
.b2-active-sub {
  margin-top: 2.5px;
  display: flex;
  align-items: flex-start;
  gap: 6px;
  min-width: 0;
  font-size: 12.5px;
  line-height: 18px;
  color: var(--l2);
}
.b2-active-sub .sub-t {
  flex: 0 1 auto;
  min-width: 0;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  overflow: hidden;
  overflow-wrap: break-word;
}
.b2-active-sub .sub-el {
  flex: none;
  font-family: var(--mono);
  font-size: 11.5px;
  line-height: 18px;
  color: var(--l3);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.b2-spine.refined .b2-passive-txt {
  min-width: 0;
  font-size: 12.75px;
  line-height: 19px;
  color: var(--l3);
  overflow-wrap: break-word;
}
.phone .b2-spine.refined .b2-passive-txt {
  font-size: 13px;
  line-height: 19px;
}
.b2-spine.refined .b2-node.pending .b2-passive-txt {
  color: var(--l2);
  opacity: .76;
}

/* Auto-collapsed banner in "done" scene to show how cleanly the conversation settles */
.settled-clean-note {
  margin-top: 2px;
  padding: 8px 12px;
  border-radius: 10px;
  background: var(--ok-bg);
  color: var(--ok);
  font-size: 12.5px;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  width: fit-content;
}

   IPHONE VIEWPORT

.phone {
  width: 390px;
  height: 696px;
  border-radius: 50px;

  position: relative;
  overflow: hidden;
  overflow: clip;

  color: var(--l1);
  font-family: var(--font-ios);
  font-size: 15.5px;
  line-height: 1.45;
  user-select: none;
}
.ios-top-fade {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 94px;
  z-index: 6;
  pointer-events: none;
  background: linear-gradient(to bottom, rgba(var(--ios-bg-rgb), .94) 30%, rgba(var(--ios-bg-rgb), 0));
}
.ios-top-nav {
  position: absolute;
  top: 14px; left: 16px; right: 16px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 8;
}
.ios-nav-circle {
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--glass); box-shadow: var(--glass-sh);
  backdrop-filter: blur(22px) saturate(1.5); -webkit-backdrop-filter: blur(22px) saturate(1.5);
  display: flex; align-items: center; justify-content: center;
}
.ios-session-cap {
  max-width: 236px;
  height: 42px;
  padding: 0 16px;
  border-radius: 999px;
  background: var(--glass);
  box-shadow: var(--glass-sh);
  backdrop-filter: blur(22px) saturate(1.5);
  -webkit-backdrop-filter: blur(22px) saturate(1.5);
  display: flex;
  flex-direction: column;
  justify-content: center;
  text-align: center;
}
.ios-session-cap b { font-size: 13px; font-weight: 600; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ios-session-cap small { font-size: 10.5px; line-height: 1.2; color: var(--l2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.ios-side-rail {
  position: absolute;
  top: 76px; right: 12px;
  z-index: 8;
  display: flex; flex-direction: column; align-items: center; gap: 11px;
}
.ios-rail-time { font-size: 12.5px; font-weight: 650; }
.ios-rail-wifi {
  width: 34px; height: 34px; border-radius: 50%;
  border: 2px solid var(--l2); border-bottom-color: transparent;
  display: flex; align-items: center; justify-content: center;
}
.ios-chat {
  position: absolute;
  inset: 0;
  overflow-y: auto;
  padding: 72px 20px 104px 20px;
  display: flex;
  flex-direction: column;
  gap: 13px;
  scrollbar-width: none;
}
.phone.duo-rail .ios-chat { padding-right: 64px; }
.ios-chat::-webkit-scrollbar { display: none; }
.ios-msg { font-size: 15.5px; line-height: 1.48; color: var(--l1); }
.ios-msg code {
  font-family: var(--mono); font-size: 13.5px; background: var(--code);
  padding: 1px 5px; border-radius: 5px;
}
.ios-tool { font-size: 14px; color: var(--l2); display: flex; align-items: center; gap: 5px; }
.ios-tool code { font-family: var(--mono); font-size: 12.5px; }

.ios-bottom {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  z-index: 9;
  pointer-events: none;
  padding: 24px 0 16px;
  background: linear-gradient(to bottom, rgba(var(--ios-bg-rgb), 0), rgba(var(--ios-bg-rgb), .90) 24px, var(--ios-bg) 44px);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.ios-bottom > * { pointer-events: auto; }
.ios-box {
  margin: 0 12px;
  padding: 6px;
  border-radius: 24px;
  background: var(--glass-pill);
  box-shadow: var(--glass-sh);
  backdrop-filter: blur(24px) saturate(1.5);
  -webkit-backdrop-filter: blur(24px) saturate(1.5);
  display: flex;
  align-items: center;
  gap: 8px;
}
.ios-plus, .ios-stop, .ios-send {
  width: 36px; height: 36px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center; flex: none;
}
.ios-plus, .ios-stop { background: var(--fill2); color: var(--l1); }
.ios-send { background: color-mix(in srgb, var(--accent) 42%, transparent); color: rgba(255,255,255,.88); }
.ios-ph { flex: 1; min-width: 0; font-size: 15px; color: var(--l3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ios-home {
  position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
  width: 130px; height: 4.5px; border-radius: 99px; background: var(--l2); opacity: .5; z-index: 15;
}
.ios-toend-wrap { display: flex; justify-content: center; }
.ios-toend-cap {
  height: 36px; max-width: calc(100% - 32px); padding: 0 8px 0 11px;
  border-radius: 999px; background: var(--glass-pill); box-shadow: var(--glass-sh);
  backdrop-filter: blur(22px) saturate(1.5); -webkit-backdrop-filter: blur(22px) saturate(1.5);
  display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 500;
}
.ios-toend-cap .tc-txt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 196px; }
.ios-toend-cap .tc-arr {
  width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: #fff;
  display: inline-flex; align-items: center; justify-content: center; flex: none;
}

/* ---------- Sticky Control Bar (Zero fold/expand buttons!) ---------- */
.ctl-bar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 99;
  background: var(--page-bar);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--page-bd);
  padding: 8px 14px;
  display: flex;
  flex-wrap: wrap;
  gap: 7px 16px;
  align-items: center;
  justify-content: center;
  font-size: 12px;
}
.ctl-g { display: flex; align-items: center; gap: 4px; }
.ctl-g > b { color: var(--page-fg2); font-weight: 500; margin-right: 3px; }
.ctl-bar button {
  height: 26px;
  padding: 0 9px;
  border-radius: 7px;
  background: var(--page-btn);
  color: var(--page-fg2);
  font-weight: 500;
  transition: background .15s, color .15s;
}
.ctl-bar button:hover { color: var(--page-fg); }
.ctl-bar button.on { background: var(--accent); color: #fff; }

let markSeqId = 0;
function emergenceMark(size = 16) {
  const uid = "hm-" + (++markSeqId);
  const beams = [0, 1, 2].map((i) => {
    const a = (i * Math.PI) / 3;
    const dx = Math.cos(a), dy = Math.sin(a);
    const nx = -dy, ny = dx;
    const mx = nx * 10, my = ny * 10;
    return {
      x1: (mx - dx * 37).toFixed(2),
      y1: (my - dy * 37).toFixed(2),
      x2: (mx + dx * 37).toFixed(2),
      y2: (my + dy * 37).toFixed(2),
      cls: "hm-beam hm-b" + i,
      gid: uid + "-" + i
    };
  });
  const stops = [0,1,2,3,4,5,6,7,8].map(k =>
    `<stop offset="${(k/8).toFixed(3)}" style="stop-color:var(--aurora-g${k})"/>`
  ).join("");
  return `<svg class="hm-mark hm-seq" width="${size}" height="${size}" viewBox="-49 -48 92 94" aria-hidden="true">
    <defs>${beams.map(b => `<linearGradient id="${b.gid}" gradientUnits="userSpaceOnUse" x1="${b.x1}" y1="${b.y1}" x2="${b.x2}" y2="${b.y2}">${stops}</linearGradient>`).join("")}</defs>
    <g>${beams.map(b => `<path d="M${b.x1} ${b.y1}L${b.x2} ${b.y2}" pathLength="100" class="${b.cls}" stroke="url(#${b.gid})" stroke-width="13" stroke-linecap="round" fill="none"/>`).join("")}</g>
  </svg>`;
}

function formatRichStepText(txt) {
  return txt.replace(/([a-zA-Z0-9_.-]+\/[a-zA-Z0-9_./-]+|\b(?:sessions\.db|schema_history|Transcript\.swift|SessionPage\.tsx|SessionPage\.swift|Hermesh\.app|Playwright|XCUITest|HermeshCore|WAL\/SHM|TodoWrite)\b)/g, (m) => {
    const cleanBreaks = m.replace(/\//g, "/<wbr>");
    return `<code class="inline-code">${cleanBreaks}</code>`;
  });
}

function glyphFor(status, variant, size = 16) {
  if (status === "completed") {
    if (variant === "s2") return IC.checkBadge;
    if (variant === "s1") return IC.checkSage;
    return `<span style="color:var(--l3);display:inline-flex">${IC.checkGray}</span>`;
  }
  if (status === "skipped") return `<span style="color:var(--l3);display:inline-flex">${IC.skip}</span>`;
  if (status === "failed") return IC.fail;
  if (status === "in_progress") return emergenceMark(size);
  return `<span style="color:var(--l4);display:inline-flex">${IC.ring}</span>`;
}

function computeSpine(steps, focusRaw) {
  if (!steps || steps.length === 0) return null;
  const all = steps.map((s, index) => ({ index, text: s.text, status: s.status }));
  let active = all.filter(s => s.status === "in_progress" || s.status === "failed");
  if (active.length === 0) active = [all.find(s => s.status === "pending") || all[all.length - 1]];
  const firstActive = active[0].index;
  const lastActive = active[active.length - 1].index;
  const w = (focusRaw || "").trim();
  const subFocus = w && !active.some(a => a.text.trim() === w) ? w : "";
  return {
    total: all.length,
    stepNumber: firstActive + 1,
    firstActive,
    lastActive,
    hasFail: all.some(s => s.status === "failed"),
    all,
    active,
    subFocus
  };
}

function renderAllExpandedSpine(variant, platform) {
  const sc = SCENES[state.scene];
  if (state.scene === "done") {
    return `
      <div class="m-am" style="${platform === "ios" ? "font-size:15.5px;line-height:1.48" : ""}">
        全部步骤已完成并通过端到端验证；随流任务清单已自动收起，不留历史残影。
      </div>
    `;
  }
  const steps = platform === "mac" ? sc.mac : sc.ios;
  const focusRaw = platform === "mac" ? sc.focusMac : sc.focusIOS;
  const elapsed = platform === "mac" ? sc.elapsed : sc.iosElapsed;
  const win = computeSpine(steps, focusRaw);
  if (!win) return "";

  const activeOrderMap = new Map(win.active.map((a, i) => [a.index, i]));
  const isRefined = variant !== "s0";
  const cls = isRefined ? `b2-spine refined ${variant}` : `b2-spine s0 ${win.total >= 2 ? "spined" : ""}`;
  const markSize = platform === "ios" ? 16 : 17;
  const skipLabel = platform === "ios" ? "Skipped" : "跳过";
  const parLabel = platform === "ios" ? "Parallel" : "并行";

  return `
    <div class="${cls} guide-axis">
      ${win.all.map((step) => {
        const order = activeOrderMap.get(step.index);
        const isActive = order !== undefined;
        const isLastActive = step.index === win.lastActive;
        const traversed = step.index < win.firstActive && (step.status === "completed" || step.status === "skipped");
        const futureSeg = step.index >= win.lastActive;
        const segCls = `${traversed ? "traversed" : ""} ${futureSeg ? "future-seg" : ""}`;

        if (isActive) {
          return `
            <div class="b2-node active ${step.status} ${segCls}">
              <span class="b2-glyph">${glyphFor(step.status, variant, markSize)}</span>
              <div style="min-width:0">
                <div class="b2-active-main">
                  <span>${formatRichStepText(step.text)}</span>
                  <span class="b2-inline-meta">
                    ${order === 0
                      ? `${win.stepNumber}/${win.total}${!win.subFocus ? ` · ${elapsed}` : ""}`
                      : `<span class="status-chip run">${parLabel}</span>`
                    }
                  </span>
                </div>
                ${isLastActive && win.subFocus ? `
                  <div class="b2-active-sub">
                    <span class="sub-t ${win.hasFail ? "" : "shimmer"}" style="${win.hasFail ? "color:var(--danger)" : ""}">${win.subFocus.replace(/\//g, "/<wbr>")}</span>
                    <span class="sub-el">· ${elapsed}</span>
                  </div>
                ` : ""}
              </div>
            </div>
          `;
        }

        return `
          <div class="b2-node ${step.status} ${segCls}">
            <span class="b2-glyph">${glyphFor(step.status, variant, markSize)}</span>
            <div class="b2-passive-txt">
              ${formatRichStepText(step.text)}
              ${step.status === "skipped" ? `<span class="status-chip skip">${skipLabel}</span>` : ""}
            </div>
          </div>
        `;
      }).join("")}
    </div>
  `;
}

      </div>
      <div class="sb-col">
        <h3>全展开呼吸节奏与对齐网格</h3>
        <p>${cur.rhythmSpec}</p>
      </div>
    </section>
    <div class="devices-row">
      <div class="dev-block mac-block">
        <div class="dev-caption">
          <b>macOS 桌面端（728px 会话列 · 全步骤直接平铺零折叠）</b>
          <span>已完成、当前执行、未来待办一目了然</span>
        </div>
        ${renderMac(cur.id)}
      </div>
      <div class="dev-block ios-block">
        <div class="dev-caption">
          <b>iPhone 端（${state.iosLayout === "duo" ? "Duo 竖排栏右侧避让 64pt" : "对称 20pt 边距 · 全步骤平铺"}）</b>
          <span>${state.scrolledAway ? "已上滑看历史 · 底部浮现进度胶囊" : "无折叠无玻璃遮挡 · 直接通览全局"}</span>
        </div>
        ${renderIPhone(cur.id)}
      </div>
    </div>
  `;

  document.querySelectorAll("[data-act='scene']").forEach(b => {
    b.classList.toggle("on", b.dataset.val === state.scene);
  });
  document.querySelectorAll("[data-act='ioslayout']").forEach(b => {
    b.classList.toggle("on", b.dataset.val === state.iosLayout);
  });
  document.querySelectorAll("[data-act='scroll']").forEach(b => {
    b.classList.toggle("on", state.scrolledAway);
  });
  document.querySelectorAll("[data-act='theme']").forEach(b => {
    b.classList.toggle("on", b.dataset.val === state.theme);
  });
  document.getElementById("btn-guides")?.classList.toggle("on", state.guides);
}

document.addEventListener("click", (e) => {
  const vBtn = e.target.closest("[data-variant]");
  if (vBtn) {
    state.variant = vBtn.dataset.variant;
    render();
    return;
  }
  const actBtn = e.target.closest("[data-act]");
  if (!actBtn) return;
  const act = actBtn.dataset.act;
  if (act === "scene") state.scene = actBtn.dataset.val;
  else if (act === "ioslayout") state.iosLayout = actBtn.dataset.val;
  else if (act === "scroll") state.scrolledAway = !state.scrolledAway;
  else if (act === "scroll-bottom") state.scrolledAway = false;
  else if (act === "guides") state.guides = !state.guides;
  else if (act === "theme") state.theme = actBtn.dataset.val;
  render();
});

render();
</script>
</body>
</html>

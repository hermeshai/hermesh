<!doctype html>
<html lang="zh-CN" data-theme="black">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>随流内嵌任务提示 · 四版精修排版与极端场景原型</title>
<style>
@font-face {
  font-family: "Google Sans Flex";
  src: url("../apps/desktop/src/renderer/src/assets/fonts/google-sans-flex.ttf") format("truetype");
  font-style: oblique 0deg 10deg;
  font-weight: 100 1000;
}
@font-face {
  font-family: "Google Sans Code";
  src: url("../apps/desktop/src/renderer/src/assets/fonts/google-sans-code.ttf") format("truetype");
  font-weight: 300 800;
}

:root {
  --font-mac: "Google Sans Flex", "Google Sans", -apple-system, BlinkMacSystemFont, "PingFang SC", system-ui, sans-serif;
  --font-ios: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", system-ui, sans-serif;
  --mono: "Google Sans Code", ui-monospace, "SF Mono", Menlo, Monaco, monospace;
  --ease: cubic-bezier(.22, 1, .36, 1);
  --ease-out: cubic-bezier(.2, 0, 0, 1);
  --ease-spring: cubic-bezier(.34, 1.4, .64, 1);
  /* Exact Hermesh spacing & column tokens (app.css + brand.css) */
  --sp-1: 8px;
  --sp-2: 13px;
  --sp-3: 21px;
  --conv-w: 728px;
  --cmp-w: 768px;
}

/* ---------- Pure Black OLED (app.css data-dark-style="black" + iOS OLED #000) ---------- */
[data-theme="black"] {
  --page: #090a0e;
  --page-fg: #ededf2;
  --page-fg2: #9498a6;
  --page-fg3: #626675;
  --page-card: #121319;
  --page-bd: rgba(255,255,255,.085);
  --page-btn: rgba(255,255,255,.075);
  --page-bar: rgba(16,17,23,.90);

  --win: #070709;
  --win-rgb: 7,7,9;
  --pill: #15151a;
  --pill-bd: rgba(255,255,255,.085);
  --cmp-hi: rgba(255,255,255,.05);
  --cmp-lift: 0 0 0 1px rgba(255,255,255,.085), 0 8px 24px -8px rgba(0,0,0,.45);
  --slice-sh: 0 0 0 1px rgba(255,255,255,.10), 0 24px 64px rgba(0,0,0,.75);

  --ios-bg: #000000;
  --ios-bg-rgb: 0,0,0;
  --glass: rgba(34,34,39,.78);
  --glass-pill: rgba(30,30,35,.82);
  --glass-sh: 0 0 0 .5px rgba(255,255,255,.13), inset 0 .5px 0 rgba(255,255,255,.12), 0 10px 28px rgba(0,0,0,.6);

  --l1: #f5f5f7;
  --l2: rgba(235,235,245,.58);
  --l3: rgba(235,235,245,.35);
  --l4: rgba(255,255,255,.15);
  --sep: rgba(255,255,255,.08);
  --fill: rgba(255,255,255,.044);
  --fill2: rgba(255,255,255,.08);
  --fill3: rgba(255,255,255,.13);
  --code: rgba(255,255,255,.07);

  --accent: #4a66ff;
  --accent-t: #8fa2ff;
  --accent-bg: rgba(74,102,255,.16);
  --ok: #3fcf86;
  --ok-bg: rgba(63,207,134,.13);
  --danger: #ff6670;
  --danger-bg: rgba(255,102,112,.14);
  --warn: #f5a53c;
  --warn-bg: rgba(245,165,60,.14);

  --aurora-g0: #22e1c9;
  --aurora-g1: #00d0de;
  --aurora-g2: #00b9f1;
  --aurora-g3: #009cfe;
  --aurora-g4: #3e7bff;
  --aurora-g5: #5175ff;
  --aurora-g6: #616eff;
  --aurora-g7: #6e68ff;
  --aurora-g8: #7b61ff;
  --beam-opacity: 0.72;
  --beam-blend: plus-lighter;
}

/* ---------- Standard Dark Gray ---------- */
[data-theme="dark"] {
  --page: #0e0f14;
  --page-fg: #ececf1;
  --page-fg2: #989ba8;
  --page-fg3: #666977;
  --page-card: #171820;
  --page-bd: rgba(255,255,255,.085);
  --page-btn: rgba(255,255,255,.08);
  --page-bar: rgba(20,21,27,.90);

  --win: #1e1e21;
  --win-rgb: 30,30,33;
  --pill: #29292d;
  --pill-bd: rgba(255,255,255,.11);
  --cmp-hi: rgba(255,255,255,.08);
  --cmp-lift: 0 .5px 1px rgba(0,0,0,.32), 0 3px 10px rgba(0,0,0,.18);
  --slice-sh: 0 0 0 .5px rgba(255,255,255,.14), 0 22px 60px rgba(0,0,0,.52);

  --ios-bg: #000000;
  --ios-bg-rgb: 0,0,0;
  --glass: rgba(36,36,41,.78);
  --glass-pill: rgba(32,32,37,.82);
  --glass-sh: 0 0 0 .5px rgba(255,255,255,.13), inset 0 .5px 0 rgba(255,255,255,.12), 0 10px 28px rgba(0,0,0,.55);

  --l1: rgba(255,255,255,.90);
  --l2: rgba(255,255,255,.56);
  --l3: rgba(255,255,255,.34);
  --l4: rgba(255,255,255,.15);
  --sep: rgba(255,255,255,.09);
  --fill: rgba(255,255,255,.05);
  --fill2: rgba(255,255,255,.085);
  --fill3: rgba(255,255,255,.14);
  --code: rgba(255,255,255,.07);

  --accent: #4a66ff;
  --accent-t: #8fa2ff;
  --accent-bg: rgba(74,102,255,.17);
  --ok: #3fcf86;
  --ok-bg: rgba(63,207,134,.14);
  --danger: #ff6670;
  --danger-bg: rgba(255,102,112,.14);
  --warn: #f5a53c;
  --warn-bg: rgba(245,165,60,.14);

  --aurora-g0: #22e1c9;
  --aurora-g1: #00d0de;
  --aurora-g2: #00b9f1;
  --aurora-g3: #009cfe;
  --aurora-g4: #3e7bff;
  --aurora-g5: #5175ff;
  --aurora-g6: #616eff;
  --aurora-g7: #6e68ff;
  --aurora-g8: #7b61ff;
  --beam-opacity: 0.68;
  --beam-blend: plus-lighter;
}

/* ---------- Light Mode ---------- */
[data-theme="light"] {
  --page: #e8eaf0;
  --page-fg: #1b1c22;
  --page-fg2: #5d606d;
  --page-fg3: #8a8e9c;
  --page-card: #ffffff;
  --page-bd: rgba(0,0,0,.085);
  --page-btn: rgba(20,24,40,.065);
  --page-bar: rgba(245,246,250,.90);

  --win: #ffffff;
  --win-rgb: 255,255,255;
  --pill: #ffffff;
  --pill-bd: rgba(0,0,0,.105);
  --cmp-hi: transparent;
  --cmp-lift: 0 .5px 1px rgba(0,0,0,.05), 0 3px 10px rgba(10,20,50,.06);
  --slice-sh: 0 0 0 .5px rgba(0,0,0,.15), 0 20px 52px rgba(10,20,50,.12);

  --ios-bg: #fbfbfc;
  --ios-bg-rgb: 251,251,252;
  --glass: rgba(250,250,252,.82);
  --glass-pill: rgba(255,255,255,.86);
  --glass-sh: 0 0 0 .5px rgba(0,0,0,.095), inset 0 .5px 0 rgba(255,255,255,.85), 0 10px 28px rgba(20,24,40,.10);

  --l1: rgba(0,0,0,.87);
  --l2: rgba(0,0,0,.55);
  --l3: rgba(0,0,0,.34);
  --l4: rgba(0,0,0,.14);
  --sep: rgba(0,0,0,.08);
  --fill: rgba(0,0,0,.042);
  --fill2: rgba(0,0,0,.075);
  --fill3: rgba(0,0,0,.12);
  --code: rgba(0,0,0,.055);

  --accent: #3d5bff;
  --accent-t: #2d4ae6;
  --accent-bg: rgba(61,91,255,.10);
  --ok: #17924f;
  --ok-bg: rgba(23,146,79,.11);
  --danger: #d7333f;
  --danger-bg: rgba(215,51,63,.10);
  --warn: #c86c08;
  --warn-bg: rgba(200,108,8,.11);

  --aurora-g0: #0891b2;
  --aurora-g1: #008cc2;
  --aurora-g2: #0084d3;
  --aurora-g3: #0079e3;
  --aurora-g4: #2f6bf0;
  --aurora-g5: #4361f2;
  --aurora-g6: #5356f3;
  --aurora-g7: #614af2;
  --aurora-g8: #6d3cf0;
  --beam-opacity: 0.78;
  --beam-blend: multiply;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--page);
  color: var(--page-fg);
  font: 14px/1.55 var(--font-mac);
  font-variation-settings: "ROND" 0, "slnt" 0, "wdth" 94;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 124px;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
svg { display: block; flex: none; }

/* ---------- Hermesh Emergence Mark + Shimmer (app.css + brand.css) ---------- */
.hm-mark { flex: none; display: inline-block; }
.hm-beam { opacity: var(--beam-opacity); mix-blend-mode: var(--beam-blend); }
.hm-seq .hm-beam {
  opacity: .26;
  mix-blend-mode: normal;
  animation: hm-seq 1.25s linear infinite;
}
.hm-seq .hm-b1 { animation-delay: .41s; }
.hm-seq .hm-b2 { animation-delay: .82s; }
@keyframes hm-seq {
  0%, 62%, 100% { opacity: .26; }
  30% { opacity: 1; }
}
.shimmer {
  -webkit-mask-image: linear-gradient(90deg, #000 36%, rgba(0,0,0,.32) 50%, #000 64%);
  mask-image: linear-gradient(90deg, #000 36%, rgba(0,0,0,.32) 50%, #000 64%);
  -webkit-mask-size: 280% 100%;
  mask-size: 280% 100%;
  animation: sweep 2.4s linear infinite;
}
@keyframes sweep {
  from { -webkit-mask-position: 100% 0; mask-position: 100% 0; }
  to { -webkit-mask-position: 0 0; mask-position: 0 0; }
}

/* Optional Alignment Guide Overlay (Toggleable to inspect the 20px / 18px grid!) */
.show-guides .guide-col {
  box-shadow: inset 1px 0 0 rgba(255, 70, 120, .38), inset -1px 0 0 rgba(255, 70, 120, .38);
}
.show-guides .guide-axis {
  position: relative;
}
.show-guides .guide-axis::after {
  content: "";
  position: absolute;
  top: 0; bottom: 0;
  left: 26px; /* 18px icon slot + 8px gap = exact text start axis! */
  border-left: 1px dashed rgba(74, 150, 255, .42);
  pointer-events: none;
}

/* ---------- Page Header ---------- */
.page-head {
  max-width: 1340px;
  margin: 0 auto;
  padding: 20px 24px 10px;
}
.page-head h1 {
  margin: 0;
  font-size: 19.5px;
  font-weight: 650;
  letter-spacing: -.01em;
}
.page-head .lead {
  margin: 6px 0 13px;
  color: var(--page-fg2);
  font-size: 13px;
  max-width: 96ch;
  line-height: 1.65;
}
.scheme-tabs {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  padding: 4px;
  border-radius: 12px;
  background: var(--page-card);
  border: 1px solid var(--page-bd);
  width: fit-content;
}
.scheme-tab {
  height: 32px;
  padding: 0 13px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  color: var(--page-fg2);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: background .16s, color .16s;
}
.scheme-tab:hover { color: var(--page-fg); background: var(--fill); }
.scheme-tab.on { background: var(--accent); color: #fff; font-weight: 600; }
.scheme-tab .rec {
  font-size: 10.5px;
  line-height: 15px;
  padding: 0 5px;
  border-radius: 4px;
  background: rgba(255,255,255,.22);
  color: inherit;
  font-weight: 600;
}
.scheme-tab:not(.on) .rec { background: var(--ok-bg); color: var(--ok); }

/* ---------- Stage ---------- */
.stage-wrap {
  max-width: 1340px;
  margin: 0 auto;
  padding: 6px 24px 24px;
}
.scheme-banner {
  background: var(--page-card);
  border: 1px solid var(--page-bd);
  border-radius: 14px;
  padding: 13px 18px;
  margin-bottom: 16px;
  display: grid;
  grid-template-columns: 1.15fr 1fr 1fr;
  gap: 12px 24px;
}
@media (max-width: 960px) { .scheme-banner { grid-template-columns: 1fr; } }
.sb-col h2 {
  margin: 0 0 4px;
  font-size: 15px;
  font-weight: 650;
  display: flex;
  align-items: center;
  gap: 8px;
}
.sb-col h3 { margin: 0 0 4px; font-size: 12.5px; font-weight: 650; color: var(--page-fg); }
.sb-col p { margin: 0; font-size: 12.5px; line-height: 1.6; color: var(--page-fg2); }
.tag-pill {
  font-size: 11px;
  line-height: 18px;
  padding: 0 7px;
  border-radius: 999px;
  font-weight: 600;
}
.tag-pill.good { background: var(--ok-bg); color: var(--ok); }
.tag-pill.info { background: var(--accent-bg); color: var(--accent-t); }

.devices-row {
  display: flex;
  gap: 26px;
  align-items: flex-start;
  justify-content: center;
  flex-wrap: wrap;
}
.dev-block { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.dev-block.mac-block { flex: 1 1 700px; max-width: 832px; }
.dev-block.ios-block { flex: 0 0 auto; }
.dev-caption {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 4px;
  font-size: 12px;
  color: var(--page-fg2);
}
.dev-caption b { color: var(--page-fg); font-weight: 600; }

/* ==========================================================================
   MAC WINDOW: Exact 728px Conversation Inside 768px Composer Grid (app.css L578)
   ========================================================================== */
.mac-win {
  position: relative;
  height: 600px;
  border-radius: 16px;
  background: var(--win);
  box-shadow: var(--slice-sh);
  overflow: hidden;
  font-family: var(--font-mac);
  color: var(--l1);
  display: flex;
  flex-direction: column;
}
.mac-titlebar {
  height: 40px;
  padding: 0 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: .5px solid var(--sep);
  flex: none;
  z-index: 6;
}
.tl-dots { display: flex; gap: 7px; margin-right: 4px; }
.tl-dots i { width: 11px; height: 11px; border-radius: 50%; background: var(--fill3); display: block; }
.mac-title { font-size: 13px; font-weight: 600; }
.mac-sub {
  font-family: var(--mono);
  font-size: 11.5px;
  color: var(--l3);
  padding: 1px 7px;
  border-radius: 5px;
  background: var(--fill);
}
.mac-chat {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  /* Exact Hermesh geometry: composer is max 768px with 32px gutter; conversation is 728px inset 20px inside composer! */
  padding: 20px 52px 146px;
  scrollbar-width: none;
}
.mac-chat::-webkit-scrollbar { display: none; }
.mac-dbody {
  max-width: var(--conv-w);
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: var(--sp-2); /* 13px exact .tr gap! */
}
.m-ubub {
  align-self: flex-end;
  max-width: 80%;
  background: var(--accent);
  color: #fff;
  border-radius: 14px;
  padding: 9px 15px;
  font-size: 14px;
  line-height: 1.6;
  margin-bottom: 4px;
}
.m-tool {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 14px;
  line-height: 20px;
  color: var(--l2);
}
.m-tool code, .inline-code {
  font-family: var(--mono);
  font-size: .88em;
  background: var(--fill2);
  padding: 1px 5px;
  border-radius: 4px;
  word-break: normal;
  overflow-wrap: break-word;
  box-decoration-break: clone;
  -webkit-box-decoration-break: clone;
}
.m-am {
  font-size: 14.5px;
  line-height: 1.65;
  color: var(--l1);
}
/* Mac Composer Zone: 32px gutter around 768px composer -> 20px wider per side than 728px conversation! */
.mac-zone {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  z-index: 5;
  pointer-events: none;
  padding: 28px 32px 16px;
  background: linear-gradient(to bottom, rgba(var(--win-rgb), 0), rgba(var(--win-rgb), .92) 26px, var(--win) 40px);
}
.mac-zcol {
  pointer-events: auto;
  max-width: var(--cmp-w);
  margin: 0 auto;
}
.mac-cmp {
  background: var(--pill);
  border-radius: 18px;
  box-shadow: inset 0 .5px 0 var(--cmp-hi), 0 0 0 .5px var(--pill-bd), var(--cmp-lift);
  display: flex;
  flex-direction: column;
}
.mac-cmp-in {
  min-height: 52px;
  padding: 14px 17px 6px; /* 32px + 17px = 49px, practically aligned with 52px conversation left edge! */
  font-size: 15px;
  line-height: 21px;
  color: var(--l3);
}
.mac-cmp-bar {
  display: flex;
  align-items: center;
  padding: 0 8px 8px 9px;
  gap: 2px;
}
.mac-ib {
  width: 32px; height: 32px; border-radius: 50%; color: var(--l3);
  display: inline-flex; align-items: center; justify-content: center;
}
.mac-pick {
  height: 28px; padding: 0 8px; border-radius: 8px;
  display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--l1);
}
.mac-pick img { width: 15px; height: 15px; border-radius: 4px; }
.mac-pick .lvl { color: var(--l3); }
.mac-pick .lvl::before { content: "·"; margin-right: 5px; }
.mac-stop {
  width: 30px; height: 30px; margin: 1px 3px 1px 1px; border-radius: 50%;
  color: var(--l1); box-shadow: inset 0 0 0 1.5px var(--l4);
  display: inline-flex; align-items: center; justify-content: center;
}
.mac-send {
  width: 30px; height: 30px; margin: 1px; border-radius: 50%; color: var(--l3);
  display: inline-flex; align-items: center; justify-content: center;
}

/* ==========================================================================
   SHARED STRICT 18PX ICON GRID & TYPOGRAPHIC TOKENS FOR INLINE FLOW
   ========================================================================== */

/* Exact Hermesh ConnectionLine (.th-work in composer.css L46: inline timer right beside text, never stranded far right!) */
.work-line {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  font-size: 13.5px;
  line-height: 20px;
  color: var(--l2);
}
.work-line .slot-18 {
  width: 18px; height: 20px;
  flex: none;
  display: flex; align-items: center; justify-content: center;
}
.work-line .w-body {
  flex: 0 1 auto;
  min-width: 0;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  overflow: hidden;
  overflow-wrap: break-word;
}
.work-line .w-timer {
  flex: none;
  font-size: 12.5px;
  line-height: 20px;
  color: var(--l3);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

/* Universal 18px Icon Slot so 13px check, 14px ring, and 16-18px Mark share ONE exact center axis! */
.g18 {
  width: 18px;
  height: 20px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: none;
}
.t-meta {
  font-family: var(--mono);
  font-size: 11.5px;
  line-height: 20px;
  color: var(--l3);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.status-chip {
  font-family: var(--font-mac);
  font-size: 11px;
  line-height: 16px;
  padding: 0 5.5px;
  border-radius: 4px;
  font-weight: 550;
}
.status-chip.run { background: var(--accent-bg); color: var(--accent-t); }
.status-chip.fail { background: var(--danger-bg); color: var(--danger); }
.status-chip.skip { background: var(--fill2); color: var(--l3); }

/* ==========================================================================
   VARIANT B1: 细线清单卡 + 底栏联动 (Hairline Plan Card · SettledCard / StepsCard 同源)
   ========================================================================== */
.b1-wrap {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.b1-card {
  width: 100%;
  max-width: 560px; /* Optimal reading width on Desktop so short steps never float in a 728px void; 100% on iPhone! */
  border-radius: 12px;
  background: var(--fill);
  box-shadow: inset 0 0 0 .5px var(--sep);
  overflow: hidden;
}
.phone .b1-card { max-width: 100%; }
.b1-head {
  width: 100%;
  min-height: 38px;
  padding: 8px 12px;
  display: grid;
  grid-template-columns: 18px minmax(0, 1fr) auto;
  column-gap: 8px;
  align-items: center;
  text-align: left;
  transition: background .15s;
}
.b1-head:hover { background: var(--fill2); }
.b1-h-title {
  min-width: 0;
  font-size: 13.5px;
  line-height: 20px;
  color: var(--l1);
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.b1-h-title.muted {
  color: var(--l2);
  font-size: 12.5px;
  font-weight: 500;
}
.b1-segs {
  display: inline-flex;
  align-items: center;
  gap: 3px;
}
.b1-segs i {
  width: 9px; height: 3px; border-radius: 2px; background: var(--fill3); display: block;
}
.b1-segs i.done { background: var(--ok); opacity: .8; }
.b1-segs i.run { background: var(--accent-t); }
.b1-segs i.fail { background: var(--danger); }

.b1-list {
  border-top: .5px solid var(--sep);
  max-height: 224px; /* ~6.5 rows cap with soft scroll, matching StepsCard! */
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  scrollbar-width: thin;
}
.b1-row {
  padding: 7.5px 12px;
  display: grid;
  grid-template-columns: 18px minmax(0, 1fr) auto;
  column-gap: 8px;
  align-items: start;
  font-size: 13px;
  line-height: 19.5px;
}
.b1-row + .b1-row { border-top: .5px solid var(--sep); }
.b1-row.in_progress { background: rgba(74, 102, 255, .055); }
[data-theme="light"] .b1-row.in_progress { background: rgba(61, 91, 255, .045); }
.b1-row.failed { background: rgba(255, 102, 112, .06); }
.b1-row .r-txt {
  min-width: 0;
  overflow-wrap: anywhere;
  color: var(--l2);
}
.b1-row.completed .r-txt, .b1-row.skipped .r-txt { color: var(--l3); }
.b1-row.in_progress .r-txt { color: var(--l1); font-weight: 500; }
.b1-row.failed .r-txt { color: var(--danger); font-weight: 500; }
.b1-subfocus {
  margin-top: 2px;
  font-size: 12px;
  line-height: 17px;
  color: var(--l2);
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 1;
  overflow: hidden;
}

/* ==========================================================================
   VARIANT B2: 呼吸脊柱时间轴 · 三行智能视窗 (Editorial Spine · 零卡片 18px 严苛轴线)
   ========================================================================== */
.b2-spine {
  position: relative;
  display: flex;
  flex-direction: column;
}
/* Continuous 1px vertical spine centered at x=9px (middle of 18px icon column!) */
.b2-spine::before {
  content: "";
  position: absolute;
  left: 8.5px;
  top: 10px;
  bottom: 10px;
  width: 1px;
  background: var(--sep);
  pointer-events: none;
}
.b2-node {
  position: relative;
  display: grid;
  grid-template-columns: 18px minmax(0, 1fr);
  column-gap: 8px;
  align-items: start;
  padding: 4px 0;
}
/* Mask behind each 18px glyph so the 1px vertical spine never pierces through icons! */
.b2-glyph {
  width: 18px;
  height: 20px;
  background: var(--win);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  z-index: 1;
}
.phone .b2-glyph { background: var(--ios-bg); }
.b2-fold-btn {
  width: fit-content;
  max-width: 100%;
  display: grid;
  grid-template-columns: 18px minmax(0, 1fr);
  column-gap: 8px;
  align-items: center;
  padding: 3px 0;
  text-align: left;
  color: var(--l3);
  font-size: 13px;
  line-height: 20px;
  transition: color .15s;
}
.b2-fold-btn:hover { color: var(--l1); }
.b2-fold-lbl {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-width: 0;
}
.b2-active-main {
  font-size: 14px;
  line-height: 20.5px;
  color: var(--l1);
  font-weight: 500;
  overflow-wrap: break-word;
}
.b2-inline-meta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  margin-left: 7px;
  font-family: var(--mono);
  font-size: 11.5px;
  font-weight: 450;
  color: var(--l3);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  vertical-align: baseline;
}
.b2-active-sub {
  margin-top: 2.5px;
  display: flex;
  align-items: baseline;
  gap: 6px;
  font-size: 12.5px;
  line-height: 18px;
  color: var(--l2);
}
.b2-active-sub .sub-t {
  flex: 0 1 auto;
  min-width: 0;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  overflow: hidden;
  overflow-wrap: break-word;
}
.b2-active-sub .sub-el {
  flex: none;
  font-family: var(--mono);
  font-size: 11.5px;
  color: var(--l3);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.b2-next-txt {
  font-size: 13px;
  line-height: 20px;
  color: var(--l3);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.b2-done-txt {
  font-size: 13px;
  line-height: 19.5px;
  color: var(--l3);
  overflow-wrap: anywhere;
}

/* ==========================================================================
   VARIANT B3: 原生 ToolFold 同构折叠行 (Zero-New-Primitive · 与「已使用…」完全同构)
   ========================================================================== */
.b3-wrap {
  display: flex;
  flex-direction: column;
  gap: 9px;
}
.b3-summary-btn {
  width: 100%;
  display: grid;
  grid-template-columns: 18px minmax(0, 1fr) auto;
  column-gap: 8px;
  align-items: center;
  padding: 2px 0;
  text-align: left;
  font-size: 13.5px;
  line-height: 20px;
  color: var(--l2);
  transition: color .15s;
}
.b3-summary-btn:hover { color: var(--l1); }
.b3-sum-line {
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 7px;
}
.b3-sum-step {
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--l1);
  font-weight: 480;
}
.b3-ratio-pill {
  font-family: var(--mono);
  font-size: 11px;
  line-height: 17px;
  padding: 0 6px;
  border-radius: 999px;
  background: var(--fill2);
  color: var(--l2);
  font-variant-numeric: tabular-nums;
  flex: none;
}
/* Exact Hermesh .tg-b / StepsCard (app.css line 729 & Tools.swift line 138) */
.b3-steps-card {
  width: 100%;
  max-width: 560px;
  border: 1px solid var(--sep);
  border-radius: 10px;
  overflow: hidden;
  max-height: 248px;
  overflow-y: auto;
}
.phone .b3-steps-card { max-width: 100%; }
.b3-card-row {
  padding: 7.5px 12px;
  display: grid;
  grid-template-columns: 16px minmax(0, 1fr) auto;
  column-gap: 8px;
  align-items: start;
  font-size: 13px;
  line-height: 19px;
}
.b3-card-row + .b3-card-row { border-top: .5px solid var(--sep); }
.b3-card-row.in_progress { background: var(--fill); }
.b3-card-row .r-idx {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--l3);
  font-variant-numeric: tabular-nums;
}

/* ==========================================================================
   VARIANT B4: 进度左轨引文式 (Proportional Left Accent Rail · 长文本最舒展)
   ========================================================================== */
.b4-rail-box {
  position: relative;
  padding: 2px 0 2px 14px;
  display: flex;
  flex-direction: column;
  gap: 5px;
}
/* 2px Left Track with proportional live progress fill! */
.b4-rail-track {
  position: absolute;
  left: 2px;
  top: 3px;
  bottom: 3px;
  width: 2.5px;
  border-radius: 99px;
  background: var(--fill3);
  overflow: hidden;
}
.b4-rail-fill {
  width: 100%;
  height: var(--pct, 66%);
  border-radius: 99px;
  background: linear-gradient(180deg, var(--aurora-g0), var(--accent));
  transition: height .35s var(--ease);
}
.b4-rail-fill.fail { background: var(--danger); }
.b4-eyebrow {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  line-height: 18px;
  color: var(--l3);
  font-variant-numeric: tabular-nums;
}
.b4-eyebrow b {
  font-weight: 550;
  color: var(--l2);
}
.b4-eyebrow .b4-toggle {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 12px;
  color: var(--l2);
  padding: 1px 6px;
  border-radius: 5px;
  background: var(--fill);
}
.b4-eyebrow .b4-toggle:hover { color: var(--l1); background: var(--fill2); }
.b4-cur-step {
  font-size: 14px;
  line-height: 1.52;
  color: var(--l1);
  font-weight: 500;
  overflow-wrap: anywhere; /* Gets 100% of column width — zero right-column squeeze! */
}
.b4-cur-focus {
  display: flex;
  align-items: flex-start;
  gap: 6px;
  font-size: 12.5px;
  line-height: 1.45;
  color: var(--l2);
  overflow-wrap: anywhere;
}
.b4-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding-top: 2px;
  max-height: 220px;
  overflow-y: auto;
}
.b4-row {
  display: grid;
  grid-template-columns: 16px minmax(0, 1fr) auto;
  column-gap: 8px;
  align-items: start;
  font-size: 13px;
  line-height: 19.5px;
}

/* ==========================================================================
   IPHONE VIEWPORT (Supports Standard Symmetric 20pt Margin AND Duo Side Rail!)
   ========================================================================== */
.phone {
  width: 390px;
  height: 676px;
  border-radius: 50px;
  background: var(--ios-bg);
  position: relative;
  overflow: hidden;
  overflow: clip;
  box-shadow: 0 0 0 9px #1b1b1f, 0 0 0 10.5px #383840, 0 24px 64px rgba(0,0,0,.55);
  color: var(--l1);
  font-family: var(--font-ios);
  font-size: 15.5px;
  line-height: 1.45;
  user-select: none;
}
.ios-top-fade {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 94px;
  z-index: 6;
  pointer-events: none;
  background: linear-gradient(to bottom, rgba(var(--ios-bg-rgb), .94) 30%, rgba(var(--ios-bg-rgb), 0));
}
/* Standard Portrait Top Nav vs Duo Side Rail */
.ios-top-nav {
  position: absolute;
  top: 14px; left: 16px; right: 16px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 8;
}
.ios-nav-circle {
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--glass); box-shadow: var(--glass-sh);
  backdrop-filter: blur(22px) saturate(1.5); -webkit-backdrop-filter: blur(22px) saturate(1.5);
  display: flex; align-items: center; justify-content: center;
}
.ios-session-cap {
  max-width: 236px;
  height: 42px;
  padding: 0 16px;
  border-radius: 999px;
  background: var(--glass);
  box-shadow: var(--glass-sh);
  backdrop-filter: blur(22px) saturate(1.5);
  -webkit-backdrop-filter: blur(22px) saturate(1.5);
  display: flex;
  flex-direction: column;
  justify-content: center;
  text-align: center;
}
.ios-session-cap b { font-size: 13px; font-weight: 600; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ios-session-cap small { font-size: 10.5px; line-height: 1.2; color: var(--l2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.ios-side-rail {
  position: absolute;
  top: 76px; right: 12px;
  z-index: 8;
  display: flex; flex-direction: column; align-items: center; gap: 11px;
}
.ios-rail-time { font-size: 12.5px; font-weight: 650; }
.ios-rail-wifi {
  width: 34px; height: 34px; border-radius: 50%;
  border: 2px solid var(--l2); border-bottom-color: transparent;
  display: flex; align-items: center; justify-content: center;
}

/* Symmetric 20pt horizontal padding on standard iPhone (SessionPage.swift L479: .padding(.horizontal, 20));
   64pt right inset when Duo vertical toolbar rail is active! */
.ios-chat {
  position: absolute;
  inset: 0;
  overflow-y: auto;
  padding: 72px 20px 104px 20px;
  display: flex;
  flex-direction: column;
  gap: 13px;
  scrollbar-width: none;
}
.phone.duo-rail .ios-chat {
  padding-right: 64px;
}
.ios-chat::-webkit-scrollbar { display: none; }
.ios-msg { font-size: 15.5px; line-height: 1.48; color: var(--l1); }
.ios-msg code {
  font-family: var(--mono); font-size: 13.5px; background: var(--code);
  padding: 1px 5px; border-radius: 5px;
}
.ios-tool {
  font-size: 14px; color: var(--l2);
  display: flex; align-items: center; gap: 5px;
}
.ios-tool code { font-family: var(--mono); font-size: 12.5px; }

/* Clean Standalone Bottom Composer on iPhone */
.ios-bottom {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  z-index: 9;
  pointer-events: none;
  padding: 24px 0 16px;
  background: linear-gradient(to bottom, rgba(var(--ios-bg-rgb), 0), rgba(var(--ios-bg-rgb), .90) 24px, var(--ios-bg) 44px);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.ios-bottom > * { pointer-events: auto; }
.ios-box {
  margin: 0 12px;
  padding: 6px;
  border-radius: 24px;
  background: var(--glass-pill);
  box-shadow: var(--glass-sh);
  backdrop-filter: blur(24px) saturate(1.5);
  -webkit-backdrop-filter: blur(24px) saturate(1.5);
  display: flex;
  align-items: center;
  gap: 8px;
}
.ios-plus, .ios-stop, .ios-send {
  width: 36px; height: 36px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center; flex: none;
}
.ios-plus, .ios-stop { background: var(--fill2); color: var(--l1); }
.ios-send { background: color-mix(in srgb, var(--accent) 42%, transparent); color: rgba(255,255,255,.88); }
.ios-ph { flex: 1; min-width: 0; font-size: 15px; color: var(--l3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ios-home {
  position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
  width: 130px; height: 4.5px; border-radius: 99px; background: var(--l2); opacity: .5; z-index: 15;
}
.ios-toend-wrap { display: flex; justify-content: center; }
.ios-toend-cap {
  height: 36px; max-width: calc(100% - 32px); padding: 0 8px 0 11px;
  border-radius: 999px; background: var(--glass-pill); box-shadow: var(--glass-sh);
  backdrop-filter: blur(22px) saturate(1.5); -webkit-backdrop-filter: blur(22px) saturate(1.5);
  display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 500;
}
.ios-toend-cap .tc-txt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 196px; }
.ios-toend-cap .tc-arr {
  width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: #fff;
  display: inline-flex; align-items: center; justify-content: center; flex: none;
}

/* Settled turn-completed summary line */
.settled-plan-line {
  display: grid;
  grid-template-columns: 18px minmax(0, 1fr) auto;
  column-gap: 8px;
  align-items: center;
  padding: 3px 0;
  font-size: 13px;
  color: var(--l3);
  width: 100%;
  text-align: left;
}
.settled-plan-line:hover { color: var(--l1); }

/* ---------- Sticky Control Bar ---------- */
.ctl-bar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 99;
  background: var(--page-bar);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--page-bd);
  padding: 8px 14px;
  display: flex;
  flex-wrap: wrap;
  gap: 7px 16px;
  align-items: center;
  justify-content: center;
  font-size: 12px;
}
.ctl-g { display: flex; align-items: center; gap: 4px; }
.ctl-g > b { color: var(--page-fg2); font-weight: 500; margin-right: 3px; }
.ctl-bar button {
  height: 26px;
  padding: 0 9px;
  border-radius: 7px;
  background: var(--page-btn);
  color: var(--page-fg2);
  font-weight: 500;
  transition: background .15s, color .15s;
}
.ctl-bar button:hover { color: var(--page-fg); }
.ctl-bar button.on { background: var(--accent); color: #fff; }
.chev-rot { transition: transform .18s var(--ease); }
.chev-rot.open { transform: rotate(90deg); }
.chev-flip { transition: transform .18s var(--ease); }
.chev-flip.open { transform: rotate(180deg); }
</style>
</head>
<body>

<header class="page-head">
  <h1>随流内嵌（Inline Flow）· 宽度、边距、对齐、长内容与状态时间四版精修</h1>
  <p class="lead">
    严格对齐 Hermesh 会话流网格：桌面端锚定 <code>728px</code> 对话列宽（嵌于 <code>768px</code> 输入框内侧各 <code>20px</code>），手机端对齐 <code>20pt</code> 正文边距；所有图标统一收敛进 <strong><code>18px</code> 定宽前导槽</strong>，右侧步骤比与计时采用 <code>tabular-nums</code> 等宽数字独立右列，<strong>彻底消除长文本折行挤压与宏观步骤 / 微观动作重复</strong>。可在底栏切换「超长折行与代码路径」「并行子任务」「10 步限高滚动」及打开「对齐参考线」检验每一像素。
  </p>
  <nav class="scheme-tabs" id="top-tabs" aria-label="随流内嵌精修方案切换"></nav>
</header>

<main class="stage-wrap" id="stage"></main>

<div class="ctl-bar">
  <div class="ctl-g">
    <b>折叠状态</b>
    <button data-act="expand" data-val="0">默认精简态</button>
    <button data-act="expand" data-val="1">展开全部步骤</button>
  </div>
  <div class="ctl-g">
    <b>极端内容测试</b>
    <button data-act="scene" data-val="normal">常规短句</button>
    <button data-act="scene" data-val="longtext">超长多行 + 代码路径</button>
    <button data-act="scene" data-val="many">10 步长列表 + 并行</button>
    <button data-act="scene" data-val="failed">含失败与跳过</button>
    <button data-act="scene" data-val="done">全部完成收尾</button>
  </div>
  <div class="ctl-g">
    <b>手机版式</b>
    <button data-act="ioslayout" data-val="std">常规对称 20pt</button>
    <button data-act="ioslayout" data-val="duo">竖排工具栏 (Duo)</button>
    <button data-act="scroll" data-val="away">上滑历史</button>
  </div>
  <div class="ctl-g">
    <b>参考线与外观</b>
    <button data-act="guides" id="btn-guides">对齐参考线</button>
    <button data-act="theme" data-val="black">纯黑</button>
    <button data-act="theme" data-val="dark">深灰</button>
    <button data-act="theme" data-val="light">浅色</button>
  </div>

let markSeqId = 0;
function emergenceMark(size = 16) {
  const uid = "hm-" + (++markSeqId);
  const beams = [0, 1, 2].map((i) => {
    const a = (i * Math.PI) / 3;
    const dx = Math.cos(a), dy = Math.sin(a);
    const nx = -dy, ny = dx;
    const mx = nx * 10, my = ny * 10;
    return {
      x1: (mx - dx * 37).toFixed(2),
      y1: (my - dy * 37).toFixed(2),
      x2: (mx + dx * 37).toFixed(2),
      y2: (my + dy * 37).toFixed(2),
      cls: "hm-beam hm-b" + i,
      gid: uid + "-" + i
    };
  });
  const stops = [0,1,2,3,4,5,6,7,8].map(k =>
    `<stop offset="${(k/8).toFixed(3)}" style="stop-color:var(--aurora-g${k})"/>`
  ).join("");
  return `<svg class="hm-mark hm-seq" width="${size}" height="${size}" viewBox="-49 -48 92 94" aria-hidden="true">
    <defs>${beams.map(b => `<linearGradient id="${b.gid}" gradientUnits="userSpaceOnUse" x1="${b.x1}" y1="${b.y1}" x2="${b.x2}" y2="${b.y2}">${stops}</linearGradient>`).join("")}</defs>
    <g>${beams.map(b => `<path d="M${b.x1} ${b.y1}L${b.x2} ${b.y2}" pathLength="100" class="${b.cls}" stroke="url(#${b.gid})" stroke-width="13" stroke-linecap="round" fill="none"/>`).join("")}</g>
  </svg>`;
}

function progressRing(done, total, hasFail, size = 15) {
  const r = 5.6;
  const c = 2 * Math.PI * r;
  const pct = total > 0 ? done / total : 0;
  const dash = (pct * c).toFixed(2);
  const stroke = hasFail ? "var(--danger)" : done === total ? "var(--ok)" : "var(--accent-t)";
  return `<svg width="${size}" height="${size}" viewBox="0 0 16 16" aria-hidden="true">
    <circle cx="8" cy="8" r="${r}" fill="none" stroke="var(--fill3)" stroke-width="1.8"/>
    <circle cx="8" cy="8" r="${r}" fill="none" stroke="${stroke}" stroke-width="1.8"
      stroke-dasharray="${dash} ${c.toFixed(2)}" stroke-linecap="round" transform="rotate(-90 8 8)"/>
  </svg>`;
}

function formatRichStepText(txt) {
  // Highlight file paths / CLI commands gently in monospace AND break cleanly at '/' slashes (<wbr>) instead of mid-word!
  return txt.replace(/([a-zA-Z0-9_.-]+\/[a-zA-Z0-9_./-]+|\b(?:sessions\.db|schema_history|Transcript\.swift|SessionPage\.tsx|SessionView\.swift|Hermesh\.app|Playwright|XCUITest|HermeshCore|WAL\/SHM)\b)/g, (m) => {
    const cleanBreaks = m.replace(/\//g, "/<wbr>");
    return `<code class="inline-code">${cleanBreaks}</code>`;
  });
}

function glyphFor(status, size = 15) {
  if (status === "completed") return `<span style="color:var(--l3);display:inline-flex">${IC.check}</span>`;
  if (status === "skipped") return `<span style="color:var(--l3);display:inline-flex">${IC.skip}</span>`;
  if (status === "failed") return IC.fail;
  if (status === "in_progress") return emergenceMark(size);
  return `<span style="color:var(--l4);display:inline-flex">${IC.ring}</span>`;
}

function analyzeSteps(steps) {
  const total = steps.length;
  const completed = steps.filter(s => s.status === "completed");
  const skipped = steps.filter(s => s.status === "skipped");
  const settledCount = completed.length + skipped.length;
  const activeList = steps.filter(s => s.status === "in_progress" || s.status === "failed");
  const pendingList = steps.filter(s => s.status === "pending");
  const hasFail = steps.some(s => s.status === "failed");
  const allDone = settledCount === total;
  const currentStepNum = Math.min(total, settledCount + 1);
  return { total, completed, skipped, settledCount, activeList, pendingList, hasFail, allDone, currentStepNum };
}

  if (variant === "b2") {

        ${info.activeList.map((act, i) => {

        ${state.expanded ? info.pendingList.map((p) => `

        ${!info.allDone && focusText ? `
          <div class="work-line">
            <span class="slot-18">${info.hasFail ? IC.fail : emergenceMark(17)}</span>

  }

  // ==================== B4: Proportional Left Accent Rail ====================

}

    <div class="ios-side-rail">
      <span class="ios-rail-time">10:14</span>
      <div class="ios-rail-wifi">${IC.wifi}</div>
      <div class="ios-nav-circle">${IC.menu}</div>
      <div class="ios-nav-circle">${IC.more}</div>
    </div>
  ` : `
    <div class="ios-top-nav">
      <div class="ios-nav-circle">${IC.menu}</div>
      <div class="ios-session-cap">
        <b>查明 session V2 DB 命名…</b>
        <small>yee-homebook/hermesh</small>
      </div>
      <div class="ios-nav-circle">${IC.more}</div>
    </div>
  `;

  const bodyContent = state.scrolledAway ? `
    <div class="ios-msg" style="opacity:.86">已核查 <code>internal/sqlitedb/steps.go</code> 中的版本号校验逻辑，准备备份本地 SQLite 库并执行全端升级。</div>
    <div class="ios-tool"><span>已使用 <code>Run backup_sqlite</code></span> ${IC.chevR(false)}</div>
    <div class="ios-msg">本地 <code>sessions.db</code> 与 <code>owner.db</code> 快照已安全保存至备份目录，SHA-256 校验和一致。</div>
    <div class="ios-tool"><span>已使用 <code>xcrun devicectl install</code></span> ${IC.chevR(false)}</div>
    <div class="ios-msg">iPhone 端新包已签名安装到「Yi's iPhone」（屏幕当前处于锁屏状态，解锁打开即可）。接下来等待 macOS 桌面端编译打包完成。</div>
  ` : `
    <div class="ios-msg">iPhone 端新包已签名安装到「Yi's iPhone」。接下来等待 macOS 桌面端 <code>Hermesh.app</code> 编译打包完成。</div>
    <div class="ios-tool"><span>已使用 <code>Run manage_task</code></span> ${IC.chevR(false)}</div>
    <div class="ios-msg">macOS 端全部组件（Go 守护进程、Rust <code>her</code>、<code>Hermesh Signer</code>）已编译完成，正在执行应用打包与签名。</div>
    ${renderInlineBlock(variant, "ios")}
  `;

  return `
    <div class="phone ${isDuo ? "duo-rail" : ""}">
      <div class="ios-top-fade"></div>
      ${topChrome}
      <div class="ios-chat guide-col">
        ${bodyContent}
      </div>
      <div class="ios-bottom">
        ${state.scrolledAway && !info.allDone ? `
          <div class="ios-toend-wrap">
            <button class="ios-toend-cap" data-act="scroll-bottom">
              ${info.hasFail ? IC.fail : emergenceMark(14)}
              <span style="font-family:var(--mono);font-size:11.5px;color:var(--l2);font-variant-numeric:tabular-nums">${info.currentStepNum}/${info.total}</span>
              <span class="tc-txt">${primaryActive ? primaryActive.text : ""}</span>
              <span class="tc-arr">${IC.down}</span>
            </button>
          </div>
        ` : ""}
        <div class="ios-box">
          <button class="ios-plus">${IC.plus}</button>
          <span class="ios-ph">继续说，会排到下一轮…</span>
          <button class="ios-stop">${IC.stop}</button>
          <button class="ios-send">${IC.up}</button>
        </div>
      </div>
      <div class="ios-home"></div>
    </div>
  `;
}

function render() {
  document.documentElement.setAttribute("data-theme", state.theme);
  document.body.classList.toggle("show-guides", state.guides);

  document.getElementById("top-tabs").innerHTML = VARIANTS.map(v => `
    <button class="scheme-tab ${state.variant === v.id ? "on" : ""}" data-variant="${v.id}">
      <span>${v.short}</span>
      ${v.rec ? `<span class="rec">${v.rec}</span>` : ""}
    </button>
  `).join("");

  const cur = VARIANTS.find(v => v.id === state.variant) || VARIANTS[0];
  document.getElementById("stage").innerHTML = `
    <section class="scheme-banner">
      <div class="sb-col">
        <h2>${cur.title} <span class="tag-pill ${cur.badge.cls}">${cur.badge.text}</span></h2>
        <p>${cur.gridSpec}</p>
      </div>
      <div class="sb-col">
        <h3>长内容折行与多步处理</h3>
        <p>${cur.longSpec}</p>
      </div>
      <div class="sb-col">
        <h3>状态与时间的层次关系</h3>
        <p>${cur.statusSpec}</p>
      </div>
    </section>
    <div class="devices-row">
      <div class="dev-block mac-block">
        <div class="dev-caption">
          <b>macOS 桌面端（728px 会话列嵌于 768px 输入框内各 20px）</b>
          <span>点击文末进度区可直接展开 / 收起</span>
        </div>
        ${renderMac(cur.id)}
      </div>
      <div class="dev-block ios-block">
        <div class="dev-caption">
          <b>iPhone 端（${state.iosLayout === "duo" ? "Duo 竖排工具栏右侧避让 64pt" : "常规对称 20pt 正文边距"}）</b>
          <span>${state.scrolledAway ? "已上滑看历史 · 底部浮现进度胶囊" : "纯黑画布零玻璃遮挡"}</span>
        </div>
        ${renderIPhone(cur.id)}
      </div>
    </div>
  `;

  document.querySelectorAll("[data-act='expand']").forEach(b => {
    b.classList.toggle("on", Boolean(Number(b.dataset.val)) === state.expanded);
  });
  document.querySelectorAll("[data-act='scene']").forEach(b => {
    b.classList.toggle("on", b.dataset.val === state.scene);
  });
  document.querySelectorAll("[data-act='ioslayout']").forEach(b => {
    b.classList.toggle("on", b.dataset.val === state.iosLayout);
  });
  document.querySelectorAll("[data-act='scroll']").forEach(b => {
    b.classList.toggle("on", state.scrolledAway);
  });
  document.querySelectorAll("[data-act='theme']").forEach(b => {
    b.classList.toggle("on", b.dataset.val === state.theme);
  });
  document.getElementById("btn-guides")?.classList.toggle("on", state.guides);

  // Keep active step visible inside scrollable inline cards (B1 / B3 / B4) just like StepsCard in Tools.swift!
  requestAnimationFrame(() => {
    document.querySelectorAll(".b1-list, .b3-steps-card, .b4-list").forEach(sc => {
      const act = sc.querySelector(".in_progress, .failed");
      if (act && sc.scrollHeight > sc.clientHeight) {
        sc.scrollTop = Math.max(0, act.offsetTop - sc.clientHeight / 2 + act.offsetHeight / 2);
      }
    });
  });
}

document.addEventListener("click", (e) => {
  const vBtn = e.target.closest("[data-variant]");
  if (vBtn) {
    state.variant = vBtn.dataset.variant;
    render();
    return;
  }
  const tBtn = e.target.closest("[data-toggle='expand']");
  if (tBtn) {
    state.expanded = !state.expanded;
    render();
    return;
  }
  const actBtn = e.target.closest("[data-act]");
  if (!actBtn) return;
  const act = actBtn.dataset.act;
  if (act === "expand") state.expanded = Boolean(Number(actBtn.dataset.val));
  else if (act === "scene") state.scene = actBtn.dataset.val;
  else if (act === "ioslayout") state.iosLayout = actBtn.dataset.val;
  else if (act === "scroll") state.scrolledAway = !state.scrolledAway;
  else if (act === "scroll-bottom") state.scrolledAway = false;
  else if (act === "guides") state.guides = !state.guides;
  else if (act === "theme") state.theme = actBtn.dataset.val;
  render();
});

render();
</script>
</body>
</html>

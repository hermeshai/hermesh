<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Her 连接器原型</title>
<style>
/* ---------- tokens ---------- */
:root{
  --font-ios:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",system-ui,sans-serif;
  --font-mac:"Google Sans Flex","Google Sans",system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Monaco,monospace;
}
[data-theme=light]{
  --page:#e8eaf0;--page-fg:#1b1c22;--page-fg2:#62646f;--page-card:#fff;--page-bd:rgba(0,0,0,.08);
  /* iOS */
  --i-bg:#f2f2f7;--i-card:#fff;--i-l1:#000;--i-l2:rgba(60,60,67,.6);--i-l3:rgba(60,60,67,.3);--i-sep:rgba(60,60,67,.18);
  --i-fill:rgba(118,118,128,.12);--i-tint:#007aff;--i-green:#34c759;--i-orange:#ff9500;--i-red:#ff3b30;
  --i-glass:rgba(255,255,255,.72);--i-glass-bd:rgba(0,0,0,.06);--i-bub:#e9e9eb;--i-me:#007aff;--i-sheet:#f2f2f7;--i-pop:rgba(250,250,252,.92);
  /* Mac (apps/desktop app.css) */
  --win:#fff;--win2:#f4f4f7;--win3:#ebebf0;--side:#f4f4f7;
  --l1:rgba(0,0,0,.86);--l2:rgba(0,0,0,.54);--l3:rgba(0,0,0,.32);--l4:rgba(0,0,0,.14);
  --sep:rgba(0,0,0,.075);--fill:rgba(0,0,0,.045);--fill2:rgba(0,0,0,.075);--fill3:rgba(0,0,0,.12);
  --accent:#3d5bff;--accent-bg:rgba(61,91,255,.10);--ok:#17924f;--warn:#e67e0a;--danger:#d7333f;
  --btn:#fff;--btn-sh:0 0 0 .5px rgba(0,0,0,.14),0 1px 1.5px rgba(0,0,0,.08);
  --field:#fff;--field-bd:rgba(0,0,0,.16);--menu:rgba(248,248,250,.94);--menu-bd:rgba(0,0,0,.10);
  --glass:rgba(255,255,255,.72);--glass-sh:0 0 0 .5px rgba(0,0,0,.10),0 2px 8px rgba(0,0,0,.08);
  --shadow-win:0 0 0 .5px rgba(0,0,0,.20),0 24px 70px rgba(10,20,50,.30),0 8px 22px rgba(10,20,50,.14);
  --scrim:rgba(0,0,0,.22);--bub:rgba(0,0,0,.86);--bub-fg:#fff;--seg-on:#fff;
}
[data-theme=dark]{
  --page:#0d0e12;--page-fg:#ececf1;--page-fg2:#9a9ca8;--page-card:#1a1b20;--page-bd:rgba(255,255,255,.08);
  --i-bg:#000;--i-card:#1c1c1e;--i-l1:#fff;--i-l2:rgba(235,235,245,.6);--i-l3:rgba(235,235,245,.3);--i-sep:rgba(84,84,88,.55);
  --i-fill:rgba(118,118,128,.24);--i-tint:#0a84ff;--i-green:#30d158;--i-orange:#ff9f0a;--i-red:#ff453a;
  --i-glass:rgba(40,40,44,.7);--i-glass-bd:rgba(255,255,255,.08);--i-bub:#26252a;--i-me:#0a84ff;--i-sheet:#1c1c1e;--i-pop:rgba(44,44,48,.94);
  --win:#1e1e21;--win2:#29292d;--win3:#323237;--side:#25252a;
  --l1:rgba(255,255,255,.88);--l2:rgba(255,255,255,.55);--l3:rgba(255,255,255,.32);--l4:rgba(255,255,255,.14);
  --sep:rgba(255,255,255,.09);--fill:rgba(255,255,255,.05);--fill2:rgba(255,255,255,.085);--fill3:rgba(255,255,255,.14);
  --accent:#6f87ff;--accent-bg:rgba(91,121,255,.16);--ok:#3fcf86;--warn:#ffab3d;--danger:#ff6670;
  --btn:rgba(255,255,255,.12);--btn-sh:0 0 0 .5px rgba(255,255,255,.08);
  --field:rgba(255,255,255,.06);--field-bd:rgba(255,255,255,.16);--menu:rgba(44,44,48,.96);--menu-bd:rgba(255,255,255,.12);
  --glass:rgba(60,60,66,.62);--glass-sh:0 0 0 .5px rgba(255,255,255,.10),0 2px 10px rgba(0,0,0,.3);
  --shadow-win:0 0 0 .5px rgba(255,255,255,.14),0 24px 70px rgba(0,0,0,.6),0 8px 22px rgba(0,0,0,.35);
  --scrim:rgba(0,0,0,.4);--bub:rgba(255,255,255,.09);--bub-fg:rgba(255,255,255,.88);--seg-on:rgba(255,255,255,.22);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--page-fg);font:14px/1.5 var(--font-mac);min-height:100vh;padding-bottom:120px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.top{max-width:1560px;margin:0 auto;padding:22px 24px 6px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.top h1{font-size:19px;margin:0;font-weight:650}
.top span{color:var(--page-fg2);font-size:13px}
.wrap{max-width:1560px;margin:0 auto;padding:10px 24px;display:flex;gap:28px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
.notes{width:330px;flex:none;background:var(--page-card);border:1px solid var(--page-bd);border-radius:14px;padding:16px 18px;font-size:13px;line-height:1.65}
.notes h3{margin:0 0 6px;font-size:14px}
.notes ul{margin:6px 0 0;padding-left:18px}
.notes li{margin:4px 0}
.notes .tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--accent-bg);color:var(--accent);margin-right:4px}
.notes .q{margin-top:12px;padding-top:10px;border-top:1px solid var(--page-bd);color:var(--page-fg2)}
/* control bar */
.ctl{position:fixed;left:0;right:0;bottom:0;background:var(--page-card);border-top:1px solid var(--page-bd);padding:9px 16px;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;font-size:12px;z-index:50}
.ctl .g{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.ctl .g b{color:var(--page-fg2);font-weight:500;margin-right:4px}
.ctl button{padding:3px 9px;border-radius:7px;background:var(--fill);color:var(--page-fg)}
.ctl button.on{background:var(--accent);color:#fff}

/* ================= iPhone ================= */
.phone{width:393px;height:852px;border-radius:56px;padding:12px;background:#111;box-shadow:0 30px 80px rgba(10,20,50,.35),inset 0 0 0 2px #333;flex:none}
.scr{position:relative;width:100%;height:100%;border-radius:45px;overflow:hidden;background:var(--i-bg);color:var(--i-l1);font:17px/1.3 var(--font-ios);letter-spacing:-.2px}
.sb{position:absolute;top:0;left:0;right:0;height:50px;display:flex;justify-content:space-between;align-items:center;padding:6px 34px 0 40px;font-size:16px;font-weight:600;z-index:30;pointer-events:none}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;border-radius:20px;background:#000;z-index:31}
.ibody{position:absolute;inset:0;padding-top:50px;display:flex;flex-direction:column}
.iscroll{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.iscroll::-webkit-scrollbar{display:none}
.home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--i-l1);opacity:.85;z-index:40}
/* nav */
.nav{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 8px;flex:none;position:relative}
.nav .t{position:absolute;left:50%;transform:translateX(-50%);font-weight:600;font-size:17px;white-space:nowrap}
.nav .back{color:var(--i-tint);display:flex;align-items:center;gap:2px;padding:0 8px;height:44px}
.nav .back svg{width:13px;height:21px}
.nav .act{color:var(--i-tint);padding:0 10px;height:44px;display:flex;align-items:center;font-size:17px}
.nav .act.b{font-weight:600}
.nav .act[disabled]{opacity:.35}
.glassbtn{width:44px;height:44px;border-radius:22px;background:var(--i-glass);backdrop-filter:blur(20px);box-shadow:0 0 0 .5px var(--i-glass-bd),0 2px 8px rgba(0,0,0,.06);display:flex;align-items:center;justify-content:center;color:var(--i-l1);position:relative}
.glassbtn svg{width:20px;height:20px}
.glassbtn .dot{position:absolute;top:9px;right:9px;width:8px;height:8px;border-radius:4px;background:var(--i-orange)}
.lt{font-size:34px;font-weight:700;letter-spacing:.3px;padding:2px 20px 10px}
/* grouped list */
.sec{margin:0 16px 22px}
.sec .hd{font-size:13px;color:var(--i-l2);text-transform:none;padding:0 16px 6px}
.sec .ft{font-size:13px;color:var(--i-l2);padding:6px 16px 0;line-height:1.38}
.card{background:var(--i-card);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 16px;position:relative;width:100%;text-align:left}
.row+.row::before{content:"";position:absolute;top:0;right:0;left:16px;border-top:.5px solid var(--i-sep)}
.row.ic+.row::before,.row.ic+.row.ic::before{left:60px}
.row .k{flex:1;min-width:0}
.row .v{color:var(--i-l2);white-space:nowrap}
.row .chev{color:var(--i-l3);font-weight:600;font-size:15px}
.row.tall{min-height:60px;padding-top:8px;padding-bottom:8px}
.row .sub{font-size:13px;color:var(--i-l2);margin-top:1px;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.tap:active{background:var(--i-fill)}
.row .bl{color:var(--i-tint)}
.row .rd{color:var(--i-red)}
.seg{display:flex;background:var(--i-fill);border-radius:9px;padding:2px;margin:0 16px 16px}
.seg button{flex:1;height:28px;border-radius:7px;font-size:13px;font-weight:500}
.seg button.on{background:var(--i-card);box-shadow:0 2px 6px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
[data-theme=dark] .seg button.on{background:#636366}
.sw{width:51px;height:31px;border-radius:16px;background:var(--i-fill);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:14px;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 0 0 .5px rgba(0,0,0,.04);transition:transform .2s}
.sw.on{background:var(--i-green)}
.sw.on::after{transform:translateX(20px)}
.sw.dis{opacity:.45}
.logo{flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;letter-spacing:-.3px}
.dotc{width:7px;height:7px;border-radius:4px;flex:none}
.pillbtn{font-size:13px;font-weight:600;padding:4px 12px;border-radius:99px;background:var(--i-fill);color:var(--i-tint);white-space:nowrap}
.pillbtn.fill{background:var(--i-tint);color:#fff}
.banner{margin:0 16px 16px;padding:11px 14px;border-radius:12px;font-size:14px;line-height:1.4;display:flex;gap:10px;align-items:center}
.banner.warn{background:rgba(255,149,0,.13)}
.banner.err{background:rgba(255,59,48,.11)}
.banner.info{background:var(--i-fill)}
.banner .k{flex:1}
/* her page */
.herhead{position:absolute;top:50px;left:0;right:0;z-index:5;padding:0 16px;height:126px}
.herhead .lr{display:flex;justify-content:space-between}
.herhead .r{display:flex;gap:10px}
.av{border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd6e7,#ff7eb6 40%,#7b61ff 100%);box-shadow:0 4px 18px rgba(123,97,255,.35)}
.herhead .mid{position:absolute;left:50%;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
.htag{margin-top:-16px;height:36px;padding:0 14px;border-radius:18px;background:var(--i-glass);backdrop-filter:blur(20px);box-shadow:0 0 0 .5px var(--i-glass-bd),0 2px 8px rgba(0,0,0,.08);display:flex;align-items:center;gap:6px;font-weight:600;font-size:16px}
.htag small{font-weight:500;color:var(--i-l2);font-size:13px}
.conv{padding:136px 16px 120px;display:flex;flex-direction:column;gap:10px;font-size:16px;line-height:1.4}
.me{align-self:flex-end;max-width:78%;background:var(--i-me);color:#fff;padding:8px 13px;border-radius:19px}
.her{max-width:92%}
.time{align-self:center;font-size:12px;color:var(--i-l2);margin:4px 0}
.scard{background:var(--i-card);border-radius:16px;padding:14px;box-shadow:0 0 0 .5px var(--i-sep);display:flex;flex-direction:column;gap:10px}
.scard .h{display:flex;gap:10px;align-items:center}
.scard .h b{font-size:16px}
.scard .h small{display:block;color:var(--i-l2);font-size:13px;font-weight:400}
.scard .f{font-size:13px;color:var(--i-l2);background:var(--i-fill);border-radius:10px;padding:8px 10px;line-height:1.5}
.scard .f code{font-family:var(--mono);font-size:12px;color:var(--i-l1)}
.scard .bs{display:flex;gap:8px}
.scard .bs button{flex:1;height:40px;border-radius:12px;font-weight:600;font-size:15px;background:var(--i-fill)}
.scard .bs button.p{background:var(--i-tint);color:#fff}
.scard.done{flex-direction:row;align-items:center;padding:11px 14px}
.composer{position:absolute;left:12px;right:12px;bottom:28px;display:flex;gap:8px;align-items:flex-end;z-index:8}
.composer .in{flex:1;min-height:44px;border-radius:22px;background:var(--i-glass);backdrop-filter:blur(20px);box-shadow:0 0 0 .5px var(--i-glass-bd),0 2px 10px rgba(0,0,0,.08);display:flex;align-items:center;padding:0 16px;color:var(--i-l3);font-size:16px}
.pop{position:absolute;left:12px;bottom:80px;width:250px;border-radius:22px;background:var(--i-pop);backdrop-filter:blur(30px);box-shadow:0 10px 40px rgba(0,0,0,.2),0 0 0 .5px var(--i-glass-bd);z-index:20;overflow:hidden;padding:6px 0}
.pop .pi{display:flex;align-items:center;gap:12px;padding:11px 18px;width:100%;text-align:left;font-size:16px}
.pop .pi svg{width:20px;height:20px;flex:none;color:var(--i-l1)}
.pop .pi .k{flex:1}
.pop .pi small{color:var(--i-l2);font-size:14px}
.pop hr{border:0;border-top:.5px solid var(--i-sep);margin:4px 0}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.18);z-index:18}
.isheet{position:absolute;left:0;right:0;bottom:0;background:var(--i-sheet);border-radius:20px 20px 0 0;z-index:25;display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.18)}
.isheet.full{top:56px}
.isheet.half{height:560px}
.grab{width:36px;height:5px;border-radius:3px;background:var(--i-l3);margin:6px auto 0;flex:none}
.field{display:flex;flex-direction:column;gap:3px;padding:10px 16px}
.field label{font-size:13px;color:var(--i-l2)}
.field .inp{font-size:17px;min-height:24px;outline:none}
.field .inp.mono{font-family:var(--mono);font-size:15px;word-break:break-all}
.field .ph{color:var(--i-l3)}
.recog{font-size:13px;color:var(--i-tint);padding:6px 16px 0;display:flex;gap:6px;align-items:center}
.steps .row{min-height:48px}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--i-l3);border-top-color:var(--i-tint);animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.ok{color:var(--i-green);font-weight:700}
.chip{font-size:12px;padding:1px 7px;border-radius:6px;background:var(--i-fill);color:var(--i-l2);margin-left:6px;vertical-align:1px}
.chip.det{background:rgba(0,122,255,.12);color:var(--i-tint)}
.bigbtn{display:block;margin:0 16px 12px;height:50px;border-radius:14px;background:var(--i-tint);color:#fff;font-weight:600;font-size:17px;width:calc(100% - 32px)}
.bigbtn.sec2{background:var(--i-fill);color:var(--i-tint)}
.center{display:flex;flex-direction:column;align-items:center;text-align:center;padding:40px 30px 20px;gap:10px}
.center h2{margin:6px 0 0;font-size:22px}
.center p{margin:0;color:var(--i-l2);font-size:15px;line-height:1.45}
.tool{padding:9px 16px;position:relative}
.tool+.tool::before{content:"";position:absolute;top:0;right:0;left:16px;border-top:.5px solid var(--i-sep)}
.tool b{font-family:var(--mono);font-size:13px;font-weight:500}
.tool div{font-size:13px;color:var(--i-l2);margin-top:1px}
.facts{display:flex;gap:0;margin:0 16px 18px;background:var(--i-card);border-radius:12px}
.facts>div{flex:1;padding:10px 12px;min-width:0}
.facts>div+div{border-left:.5px solid var(--i-sep)}
.facts small{display:block;font-size:12px;color:var(--i-l2)}
.facts span{font-size:14px;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dhead{display:flex;flex-direction:column;align-items:center;gap:8px;padding:4px 16px 18px}
.dhead h2{margin:0;font-size:24px}
.ctxmenu{position:absolute;top:96px;right:12px;width:230px;border-radius:14px;background:var(--i-pop);backdrop-filter:blur(30px);box-shadow:0 10px 40px rgba(0,0,0,.25);z-index:20;overflow:hidden}
.ctxmenu button{display:flex;justify-content:space-between;width:100%;padding:11px 16px;font-size:16px;text-align:left}
.ctxmenu button+button{border-top:.5px solid var(--i-sep)}
.ctxmenu hr{border:0;height:8px;background:var(--i-sep);opacity:.4;margin:0}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:96px;background:rgba(30,30,32,.92);color:#fff;font-size:14px;padding:10px 16px;border-radius:14px;z-index:60;max-width:330px;text-align:center;line-height:1.35;animation:tin .25s ease}
@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}}
.disc{display:flex;gap:12px;align-items:center;padding:12px 16px;position:relative}
.disc+.disc::before{content:"";position:absolute;top:0;right:0;left:68px;border-top:.5px solid var(--i-sep)}
.disc .k{flex:1;min-width:0}
.disc .k div{font-size:13px;color:var(--i-l2);line-height:1.35;margin-top:1px}
.addc{width:30px;height:30px;border-radius:15px;background:var(--i-fill);color:var(--i-tint);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:400;flex:none}
.addc.done{color:var(--i-green);font-size:16px;font-weight:700}
.offline .card,.offline .facts{opacity:.55}

/* ================= Mac ================= */
.mac{width:1120px;height:760px;border-radius:12px;overflow:hidden;box-shadow:var(--shadow-win);display:flex;background:var(--win);color:var(--l1);font:13px/1.45 var(--font-mac);flex:none;position:relative}
.mside{width:220px;background:var(--side);border-right:.5px solid var(--sep);padding:44px 10px 10px;flex:none;position:relative}
.lights{position:absolute;top:16px;left:16px;display:flex;gap:8px}
.lights i{width:12px;height:12px;border-radius:6px;background:#ff5f57}
.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.mside .it{display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;border-radius:7px;color:var(--l1);width:100%;text-align:left}
.mside .it.on{background:var(--fill2)}
.mside .it svg{width:16px;height:16px;color:var(--l2)}
.mside .gh{font-size:11.5px;color:var(--l3);padding:14px 10px 4px}
.mside .ses{height:28px;padding:0 10px;display:flex;align-items:center;gap:8px;color:var(--l2);white-space:nowrap;overflow:hidden}
.mside .ses i{width:6px;height:6px;border-radius:3px;background:var(--ok);flex:none}
.mmain{flex:1;position:relative;display:flex;flex-direction:column;min-width:0}
.mtop{height:96px;display:flex;align-items:flex-start;justify-content:flex-end;padding:12px 14px;gap:6px;position:relative;flex:none}
.mtop .mid{position:absolute;left:50%;top:10px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
.mtag{margin-top:-12px;height:28px;padding:0 12px;border-radius:14px;background:var(--glass);box-shadow:var(--glass-sh);display:flex;align-items:center;gap:6px;font-weight:550;backdrop-filter:blur(16px)}
.mtag small{color:var(--l2);font-weight:400}
.ib{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--l2);position:relative}
.ib:hover,.ib.on{background:var(--fill2);color:var(--l1)}
.ib svg{width:17px;height:17px}
.mconv{flex:1;overflow:auto;padding:10px 0 130px}
.mconv .col{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:12px;font-size:14.5px;line-height:1.55}
.mconv .me{background:var(--bub);color:var(--bub-fg);border-radius:16px;padding:8px 14px;font-size:14.5px}
.mconv .time{color:var(--l3)}
.mcard{border-radius:12px;box-shadow:0 0 0 .5px var(--field-bd);padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--win);max-width:520px}

    case "settings":
      body=`<div style="display:flex;gap:10px;align-items:center;margin-bottom:14px">${logo(sentry,28,7)}<b>sentry</b><span style="color:var(--l3);font-family:var(--mono);font-size:12px;flex:1">https://mcp.sentry.dev/mcp</span><button class="mbtn sm" data-set="add:address">修改</button></div>
        <div class="fhd">鉴权</div><div class="fgroup"><div class="frow"><span>方式</span><span class="popup">用账号登录 <span class="mchip rec">检测到</span> ⌃</span></div></div>
        <div class="fnote"><span style="color:var(--accent)">服务器要求登录，支持自动登记应用。</span> 添加后在这台 Mac 的浏览器里用你的 Sentry 账号登录；令牌只存在 Mac mini 上，不经过 Hermesh 服务器。</div>
        <div class="fgroup"><div class="frow"><span>高级选项</span><span class="v">自动 · 可流式 HTTP ›</span></div></div><div class="fnote">只添加你信任的连接器：Her 会按它说的去做。</div>`;
      foot=`<button class="mbtn" data-set="add:address">返回</button><button class="mbtn p" data-set="add:waiting">添加并登录</button>`; break;
    case "waiting":
      body=`<div style="text-align:center;padding:30px 0">${logo(sentry,48,11).replace('class="logo"','class="logo" style="margin:0 auto"')}<div style="font-size:16px;font-weight:600;margin-top:12px">在浏览器里登录 Sentry</div><div style="color:var(--l2);margin-top:4px">登录完会自动回到这里。</div><div class="mspin" style="margin:16px auto 0"></div></div>`;
      foot=`<button class="mbtn">复制链接</button><button class="mbtn" data-set="add:done" style="color:var(--l3)">（原型：模拟登录成功）</button>${cancel}`; break;
    case "done":
      body=`<div style="text-align:center;padding:20px 0"><div style="width:48px;height:48px;border-radius:24px;background:var(--ok);color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;margin:0 auto">✓</div><div style="font-size:16px;font-weight:600;margin-top:12px">已添加 Sentry</div><div style="color:var(--l2);margin-top:4px">18 个工具 · Her 现在就能用</div><div style="color:var(--l3);font-family:var(--mono);font-size:12px;margin-top:10px">search_issues · get_issue_details · find_releases …</div></div>`;
      foot=`<button class="mbtn p" data-act="addDone">完成</button>`; break;
    case "command":
      title="添加 postgres";
      body=`<div class="fhd">命令</div><div class="mfield"><div class="box mono">npx -y @modelcontextprotocol/server-postgres</div></div>
        <div class="fhd">环境变量</div><div class="fgroup"><div class="frow"><span style="font-family:var(--mono)">DATABASE_URL</span><span class="v">🔒 ••••••••</span></div></div><div class="fnote">上锁的值存在 Mac mini 的钥匙串里。第一次运行要下载，检查可能要几十秒。</div>
        <div class="mnote warn"><span class="k">这条命令会以你的身份在 Mac mini 上运行。添加时要用 Touch ID 签名确认，Her 自己不能添加本地命令。</span></div>`;
      foot=`<button class="mbtn" data-set="add:address">返回</button><button class="mbtn p" data-act="sign">用 Touch ID 添加</button>`; break;
  }
  return `<div class="mscrim"><div class="msheet"><div class="sh">${title}</div><div class="sb2">${body}</div><div class="sf">${foot}</div></div></div>`;
}
function renderMac(){
  const conv=()=>mTop()+mConv()+mComposer();
  switch(S.screen){
    case "chat": return mFrame(conv());
    case "plus": return mFrame(mTop()+mConv()+mComposer(mPlusMenu()));
    case "settings": return mFrame(mTop(true)+mConv()+mComposer()+mSettingsPanel());
    case "list": return mFrame(mList());
    case "discover": return mFrame(mDiscover());
    case "detail": return mFrame(mDetail());
    case "add": return mFrame(mList(), mAddSheet());
  }
}

/* ---------------- render & events ---------------- */
let toastTimer, probeTimer;
function toast(t){S.toast=t;render();clearTimeout(toastTimer);toastTimer=setTimeout(()=>{S.toast="";render();},2600);}
function render(){
  document.documentElement.dataset.theme=S.theme;
  document.getElementById("stage").innerHTML = S.plat==="iphone"?renderIphone():renderMac();
  document.getElementById("notes").innerHTML = NOTES[S.screen];
  renderCtl();
  clearTimeout(probeTimer);
  if(S.screen==="add"&&S.add==="probing") probeTimer=setTimeout(()=>{if(S.screen==="add"&&S.add==="probing"){S.add="settings";render();}},1800);
}
function go(screen){S.screen=screen;S.menu=false;S.plusSub=false;if(screen==="add")S.add="address";render();}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-set],[data-go],[data-act],[data-detail],[data-toggle],[data-fix],[data-install]");
  if(!t) return;
  e.stopPropagation();
  const d=t.dataset;
  if(d.set){const [k,v]=d.set.split(":");S[k]=v;if(k==="scen")reset();if(k==="screen"){S.menu=false;S.plusSub=false;if(v==="add")S.add="address";}render();return;}
  if(d.go){if(d.go.includes(":")){const [k,v]=d.go.split(":");S[k]=v;render();}else go(d.go);return;}
  if(d.detail){S.detail=d.detail;go("detail");return;}
  if(d.toggle){if(offline()){toast("Mac mini 离线，连上后才能修改");return;}const c=byId(d.toggle);c.on=!c.on;
    toast(c.on?`已打开 ${c.name}，Her 下一步起就能用`:(c.routines.length?`已关掉 ${c.name}。“${c.routines[0]}”下次运行会失败`:`已关掉 ${c.name}，Her 下一步起不再用它`));return;}
  if(d.fix){if(offline())return;const c=byId(d.fix);const was=c.status;c.status=was==="login"?"waiting":"checking";S.menu=false;render();
    setTimeout(()=>{c.status="ok";toast(was==="login"?`已登录 ${c.name} · ${c.tools} 个工具`:`${c.name} 可用 · ${c.tools} 个工具`);},1500);return;}
  if(d.install){const it=CATALOG.flatMap(g=>g.items).find(i=>i.id===d.install);
    if(it.ways[0]==="不需要鉴权"){C.push({id:it.id,name:it.name,mono:it.mono,bg:it.bg,kind:"remote",addr:"https://mcp.context7.com/mcp",auth:"none",status:"ok",tools:2,on:true,checked:"刚刚",routines:[],tl:[["resolve-library-id","找到库的 ID"],["get-library-docs","读库的文档"]]});toast(`已添加 ${it.name} · 2 个工具，Her 现在就能用`);}
    else if(it.ways[0]==="内置"){toast(`${it.name} 随 Her 安装：会在 Mac mini 上打开它的登录（原型）`);}
    else {S.screen="add";S.add="settings";render();}
    return;}
  switch(d.act){
    case "plus": if(S.screen==="plus"){go("chat");}else{S.screen="plus";S.plusSub=false;render();} break;
    case "plusSub": S.plusSub=!S.plusSub;render();break;
    case "closePop": go("chat");break;
    case "add": go("add");break;
    case "addDone": addSentry();go("list");toast("已添加 Sentry · 18 个工具");break;
    case "menu": S.menu=!S.menu;render();break;
    case "del": S.menu=false;{const c=byId(S.detail);C=C.filter(x=>x!==c);go("list");toast(`已删除 ${c.name}，它的令牌一并删除 · 撤销`);}break;
    case "cardYes": addSentry();S.cards="done";render();toast("在浏览器里登录 Sentry…（原型：直接成功）");break;
    case "cardNo": S.cards="ask";toast("好的，不连了");break;
    case "sign": toast(S.plat==="iphone"?"Face ID 确认后添加（原型）":"Touch ID 确认后添加（原型）");break;
  }
});
render();
</script>
</body>
</html>

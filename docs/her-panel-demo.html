<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Her 面板 · 原型</title>
<style>
:root{
  --font-ios:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",system-ui,sans-serif;
  --font-mac:"Google Sans Flex","Google Sans",system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
  --round:ui-rounded,"SF Pro Rounded","Google Sans Flex",-apple-system,"PingFang SC",system-ui,sans-serif;
  --orange:#f08a00;--green:#22a559;--red:#e5484d;
}
[data-theme=light]{
  --page:#e8eaf0;--page-fg:#1b1c22;--page-fg2:#62646f;--page-card:#fff;--page-bd:rgba(0,0,0,.08);
  --i-bg:#fff;--i-l1:#000;--i-l2:rgba(60,60,67,.6);--i-l3:rgba(60,60,67,.3);--i-sep:rgba(0,0,0,.09);
  --i-fill:rgba(118,118,128,.12);--i-reply:#f4f4f7;--i-me:#3d5bff;--i-tint:#3d5bff;
  --i-glass:rgba(255,255,255,.82);--i-glass-bd:rgba(0,0,0,.07);--i-sheet:#f2f2f7;--i-card:#fff;
  --win:#fff;--win2:#f4f4f7;--side:#f4f4f7;
  --l1:rgba(0,0,0,.86);--l2:rgba(0,0,0,.54);--l3:rgba(0,0,0,.32);
  --sep:rgba(0,0,0,.075);--fill:rgba(0,0,0,.045);--fill2:rgba(0,0,0,.075);
  --accent:#3d5bff;--accent-t:#3d5bff;--accent-bg:rgba(61,91,255,.10);
  --shadow-win:0 0 0 .5px rgba(0,0,0,.20),0 24px 70px rgba(10,20,50,.30),0 8px 22px rgba(10,20,50,.14);
  --bezel:#16171b;--pillbg:rgba(255,255,255,.88);--sheet:#fff;--glassy:rgba(255,255,255,.72);
  --amb1:oklch(.9 .075 285/.95);--amb2:oklch(.93 .07 45/.85);
}
[data-theme=dark]{
  --page:#0d0e12;--page-fg:#ececf1;--page-fg2:#9a9ca8;--page-card:#1a1b20;--page-bd:rgba(255,255,255,.08);
  --i-bg:#000;--i-l1:#fff;--i-l2:rgba(235,235,245,.6);--i-l3:rgba(235,235,245,.3);--i-sep:rgba(255,255,255,.11);
  --i-fill:rgba(118,118,128,.24);--i-reply:rgba(255,255,255,.08);--i-me:#4f6bff;--i-tint:#8094ff;
  --i-glass:rgba(48,48,54,.82);--i-glass-bd:rgba(255,255,255,.1);--i-sheet:#000;--i-card:#1c1c1e;
  --win:#1e1e21;--win2:#29292d;--side:#25252a;
  --l1:rgba(255,255,255,.88);--l2:rgba(255,255,255,.55);--l3:rgba(255,255,255,.32);
  --sep:rgba(255,255,255,.09);--fill:rgba(255,255,255,.05);--fill2:rgba(255,255,255,.085);
  --accent:#4f6bff;--accent-t:#8ea0ff;--accent-bg:rgba(91,121,255,.2);
  --shadow-win:0 0 0 .5px rgba(255,255,255,.14),0 24px 70px rgba(0,0,0,.6),0 8px 22px rgba(0,0,0,.35);
  --bezel:#2a2b31;--pillbg:rgba(0,0,0,.34);--sheet:#d9dae2;--glassy:rgba(255,255,255,.1);
  --amb1:oklch(.36 .1 285/.75);--amb2:oklch(.34 .08 45/.5);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--page-fg);font:14px/1.5 var(--font-mac);min-height:100vh;padding-bottom:120px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{display:block}
h4,h5,p,ul{margin:0;padding:0}
ul{list-style:none}
.top{max-width:1480px;margin:0 auto;padding:20px 24px 4px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.top h1{font-size:19px;margin:0;font-weight:650}
.top span{color:var(--page-fg2);font-size:13px}
.wrap{max-width:1480px;margin:0 auto;padding:10px 24px;display:flex;gap:26px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
#stage{min-width:0;max-width:100%;display:flex;flex-direction:column;align-items:center;gap:26px}
.phones{display:flex;gap:30px;flex-wrap:wrap;justify-content:center}
.cap{font-size:12.5px;color:var(--page-fg2);margin:0 0 8px 6px}
.cap b{color:var(--page-fg);font-weight:600;margin-right:6px}
.notes{width:372px;max-width:100%;flex:none;background:var(--page-card);border:1px solid var(--page-bd);border-radius:14px;padding:16px 18px;font-size:13px;line-height:1.65;position:sticky;top:14px}
.notes h3{margin:0 0 6px;font-size:14px}
.notes p{color:var(--page-fg2)}
.notes ul{margin:6px 0 0;padding-left:19px;list-style:disc}
.notes li{margin:4px 0}
.notes .blk{margin-top:14px;padding-top:12px;border-top:1px solid var(--page-bd)}
.notes li b{font-weight:600}
.notes table{border-collapse:collapse;margin-top:6px;width:100%}
.notes td{padding:3px 0;vertical-align:top}
.notes td:first-child{font-weight:600;white-space:nowrap;padding-right:12px}
.notes td:last-child{color:var(--page-fg2)}
.ctl{position:fixed;left:0;right:0;bottom:0;background:var(--page-card);border-top:1px solid var(--page-bd);padding:9px 16px;display:flex;flex-wrap:wrap;gap:6px 20px;align-items:center;justify-content:center;font-size:12.5px;z-index:90}
.ctl .g{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.ctl .g b{color:var(--page-fg2);font-weight:500;margin-right:4px}
.ctl button{padding:4px 11px;border-radius:7px;background:var(--fill2);color:var(--page-fg)}
.ctl button.on{background:var(--accent);color:#fff}
.ctl .g.off{opacity:.4;pointer-events:none}
.ctl select{font:inherit;padding:3px 6px;border-radius:7px;border:0;background:var(--fill2);color:var(--page-fg)}
.hide{display:none!important}

/* What both platforms share is drawn with these: each sets them to its own palette. */
.scr{--c1:var(--i-l1);--c2:var(--i-l2);--c3:var(--i-l3);--csep:var(--i-sep);--cfill:var(--i-fill);--tint:var(--i-tint);--pgbg:var(--i-sheet);--card:var(--i-card);
  --rh:50px;--fs:16px;--fs2:15px;--fsh:13px;--rad:24px;--ris:30px;--rir:9px;--pad:14px;font-family:var(--font-ios)}
.mpanel{--c1:var(--l1);--c2:var(--l2);--c3:var(--l3);--csep:var(--sep);--cfill:var(--fill2);--tint:var(--accent-t);--pgbg:var(--win);--card:var(--fill);
  --rh:36px;--fs:13px;--fs2:12.5px;--fsh:11.5px;--rad:14px;--ris:22px;--rir:6px;--pad:11px}

/* ---------- iPhone ---------- */
.phone{width:372px;height:800px;border-radius:54px;background:var(--bezel);padding:9px;box-shadow:0 18px 50px rgba(10,20,50,.25);flex:none}
.scr{position:relative;width:100%;height:100%;border-radius:45px;overflow:hidden;background:var(--i-bg);color:var(--i-l1);display:flex;flex-direction:column}
.sbar{height:46px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 6px;font-weight:600;font-size:15px;position:relative;z-index:3}
.sbar i{width:24px;height:11px;border-radius:3.5px;border:1.2px solid var(--i-l2);position:relative;margin-bottom:4px}
.sbar i::after{content:"";position:absolute;inset:1.3px;right:5px;background:var(--i-l1);border-radius:1.5px}
.gb{position:relative;width:42px;height:42px;border-radius:50%;background:var(--i-glass);border:.5px solid var(--i-glass-bd);box-shadow:0 2px 10px rgba(0,0,0,.08);display:grid;place-items:center;flex:none;color:var(--i-l1)}
.bdg{position:absolute;top:-3px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--i-tint);color:#fff;font:700 11px/18px var(--font-ios);text-align:center}
.dot{position:absolute;top:9px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--i-tint)}
.dot.o,.d.o{background:var(--orange)}
.ihead{position:relative;flex:none;height:98px;padding:0 14px}
.ibtns{display:flex;gap:8px;align-items:center}
.ibtns .sp{flex:1}
.iid{position:absolute;left:0;right:0;top:-6px;display:flex;flex-direction:column;align-items:center;pointer-events:none}
.iid>*{pointer-events:auto}
.avb{position:relative;display:block;border-radius:50%}
.avb .att{position:absolute;top:4px;right:2px;width:13px;height:13px;border-radius:50%;background:var(--orange);border:2.5px solid var(--i-bg)}
.mac .avb .att{border-color:var(--win);width:11px;height:11px;top:2px;right:0}
.tag{margin-top:-14px;height:34px;padding:0 14px;border-radius:17px;background:var(--i-glass);border:.5px solid var(--i-glass-bd);box-shadow:0 2px 10px rgba(0,0,0,.08);display:flex;align-items:center;gap:7px;font-size:14px;font-weight:500;position:relative;z-index:1;white-space:nowrap}
.tag b{font-size:16px;font-weight:600}
.tag .bar{width:1px;height:14px;background:var(--i-l3)}
.d{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.tag em{font-style:normal;color:var(--orange)}
.tag span{color:var(--i-l2)}
.ring{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--c2,var(--i-l2));border-right-color:transparent;display:inline-block;flex:none;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.chat{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:9px;padding:12px 14px;justify-content:flex-end}
.b{max-width:80%;padding:9px 13px;border-radius:19px;font-size:15.5px;line-height:1.4}
.b.me{align-self:flex-end;background:var(--i-me);color:#fff}
.b.her{align-self:flex-start;background:var(--i-reply)}
.fcard{align-self:flex-start;display:flex;gap:10px;align-items:center;padding:9px 13px 9px 10px;border-radius:16px;background:var(--i-reply);font-size:14px}
.fcard span{display:block;color:var(--i-l2);font-size:12px}
.fi{flex:none;width:30px;height:37px;border-radius:6px;background:rgba(229,72,77,.14);color:var(--red);font:700 8px/1 var(--font-ios);display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px}
.cmp{flex:none;margin:4px 12px 22px;height:48px;border-radius:24px;background:var(--i-glass);border:.5px solid var(--i-glass-bd);box-shadow:0 2px 12px rgba(0,0,0,.1);display:flex;align-items:center;gap:8px;padding:0 7px;color:var(--i-l3);font-size:16px}
.cmp span{flex:1}
.cmp button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--i-fill);color:var(--i-l1)}
.cmp .send{background:var(--i-tint);color:#fff}
.inav{flex:none;height:50px;display:flex;align-items:center;padding:0 14px}
.scr.pgd{background:var(--pgbg)}
.pg{flex:1;min-height:0;overflow-y:auto;padding:0 16px 34px;scrollbar-width:none}
.pg::-webkit-scrollbar{display:none}

/* ---------- Mac ---------- */
.mac{width:1030px;max-width:100%;height:740px;border-radius:14px;background:var(--win);color:var(--l1);box-shadow:var(--shadow-win);display:flex;overflow:hidden;font:13px/1.45 var(--font-mac);position:relative}
.mside{width:186px;flex:none;background:var(--side);padding:14px 10px;border-right:.5px solid var(--sep)}
.lights{display:flex;gap:8px;padding:2px 4px 18px}
.lights i{width:12px;height:12px;border-radius:50%;background:#ff5f57}
.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.mside div.sr{display:flex;align-items:center;gap:8px;height:30px;padding:0 8px;border-radius:7px;color:var(--l2)}
.mside div.sr.on{background:var(--fill2);color:var(--l1);font-weight:600}
.mmain{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.mhead{flex:none;height:88px;display:flex;align-items:flex-start;gap:4px;padding:10px 12px;position:relative}
.mhead .sp{flex:1}
.mid{position:absolute;left:0;right:0;top:8px;display:flex;flex-direction:column;align-items:center;pointer-events:none}
.mid>*{pointer-events:auto}
.mcap{margin-top:-10px;height:26px;padding:0 11px;border-radius:13px;background:var(--win);box-shadow:0 0 0 .5px var(--sep),0 2px 8px rgba(0,0,0,.1);display:flex;align-items:center;gap:6px;font-size:12px;position:relative;z-index:1;white-space:nowrap}
.mcap b{font-weight:600;font-size:13px}
.mcap em{font-style:normal;color:var(--orange)}
.tb{position:relative;width:30px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--l2)}
.tb:hover,.tb.on{background:var(--fill2);color:var(--l1)}
.tb .dot{top:4px;right:4px;width:7px;height:7px}
.tb .bdg{top:-2px;right:-5px;min-width:15px;height:15px;font-size:9.5px;line-height:15px;padding:0 4px;background:var(--accent)}
.mmenu{position:absolute;right:10px;top:42px;width:216px;background:var(--win);border-radius:9px;box-shadow:0 0 0 .5px var(--sep),0 10px 30px rgba(0,0,0,.22);padding:5px;z-index:6;font-size:12.5px}
.mmenu div{display:flex;align-items:center;gap:7px;height:28px;padding:0 8px;border-radius:6px}
.mmenu div span{color:var(--l2);margin-left:auto;font-size:11.5px}
.mmenu hr{border:0;border-top:.5px solid var(--sep);margin:4px 0}
.mac .chat{padding:14px 26px;gap:8px}
.mac .b,.mac .fcard{font-size:13px;border-radius:14px;padding:7px 11px;max-width:74%}
.mac .b.me{background:var(--accent)}.mac .b.her,.mac .fcard{background:var(--win2)}
.mac .fcard span{font-size:11.5px;color:var(--l2)}
.mac .cmp{margin:4px 22px 16px;height:40px;border-radius:13px;background:var(--win2);box-shadow:none;border:.5px solid var(--sep);font-size:13px;color:var(--l3)}
.mac .cmp button{width:26px;height:26px;background:var(--fill2);color:var(--l1)}
.mac .cmp .send{background:var(--accent);color:#fff}
.mpanel{width:372px;flex:none;border-left:.5px solid var(--sep);display:flex;flex-direction:column;position:relative;background:var(--win)}
.mp-top{flex:none;height:40px;display:flex;align-items:center;padding:0 8px}
.mp-body{flex:1;min-height:0;overflow-y:auto;padding:0 14px 20px;scrollbar-width:none}
.mp-body::-webkit-scrollbar{display:none}

/* ---------- lists: the settings as they are today, and the workbench's controls ---------- */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:2px 0 6px}
.hero h2{margin:8px 0 0;font-size:22px;font-weight:650;color:var(--c1)}
.mpanel .hero h2{font-size:17px;margin-top:6px}
.grp>h4{font-size:var(--fsh);font-weight:500;color:var(--c2);margin:18px var(--pad) 7px}
.mpanel .grp>h4{margin:15px 4px 6px}
.card{background:var(--card);border-radius:var(--rad);overflow:hidden}
.row{position:relative;display:flex;align-items:center;gap:11px;min-height:var(--rh);padding:0 var(--pad);font-size:var(--fs);color:var(--c1);width:100%;text-align:left}
.mpanel .row{gap:9px}
.row+.row::before{content:"";position:absolute;left:var(--pad);right:0;top:0;height:.5px;background:var(--csep)}
.row.ic+.row.ic::before{left:calc(var(--pad) + var(--ris) + 11px)}
.rl{flex:1;min-width:0}
.rl small{display:block;font-size:var(--fsh);color:var(--c2);margin-top:-1px}
.rv{color:var(--c2);font-size:var(--fs2);display:flex;align-items:center;gap:6px;white-space:nowrap}
.rv .chev{color:var(--c3)}
.rv .ck{color:var(--tint)}
.row.red{color:var(--red)}
.row.blue{color:var(--tint)}
.ri{width:var(--ris);height:var(--ris);border-radius:var(--rir);display:grid;place-items:center;flex:none;background:var(--cfill);color:var(--c1)}
.foot{font-size:var(--fsh);color:var(--c2);margin:7px var(--pad) 0;line-height:1.45}
.mpanel .foot{margin:6px 4px 0}
.seg{display:inline-flex;padding:2px;border-radius:9px;background:var(--cfill)}
.seg button{padding:4px 10px;border-radius:7px;font-size:13px;color:var(--c1)}
.mpanel .seg button{font-size:12px;padding:2px 8px}
.seg button.on{background:var(--i-card);box-shadow:0 1px 3px rgba(0,0,0,.14);font-weight:600}
[data-theme=dark] .seg button.on{background:rgba(255,255,255,.2)}
.sw{width:50px;height:30px;border-radius:15px;background:var(--cfill);position:relative;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw.on{background:var(--green)}.sw.on::after{transform:translateX(20px)}
.mpanel .sw{width:34px;height:20px}.mpanel .sw::after{width:16px;height:16px}.mpanel .sw.on::after{transform:translateX(14px)}

/* ---------- Her's page: her name, three tabs, and under each one kind of thing ---------- */
.tabs{display:flex;gap:2px;padding:4px;border-radius:27px;background:var(--card);margin:18px 0 0}
.tabs button{flex:1;height:46px;border-radius:23px;display:flex;align-items:center;justify-content:center;gap:7px;font-size:15px;font-weight:500;color:var(--c2);transition:background .2s,color .2s}
.tabs button.on{background:var(--cfill);color:var(--c1);font-weight:600}
.mpanel .tabs{border-radius:11px;padding:3px;margin-top:14px}
.mpanel .tabs button{height:28px;border-radius:8px;font-size:12.5px;gap:5px}
.tabpage{animation:tabin .28s cubic-bezier(.2,.8,.2,1)}
@keyframes tabin{from{opacity:0;transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){.tabpage{animation:none}.ring{animation:none}}
.tabpage>.grp:first-child>h4:empty{margin-top:14px}

/* Panes of glass over a field of Her's own colours. What is in a pane is what suits the thing: a list of what is
   at work, the files themselves, the next runs, the services, the skills by name, a switch. */
.gcs{position:relative;isolation:isolate;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.mpanel .gcs{gap:8px;margin-top:12px}
.gcs::before{content:"";position:absolute;inset:-26px -8px;z-index:-1;filter:blur(36px);opacity:.8;
  background:radial-gradient(38% 30% at 16% 12%,#8f9bf0,transparent 72%),radial-gradient(34% 28% at 84% 20%,#f29bc0,transparent 72%),radial-gradient(42% 30% at 56% 56%,#7fc4ea,transparent 72%),radial-gradient(40% 28% at 14% 90%,#b59cf2,transparent 72%)}
[data-theme=light] .gcs::before{opacity:.62}
.gc{position:relative;isolation:isolate;overflow:hidden;border-radius:26px;padding:14px 16px 8px;display:block;width:100%;text-align:left;grid-column:1/-1;
  --gt:var(--c1);--gs:color-mix(in srgb,var(--c1) 66%,transparent);--gline:color-mix(in srgb,var(--c1) 13%,transparent);--gtile:rgba(255,255,255,.1);
  color:var(--gt);background:linear-gradient(135deg,rgba(255,255,255,.17),rgba(255,255,255,.05));box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),inset 0 1px 0 rgba(255,255,255,.28);
  -webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5)}
[data-theme=light] .gc{--gtile:rgba(255,255,255,.62);background:linear-gradient(135deg,rgba(255,255,255,.78),rgba(255,255,255,.42));box-shadow:inset 0 0 0 1px rgba(255,255,255,.7),0 6px 20px rgba(60,70,140,.1)}
.mpanel .gc{border-radius:16px;padding:10px 12px 5px}
.gc[data-go]{cursor:pointer;transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.gc[data-go]:active{transform:scale(.985)}
.th{display:flex;align-items:center;gap:8px;min-height:26px}
.th b{font-size:18px;font-weight:700;letter-spacing:.2px}
.th .gs{margin-left:auto;font-size:13px;color:var(--gs);display:flex;align-items:center;gap:6px;white-space:nowrap}
.th .gs.o{color:var(--orange)}
.th>.chev{color:var(--gs);margin-left:auto}
.th>.gs+.chev{margin-left:2px}
.mem>.chev{color:var(--gs)}
.mpanel .th b{font-size:14px}.mpanel .th .gs{font-size:11.5px}
.new{font-style:normal;font-size:10px;font-weight:600;letter-spacing:.04em;color:var(--tint);background:var(--accent-bg);border-radius:6px;padding:1px 5px;white-space:nowrap}
/* A card is a way in: its name, at most a word of how it stands, and its glyph. What is in it shows on its page. */
.gc.ent{grid-column:auto;height:112px;padding:14px 16px;display:flex;flex-direction:column}
.gc.ent.w2{grid-column:1/-1}
.gc.ent .th{flex-direction:column;align-items:flex-start;gap:3px}
.gc.ent .th .gs{margin-left:0}
.th b .new{margin-left:6px;vertical-align:2px}
.gc.ent .gi{position:absolute;right:14px;bottom:13px;color:var(--gs)}
.mpanel .gc.ent{height:84px;padding:10px 12px}
.mpanel .gc.ent .gi{right:11px;bottom:10px}
.fic{flex:none;width:28px;height:35px;border-radius:6px;background:color-mix(in srgb,var(--k) 22%,transparent);color:var(--k);font:700 7.5px/1 var(--font-ios);font-style:normal;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px}
.k-pdf{--k:#e5484d}.k-sheet{--k:#1a9d55}.k-md{--k:#8a8d98}.k-doc{--k:#2f6bff}.k-img{--k:#8e5bd6}
[data-theme=dark] .k-pdf{--k:#ff6b70}[data-theme=dark] .k-sheet{--k:#3fcf7f}[data-theme=dark] .k-md{--k:#b3b6c2}[data-theme=dark] .k-doc{--k:#6f95ff}[data-theme=dark] .k-img{--k:#b48cf0}
.mpanel .fic{width:22px;height:28px;font-size:6px;padding-bottom:4px}
/* the services, each as it stands */
.apps{display:flex;justify-content:space-between;margin:12px 0 10px}
.apps span{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;width:46px}
.apps i,.ai{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font:700 17px/1 var(--font-ios);font-style:normal;color:#fff;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.2),0 2px 6px rgba(0,0,0,.22);flex:none}
.apps u{text-decoration:none;font-size:11px;color:var(--gs);white-space:nowrap}
.apps .add i{background:none;box-shadow:inset 0 0 0 1.2px var(--gs);color:var(--gs);font-weight:400;font-size:22px}
.apps .at::after{content:"";position:absolute;top:-3px;right:-3px;width:11px;height:11px;border-radius:50%;background:var(--orange)}
.mpanel .apps{margin:9px 0 7px}.mpanel .apps span{width:38px;gap:4px}
.mpanel .apps i{width:36px;height:36px;border-radius:10px;font-size:14px}.mpanel .apps u{font-size:10px}.mpanel .apps .add i{font-size:18px}
.ai.sm{width:34px;height:34px;border-radius:9px;font-size:13px}

/* Remote Desktop, at the top right of her page: one tap */
.rd{margin-left:auto;height:42px;padding:0 15px 0 12px;border-radius:21px;background:var(--i-glass);border:.5px solid var(--i-glass-bd);box-shadow:0 2px 10px rgba(0,0,0,.08);display:flex;align-items:center;gap:7px;font-size:15px;font-weight:500;color:var(--i-l1)}
.edit{position:absolute;right:-4px;bottom:-2px;width:24px;height:24px;border-radius:50%;background:var(--win2);box-shadow:0 0 0 2px var(--win);display:grid;place-items:center;color:var(--l1)}

/* ---------- the pages under it: plain, as the app's pages are ---------- */
.inav h3,.mp-top h3{flex:1;margin:0;text-align:center;font-size:17px;font-weight:600;color:var(--c1)}
.mp-top h3{font-size:13px}
.inav .sp42{width:42px;flex:none}.mp-top .sp42{width:30px;flex:none}
.row.two{min-height:calc(var(--rh) + 12px);padding-top:7px;padding-bottom:7px}
.rl small.o{color:var(--orange)}.rl small.r{color:var(--red)}.rl small.a{color:var(--tint)}
.row[data-go]{cursor:pointer}
.srch{height:36px;border-radius:11px;background:var(--cfill);display:flex;align-items:center;gap:6px;padding:0 10px;color:var(--c2);font-size:var(--fs2);margin-top:4px}
.mpanel .srch{height:28px;border-radius:8px}
.seg.full{display:flex;margin-top:10px}.seg.full button{flex:1}
.btn{height:30px;padding:0 13px;border-radius:15px;background:var(--tint);color:#fff;font-size:13px;font-weight:600;white-space:nowrap;flex:none}
.btn.q{background:var(--cfill);color:var(--tint)}
.btn.o{background:var(--orange)}
.mpanel .btn{height:22px;font-size:11.5px;padding:0 9px}
.badge{font-size:11px;padding:1px 7px;border-radius:8px;background:var(--accent-bg);color:var(--tint);font-weight:600;white-space:nowrap}
.badge.g{background:var(--cfill);color:var(--c2)}
.note{font-size:var(--fsh);color:var(--c2);line-height:1.5;margin:10px var(--pad) 0}
.mpanel .note{margin:8px 4px 0}
.part{font-size:var(--fsh);font-weight:600;color:var(--c2);margin:22px 4px 0}
.post{padding:14px 4px 0;border-bottom:.5px solid var(--csep)}
.post h5{font-size:17px;font-weight:600;display:flex;gap:8px;align-items:baseline;color:var(--c1)}
.post p{font-size:15px;color:var(--c2);margin-top:4px;line-height:1.4}
.well{margin-top:10px;background:var(--cfill);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;font-size:15px;color:var(--c1);min-height:46px}
.well .o{color:var(--orange)}.well .btn{margin-left:auto}
.beat{display:inline-flex;gap:3px}.beat i{width:5px;height:5px;border-radius:50%;background:var(--tint)}
.beat i:nth-child(2){opacity:.6}.beat i:nth-child(3){opacity:.3}
.pfoot{display:flex;align-items:center;gap:6px;font:500 13px/1 var(--font-ios);color:var(--c3);height:42px}
.pfoot .a{color:var(--tint)}.pfoot svg{margin-left:auto;color:var(--c2)}
.mpanel .post h5{font-size:13.5px}.mpanel .post p,.mpanel .well{font-size:12.5px}.mpanel .well{min-height:36px;border-radius:9px;padding:7px 10px}.mpanel .pfoot{height:34px;font-size:11.5px}
.md{padding:12px var(--pad);font-size:var(--fs2);line-height:1.6;color:var(--c1)}
.md h6{font-size:var(--fs2);font-weight:700;margin:8px 0 2px}.md h6:first-child{margin-top:0}
.md ul{list-style:disc;padding-left:18px}
.usebar{display:flex;height:10px;gap:2px;margin:14px var(--pad) 4px;border-radius:5px;overflow:hidden}
.usebar i{min-width:3px;background:var(--k)}
.kd{width:10px;height:10px;border-radius:3px;background:var(--k);flex:none}
.grip{color:var(--c3);flex:none}
.web{margin-top:10px;border-radius:var(--rad);overflow:hidden;background:var(--card);box-shadow:inset 0 0 0 .5px var(--csep)}
.web .bar{height:34px;display:flex;align-items:center;gap:7px;padding:0 12px;font-size:12px;color:var(--c2);border-bottom:.5px solid var(--csep)}
.center{text-align:center}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:.92em}
.cap2{height:26px;padding:0 10px;border-radius:13px;background:var(--card);font-size:var(--fsh);display:inline-flex;align-items:center;gap:6px}
.cap2.o{color:var(--orange)}
.ava{width:40px;height:40px;border-radius:50%;background:var(--cfill);display:grid;place-items:center;color:var(--c2);flex:none}
.mpanel .ava{width:30px;height:30px}
.btnrow{display:flex;gap:10px;margin-top:18px}
.btn.big{flex:1;height:46px;border-radius:23px;font-size:16px}
.mpanel .btn.big{height:30px;font-size:12.5px}
.btn.dis{opacity:.4}
.tbl{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;margin-top:12px;border-radius:14px;overflow:hidden;background:var(--card);font-size:12.5px}
.tbl span{padding:9px 10px;border-top:.5px solid var(--csep);border-left:.5px solid var(--csep);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl span:nth-child(4n+1){border-left:0;font-weight:600}
.tbl span:nth-child(-n+4){border-top:0;font-weight:600;color:var(--c2)}
.mpanel .tbl{font-size:11px}.mpanel .tbl span{padding:6px 7px}
.delivery{margin-top:14px;padding:14px!important;cursor:default}
.delivery .who{display:flex;gap:10px;align-items:flex-start;font-size:var(--fs2)}
.delivery .who small{display:block;font-size:var(--fsh);font-weight:600;color:var(--gs)}
.appr{margin-top:14px;border-radius:var(--rad);background:var(--card);padding:14px}
.appr b{font-size:var(--fs)}
/* what is asked before it is done */
.act{position:absolute;inset:0;z-index:8;background:rgba(0,0,0,.36);display:flex;flex-direction:column;justify-content:flex-end;padding:10px;gap:8px}
.act-card{background:var(--i-card);border-radius:24px;overflow:hidden;color:var(--i-l1)}
.act-card p{font-size:13px;color:var(--i-l2);text-align:center;padding:14px 18px;line-height:1.45}
.act-card p b{display:block;color:var(--i-l1);font-size:15px;margin-bottom:4px}
.act button{display:block;width:100%;height:54px;font-size:17px;color:var(--i-tint);border-top:.5px solid var(--i-sep)}
.act button.red{color:var(--red)}
.act>button{background:var(--i-card);border-radius:24px;font-weight:600;border:0}
.mpanel .act{justify-content:center;padding:22px}
.mpanel .act-card,.mpanel .act>button{border-radius:12px;background:var(--win)}
.mpanel .act-card p{font-size:12px}.mpanel .act-card p b{font-size:13px}
.mpanel .act button{height:34px;font-size:13px}
.linkrow{display:block;width:100%;text-align:center;color:var(--tint);font-size:var(--fs2);padding:14px 0}
</style>
</head>
<body>
<div class="top">
  <h1>Her 面板 · 工作台</h1>
  <span>点 Her 之后的这一页，和从它点进去的每一页。面板上的每一块都能点进子页；底部也可以直接跳。标着“新”的是这一版提议新增的入口。</span>
</div>
<div class="wrap">
  <div id="stage"></div>
  <aside class="notes" id="notes"></aside>
</div>
<div class="ctl">
  <div class="g" data-k="v"><b>页面</b><button data-v="wb">工作台</button><button data-v="cur">现状</button></div>
  <div class="g" data-k="tab"><b>标签</b><button data-v="work">工作</button><button data-v="has">能力</button><button data-v="set">设置</button></div>
  <div class="g" id="jump"><b>子页面</b><select id="page"></select></div>
  <div class="g" data-k="plat"><b>平台</b><button data-v="both">都看</button><button data-v="ios">iPhone</button><button data-v="mac">Mac</button></div>
  <div class="g" data-k="slot"><b>顶栏</b><button data-v="none">只留 Her</button><button data-v="one">留一个槽</button></div>
  <div class="g" data-k="theme"><b>主题</b><button data-v="light">浅色</button><button data-v="dark">深色</button></div>
</div>
<script>
const P = {
  menu: "M4 7h16M4 12h16M4 17h16",
  tray: "M4 13l2.5-7h11L20 13v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1zM4 13h4.5a3.5 3.5 0 0 0 7 0H20",
  pulse: "M3 12h4l2.5-6 4 12 2.5-6H21",
  clock: "M12 3.5a8.5 8.5 0 1 0 0 17a8.5 8.5 0 0 0 0-17zM12 7.5V12l3 2",
  chevR: "M9 6l6 6-6 6", chevD: "M6 9l6 6 6-6", chevL: "M15 6l-6 6 6 6",
  spark: "M12 3l1.9 5.6L19.5 10.5l-5.6 1.9L12 18l-1.9-5.6L4.5 10.5l5.6-1.9zM19 16v4M17 18h4",
  book: "M5 5.5A1.5 1.5 0 0 1 6.5 4H19v14H6.5A1.5 1.5 0 0 0 5 19.5zM5 19.5A1.5 1.5 0 0 0 6.5 21H19M9 8.5h6",
  plug: "M9 3v5M15 3v5M7 8h10v3a5 5 0 0 1-10 0zM12 16v5",
  laptop: "M5 6h14v9H5zM3 18.5h18",
  display: "M4 5h16v11H4zM9 20h6M12 16v4",
  shield: "M12 3l7 3v5.5c0 4.2-2.9 7.6-7 9.5-4.1-1.9-7-5.3-7-9.5V6zM9 12l2 2 4-4.5",
  bell: "M6.5 16.5V11a5.5 5.5 0 0 1 11 0v5.5l1.5 2H5zM10 20.5a2 2 0 0 0 4 0",
  gear: "M12 9a3 3 0 1 0 0 6a3 3 0 0 0 0-6zM12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1",
  person: "M12 12a4 4 0 1 0 0-8a4 4 0 0 0 0 8zM4.5 20a7.5 7.5 0 0 1 15 0",
  play: "M8 5.5v13l10.5-6.5z",
  info: "M12 3.5a8.5 8.5 0 1 0 0 17a8.5 8.5 0 0 0 0-17zM12 11v5.5M12 7.8h.01",
  doc: "M7 3h7l4 4v14H7zM14 3v4h4",
  grip: "M5 9h14M5 15h14",
  drive: "M4 14l2.5-8h11L20 14v4H4zM4 14h16M16.5 16.5h.01",
  cpu: "M8 8h8v8H8zM10 4v4M14 4v4M10 16v4M14 16v4M4 10h4M4 14h4M16 10h4M16 14h4",
  plus: "M12 5v14M5 12h14", x: "M6 6l12 12M18 6L6 18", up: "M12 19V5M6 11l6-6 6 6",
  check: "M5 12.5l4.5 4.5L19 7.5",
  edit: "M4 20l1-4.5L16.5 4a2.1 2.1 0 0 1 3 3L8 18.5zM14.5 6l3 3",
  checklist: "M4 6.5l1.6 1.6L8.4 5.2M12 6.5h8M4 12.5l1.6 1.6 2.8-2.9M12 12.5h8M5 18.5h2.5M12 18.5h8",
  puzzle: "M9.5 6V5a2 2 0 0 1 4 0v1H17a1 1 0 0 1 1 1v3.5h1a2 2 0 0 1 0 4h-1V18a1 1 0 0 1-1 1h-3.5v-1a2 2 0 0 0-4 0v1H6a1 1 0 0 1-1-1v-3.5h1a2 2 0 0 0 0-4H5V7a1 1 0 0 1 1-1z",
  brain: "M12 5.6C10.6 4 7.6 4.4 7.1 6.9 5 7.3 4.2 9.7 5.6 11.3 4.2 12.9 5 15.7 7.3 16 7.7 18.7 10.9 19.3 12 17.6M12 5.6C13.4 4 16.4 4.4 16.9 6.9 19 7.3 19.8 9.7 18.4 11.3 19.8 12.9 19 15.7 16.7 16 16.3 18.7 13.1 19.3 12 17.6M12 5.6v12M9 9.4c.2 1.2 1.2 2 3 2M15 13.4c-.2-1.2-1.2-2-3-2",
  skill: "M12 6.5c-2-1.3-4.5-1.5-7-1v12c2.5-.5 5-.3 7 1 2-1.3 4.5-1.5 7-1v-12c-2.5-.5-5-.3-7 1zM12 6.5v12",
  search: "M11 4.5a6.5 6.5 0 1 0 0 13a6.5 6.5 0 0 0 0-13zM16 16l4 4",
  window: "M4 5.5h16v13H4zM4 9.5h16M6.6 7.5h.01M9.2 7.5h.01",
  team: "M9 11a3 3 0 1 0 0-6a3 3 0 0 0 0 6zM3.5 19a5.5 5.5 0 0 1 11 0M16 5.2a3 3 0 0 1 0 5.6M17.5 14a5.5 5.5 0 0 1 3 5",
  work: "M4 8h16v11H4zM9 8V5h6v3",
};
// Drawn from more than one stroke.
const RAW = {
  gear: `<circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="8.5" stroke-width="2.6" stroke-dasharray="2.4 4.276" stroke-linecap="butt"/><circle cx="12" cy="12" r="2.3"/>`,
  remote: `<path d="M4 5h16v11H4zM9 20h6M12 16v4"/><path d="M10.5 7.6l5 3.2-2.2.5 1.1 2.2-1.1.6-1.1-2.2-1.7 1.5z" fill="currentColor" stroke-width=".6"/>`,
};
const ic = (n, s = 20, w = 1.8) => n === "more"
  ? `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="currentColor"><circle cx="5.5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="18.5" cy="12" r="1.7"/></svg>`
  : RAW[n] ? `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${RAW[n]}</svg>`
  : `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"><path d="${P[n]}"/></svg>`;
const chev = `<span class="chev">${ic("chevR", 14, 2.2)}</span>`;
const down = ic("chevD", 12, 2.4);

// Her's cat, as apps/desktop draws it (Cat.tsx).
let cats = 0;
function cat(size) {
  const id = "c" + cats++, small = size < 40;
  const ear = `<path d="M30 53L26 25L50 37Z" fill="#cbd3fb" stroke="#cbd3fb" stroke-width="8" stroke-linejoin="round"/>`;
  const eye = (x) => `<ellipse cx="${x}" cy="64" rx="${small ? 5.2 : 4.1}" ry="${small ? 5.9 : 4.7}" fill="#3c2f3a"/>${small ? "" : `<circle cx="${x + 1.3}" cy="62.4" r="1.25" fill="#fff"/>`}`;
  const apart = small ? 12.5 : 11.5;
  return `<svg width="${size}" height="${size}" viewBox="8 16 104 104"><defs><radialGradient id="${id}" gradientUnits="userSpaceOnUse" cx="44" cy="50" r="72"><stop offset="0" stop-color="#f1f3ff"/><stop offset=".55" stop-color="#d7ddff"/><stop offset="1" stop-color="#b3bcf2"/></radialGradient></defs>
    ${ear}<g transform="translate(120 0) scale(-1 1)">${ear}</g>
    <path d="M60 30C84 30 100 48 103 72C106 96 92 110 60 110C28 110 14 96 17 72C20 48 36 30 60 30Z" fill="url(#${id})"/>
    <path d="M46 47H74C86 47 92 55 92 65.5C92 80 82 88 60 88C38 88 28 80 28 65.5C28 55 34 47 46 47Z" fill="#fafbff"/>
    ${small ? "" : `<ellipse cx="37" cy="73" rx="6.5" ry="4.4" fill="#ffa3be" opacity=".5"/><ellipse cx="83" cy="73" rx="6.5" ry="4.4" fill="#ffa3be" opacity=".5"/>`}
    ${eye(60 - apart)}${eye(60 + apart)}
    ${small ? "" : `<path d="M55.2 71.2q2.4 3.3 4.8 0q2.4 3.3 4.8 0" fill="none" stroke="#3c2f3a" stroke-width="2.1" stroke-linecap="round"/>`}</svg>`;
}

// ---------- the conversation ----------
const chat = () => `<div class="chat">
  <div class="b me">把上周的周报整理一下，发我一份 PDF</div>
  <div class="b her">整理好了，一共 3 页，重点放在连接器那部分。</div>
  <div class="fcard"><i class="fi">PDF</i><div><b>周报 · 11 月第 2 周.pdf</b><span>3 页 · 刚刚</span></div></div>
  <div class="b her">登录页那个问题我交给 Codex 去修了，改动需要你确认。</div>
</div>
<div class="cmp"><button>${ic("plus", 18)}</button><span>发消息给 Her</span><button class="send">${ic("up", 18, 2.2)}</button></div>`;

function phoneChat(v, slot) {
  const cur = v === "cur";
  const right = cur ? `<button class="gb">${ic("pulse")}<i class="dot o"></i></button><button class="gb">${ic("clock")}</button>`
    : slot === "one" ? `<button class="gb">${ic("pulse")}<i class="dot o"></i></button>` : "";
  return `<div class="phone"><div class="scr">
    <div class="sbar"><span>9:41</span><i></i></div>
    <div class="ihead">
      <div class="ibtns"><button class="gb">${ic("menu")}</button>${cur ? `<button class="gb">${ic("tray")}<b class="bdg">3</b></button>` : ""}<span class="sp"></span>${right}</div>
      <div class="iid"><span class="avb">${cat(70)}${cur ? "" : `<i class="att"></i>`}</span>
        <div class="tag"><b>Her</b><i class="bar"></i><i class="d o"></i><em>Codex 在等你</em><span>2</span><i class="ring"></i></div></div>
    </div>
    ${chat()}
  </div></div>`;
}
// ---------- small pieces ----------
const NEW = `<i class="new">新</i>`;
// Where a row leads: a page, or (ask:…) what is asked before it is done.
const link = (to) => to === null ? "" : to.startsWith("ask:") ? `data-ask="${to.slice(4)}"` : `data-go="${to}"`;
const row = (label, value = "", go = true, cls = "", to = null) =>
  `<div class="row ${cls}" ${link(to)}><span class="rl">${label}</span><span class="rv">${value}${go ? chev : ""}</span></div>`;
// A row of two lines: something before it, its name over a line about it, something after.
const row2 = (lead, title, sub, right = "", subcls = "", to = null) =>
  `<div class="row two" ${link(to)}>${lead}<span class="rl">${title}<small class="${subcls}">${sub}</small></span><span class="rv">${right}</span></div>`;
const seg = (a, b) => `<span class="seg"><button class="on">${a}</button><button>${b}</button></span>`;
const grp = (title, rows, foot = "") => `<div class="grp"><h4>${title}</h4><div class="card">${rows}</div>${foot ? `<p class="foot">${foot}</p>` : ""}</div>`;
const sw = (on = true) => `<button class="sw ${on ? "on" : ""}"></button>`;
const app = (bg, letter) => `<i class="ai sm" style="background:${bg}">${letter}</i>`;
const fic = (k, ext) => `<i class="fic k-${k}">${ext}</i>`;
const btn = (t, cls = "") => `<button class="btn ${cls}">${t}</button>`;
const check = `<span class="ck">${ic("check", 17, 2.4)}</span>`;
const dotNew = `<i class="d" style="background:var(--tint);margin-right:6px"></i>`;

// ---------- the frames ----------
// A page on the phone: back, its title, and what its bar holds on the right.
let overlay = "";
function phonePage(inner, { title = "", back = null, right = "", rightGo = null, remote = false } = {}) {
  return `<div class="phone"><div class="scr pgd">

const notes = {
  cur: `<h3>现状</h3>

const icons = `<div class="blk"><h3>卡片与图标</h3><p>卡片是玻璃，后面是 Her 的蓝紫和粉。图标是手画的近似，落到 App 里用系统图标。</p></div>`;

// ---------- the page ----------
const state = { v: "wb", tab: "work", page: null, ask: null, full: false, plat: "both", slot: "none", theme: "dark" };
const label = (id) => subs[id].name || subs[id].title;
// A page, then the pages under it.
const under = (parent, depth) => Object.keys(subs).filter((id) => (subs[id].parent || null) === parent).flatMap((id) => [[id, depth], ...under(id, depth + 1)]);
const path = (id) => (subs[id].parent ? path(subs[id].parent) + " › " : "") + label(id);
const select = document.getElementById("page");
select.innerHTML = `<option value="">面板</option>` + [["工作", "work"], ["能力", "has"], ["设置", "set"]].map(([t, k]) =>
  `<optgroup label="${t}">${under(null, 0).filter(([id]) => subs[id].tab === k).map(([id, d]) => `<option value="${id}">${"　".repeat(d)}${label(id)}</option>`).join("")}</optgroup>`).join("");

function render() {
  cats = 0;
  document.documentElement.dataset.theme = state.theme;
  const { v, plat, slot, tab } = state;
  const cur = v === "cur";
  const page = !cur && state.page ? subs[state.page] : null;
  const nav = page ? { title: page.title, back: page.parent || "", right: page.right || "", rightGo: page.rightGo || null } : {};
  const ask = !cur && state.ask ? asks[state.ask] : null;
  overlay = ask ? `<div class="act"><div class="act-card"><p><b>${ask[0]}</b>${ask[1]}</p>${ask[2].map(([t, red, does]) => `<button class="${red ? "red" : ""}" data-ask="" ${does ? `data-do="${does}"` : ""}>${t}</button>`).join("")}</div><button data-ask="">取消</button></div>` : "";
  const inner = (m) => cur ? current(m) : page ? page.body(m) : root(m, tab);
  const top = cur ? "对话页 · 4 个按钮 + 头像 + 名牌" : slot === "one" ? "对话页 · 右侧固定留一个槽" : "对话页 · 顶栏只留 Her";
  const where = cur ? "点头像之后：设置" : page ? path(state.page) : "点 Her 之后";
  document.getElementById("stage").innerHTML = `
    <div class="phones ${plat === "mac" ? "hide" : ""}">
      <div><p class="cap"><b>iPhone</b>${top}</p>${phoneChat(v, slot)}</div>
      <div><p class="cap"><b>iPhone</b>${where}</p>${phonePage(inner(false), cur ? {} : page ? nav : { remote: true })}</div>
    </div>
    <div class="${plat === "ios" ? "hide" : ""}" style="max-width:100%"><p class="cap"><b>Mac</b>${cur ? "设置在侧栏，环境在 ⋯ 里" : page ? where + "，开在同一个侧栏里" : "同一页，开在对话旁边"}</p>${mac(v, slot, inner(true), nav)}</div>`;
  document.getElementById("notes").innerHTML = cur ? notes.cur : page
    ? `<h3>${label(state.page)}${page.fresh ? " " + NEW : ""}</h3><p>来源：${page.from}。</p><ul>${page.fresh ? "<li><b>新入口：</b>内容和文案取自控制台现有的这一页，这里按原生样式画出来。第一步可以先在 App 里打开网页，用得多再改原生。</li>" : "<li>内容和现有页面一致，没有新增功能。</li>"}${page.note || ""}</ul>`
    : notes[tab] + icons;
  for (const g of document.querySelectorAll(".ctl .g[data-k]")) {
    for (const b of g.querySelectorAll("button")) b.classList.toggle("on", b.dataset.v === state[g.dataset.k]);
    if (g.dataset.k === "slot" || g.dataset.k === "tab") g.classList.toggle("off", cur);
  }
  document.getElementById("jump").classList.toggle("off", cur);
  select.value = state.page || "";
}
document.querySelector(".ctl").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  state[b.parentElement.dataset.k] = b.dataset.v;
  if (b.parentElement.dataset.k === "tab" || b.parentElement.dataset.k === "v") state.page = state.ask = null;
  render();
});
select.addEventListener("change", () => {
  state.page = select.value || null;
  state.ask = null;
  if (state.page) state.tab = subs[state.page].tab;
  render();
});
document.getElementById("stage").addEventListener("click", (e) => {
  const s = e.target.closest(".sw");
  if (s) return s.classList.toggle("on");
  const ask = e.target.closest("[data-ask]");
  if (ask) {
    if (ask.dataset.do === "full") state.full = true;
    return (state.ask = ask.dataset.ask || null), render();
  }
  if (e.target.closest("[data-full]")) return (state.full = false), render();
  const sg = e.target.closest(".seg button");
  if (sg) return [...sg.parentElement.children].forEach((x) => x.classList.toggle("on", x === sg));
  const tab = e.target.closest("[data-tab]");
  if (tab) return (state.tab = tab.dataset.tab), render();
  const go = e.target.closest("[data-go]");
  if (go) return (state.page = go.dataset.go || null), render();
});
render();
</script>

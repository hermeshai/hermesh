<title>会话多图展示 · 竖图与长图留白优化交互原型</title>
<style>
@font-face {
  font-family: "Google Sans Flex";
  src: url("../apps/desktop/src/renderer/src/assets/fonts/google-sans-flex.ttf") format("truetype");
  font-style: oblique 0deg 10deg;
  font-weight: 100 1000;
  font-display: swap;
}
@font-face {
  font-family: "Google Sans Code";
  src: url("../apps/desktop/src/renderer/src/assets/fonts/google-sans-code.ttf") format("truetype");
  font-weight: 300 800;
  font-display: swap;
}

:root {
  --font-mac: "Google Sans Flex", "Google Sans", -apple-system, BlinkMacSystemFont, "PingFang SC", system-ui, sans-serif;
  --font-ios: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", system-ui, sans-serif;
  --mono: "Google Sans Code", ui-monospace, "SF Mono", Menlo, Monaco, monospace;
  --ease: cubic-bezier(.22, 1, .36, 1);
  --ease-out: cubic-bezier(.2, 0, 0, 1);
}

/* ---------- Pure Black OLED (Default — 1:1 matches uploaded screenshot) ---------- */
[data-theme="black"] {
  --page: #090a0e;
  --page-fg: #ededf2;
  --page-fg2: #989caa;
  --page-fg3: #636776;
  --page-card: #12131a;
  --page-bd: rgba(255,255,255,.085);
  --page-bar: rgba(14,15,21,.90);

  --win: #000000;
  --win2: #121318;
  --win3: #1b1c23;
  --code: #0b0c10;
  --pill: #15161c;
  --pill-bd: rgba(255,255,255,.10);

  --l1: rgba(255,255,255,.93);
  --l2: rgba(235,235,245,.60);
  --l3: rgba(235,235,245,.36);
  --l4: rgba(255,255,255,.15);
  --sep: rgba(255,255,255,.095);
  --fill: rgba(255,255,255,.055);
  --fill2: rgba(255,255,255,.105);
  --fill3: rgba(255,255,255,.155);

  --accent: #4a66ff;
  --accent-t: #8fa2ff;
  --accent-bg: rgba(74,102,255,.18);
  --ok: #38ce86;
  --ok-bg: rgba(56,206,134,.15);
  --warn: #f5a53c;
  --warn-bg: rgba(245,165,60,.15);
  --danger: #ff6670;
  --danger-bg: rgba(255,102,112,.16);

  --shadow-win: 0 0 0 1px rgba(255,255,255,.11), 0 24px 68px rgba(0,0,0,.78);
  --simg-whisper: 0 0 0 .5px rgba(255,255,255,.11), 0 8px 26px rgba(0,0,0,.48);
  --simg-whisper-hover: 0 0 0 .5px rgba(255,255,255,.20), 0 12px 32px rgba(0,0,0,.64);
  --i-bg: #000000;
  --i-glass: rgba(30,30,36,.84);
  --i-glass-bd: rgba(255,255,255,.13);
}

/* ---------- Dark Gray (Desktop Standard Dark) ---------- */
[data-theme="dark"] {
  --page: #0f1116;
  --page-fg: #ececf1;
  --page-fg2: #989ba8;
  --page-fg3: #666977;
  --page-card: #171922;
  --page-bd: rgba(255,255,255,.085);
  --page-bar: rgba(20,21,28,.90);

  --win: #1e1e22;
  --win2: #26262b;
  --win3: #303037;
  --code: #17171b;
  --pill: #29292f;
  --pill-bd: rgba(255,255,255,.12);

  --l1: rgba(255,255,255,.91);
  --l2: rgba(255,255,255,.58);
  --l3: rgba(255,255,255,.35);
  --l4: rgba(255,255,255,.15);
  --sep: rgba(255,255,255,.09);
  --fill: rgba(255,255,255,.055);
  --fill2: rgba(255,255,255,.095);
  --fill3: rgba(255,255,255,.145);

  --accent: #4a66ff;
  --accent-t: #95a8ff;
  --accent-bg: rgba(74,102,255,.18);
  --ok: #3fcf86;
  --ok-bg: rgba(63,207,134,.15);
  --warn: #f5a623;
  --warn-bg: rgba(245,166,35,.15);
  --danger: #ff6b75;
  --danger-bg: rgba(255,107,117,.16);

  --shadow-win: 0 0 0 .5px rgba(255,255,255,.14), 0 24px 68px rgba(0,0,0,.56);
  --simg-whisper: 0 0 0 .5px rgba(255,255,255,.09), 0 6px 22px rgba(0,0,0,.32);
  --simg-whisper-hover: 0 0 0 .5px rgba(255,255,255,.16), 0 10px 28px rgba(0,0,0,.44);
  --i-bg: #141417;
  --i-glass: rgba(38,38,44,.80);
  --i-glass-bd: rgba(255,255,255,.12);
}

/* ---------- Light ---------- */
[data-theme="light"] {
  --page: #e8eaf0;
  --page-fg: #181920;
  --page-fg2: #5d606e;
  --page-fg3: #898d9c;
  --page-card: #ffffff;
  --page-bd: rgba(0,0,0,.08);
  --page-bar: rgba(255,255,255,.90);

  --win: #ffffff;
  --win2: #f4f5f8;
  --win3: #eaecf2;
  --code: #f6f7fa;
  --pill: #ffffff;
  --pill-bd: rgba(0,0,0,.11);

  --l1: rgba(0,0,0,.88);
  --l2: rgba(0,0,0,.56);
  --l3: rgba(0,0,0,.35);
  --l4: rgba(0,0,0,.14);
  --sep: rgba(0,0,0,.085);
  --fill: rgba(0,0,0,.045);
  --fill2: rgba(0,0,0,.08);
  --fill3: rgba(0,0,0,.125);

  --accent: #3d5bff;
  --accent-t: #2c4ae8;
  --accent-bg: rgba(61,91,255,.10);
  --ok: #158f4c;
  --ok-bg: rgba(21,143,76,.11);
  --warn: #c96a04;
  --warn-bg: rgba(201,106,4,.11);
  --danger: #dc2626;
  --danger-bg: rgba(220,38,38,.10);

  --shadow-win: 0 0 0 .5px rgba(0,0,0,.15), 0 22px 62px rgba(15,23,42,.16);
  --simg-whisper: 0 0 0 .5px rgba(0,0,0,.07), 0 4px 18px rgba(15,23,42,.06);
  --simg-whisper-hover: 0 0 0 .5px rgba(0,0,0,.12), 0 8px 26px rgba(15,23,42,.10);
  --i-bg: #ffffff;
  --i-glass: rgba(250,250,252,.84);
  --i-glass-bd: rgba(0,0,0,.08);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--page);
  color: var(--page-fg);
  font: 13.5px/1.55 var(--font-mac);
  min-height: 100vh;
  padding-bottom: 132px;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
svg { display: block; flex: none; }
code { font-family: var(--mono); }

/* ---------- Header ---------- */
.top {
  max-width: 1640px;
  margin: 0 auto;
  padding: 16px 20px 6px;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px 16px;
  flex-wrap: wrap;
}
.top-l { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.top h1 { margin: 0; font-size: 17.5px; font-weight: 650; letter-spacing: -.015em; }
.top .sub { font-size: 12.8px; color: var(--page-fg2); }
.pbadge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 9px; border-radius: 99px; font-size: 11.5px; font-weight: 560;
  background: var(--accent-bg); color: var(--accent-t);
  white-space: nowrap;
}
.pbadge.ok { background: var(--ok-bg); color: var(--ok); }
.pbadge.warn { background: var(--warn-bg); color: var(--warn); }
.pbadge.danger { background: var(--danger-bg); color: var(--danger); }

/* ---------- Main Stage Layout ---------- */
.wrap {
  max-width: 1580px;
  margin: 0 auto;
  padding: 8px 18px 20px;
  display: flex;
  gap: 16px;
  align-items: flex-start;
  justify-content: center;
  flex-wrap: wrap;
}
@media (min-width: 1480px) {
  .wrap { flex-wrap: nowrap; }
}
#stage {
  display: flex;
  gap: 16px;
  align-items: flex-start;
  justify-content: center;
  flex-wrap: wrap;
  min-width: 0;
  max-width: 100%;
}
@media (min-width: 1200px) {
  #stage { flex-wrap: nowrap; }
}

/* ---------- Diagnostic Notes Card ---------- */
.notes {
  width: 324px;
  max-width: 100%;
  flex: none;
  background: var(--page-card);
  border: 1px solid var(--page-bd);
  border-radius: 14px;
  padding: 14px 15px;
  font-size: 12.4px;
  line-height: 1.58;
}
.notes h3 { margin: 0 0 5px; font-size: 13.8px; font-weight: 650; display: flex; align-items: center; gap: 7px; }
.notes p { margin: 0; color: var(--page-fg2); }
.notes ul { margin: 6px 0 0; padding-left: 16px; color: var(--page-fg2); }
.notes li { margin: 4px 0; }
.notes li b { color: var(--page-fg); font-weight: 600; }
.notes .blk { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--page-bd); }
.notes code { font-size: 11px; padding: 1px 4.5px; border-radius: 4px; background: var(--fill2); color: var(--page-fg); }
.metric-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
.metric {
  background: var(--fill);
  border: .5px solid var(--sep);
  border-radius: 8px;
  padding: 6px 7px;
}
.metric small { display: block; font-size: 10.2px; color: var(--page-fg3); }
.metric b { display: block; font-size: 12px; font-weight: 650; margin-top: 2px; font-variant-numeric: tabular-nums; }

/* ==========================================================================
   IPHONE 17 PRO SIMULATION (1:1 with uploaded screenshot)
   ========================================================================== */
.phone {
  width: 372px;
  max-width: 100%;
  height: 736px;
  border-radius: 50px;
  padding: 9px;
  background: #1b1b21;
  box-shadow: 0 24px 66px rgba(0,0,0,.48), inset 0 0 0 1.5px #383844;
  flex: none;
  user-select: none;
}
.scr {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 42px;
  overflow: hidden;
  background: var(--i-bg);
  color: var(--l1);
  font: 15px/1.48 var(--font-ios);
}
.island {
  position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
  width: 112px; height: 30px; border-radius: 16px; background: #000; z-index: 40;
}
.sb {
  position: absolute; top: 0; left: 0; right: 0; height: 46px;
  display: flex; justify-content: space-between; align-items: center;
  padding: 6px 26px 0 32px; font-size: 14px; font-weight: 600; z-index: 39;
  pointer-events: none;
}
.inav {
  position: absolute; top: 46px; left: 0; right: 0; height: 44px;
  display: flex; align-items: center; justify-content: center; z-index: 20;
  background: linear-gradient(var(--i-bg) 58%, transparent);
}
.iglass {
  background: var(--i-glass);
  backdrop-filter: blur(22px) saturate(1.5);
  -webkit-backdrop-filter: blur(22px) saturate(1.5);
  box-shadow: 0 0 0 .5px var(--i-glass-bd), 0 4px 14px rgba(0,0,0,.20);
}
.itcap {
  height: 36px; max-width: 228px; border-radius: 18px; padding: 0 14px;
  display: flex; flex-direction: column; justify-content: center; text-align: center;
}
.itcap b { font-size: 12.8px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.itcap small { font-size: 10px; color: var(--l2); }

/* Right floating rail buttons (matching user's screenshot!) */
.irail-float {
  position: absolute;
  right: 10px;
  top: 100px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  z-index: 25;
  pointer-events: none;
}
.irail-btn {
  width: 38px; height: 38px; border-radius: 50%;
  display: grid; place-items: center;
  color: var(--l1);
  opacity: .88;
}
.iscroll {
  position: absolute; inset: 0; overflow-y: auto; scrollbar-width: none;
  padding: 96px 16px 88px;
  display: flex; flex-direction: column; gap: 10px;
}
.iscroll::-webkit-scrollbar { display: none; }
.iscroll h3 { margin: 2px 0 2px; font-size: 17px; font-weight: 650; letter-spacing: -.01em; }
.iscroll p { margin: 0; font-size: 15px; line-height: 1.52; color: var(--l1); padding-right: 26px; }
.idock { position: absolute; left: 12px; right: 12px; bottom: 18px; z-index: 20; display: flex; gap: 8px; align-items: center; }
.ibox { flex: 1; height: 42px; border-radius: 21px; padding: 0 14px; display: flex; align-items: center; color: var(--l3); font-size: 14px; }
.ichat-fab { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; color: var(--l1); flex: none; }
.homebar { position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%); width: 128px; height: 4.5px; border-radius: 3px; background: var(--l1); opacity: .7; z-index: 25; }

/* ==========================================================================
   MAC DESKTOP WINDOW SIMULATION (InlineImages.tsx + files.css)
   ========================================================================== */
.mac {
  width: 752px;
  max-width: 100%;
  height: 736px;
  border-radius: 13px;
  overflow: hidden;
  box-shadow: var(--shadow-win);
  display: flex;
  background: var(--win);
  color: var(--l1);
  font: 14.5px/1.62 var(--font-mac);
  position: relative;
  user-select: none;
}
.mac.wide-only { width: 920px; }
.scol {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  background: var(--win);
  position: relative;
}
.scol.split-narrow {
  flex: 0 0 468px;
  width: 468px;
  max-width: 100%;
}
.ctool {
  height: 44px;
  border-bottom: .5px solid var(--sep);
  display: flex;
  align-items: center;
  padding: 0 12px 0 16px;
  gap: 9px;
  flex: none;
}
.lights { display: flex; gap: 7px; margin-right: 4px; }
.lights i { width: 11px; height: 11px; border-radius: 50%; background: #ff5f57; display: block; }
.lights i:nth-child(2) { background: #febc2e; }
.lights i:nth-child(3) { background: #28c840; }
.ctitle { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
.ctitle h2 { margin: 0; font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.th-where { font-size: 12px; color: var(--l2); white-space: nowrap; }
.tb-ic { width: 27px; height: 27px; border-radius: 7px; display: grid; place-items: center; color: var(--l2); }
.tb-ic:hover, .tb-ic.on { background: var(--fill2); color: var(--l1); }

.cscroll { flex: 1; overflow-y: auto; padding: 18px 26px 88px; scrollbar-width: thin; }
.mcol { max-width: 752px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.mcol h3 { margin: 2px 0 0; font-size: 17.5px; font-weight: 650; letter-spacing: -.012em; }
.mcol p { margin: 0; color: var(--l1); }

.sfp-mock {
  flex: 1; min-width: 0; border-left: .5px solid var(--sep); background: var(--win2);
  display: flex; flex-direction: column;
}
.sfp-mock-hd {
  height: 44px; border-bottom: .5px solid var(--sep); padding: 0 12px;
  display: flex; align-items: center; font-size: 12px; color: var(--l2); gap: 6px;
}
.sfp-mock-bd {
  flex: 1; padding: 16px; display: flex; flex-direction: column; justify-content: center; align-items: center;
  text-align: center; color: var(--l3); font-size: 12.5px; gap: 6px;
}

.mcmp-zone {
  position: absolute; left: 0; right: 0; bottom: 0;
  padding: 18px 24px 14px;
  background: linear-gradient(transparent, var(--win) 28px);
  pointer-events: none;
}
.mcmp {
  pointer-events: auto;
  max-width: 752px; margin: 0 auto;
  background: var(--pill);
  border-radius: 16px;
  box-shadow: 0 0 0 .5px var(--pill-bd), 0 4px 14px rgba(0,0,0,.22);
  padding: 8px 13px;
  display: flex; align-items: center; gap: 8px;
  color: var(--l3); font-size: 13.5px;
}

/* ==========================================================================
   SHARED INDEX BAR & CAPTION (Matches files.css .simg-index-bar)
   ========================================================================== */
.idx-bar {
  display: flex;
  align-items: center;
  gap: 4px;
  padding-bottom: 6px;
  border-bottom: .5px solid var(--sep);
  min-width: 0;
}
.idx-chips {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 3px;
  overflow-x: auto;
  scrollbar-width: none;
}
.idx-chips::-webkit-scrollbar { display: none; }
.idx-chip {
  flex: none;
  height: 24px;
  padding: 0 8px;
  border-radius: 6px;
  color: var(--l3);
  font-size: 12px;
  line-height: 24px;
  font-variant-numeric: tabular-nums;
  display: inline-flex;
  align-items: center;
  gap: 4.5px;
  transition: color .14s, background .14s;
  max-width: 176px;
}
.idx-chip i { font-style: normal; font-family: var(--mono); font-size: 11px; }
.idx-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.idx-chip:hover { color: var(--l1); background: var(--fill); }
.idx-chip.on { color: var(--l1); font-weight: 600; background: var(--fill2); }
.idx-count {
  flex: none;
  margin-left: auto;
  padding-left: 6px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--l3);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.stage-cap {
  font-size: 12.8px;
  line-height: 1.48;
  color: var(--l2);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* ==========================================================================
   0. CURRENT BUG REPRODUCTION (iOS full-width border box + Mac empty stage)
   ========================================================================== */
.bug-wrap { display: flex; flex-direction: column; gap: 8px; width: 100%; }

/* iOS Bug: SessionImages.swift:603 .frame(maxWidth: .infinity, maxHeight: 208, alignment: .leading) BEFORE .strokeBorder */
.ios-bug-stage {
  position: relative;
  width: 100%;
  height: 208px;
  border-radius: 10px;
  border: .5px solid var(--sep);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  cursor: zoom-in;
}
.ios-bug-stage .art-slot {
  height: 100%;
  width: auto;
  flex: none;
  display: flex;
}
.ios-bug-stage .art-slot svg { height: 100%; width: auto; }
.void-callout {
  flex: 1;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  margin: 8px;
  border-radius: 7px;
  border: 1px dashed rgba(255, 102, 112, .42);
  background: rgba(255, 102, 112, .05);
  color: var(--danger);
  font-size: 11px;
  text-align: center;
  padding: 6px;
  pointer-events: none;
}
.void-callout small { color: var(--l3); font-size: 10.2px; }

/* Mac Bug: files.css:206 aspect-ratio locked >= 1.25, width 100%, next arrow stranded on far right */
.mac-bug-stage {
  position: relative;
  width: 100%;
  height: 356px;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  cursor: zoom-in;
}
.mac-bug-stage.landscape { height: auto; aspect-ratio: 2544 / 1390; max-height: 380px; }
.mac-bug-stage .art-slot {
  height: 100%;
  max-width: 100%;
  border-radius: 8px;
  overflow: hidden;
  box-shadow: var(--simg-whisper);
  flex: none;
}
.mac-bug-stage .art-slot svg { height: 100%; width: auto; max-width: 100%; }
.mac-bug-stage.landscape .art-slot { width: 100%; height: auto; }
.mac-bug-stage.landscape .art-slot svg { width: 100%; height: auto; }
.stage-nav {
  position: absolute;
  top: 50%;
  margin-top: -15px;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: rgba(18,19,25,.62);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  box-shadow: inset 0 0 0 .5px rgba(255,255,255,.24);
  color: #fff;
  display: grid;
  place-items: center;
  z-index: 3;
}
.stage-nav:hover { background: rgba(28,30,40,.88); }
.stage-nav.prev { left: 8px; }
.stage-nav.next { right: 8px; }

/* Mac Pair Bug: files.css:200 width:100%; max-height:320px; object-fit:contain -> wide shadow box */
.pair-row { display: flex; gap: 12px; width: 100%; align-items: flex-start; }
.pair-bug-card {
  flex: 1 1 0;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
  cursor: zoom-in;
}
.pair-bug-box {
  width: 100%;
  height: 250px;
  border-radius: 8px;
  box-shadow: var(--simg-whisper);
  border: 1px dashed rgba(255,102,112,.40);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}
.pair-bug-box svg { height: 100%; width: auto; }

/* ==========================================================================
   OPTION A: PROPORTIONAL MULTI-UP SNAP STRIP (推荐 1 · 多卡等高同屏轨道)
   ========================================================================== */
.opt-a { display: flex; flex-direction: column; gap: 8px; width: 100%; position: relative; }
.opt-a-stage { position: relative; width: 100%; }
.opt-a-track {
  display: flex;
  align-items: stretch;
  gap: 10px;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  scroll-behavior: smooth;
  scrollbar-width: none;
  padding: 2px 2px 4px;
}
.opt-a-track::-webkit-scrollbar { display: none; }

.opt-a-card {
  flex: none;
  height: var(--strip-h, 296px);
  scroll-snap-align: start;

/* ---------- State ---------- */
const isMobileScreen = () => window.innerWidth <= 820;

const qs = typeof location !== "undefined" ? new URLSearchParams(location.search) : null;
const S = {
  scheme: (qs && qs.get("scheme")) || "a",
  scene: (qs && qs.get("scene")) || "portrait4",
  device: (qs && qs.get("device")) || (isMobileScreen() ? "ios" : "both"),
  theme: (qs && qs.get("theme")) || "black",
  idx: 0,
  lb: null
};
if (S.theme !== "black") document.documentElement.dataset.theme = S.theme;

function slidesOf() {
  if (S.scene === "mixed") return MIXED_SLIDES;
  if (S.scene === "long") return LONG_SLIDES;
  if (S.scene === "pair") return PAIR_PORTRAIT;
  return PORTRAIT_FOUR;
}

function pad2(n) { return String(n).padStart(2, "0"); }

function setOpt(k, v) {
  S[k] = v;
  if (k === "theme") document.documentElement.dataset.theme = v;
  if (k === "scene") { S.idx = 0; S.lb = null; }
  render();
}

function pickIdx(i, e) {
  if (e) e.stopPropagation();
  const list = slidesOf();
  S.idx = ((i % list.length) + list.length) % list.length;
  render();
}

function clickStripCard(i, e) {
  if (e) e.stopPropagation();
  if (S.idx === i) {
    openLB(i, e);
  } else {
    S.idx = i;
    render();
  }
}

function openLB(i, e) {
  if (e) e.stopPropagation();
  S.lb = { idx: i, zoomed: false };
  renderLB();
}

function closeLB() {
  S.lb = null;
  renderLB();
}

function stepLB(delta, e) {
  if (e) e.stopPropagation();
  if (!S.lb) return;
  const list = slidesOf();
  S.lb.idx = (S.lb.idx + delta + list.length) % list.length;
  S.lb.zoomed = false;
  renderLB();
}

function toggleZoomLB(e) {
  if (e) e.stopPropagation();
  if (!S.lb) return;
  S.lb.zoomed = !S.lb.zoomed;
  renderLB();
}

window.addEventListener("keydown", (e) => {
  if (S.lb) {
    if (e.key === "Escape") closeLB();
    else if (e.key === "ArrowLeft") stepLB(-1);
    else if (e.key === "ArrowRight") stepLB(1);
    return;
  }
  if (e.key === "ArrowLeft") pickIdx(S.idx - 1);
  else if (e.key === "ArrowRight") pickIdx(S.idx + 1);
});

function renderIndexBar(list, idx) {
  return `
    <div class="idx-bar">
      <div class="idx-chips">
        ${list.map((it, i) => `
          <button class="idx-chip ${i === idx ? "on" : ""}" onclick="pickIdx(${i}, event)" title="${it.caption}">
            <i>${pad2(i + 1)}</i><span>${it.tag}</span>
          </button>
        `).join("")}
      </div>
      <span class="idx-count">${idx + 1} / ${list.length}</span>
    </div>
  `;
}

/* ---------- Render Gallery Component for Platform ('ios' | 'mac') ---------- */
function renderGallery(scheme, platform) {
  const list = slidesOf();
  const n = list.length;
  const idx = Math.min(S.idx, n - 1);
  const cur = list[idx];
  const isIOS = platform === "ios";

  /* Pair Scene (N = 2) */
  if (n === 2) {
    if (scheme === "bug") {
      return `
        <div class="pair-row">

            <div class="pair-bug-card" onclick="openLB(${i}, event)">

    return `

        ${list.map((s, i) => `
          <div class="pair-clean-card ${isIOS ? "ios" : ""}" onclick="openLB(${i}, event)">
            <div class="pair-clean-pic">${renderSlideSVG(s)}</div>

  /* OPTION A: PROPORTIONAL MULTI-UP SNAP STRIP (推荐 1) */
  if (scheme === "a") {
    return `

            <div class="opt-b-list" style="margin-top:5px">
              ${list.map((s, i) => `
                <button class="opt-b-item ${i === idx ? "on" : ""}" onclick="pickIdx(${i}, event)">
                  <i>${pad2(i + 1)}</i><span>${s.tag}</span>
                </button>
              `).join("")}
            </div>
          </div>
          <div class="opt-b-desc">
            ${cur.caption}
            <div><button class="opt-b-open" onclick="openLB(${idx}, event)">点击左图放大查看 (${cur.dim}) ↗</button></div>
          </div>
        </div>
      </div>
    `;
  }

  /* OPTION C: FIT-CONTENT STAGE + NEXT-SLIDE PEEK */
  const nextIdx = (idx + 1) % n;
  const nextSlide = list[nextIdx];
  const isLand = cur.kind === "landscape";
  const isLong = cur.kind === "long";
  return `
    <div class="opt-c ${isIOS ? "ios" : ""}">
      <div class="opt-c-canvas">
        <div class="opt-c-main ${isLand ? "landscape-art" : ""} ${isLong ? "ultra-long" : ""}" onclick="openLB(${idx}, event)">
          <button class="stage-nav prev" onclick="pickIdx(${idx - 1}, event)">${IC.chevL}</button>
          ${renderSlideSVG(cur)}
          ${isLong ? `<div class="long-fade"><span class="long-pill">↕ 长图 · 点击查看全图 (${cur.dim})</span></div>` : ""}
          <button class="stage-nav next" onclick="pickIdx(${idx + 1}, event)">${IC.chevR}</button>
        </div>
        ${!isLand && nextSlide.kind !== "landscape" ? `
          <div class="opt-c-peek ${nextSlide.kind === "long" ? "ultra-long" : ""}" onclick="pickIdx(${nextIdx}, event)" title="点击切换到下一张：${nextSlide.tag}">
            ${renderSlideSVG(nextSlide)}
            <div class="opt-c-peek-tag"><span>${pad2(nextIdx + 1)} ›</span></div>
          </div>
        ` : ""}
      </div>
      ${renderIndexBar(list, idx)}
      <div class="stage-cap">${cur.caption}</div>
    </div>
  `;
}

function renderLB() {
  const root = document.getElementById("lbRoot");
  if (!S.lb) { root.innerHTML = ""; return; }
  const list = slidesOf();
  const idx = S.lb.idx;
  const cur = list[idx];
  const isLand = cur.kind === "landscape";
  root.innerHTML = `
    <div class="slb" onclick="closeLB()">
      <div class="slb-top" onclick="event.stopPropagation()">
        <div></div>
        <div class="slb-center">
          <div class="slb-title">${cur.name}</div>
          <div class="slb-meta">${idx + 1} / ${list.length} · ${cur.dim} · ${cur.size}</div>
        </div>
        <div class="slb-acts">
          <button class="slb-btn" onclick="closeLB()" title="关闭 (Esc)">${IC.x}</button>
        </div>
      </div>
      <div class="slb-stage">
        <button class="slb-nav prev" onclick="stepLB(-1, event)">${IC.chevL}</button>
        <div class="slb-art ${isLand ? "landscape" : ""} ${S.lb.zoomed ? "zoomed" : ""}" onclick="toggleZoomLB(event)">
          ${renderSlideSVG(cur)}
        </div>
        <div class="slb-cap" onclick="event.stopPropagation()">${cur.caption}</div>
        <button class="slb-nav next" onclick="stepLB(1, event)">${IC.chevR}</button>
      </div>
    </div>
  `;
}

function render() {
  const stage = document.getElementById("stage");
  if (S.scheme === "matrix") {
    stage.innerHTML = renderMatrix();
  } else if (S.device === "ios") {
    stage.innerHTML = renderIPhoneFrame(S.scheme);
  } else if (S.device === "mac" || S.device === "mac-split") {
    stage.innerHTML = renderMacFrame(S.scheme);
  } else {
    stage.innerHTML = renderIPhoneFrame(S.scheme) + renderMacFrame(S.scheme);
  }
  document.getElementById("notes").innerHTML = renderNotes();
  document.getElementById("ctl").innerHTML = renderControls();
  renderLB();
}

render();
</script>

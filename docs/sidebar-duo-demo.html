<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sidebar 与大拇指热区 · iPhone Duo 规范优化 Demo v2</title>
<style>
:root {
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
[data-theme="light"] {
  --page: #e7e8ee; --page-fg: #18191f; --page-fg2: #5e606c; --card: #ffffff; --card-bd: rgba(0,0,0,.08);
  --i-bg: #ffffff; --i-menu: #ffffff; --i-bg2: #f2f2f7; --i-vbar: #f4f4f8;
  --i-l1: #000000; --i-l2: rgba(60,60,67,.64); --i-l3: rgba(60,60,67,.36); --i-sep: rgba(0,0,0,.09);
  --i-fill: rgba(118,118,128,.11); --i-fill2: rgba(118,118,128,.18);
  --i-me: #3d5bff; --i-tint: #3d5bff; --i-tint-bg: rgba(61,91,255,.14);
  --i-glass: rgba(252,252,255,.78); --i-glass-hi: rgba(255,255,255,.8); --i-glass-bd: rgba(0,0,0,.09);
  --i-pop: rgba(248,248,252,.90); --scrim: rgba(0,0,0,.22);
  --orange: #ff8c1a; --blue-dot: #3d5bff;
  --warn-bg: rgba(230,90,40,.11); --warn-fg: #c94518; --ok-bg: rgba(32,163,90,.12); --ok-fg: #178245;
}
[data-theme="dark"] {
  --page: #0a0b0f; --page-fg: #ededf2; --page-fg2: #9699a6; --card: #15161c; --card-bd: rgba(255,255,255,.08);
  --i-bg: #000000; --i-menu: #121212; --i-bg2: #1c1c1e; --i-vbar: #08080a;
  --i-l1: #f5f5f7; --i-l2: rgba(235,235,245,.62); --i-l3: rgba(235,235,245,.34); --i-sep: rgba(255,255,255,.11);
  --i-fill: rgba(118,118,128,.24); --i-fill2: rgba(118,118,128,.34);
  --i-me: #4a66ff; --i-tint: #7b93ff; --i-tint-bg: rgba(123,147,255,.22);
  --i-glass: rgba(42,42,48,.76); --i-glass-hi: rgba(255,255,255,.18); --i-glass-bd: rgba(255,255,255,.13);
  --i-pop: rgba(34,34,40,.88); --scrim: rgba(0,0,0,.48);
  --orange: #ff9f2e; --blue-dot: #6f8aff;
  --warn-bg: rgba(255,105,65,.15); --warn-fg: #ff8c6b; --ok-bg: rgba(63,207,134,.14); --ok-fg: #5ce09b;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--page); color: var(--page-fg);
  font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased;
  min-height: 100vh; padding-bottom: 92px;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
svg { display: block; flex: none; }
code { font: 12px var(--mono); background: var(--i-fill); padding: 1px 5px; border-radius: 5px; }

/* ---------- Header ---------- */
.hdr {
  max-width: 1460px; margin: 0 auto; padding: 16px 20px 8px;
  display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
}
.hdr-title { display: flex; flex-direction: column; gap: 3px; }
.hdr-title h1 { font-size: 18px; font-weight: 650; margin: 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.badge { font-size: 11.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--ok-bg); color: var(--ok-fg); }
.hdr-title p { margin: 0; font-size: 12.5px; color: var(--page-fg2); }

.mode-tabs {
  display: inline-flex; flex-wrap: wrap; gap: 3px; padding: 3px;
  background: var(--card); border: 1px solid var(--card-bd); border-radius: 12px;
}
.mode-tabs button {
  padding: 6px 12px; border-radius: 9px; font-size: 12.5px; font-weight: 500;
  color: var(--page-fg2); transition: background .15s, color .15s;
}
.mode-tabs button.on { background: var(--i-me); color: #fff; }

/* ---------- Stage ---------- */
.stage {
  max-width: 1480px; margin: 0 auto; padding: 8px 16px 20px;
  display: flex; flex-direction: column; align-items: center; gap: 22px;
}
.row-stage {
  width: 100%; display: flex; gap: 28px; align-items: flex-start; justify-content: center; flex-wrap: wrap;
}
.dev-col { display: flex; flex-direction: column; align-items: center; gap: 8px; max-width: 100%; }
.dev-tag {
  font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px;
  background: var(--card); border: 1px solid var(--card-bd); color: var(--page-fg2);
}
.dev-tag.good { background: var(--ok-bg); color: var(--ok-fg); border-color: transparent; }
.dev-tag.bad { background: var(--warn-bg); color: var(--warn-fg); border-color: transparent; }
.cap { font-size: 12px; color: var(--page-fg2); text-align: center; max-width: 460px; line-height: 1.55; }

/* ---------- Liquid Glass ---------- */
.iglass {
  background: var(--i-glass);
  backdrop-filter: blur(28px) saturate(1.7); -webkit-backdrop-filter: blur(28px) saturate(1.7);
  box-shadow: inset 0 .75px 0 var(--i-glass-hi), 0 0 0 .5px var(--i-glass-bd), 0 8px 24px rgba(0,0,0,.22);
}
.igb {
  width: 44px; height: 44px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: var(--i-l1); transition: transform .12s, background .15s, color .15s; position: relative;
}
.igb:active { transform: scale(.92); }
.igb.on { background: var(--i-tint-bg); color: var(--i-tint); }

.vcapsule {
  width: 48px; border-radius: 24px; padding: 3px;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.vcapsule .igb { width: 42px; height: 42px; box-shadow: none; background: transparent; backdrop-filter: none; }
.vcapsule .igb.on { background: var(--i-tint-bg); color: var(--i-tint); }
.vcapsule .vsep { width: 22px; height: .5px; background: var(--i-sep); margin: 1px 0; }

.badge-dot {
  position: absolute; top: 8px; right: 8px; width: 7.5px; height: 7.5px; border-radius: 50%;
  box-shadow: 0 0 0 1.5px rgba(18,18,22,.85);
}
[data-theme="light"] .badge-dot { box-shadow: 0 0 0 1.5px rgba(255,255,255,.9); }
.badge-dot.blue { background: var(--blue-dot); }
.badge-dot.orange { background: var(--orange); }

.ic {
  width: 20px; height: 20px; fill: none; stroke: currentColor;
  stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
}

/* ---------- Device Shells ---------- */
.duo-outer {
  width: 448px; height: 648px; border-radius: 46px; padding: 11px;
  background: #1a1b20;
  box-shadow: 0 28px 75px rgba(0,0,0,.45), inset 0 0 0 1.5px #383a44;
  position: relative; user-select: none; flex: none;
}
.duo {
  width: 920px; height: 648px; border-radius: 40px; padding: 11px;
  background: #1a1b20;
  box-shadow: 0 28px 75px rgba(0,0,0,.45), inset 0 0 0 1.5px #383a44;
  position: relative; user-select: none; flex: none;
}
.duo::before {
  content: ""; position: absolute; left: 50%; top: 5px; bottom: 5px; width: 2px; margin-left: -1px;
  background: linear-gradient(to bottom, rgba(255,255,255,.16), rgba(255,255,255,.03) 15%, rgba(255,255,255,.03) 85%, rgba(255,255,255,.16));
  z-index: 90; pointer-events: none;
}
.phone {
  width: 396px; height: 780px; border-radius: 54px; padding: 11px;
  background: #1a1b20;
  box-shadow: 0 28px 75px rgba(0,0,0,.45), inset 0 0 0 1.5px #383a44;
  position: relative; user-select: none; flex: none;
}

.scr {
  position: relative; width: 100%; height: 100%; border-radius: 35px;
  overflow: hidden; background: var(--i-bg); color: var(--i-l1);
  font: 15.5px/1.38 var(--font); letter-spacing: -.15px; display: flex;
}
.duo .scr { border-radius: 30px; }
.phone .scr { border-radius: 44px; display: block; }

/* ---------- Right System Vertical Bar (iPhone Duo) ---------- */
.dvbar {
  flex: none; width: 70px; background: var(--i-vbar); border-left: .5px solid var(--i-sep);
  padding: 15px 0 15px; display: flex; flex-direction: column; align-items: center; gap: 9px;
  z-index: 40; position: relative;
}
.dvbar.menu-bg { background: var(--i-menu); border-left-color: transparent; }
.vclock { font-size: 14.5px; font-weight: 650; letter-spacing: -.2px; font-variant-numeric: tabular-nums; }
.vring {
  width: 42px; height: 42px; border-radius: 50%;
  border: 2.2px solid var(--i-l1); border-bottom-color: transparent;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  position: relative; margin-bottom: 2px;
}
.vring .dots { position: absolute; bottom: -2px; font-size: 8px; letter-spacing: 2px; color: var(--i-l1); }
.vbar-spacer { flex: 1; min-height: 8px; }

/* Thumb Zone Callout Bracket */
.thumb-callout {
  position: absolute; right: 64px; bottom: 18px; pointer-events: none;
  display: flex; flex-direction: column; align-items: flex-end; gap: 4px; z-index: 45;
}
.thumb-pill-hint {
  font-size: 11px; padding: 3px 9px; border-radius: 8px; white-space: nowrap;
  background: rgba(74,102,255,.18); color: #a5b5ff; border: .5px solid rgba(123,147,255,.35);
  backdrop-filter: blur(12px);
}
[data-theme="light"] .thumb-pill-hint { background: rgba(61,91,255,.11); color: #2b47d6; }

/* ---------- Identicon Avatar ---------- */
.identicon {
  width: 34px; height: 34px; border-radius: 50%; overflow: hidden;
  background: #6cc5b8; display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(5, 1fr);
  padding: 4px; gap: 1px; flex: none;
  box-shadow: inset 0 0 0 .5px rgba(255,255,255,.28);
}
.identicon i { background: transparent; border-radius: 1px; }
.identicon i.f { background: #f2f8f7; }

.legacy-avatar-float {
  position: absolute; left: 16px; bottom: 12px; z-index: 30;
  width: 52px; height: 52px; border-radius: 50%; padding: 4px;
  display: flex; align-items: center; justify-content: center;
}
.legacy-avatar-float .identicon { width: 44px; height: 44px; }
.legacy-collide-ring {
  position: absolute; inset: -5px; border-radius: 50%;
  border: 2px dashed #ff6b4a; pointer-events: none;
  animation: pulseWarn 1.8s ease-in-out infinite;
}
@keyframes pulseWarn { 0%,100%{opacity:.9;transform:scale(1)} 50%{opacity:.4;transform:scale(1.06)} }

/* ---------- Sidebar (DrawerView) ---------- */
.drawer-wrap {
  flex: 1; min-width: 0; height: 100%; background: var(--i-menu);
  display: flex; flex-direction: column; position: relative;
}
.drawer-top {
  padding: 14px 16px 8px 22px; display: flex; align-items: center; justify-content: space-between; flex: none;
}
.wordmark { display: flex; align-items: center; gap: 9px; font-size: 21px; font-weight: 700; letter-spacing: -.3px; }
.drawer-scroll {
  flex: 1; min-height: 0; overflow-y: auto; padding: 0 10px 18px;
  scrollbar-width: none;
}
.drawer-scroll::-webkit-scrollbar { display: none; }

.nav-row {
  width: 100%; height: 46px; border-radius: 23px; padding: 0 16px;
  display: flex; align-items: center; gap: 12px; font-size: 16px; color: var(--i-l1);
  margin-bottom: 3px; text-align: left;
}
.nav-row.pill-bg { background: var(--i-fill); }
.nav-row:hover { background: var(--i-fill); }
.nav-row.sel { background: var(--i-fill2); font-weight: 600; }
.nav-row .r-mark { margin-left: auto; width: 8.5px; height: 8.5px; border-radius: 50%; }

.sec-label {
  font-size: 13px; color: var(--i-l2); padding: 6px 16px 2px;
  display: flex; align-items: center; justify-content: space-between;
}
.grp-head {
  width: 100%; padding: 10px 16px 4px; font-size: 13px; color: var(--i-l2);
  display: flex; align-items: center; gap: 5px; text-align: left;
}
.s-row {
  width: 100%; min-height: 44px; padding: 8px 14px; border-radius: 22px;
  display: flex; align-items: center; gap: 11px; text-align: left;
  color: var(--i-l1); font-size: 15.5px; transition: background .12s;
}
.s-row:hover { background: rgba(128,128,140,.10); }
.s-row.sel { background: var(--i-fill); font-weight: 550; }
.s-row .s-title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.s-row.running .s-title {
  background: linear-gradient(90deg, var(--i-l1) 30%, rgba(150,175,255,.45) 50%, var(--i-l1) 70%);
  background-size: 220% 100%;
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  animation: shimmer 3s linear infinite;
}
@keyframes shimmer { 0%{background-position:100% 0} 100%{background-position:-100% 0} }

.ag-logo {
  width: 24px; height: 24px; border-radius: 7px; flex: none;
  display: grid; place-items: center; font-size: 12px; font-weight: 700; position: relative;
}
.ag-logo.gpt { background: #ffffff; color: #111; border: .5px solid rgba(0,0,0,.12); }
.ag-logo.agy { background: #ffffff; color: #2b5cff; border: .5px solid rgba(0,0,0,.12); }
.ag-logo.claude { background: #d97757; color: #fff; }
.ag-logo.orbit::after {
  content: ""; position: absolute; inset: -2.5px; border-radius: 9px;
  border: 1.8px solid transparent; border-top-color: #5b7dff; border-right-color: rgba(91,125,255,.45);
  animation: spin 1.8s linear infinite; pointer-events: none;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Liquid Glass Pull-Up Menu ---------- */
.pop-backdrop { position: absolute; inset: 0; z-index: 65; background: rgba(0,0,0,.08); }
.lg-menu {
  position: absolute; z-index: 70; width: 236px; border-radius: 22px; padding: 6px;
  background: var(--i-pop);
  backdrop-filter: blur(34px) saturate(1.8); -webkit-backdrop-filter: blur(34px) saturate(1.8);
  box-shadow: inset 0 .75px 0 var(--i-glass-hi), 0 0 0 .5px var(--i-glass-bd), 0 18px 48px rgba(0,0,0,.42);
  transform-origin: bottom right;
  animation: popIn .18s cubic-bezier(.2, .9, .3, 1);
}
.lg-menu.origin-bl { transform-origin: bottom left; }
@keyframes popIn { from { opacity: 0; transform: scale(.86) translateY(8px); } to { opacity: 1; transform: scale(1) translateY(0); } }
.lg-sec-hdr {
  padding: 6px 12px 3px; font-size: 11.5px; font-weight: 600; color: var(--i-l2);
  display: flex; align-items: center; justify-content: space-between;
}
.lg-sep { height: .5px; background: var(--i-sep); margin: 5px 10px; }
.lg-item {
  width: 100%; min-height: 39px; padding: 6px 12px; border-radius: 13px;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  font-size: 14.5px; color: var(--i-l1); text-align: left;
}
.lg-item:hover, .lg-item:active { background: var(--i-fill); }
.lg-item .sub { display: block; font-size: 11.5px; color: var(--i-l2); margin-top: 1px; }
.lg-item .ic { width: 18px; height: 18px; color: var(--i-l1); opacity: .88; }

/* ---------- Root Pages ---------- */
.root-page {
  flex: 1; min-width: 0; height: 100%; background: var(--i-bg);
  display: flex; flex-direction: column; position: relative;
}
.page-top { padding: 14px 16px 10px; display: flex; align-items: center; justify-content: center; position: relative; }
.title-cap { padding: 6px 16px; border-radius: 22px; text-align: center; max-width: 240px; }
.title-cap b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.title-cap span { display: block; font-size: 11px; color: var(--i-l2); }
.chat-body { flex: 1; padding: 12px 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.bub-me {
  align-self: flex-end; max-width: 82%; padding: 10px 14px; border-radius: 18px 18px 4px 18px;
  background: var(--i-me); color: #fff; font-size: 14.5px;
}
.bub-ai { font-size: 14.5px; line-height: 1.55; color: var(--i-l1); }
.composer-mock {
  margin: 8px 14px 14px; height: 44px; border-radius: 22px; padding: 0 14px;
  display: flex; align-items: center; justify-content: space-between; color: var(--i-l2); font-size: 14px;
}
.her-hero { display: flex; flex-direction: column; align-items: center; padding-top: 16px; gap: 6px; }
.her-orb {
  width: 64px; height: 64px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #9db4ff, #4a66ff 60%, #25348a);
  box-shadow: 0 8px 26px rgba(74,102,255,.42); display: grid; place-items: center; color: #fff;
}
.ov-cards { padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
.ov-card { padding: 13px 15px; border-radius: 20px; background: var(--i-bg2); display: flex; flex-direction: column; gap: 4px; }

.sheet-modal {
  position: absolute; inset: 18px 10px 0 10px; z-index: 80;
  background: var(--i-bg2); border-radius: 28px 28px 0 0;
  box-shadow: 0 -10px 40px rgba(0,0,0,.5); display: flex; flex-direction: column; overflow: hidden;
  animation: slideUp .22s cubic-bezier(.2,.9,.3,1);
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

/* ---------- Unfolded Duo Left Sidebar / 74pt Rail ---------- */
.beside-side {
  width: 288px; height: 100%; background: var(--i-menu); border-right: .5px solid var(--i-sep);
  display: flex; flex-direction: column; position: relative; flex: none;
}
.beside-rail {
  width: 74px; height: 100%; background: var(--i-menu); border-right: .5px solid var(--i-sep);
  padding: 14px 0 12px; display: flex; flex-direction: column; align-items: center; gap: 6px;
  position: relative; flex: none;
}
.rail-btn {
  width: 48px; height: 48px; border-radius: 14px;
  display: flex; align-items: center; justify-content: center; color: var(--i-l1); position: relative;
}
.rail-btn:hover { background: var(--i-fill); }
.rail-btn.sel { background: var(--i-fill); }
.rail-btn.sel::before {
  content: ""; position: absolute; left: -13px; top: 14px; bottom: 14px; width: 3px;
  border-radius: 2px; background: var(--i-tint);
}
.rail-btn .r-dot { position: absolute; top: 8px; right: 8px; width: 8px; height: 8px; border-radius: 50%; }

/* ---------- Spec Summary Cards ---------- */
.spec-grid {
  width: 100%; max-width: 1320px; display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 16px;
}
.scard { background: var(--card); border: 1px solid var(--card-bd); border-radius: 18px; padding: 16px 18px; }
.scard h3 { margin: 0 0 8px; font-size: 14.5px; font-weight: 650; }
.scard ul { margin: 0; padding-left: 18px; font-size: 13px; color: var(--page-fg2); line-height: 1.65; }
.scard li { margin: 4px 0; }
.scard b { color: var(--page-fg); }

/* ---------- Bottom Control Bar ---------- */
.ctl {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 120;
  background: var(--card); border-top: 1px solid var(--card-bd);
  padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; justify-content: center;
  font-size: 12.5px;
}
.ctl-grp { display: inline-flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.ctl-grp span { color: var(--page-fg2); font-weight: 500; margin-right: 2px; }
.ctl button { padding: 5px 11px; border-radius: 8px; background: var(--i-fill); color: var(--page-fg); font-weight: 500; }
.ctl button.on { background: var(--i-me); color: #fff; }

.toast {
  position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%);
  padding: 7px 14px; border-radius: 99px; font-size: 12.5px; font-weight: 500;
  z-index: 95; white-space: nowrap; pointer-events: none;
}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-title">
    <h1>
      Sidebar 与大拇指热区 · iPhone Duo 规范优化 Demo v2
      <span class="badge">Her & 概览全迁入右下角拇指位 · 左侧纯任务流</span>
    </h1>
    <p>去掉生硬的横向并排胶囊：在 Duo 上把 <b>Her、概览、新建</b> 直接搬到右侧竖栏底部<b>大拇指液态玻璃胶囊</b>，左侧从头到尾纯粹是任务列表（省 ~156pt），<b>头像仅在 Sidebar 打开时显示</b>。</p>
  </div>
  <div class="mode-tabs" id="pose-tabs">
    <button data-pose="compare" class="on">① Duo 外屏：现状 vs 大拇指区方案</button>
    <button data-pose="unfolded">② Duo 展开横放（分屏 + 右下角拇指区 / 左窄栏）</button>
    <button data-pose="iphone">③ 直板 iPhone（保持自然竖排）</button>
  </div>
</header>

<main class="stage" id="stage"></main>

<div class="ctl" id="ctl"></div>

<script>
const S = {
  theme: "dark",
  pose: "compare",          // "compare" | "unfolded" | "iphone"
  duoScreen: "sidebar",     // "sidebar" | "session" | "her" | "overview" | "new"
  newInList: false,         // false: 新建也收进右下角 [新建|Her|概览] (左侧100%纯任务); true: 左侧顶留单行[新建], 右下角 [Her|概览]
  pageNavBar: "tabs",       // "tabs" (普通页右下角常驻 [≡会话|Her|概览], 无头像) | "minimal" (普通页仅右上 ≡)

        ${inSidebar && S.menuOpen ? renderLiquidGlassMenu() : ""}
        ${renderSettingsSheet()}
        ${S.toast ? `<div class="toast iglass">${S.toast}</div>` : ""}
      </div>
    </div>
    <div class="cap">
      ✅ <b>无生硬横排</b>：左侧从上到下全是任务列表（首屏直接看 9～10 条任务！）；右手大拇指在右下角直接点 <b>新建 / Her / 概览 / 头像菜单</b>，进普通页后头像自动收起。
    </div>
  </div>`;
}

/* ========== 3. Unfolded Duo Landscape ========== */
function renderUnfoldedDuo() {
  const cur = [...SESSIONS.pinned, ...SESSIONS.active].find(x => x.id === S.selectedSession) || SESSIONS.active[0];
  const rightThumbMode = S.unfoldedThumb === "right";

  const leftPane = S.railCollapsed
    ? `<nav class="beside-rail">
         <button class="rail-btn" data-togglerail="0" title="展开左侧任务栏">${ic("sidebar")}</button>
         <button class="rail-btn" data-go="new" title="新建任务">${ic("compose")}</button>
         ${!rightThumbMode ? `
           <button class="rail-btn" data-go="her" title="Her">${ic("her")}<span class="r-dot" style="background:var(--blue-dot)"></span></button>
           <button class="rail-btn" data-go="overview" title="概览">${ic("grid")}<span class="r-dot" style="background:var(--orange)"></span></button>
         ` : ""}
         <button class="rail-btn" data-toast="打开搜索" title="搜索">${ic("search")}</button>
         <div style="width:26px;height:1px;background:var(--i-sep);margin:4px 0"></div>
         <button class="rail-btn sel" title="Antigravity · 3 个运行中">${agentLogo("agy", true)}</button>
         <button class="rail-btn" title="Codex">${agentLogo("gpt", false)}</button>
         <div style="flex:1"></div>
         <button class="igb iglass ${S.railMenuOpen ? "on" : ""}" data-togglerailmenu="1" title="左侧常驻栏底部头像菜单">
           ${identiconHtml()}
         </button>
       </nav>`
    : `<aside class="beside-side">
         <div class="drawer-top" style="padding:12px 12px 8px 18px">
           <div class="wordmark" style="font-size:19px">${brandMark()}<span>Hermesh</span></div>
           <button class="igb iglass" style="width:36px;height:36px" data-toast="打开搜索">${ic("search")}</button>
         </div>
         <div class="drawer-scroll" style="padding:0 8px 10px">
           ${!rightThumbMode ? `
             <button class="nav-row pill-bg" data-go="new">${ic("compose")}<span>新建</span></button>
             <button class="nav-row" data-go="her">${ic("her")}<span>Her</span><span class="r-mark" style="background:var(--blue-dot)"></span></button>
             <button class="nav-row" data-go="overview">${ic("grid")}<span>概览</span><span class="r-mark" style="background:var(--orange)"></span></button>
           ` : ""}
           ${renderSessionRows(true, rightThumbMode)}
         </div>
         <div style="padding:8px 14px 12px;border-top:.5px solid var(--i-sep);display:flex;align-items:center;justify-content:space-between">
           <button class="igb iglass ${S.railMenuOpen ? "on" : ""}" data-togglerailmenu="1" title="点击弹出统一液态玻璃菜单">
             ${identiconHtml()}
           </button>
           <button class="igb iglass" data-go="new" title="新建任务">${ic("compose")}</button>
         </div>
       </aside>`;

  return `
  <div class="dev-col">
    <span class="dev-tag good">iPhone Duo 展开横放（内屏分屏 · 可在底部切换 Her/概览放「右手竖栏底」或「左栏竖排」）</span>
    <div class="duo">
      <div class="scr">
        ${leftPane}
        <div class="root-page">
          <div class="page-top" style="justify-content:space-between;padding:12px 18px">
            ${!S.railCollapsed
              ? `<button class="igb iglass" style="width:40px;height:40px" data-togglerail="1" title="收起左侧边栏">${ic("widen")}</button>`
              : `<span style="width:40px"></span>`}
            <div class="title-cap iglass"><b>${cur.title}</b><span>Mac Studio / hermesh</span></div>
            <span style="width:40px"></span>
          </div>
          <div class="chat-body" style="padding:16px 28px">
            <div class="bub-me">展开横放时，如果也把 Her 和概览放在右手大拇指竖栏底部会怎样？</div>
            <div class="bub-ai">
              体验非常统一！无论合上外屏还是展开内屏：<br><br>
              • <b>右手大拇指记忆完全一致</b>：<code>Her / 概览</code> 永远在右下角系统竖栏底部胶囊，开合屏幕肌肉记忆不断裂。<br>
              • <b>左屏彻底变纯任务列表</b>：不再有生硬的横排胶囊，左栏底部保留<b>头像菜单 + 新建</b>（收起成 74pt 窄栏时同样保留新建与头像）。你也可以点底部控制栏对比「展开态左栏保留竖排」。
            </div>
          </div>
          <div class="composer-mock iglass" style="margin:10px 24px 16px"><span>发消息给代理…</span></div>
        </div>
        <aside class="dvbar">
          <div class="vclock">21:20</div>
          <div class="vring">${ic("wifi")}<span class="dots">••••</span></div>
          <button class="igb iglass" data-toast="展开右侧代码文件面板">${ic("sidebar")}</button>
          <button class="igb iglass" data-toast="当前会话更多菜单">${ic("more")}</button>
          <div class="vbar-spacer"></div>
          ${rightThumbMode ? `
            <div class="vcapsule iglass" title="开合一致：右手大拇指常驻 Her / 概览">
              <button class="igb" data-go="her" title="Her">${ic("her")}<span class="badge-dot blue"></span></button>
              <div class="vsep"></div>
              <button class="igb" data-go="overview" title="概览">${ic("grid")}<span class="badge-dot orange"></span></button>
            </div>` : ""}
        </aside>
        ${S.railMenuOpen ? renderLiquidGlassMenu("origin-bl") : ""}
        ${renderSettingsSheet()}
        ${S.toast ? `<div class="toast iglass">${S.toast}</div>` : ""}
      </div>
    </div>
  </div>`;
}

/* ========== 4. Standard Candy-Bar iPhone (Natural Vertical Rows!) ========== */
function renderCandyBarPhone() {
  return `
  <div class="dev-col">
    <span class="dev-tag good">直板 iPhone 竖屏抽屉（屏幕修长：保持自然竖排三行，仅优化底部独立栏 + 头像液态玻璃菜单）</span>
    <div class="phone">
      <div class="scr" style="display:flex">
        <div class="drawer-wrap" style="width:322px;flex:none;border-right:.5px solid var(--i-sep)">
          <div class="drawer-top" style="padding-top:22px">
            <div class="wordmark">${brandMark()}<span>Hermesh</span></div>
            <button class="igb iglass" style="width:40px;height:40px" data-toast="打开搜索">${ic("search")}</button>
          </div>
          <div class="drawer-scroll" style="padding:0 8px 12px">
            <button class="nav-row pill-bg" data-toast="新建任务">${ic("compose")}<span>新建</span></button>
            <button class="nav-row" data-toast="切换到 Her">${ic("her")}<span>Her</span><span class="r-mark" style="background:var(--blue-dot)"></span></button>
            <button class="nav-row" data-toast="切换到概览">${ic("grid")}<span>概览</span><span class="r-mark" style="background:var(--orange)"></span></button>
            ${renderSessionRows(true, false)}
          </div>
          <div style="padding:8px 16px 18px;border-top:.5px solid var(--i-sep);display:flex;align-items:center;justify-content:space-between">
            <button class="igb iglass ${S.ipMenuOpen ? "on" : ""}" data-toggleipmenu="1" title="点击弹出统一液态玻璃菜单（不再压住任务文字）">
              ${identiconHtml()}
            </button>
            <button class="igb iglass" data-toast="新建任务" title="拇指顺手新建">${ic("compose")}</button>
          </div>
        </div>
        <div style="flex:1;background:var(--i-bg2);opacity:.45;padding:28px 10px;font-size:13px;color:var(--i-l2)">
          主页面卡片退后半露
        </div>
        ${S.ipMenuOpen ? renderLiquidGlassMenu("origin-bl") : ""}
        ${renderSettingsSheet()}
        ${S.toast ? `<div class="toast iglass">${S.toast}</div>` : ""}
      </div>
    </div>
  </div>`;
}

function renderSpecSummary() {
  return `
  <div class="spec-grid">
    <div class="scard">
      <h3>1. Duo 右下角大拇指液态玻璃区（告别横向胶囊）</h3>
      <ul>
        <li><b>Sidebar 打开态</b>：左侧彻底变成<b>纯粹的纵向任务列表</b>（立省 ~156pt，首屏展示 9～10 条任务）；右侧竖栏底部（<code>.bottomBar</code>）放竖向胶囊 <b><code>[ 📝 新建 | 🤖 Her | 吅 概览 ]</code> + <code>[ 头像 ]</code></b>，全部落在右手大拇指最顺手的位置。</li>
        <li><b>非 Sidebar 普通页</b>：<b>自动隐藏低频头像</b>，右下角保留 <b><code>[ ≡ 会话 | 🤖 Her | 吅 概览 ]</code></b>，三大高频去处一步秒切。</li>
      </ul>
    </div>
    <div class="scard">
      <h3>2. 头像菜单兜底文字说明 + 全局配对入口</h3>
      <ul>
        <li><b>图标 + 菜单双保险</b>：右下角胶囊用精炼图标省空间，同时<b>点击头像弹出的液态玻璃菜单</b>里保留了带文字和状态副标题的「新建任务 / Her / 概览」+「连接代理 / 添加环境 / 扫码配对」+「设置」。</li>
      </ul>
    </div>
    <div class="scard">
      <h3>3. 因地制宜：Duo 用右竖栏拇指区，直板机保自然竖排</h3>
      <ul>
        <li><b>直板 iPhone</b>（无右侧系统竖栏、纵向屏幕长）：保留最自然的竖排三行，仅将底部头像改为独立底栏（不压任务图标）并统一头像弹出菜单。</li>
        <li><b>Duo 展开横放</b>：支持开合一致（右手竖栏底继续放 <code>[ Her | 概览 ]</code>，左栏纯放任务列表 + 底部头像），并补齐 74pt <code>RailView</code> 的「新建」按钮。</li>
      </ul>
    </div>
  </div>`;
}

function renderControls() {
  if (S.pose === "unfolded") {
    return `
      <div class="ctl-grp">
        <span>展开横放 Her/概览位置：</span>
        <button data-unf="right" class="${S.unfoldedThumb === "right" ? "on" : ""}">推荐：也放右下角大拇指竖栏（开合肌肉记忆一致，左栏纯任务）</button>
        <button data-unf="left" class="${S.unfoldedThumb === "left" ? "on" : ""}">左栏顶部保留竖排三行</button>
      </div>
      <div class="ctl-grp">
        <button data-togglerail="${S.railCollapsed ? "0" : "1"}" class="${S.railCollapsed ? "on" : ""}">↔️ 切换左侧 74pt 窄栏</button>
        <button data-theme-toggle="1">${S.theme === "dark" ? "☀️ 浅色" : "🌙 深色"}</button>
      </div>
    `;
  }
  return `
    <div class="ctl-grp">
      <span>Duo 页面：</span>
      <button data-setscreen="sidebar" class="${S.duoScreen === "sidebar" ? "on" : ""}">Sidebar（露头像）</button>
      <button data-setscreen="session" class="${S.duoScreen === "session" ? "on" : ""}">会话页</button>
      <button data-setscreen="her" class="${S.duoScreen === "her" ? "on" : ""}">Her</button>
      <button data-setscreen="overview" class="${S.duoScreen === "overview" ? "on" : ""}">概览</button>
    </div>
    <div class="ctl-grp">
      <span>「新建」位置：</span>
      <button data-newpos="thumb" class="${!S.newInList ? "on" : ""}">全收进右下角 [ 新建 | Her | 概览 ]（推荐 · 左侧纯任务）</button>
      <button data-newpos="list" class="${S.newInList ? "on" : ""}">左侧留「新建」胶囊 + 右下角 [ Her | 概览 ]</button>
    </div>
    <div class="ctl-grp">
      <span>普通页右栏底：</span>
      <button data-pagenav="tabs" class="${S.pageNavBar === "tabs" ? "on" : ""}">常驻 [ ≡ 会话 | Her | 概览 ]</button>
      <button data-pagenav="minimal" class="${S.pageNavBar === "minimal" ? "on" : ""}">仅保留右上 ≡</button>
    </div>
    <div class="ctl-grp">
      <button data-theme-toggle="1">${S.theme === "dark" ? "☀️ 浅色" : "🌙 深色"}</button>
    </div>
  `;
}

function render() {
  document.documentElement.setAttribute("data-theme", S.theme);
  document.querySelectorAll("#pose-tabs button").forEach(b => {
    b.classList.toggle("on", b.dataset.pose === S.pose);
  });

  const stage = document.getElementById("stage");
  if (S.pose === "compare") {
    stage.innerHTML = `<div class="row-stage">${renderLegacyDuoOuter()}${renderOptimizedDuoOuter()}</div>${renderSpecSummary()}`;
  } else if (S.pose === "unfolded") {
    stage.innerHTML = `<div class="row-stage">${renderUnfoldedDuo()}</div>${renderSpecSummary()}`;
  } else {
    stage.innerHTML = `<div class="row-stage">${renderCandyBarPhone()}</div>${renderSpecSummary()}`;
  }

  document.getElementById("ctl").innerHTML = renderControls();
}

document.addEventListener("click", (e) => {
  const btn = e.target.closest("button, [data-closemenu], [data-closesettings]");
  if (!btn) return;

  if (btn.dataset.pose) {
    S.pose = btn.dataset.pose;
    S.menuOpen = false; S.railMenuOpen = false; S.ipMenuOpen = false;
    render();
  } else if (btn.dataset.togglemenu) {
    S.menuOpen = !S.menuOpen;
    render();
  } else if (btn.dataset.togglerailmenu) {
    S.railMenuOpen = !S.railMenuOpen;
    render();
  } else if (btn.dataset.toggleipmenu) {
    S.ipMenuOpen = !S.ipMenuOpen;
    render();
  } else if (btn.dataset.closemenu) {
    S.menuOpen = false; S.railMenuOpen = false; S.ipMenuOpen = false;
    render();
  } else if (btn.dataset.opensettings) {
    S.menuOpen = false; S.railMenuOpen = false; S.ipMenuOpen = false;
    S.settingsOpen = true;
    render();
  } else if (btn.dataset.closesettings) {
    S.settingsOpen = false;
    render();
  } else if (btn.dataset.go) {
    if (S.pose === "unfolded" && btn.dataset.go !== "sidebar") {
      showToast(`已切换到：${btn.dataset.go === "her" ? "Her" : btn.dataset.go === "overview" ? "概览" : "新建任务"}`);
      S.railMenuOpen = false;
      return;
    }
    S.duoScreen = btn.dataset.go;
    S.menuOpen = false; S.railMenuOpen = false;
    render();
  } else if (btn.dataset.opensess) {
    S.selectedSession = btn.dataset.opensess;
    if (S.pose === "compare") S.duoScreen = "session";
    S.menuOpen = false;
    render();
  } else if (btn.dataset.setscreen) {
    S.pose = "compare";
    S.duoScreen = btn.dataset.setscreen;
    S.menuOpen = false;
    render();
  } else if (btn.dataset.newpos) {
    S.pose = "compare";
    S.duoScreen = "sidebar";
    S.newInList = btn.dataset.newpos === "list";
    render();
  } else if (btn.dataset.pagenav) {
    S.pose = "compare";
    S.pageNavBar = btn.dataset.pagenav;
    if (S.duoScreen === "sidebar") S.duoScreen = "session";
    S.menuOpen = false;
    render();
  } else if (btn.dataset.unf) {
    S.unfoldedThumb = btn.dataset.unf;
    render();
  } else if (btn.dataset.togglerail !== undefined) {
    S.railCollapsed = btn.dataset.togglerail === "1";
    S.railMenuOpen = false;
    render();
  } else if (btn.dataset.themeToggle) {
    S.theme = S.theme === "dark" ? "light" : "dark";
    render();
  } else if (btn.dataset.toast) {
    S.menuOpen = false; S.railMenuOpen = false; S.ipMenuOpen = false;
    showToast(btn.dataset.toast);
  }
});

render();
</script>
</body>
</html>

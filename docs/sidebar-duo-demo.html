<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>iPhone Duo 原生右侧竖栏双态设计 · 没滑出 Sidebar vs 滑出 Sidebar</title>
<style>
:root {
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "PingFang SC", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
[data-theme="dark"] {
  --page: #08090c;
  --page-fg: #f2f2f7;
  --page-fg2: rgba(235,235,245,.62);
  --card: #13141a;
  --card-bd: rgba(255,255,255,.09);

  --i-bg: #050506;
  --i-menu: #070709;
  --i-bg2: #18181c;
  --i-vbar: #050506;
  --i-l1: #ffffff;
  --i-l2: rgba(235,235,245,.62);
  --i-l3: rgba(235,235,245,.34);
  --i-sep: rgba(255,255,255,.10);
  --i-fill: rgba(120,120,132,.22);
  --i-me: #4a66ff;
  --i-tint: #7d96ff;

  /* Calibrated 1:1 to Claude Duo screenshots (08:36 & 08:37) */
  --lg-surface: linear-gradient(180deg, rgba(42,42,46,.88) 0%, rgba(28,28,32,.92) 100%);
  --lg-pill-sel: rgba(14,14,17,.78);
  --lg-rim-hi: rgba(255,255,255,.20);
  --lg-rim-lo: rgba(255,255,255,.07);
  --lg-shadow: 0 8px 22px rgba(0,0,0,.55);
  --lg-menu-bg: rgba(32,32,36,.92);

  --prominent-bg: #f5f5f7;
  --prominent-fg: #0b0b0d;

  --orange: #ff9f2e;
  --blue-dot: #4b8bff;
  --ok-bg: rgba(56,209,130,.15);
  --ok-fg: #5ee39d;
}
[data-theme="light"] {
  --page: #e8eaf0;
  --page-fg: #16171d;
  --page-fg2: rgba(60,60,67,.66);
  --card: #ffffff;
  --card-bd: rgba(0,0,0,.08);

  --i-bg: #ffffff;
  --i-menu: #f6f6f9;
  --i-bg2: #f2f2f7;
  --i-vbar: #f4f4f7;
  --i-l1: #000000;
  --i-l2: rgba(60,60,67,.62);
  --i-l3: rgba(60,60,67,.34);
  --i-sep: rgba(0,0,0,.09);
  --i-fill: rgba(118,118,128,.12);
  --i-me: #3d5bff;
  --i-tint: #3d5bff;

  --lg-surface: linear-gradient(180deg, rgba(255,255,255,.90) 0%, rgba(238,239,245,.88) 100%);
  --lg-pill-sel: rgba(0,0,0,.09);
  --lg-rim-hi: rgba(255,255,255,.96);
  --lg-rim-lo: rgba(0,0,0,.10);
  --lg-shadow: 0 8px 22px rgba(0,0,0,.10);
  --lg-menu-bg: rgba(248,248,252,.94);

  --prominent-bg: #141417;
  --prominent-fg: #ffffff;

  --orange: #f08210;
  --blue-dot: #2f6bff;
  --ok-bg: rgba(32,163,90,.12);
  --ok-fg: #167e43;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--page); color: var(--page-fg);
  font: 14px/1.48 var(--font); -webkit-font-smoothing: antialiased;
  min-height: 100vh; padding-bottom: 36px;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
svg { display: block; flex: none; }
code { font: 12px var(--mono); background: var(--i-fill); padding: 1px 6px; border-radius: 5px; }

/* ---------- Top Header & Controls ---------- */
.hdr {
  max-width: 1320px; margin: 0 auto; padding: 14px 16px 8px;
  display: flex; flex-direction: column; gap: 10px;
}
.hdr-title h1 {
  font-size: 17px; font-weight: 650; margin: 0 0 4px;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.badge { font-size: 11.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--ok-bg); color: var(--ok-fg); }
.hdr-title p { margin: 0; font-size: 12.5px; color: var(--page-fg2); }

.panel-ctl {
  background: var(--card); border: 1px solid var(--card-bd); border-radius: 16px;
  padding: 10px 12px; display: flex; flex-direction: column; gap: 8px;
}
.ctl-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12.5px; }
.ctl-lbl { color: var(--page-fg2); font-weight: 600; min-width: 110px; font-size: 12px; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 5px; }
.seg button {
  padding: 5px 10px; border-radius: 9px; background: var(--i-fill);
  color: var(--page-fg); font-size: 12px; font-weight: 500;
  display: inline-flex; align-items: center; gap: 6px;
  transition: background .14s, color .14s;
}
.seg button.on { background: var(--i-me); color: #fff; }

/* ---------- Stage ---------- */
.stage {
  max-width: 1320px; margin: 0 auto; padding: 10px 12px 16px;
  display: flex; flex-direction: column; align-items: center; gap: 24px;
}
.row-stage {
  width: 100%; display: flex; gap: 26px; align-items: flex-start; justify-content: center; flex-wrap: wrap;
}
.dev-col { display: flex; flex-direction: column; align-items: center; gap: 8px; max-width: 100%; }
.dev-tag {
  font-size: 12px; font-weight: 600; padding: 3.5px 12px; border-radius: 999px;
  background: var(--ok-bg); color: var(--ok-fg); text-align: center;
}
.cap { font-size: 12px; color: var(--page-fg2); text-align: center; max-width: 444px; line-height: 1.55; }

/* ---------- Device Shells ---------- */
.duo-outer {
  width: min(444px, calc(100vw - 24px));
  height: 668px;
  border-radius: 44px; padding: 10px;
  background: #191a1f;
  box-shadow: 0 26px 70px rgba(0,0,0,.52), inset 0 0 0 1.5px #353741;
  position: relative; user-select: none; flex: none;
}
.duo-wide {
  width: min(914px, calc(100vw - 24px));
  height: 636px;
  border-radius: 38px; padding: 10px;
  background: #191a1f;
  box-shadow: 0 26px 70px rgba(0,0,0,.52), inset 0 0 0 1.5px #353741;
  position: relative; user-select: none; overflow-x: auto;
}
.duo-wide::before {
  content: ""; position: absolute; left: 50%; top: 6px; bottom: 6px; width: 2px; margin-left: -1px;
  background: linear-gradient(to bottom, rgba(255,255,255,.16), rgba(255,255,255,.03) 18%, rgba(255,255,255,.03) 82%, rgba(255,255,255,.16));
  z-index: 90; pointer-events: none;
}
.scr {
  position: relative; width: 100%; height: 100%; border-radius: 35px;
  overflow: hidden; background: var(--i-bg); color: var(--i-l1);
  font: 15px/1.36 var(--font); letter-spacing: -.15px; display: flex;
}
.duo-wide .scr { min-width: 760px; border-radius: 29px; }

/* ---------- Native Right Vertical Bar (dvbar) ---------- */
.dvbar {
  flex: none; width: 78px;
  background: var(--i-vbar);
  padding: 16px 0 16px;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  z-index: 40; position: relative;
}
.dvbar.menu-bg { background: var(--i-menu); }

.vmoon { width: 14px; height: 14px; color: var(--i-l1); margin-bottom: -4px; }
.vclock { font-size: 15.5px; font-weight: 700; letter-spacing: -.3px; font-variant-numeric: tabular-nums; margin-bottom: -3px; }
.vring { width: 42px; height: 42px; position: relative; display: grid; place-items: center; margin-bottom: 2px; }
.vring svg.arc { position: absolute; inset: 0; width: 42px; height: 42px; }
.vring .wifi-ic { width: 17px; height: 17px; margin-top: -1px; }
.vring .dots { position: absolute; bottom: 1px; display: flex; gap: 3px; align-items: center; }
.vring .dots i { width: 3.4px; height: 3.4px; border-radius: 50%; background: var(--i-l1); display: block; }
.vring .dots i.dim { opacity: .28; }
.vbar-spacer { flex: 1; min-height: 8px; }

/* ---------- Native Bar Button Items (1:1 Claude Duo Screenshots) ---------- */
/* 1. Single Liquid Glass Circle Button (ToolbarItem + ToolbarSpacer(.fixed)) */
.vbar-circle {
  width: 50px; height: 50px; border-radius: 50%;
  background: var(--lg-surface);
  backdrop-filter: blur(28px) saturate(1.8); -webkit-backdrop-filter: blur(28px) saturate(1.8);
  box-shadow:
    inset 0 1px 0.5px var(--lg-rim-hi),
    inset 0 -0.8px 0.5px var(--lg-rim-lo),
    0 0 0 0.5px rgba(255,255,255,.08),
    var(--lg-shadow);
  display: flex; align-items: center; justify-content: center;
  color: var(--i-l1); position: relative;
  transition: transform .13s cubic-bezier(.2,.9,.3,1), filter .13s;
}
.vbar-circle:active { transform: scale(.92); filter: brightness(1.12); }
.vbar-circle.on {
  box-shadow: inset 0 1px 0.8px rgba(255,255,255,.42), 0 0 0 1.5px var(--i-tint), var(--lg-shadow);
}

/* 2. Prominent Solid White Circle Button (UIBarButtonItemStyleProminent — Bottom New Session in Screenshot 2!) */
.vbar-prominent {
  width: 52px; height: 52px; border-radius: 50%;
  background: var(--prominent-bg);
  color: var(--prominent-fg);
  box-shadow:
    0 10px 26px rgba(0,0,0,.55),
    inset 0 1px 0.5px rgba(255,255,255,.8);
  display: flex; align-items: center; justify-content: center;
  position: relative;
  transition: transform .13s cubic-bezier(.2,.9,.3,1), filter .13s;
}
.vbar-prominent:active { transform: scale(.92); filter: brightness(.92); }

/* 3. Grouped Top-Trailing Toolbar Capsule (like [ 🕒 | ▽ | Q ] in Screenshot 1) */
.vbar-group {
  width: 50px; border-radius: 25px; padding: 4px;
  background: var(--lg-surface);
  backdrop-filter: blur(28px) saturate(1.8); -webkit-backdrop-filter: blur(28px) saturate(1.8);
  box-shadow:
    inset 0 1px 0.5px var(--lg-rim-hi),
    inset 0 -0.8px 0.5px var(--lg-rim-lo),
    0 0 0 0.5px rgba(255,255,255,.08),
    var(--lg-shadow);
  display: flex; flex-direction: column; align-items: center; gap: 3px;
}
.vbar-group button {
  width: 42px; height: 42px; border-radius: 50%;
  display: grid; place-items: center; color: var(--i-l1); position: relative;
}
.vbar-group button:active { background: var(--i-fill); }

/* 4. Native Vertical UITabBar Capsule (Screenshot 1 idle icon capsule -> expands with labels & lens on press/drag!) */
.vbar-tabcapsule {
  width: 52px; border-radius: 26px; padding: 4px;
  background: var(--lg-surface);
  backdrop-filter: blur(32px) saturate(1.9); -webkit-backdrop-filter: blur(32px) saturate(1.9);
  box-shadow:
    inset 0 1.1px 0.6px var(--lg-rim-hi),
    inset 0 -0.9px 0.6px var(--lg-rim-lo),
    0 0 0 0.5px rgba(255,255,255,.09),
    var(--lg-shadow);
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  position: relative; touch-action: none;
  transition: width .18s cubic-bezier(.2,.9,.3,1), border-radius .18s;
}
.vbar-tabcapsule.lens-active {
  width: 68px; border-radius: 34px; padding: 5px 4px;
}
.vtab-btn {
  width: 44px; height: 48px; border-radius: 22px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  color: var(--i-l1); opacity: .78; position: relative; z-index: 2;
  transition: all .16s cubic-bezier(.2,.9,.3,1);
}
.vtab-btn svg { width: 21px; height: 21px; }
.vtab-btn .tlbl {
  display: none; font-size: 10px; font-weight: 600; line-height: 1.05; letter-spacing: -.1px;
}
.vbar-tabcapsule.lens-active .vtab-btn {
  width: 60px; height: 58px; border-radius: 29px;
}
.vbar-tabcapsule.lens-active .vtab-btn .tlbl { display: block; }
.vtab-btn.sel {
  opacity: 1;
  background: var(--lg-pill-sel);
  box-shadow: inset 0 0.5px 0.5px rgba(255,255,255,.10);
}
.vbar-tabcapsule.lens-active .vtab-btn.sel { background: transparent; box-shadow: none; }
.vtab-btn.lens-focus { opacity: 1; transform: scale(1.12); z-index: 6; }

.lg-lens {
  position: absolute; left: -9px; width: 86px; height: 72px; border-radius: 36px;
  pointer-events: none; z-index: 5;
  background: radial-gradient(110% 100% at 50% 24%, rgba(255,255,255,.24) 0%, rgba(255,255,255,.07) 48%, rgba(20,20,25,.30) 100%);
  backdrop-filter: blur(8px) saturate(2.1) brightness(1.12); -webkit-backdrop-filter: blur(8px) saturate(2.1) brightness(1.12);
  box-shadow:
    inset 0 1.6px 1px rgba(255,255,255,.55),
    inset 0 -1.5px 1.2px rgba(255,255,255,.22),
    inset 2.2px 0 2px rgba(255,95,70,.34),
    inset -2.2px 0 2px rgba(65,180,255,.36),
    0 12px 28px rgba(0,0,0,.55);
  transition: top .13s cubic-bezier(.2,.9,.3,1);
}

/* Separate Buttons Stack in Thumb Zone when Sidebar IS Slid Out (Screenshot 2!) */
.vbar-sep-stack {
  display: flex; flex-direction: column; align-items: center; gap: 11px;
}

.dot-badge {
  position: absolute; top: 8px; right: 9px; width: 7.5px; height: 7.5px; border-radius: 50%;
  box-shadow: 0 0 0 1.8px #1d1d22;
}
.dot-badge.orange { background: var(--orange); }
.dot-badge.blue { background: var(--blue-dot); }

/* ---------- Identicon / Avatar Badge ---------- */
.identicon {
  width: 28px; height: 28px; border-radius: 50%;
  background: #6cc9bf;
  display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(5, 1fr);
  padding: 4px; gap: 1px; flex: none;
  box-shadow: inset 0 0 0 .5px rgba(255,255,255,.35);
}
.identicon i { background: transparent; border-radius: 0.7px; }
.identicon i.f { background: #f2f8f7; }

/* ---------- Slid-out Sidebar Content (100% Pure List, Like Claude Screenshot 2!) ---------- */
.drawer-wrap {
  flex: 1; min-width: 0; height: 100%; background: var(--i-menu);
  display: flex; flex-direction: column; position: relative;
}
.drawer-top {
  padding: 20px 16px 12px 22px; display: flex; align-items: center; justify-content: space-between; flex: none;
}
.wordmark { display: flex; align-items: center; gap: 9px; font-size: 22px; font-weight: 700; letter-spacing: -.35px; }
.drawer-scroll {
  flex: 1; min-height: 0; overflow-y: auto; padding: 0 12px 24px; scrollbar-width: none;
}
.drawer-scroll::-webkit-scrollbar { display: none; }

.grp-head {
  width: 100%; padding: 12px 10px 6px; font-size: 13px; color: var(--i-l2); font-weight: 500;
  display: flex; align-items: center; justify-content: space-between; text-align: left;
}
.s-row {
  width: 100%; min-height: 46px; padding: 8px 10px; border-radius: 14px;
  display: flex; align-items: center; gap: 12px; text-align: left;
  color: var(--i-l1); font-size: 15.5px; transition: background .12s;
}
.s-row:hover { background: rgba(255,255,255,.04); }
.s-row.sel { background: var(--i-fill); font-weight: 550; }
.s-title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.s-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--blue-dot); flex: none; }

.ag-logo {
  width: 23px; height: 23px; border-radius: 6.5px; flex: none;
  display: grid; place-items: center; font-size: 11.5px; font-weight: 700; position: relative;
}
.ag-logo.gpt { background: #ffffff; color: #111; }
.ag-logo.agy { background: #f2f4ff; color: #3656f5; }
.ag-logo.claude { background: #d97757; color: #fff; }
.ag-logo.orbit::after {
  content: ""; position: absolute; inset: -2.5px; border-radius: 8.5px;
  border: 1.6px solid var(--i-tint); opacity: .9;
}

/* ---------- Root Pages (When Sidebar is NOT Slid Out) ---------- */
.root-page {
  flex: 1; min-width: 0; height: 100%; background: var(--i-bg);
  display: flex; flex-direction: column; position: relative;
}
.page-top {
  padding: 18px 20px 8px; display: flex; align-items: center; justify-content: space-between; flex: none;
}
.page-serif-title { font-size: 24px; font-weight: 700; letter-spacing: -.4px; }
.title-cap {
  padding: 6px 15px; border-radius: 999px; background: var(--lg-surface);
  box-shadow: inset 0 1px 0.5px var(--lg-rim-hi), 0 4px 14px rgba(0,0,0,.22);
  display: flex; flex-direction: column; align-items: center; max-width: 280px; margin: 0 auto;
}
.title-cap b { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 250px; }
.title-cap span { font-size: 11px; color: var(--i-l2); }

.chat-body {
  flex: 1; min-height: 0; overflow-y: auto; padding: 12px 18px;
  display: flex; flex-direction: column; gap: 11px;
}
.bub-me {
  align-self: flex-end; max-width: 85%; padding: 9px 13px; border-radius: 18px 18px 5px 18px;
  background: var(--i-me); color: #fff; font-size: 14px; line-height: 1.45;
}
.bub-ai {
  align-self: flex-start; max-width: 95%; padding: 11px 14px; border-radius: 16px;
  background: var(--i-bg2); color: var(--i-l1); font-size: 13.5px; line-height: 1.56;
}
.composer-mock {
  margin: 6px 16px 16px; height: 44px; border-radius: 22px; padding: 0 14px;
  background: var(--lg-surface);
  box-shadow: inset 0 1px 0.5px var(--lg-rim-hi), 0 4px 16px rgba(0,0,0,.25);
  display: flex; align-items: center; justify-content: space-between; color: var(--i-l2); font-size: 13.5px;
}

.ov-cards { padding: 8px 18px; display: flex; flex-direction: column; gap: 10px; }
.ov-card {
  padding: 13px 15px; border-radius: 18px; background: var(--i-bg2);
  display: flex; flex-direction: column; gap: 4px; border: .5px solid var(--i-sep);
}

/* ---------- Unfolded Split Sidebar ---------- */
.beside-side {
  width: 296px; flex: none; height: 100%; background: var(--i-menu);
  border-right: .5px solid var(--i-sep);
  display: flex; flex-direction: column; position: relative;
}
.beside-foot {
  padding: 8px 16px 14px; display: flex; align-items: center; justify-content: space-between;
}
.beside-rail {
  width: 72px; flex: none; height: 100%; background: var(--i-menu);
  border-right: .5px solid var(--i-sep);
  padding: 14px 0; display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.rail-btn {
  width: 46px; height: 46px; border-radius: 14px;
  display: grid; place-items: center; color: var(--i-l2); position: relative;
}
.rail-btn:hover { background: var(--i-fill); color: var(--i-l1); }
.rail-btn.sel { background: var(--i-fill); color: var(--i-l1); }

/* ---------- Native Pull-up Menu ---------- */
.pop-backdrop { position: absolute; inset: 0; z-index: 65; background: rgba(0,0,0,.18); }
.ios-menu {
  position: absolute; z-index: 70; width: 232px; border-radius: 22px; overflow: hidden;
  background: var(--lg-menu-bg);
  backdrop-filter: blur(40px) saturate(1.9); -webkit-backdrop-filter: blur(40px) saturate(1.9);
  box-shadow: inset 0 1px 0.5px var(--lg-rim-hi), 0 20px 52px rgba(0,0,0,.58), 0 0 0 0.5px rgba(255,255,255,.12);
  animation: menuPop .16s cubic-bezier(.2,.9,.3,1);
}
@keyframes menuPop {
  from { opacity: 0; transform: scale(.90) translateY(6px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
.ios-menu-item {
  width: 100%; padding: 11px 16px; display: flex; align-items: center; gap: 12px;
  font-size: 14.5px; color: var(--i-l1); text-align: left;
  border-bottom: .5px solid var(--i-sep);
}
.ios-menu-item:last-child { border-bottom: 0; }
.ios-menu-item:active { background: var(--i-fill); }
.ios-menu-item svg { width: 18px; height: 18px; color: var(--i-l1); opacity: .9; }
.ios-menu-sep { height: 7px; background: rgba(0,0,0,.18); border-bottom: .5px solid var(--i-sep); }
.ios-menu-item .sub { display: block; font-size: 11.5px; color: var(--i-l2); margin-top: 1px; line-height: 1.3; }

.toast {
  position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 95;
  padding: 8px 16px; border-radius: 999px; font-size: 12.5px; font-weight: 600;
  background: var(--lg-menu-bg); color: var(--i-l1);
  backdrop-filter: blur(28px); box-shadow: 0 10px 28px rgba(0,0,0,.45), inset 0 1px .5px var(--lg-rim-hi);
  white-space: nowrap; pointer-events: none;
}

.ic { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.85; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-title">
    <h1>
      iPhone Duo 原生右侧竖栏 · 滑出 Sidebar 前后双态设计
      <span class="badge">1:1 对齐 Claude 原生侧栏双态逻辑</span>
    </h1>
    <p>
      全部按钮都在<b>右侧系统原生竖栏</b>，但<b>没滑出 Sidebar</b> 与<b>滑出 Sidebar</b> 完全不同：<br>
      ① <b>没滑出时（左图）</b>：右下角是<b>连体功能胶囊 <code>UITabBar</code></b>（纯功能切换，无 <code>+</code> 创建、无头像）；② <b>滑出 Sidebar 时（右图）</b>：<code>UITabBar</code> 退场，右下角切换为<b>一列独立的原生圆钮</b>（用户头像 + 搜索/入口 + 最底部白底醒目新会话圆钮）！
    </p>
  </div>
  <div class="panel-ctl" id="ctl"></div>
</header>

           <button class="vbar-circle ${S.menuOpenUnfolded ? "on" : ""}" style="width:48px;height:48px" data-togglemenuunfolded="1" title="用户头像（原生液态玻璃）">
             ${identiconHtml()}
           </button>
           <button class="vbar-circle" style="width:48px;height:48px" data-setpage="new" title="新建会话（原生液态玻璃 + 底部边缘模糊）">
             ${ic("plus")}
           </button>
         </div>
       </aside>`;

  return `
  <div class="dev-col">
    <span class="dev-tag">③ Duo 展开内屏横屏（回到常规分栏模式：左栏含 Her/概览行 + 底栏左头像右白底新建；右侧竖栏无底部拇指区！）</span>
    <div class="duo-wide">
      <div class="scr">
        ${leftSide}
        <div class="root-page">
          <div class="page-top" style="padding:14px 18px">
            <span style="width:40px"></span>
            <div class="title-cap"><b>${S.activePage === "new" ? "新会话" : S.activePage === "her" ? "Her" : S.activePage === "overview" ? "概览" : cur.title}</b><span>HomeBook / hermesh</span></div>
            <span style="width:40px"></span>
          </div>
          <div class="chat-body" style="padding:16px 26px">
            <div class="bub-ai">
              <b>展开内屏回到常规分栏交互（对标案例图 08:55）：</b><br>
              • <b>右侧系统竖栏</b>：只保留页面自己的右上工具按钮，<b>右下角完全留空，没有拇指按钮区</b>。<br>
              • <b>左侧 Sidebar</b>：列表顶部回归常规的 <code>🐱 Her</code>、<code>⏲ 概览</code> 导航行，左下角为用户头像，左栏右下角为醒目白底 <code>+</code> 新会话圆钮。
            </div>
          </div>
          <div class="composer-mock" style="margin:10px 22px 16px"><span>发消息给代理…</span></div>
        </div>
        <aside class="dvbar">
          ${statusHeader("08:55")}
          <div class="vbar-group">
            <button data-toast="展开文件与变更侧面板">${ic("sidebar")}</button>
            <button data-toast="会话更多操作">${ic("more")}</button>
          </div>
          <div class="vbar-spacer"></div>
        </aside>
        ${S.menuOpenUnfolded ? renderCleanAccountMenu("left: 16px; bottom: 72px;", "data-closemenuunfolded") : ""}
      </div>
    </div>
  </div>`;
}

function renderControls() {
  return `
    <div class="ctl-row">
      <span class="ctl-lbl">滑出 Sidebar 右下角</span>
      <div class="seg">
        <button data-sbstack="claude3" class="${S.sidebarStack === "claude3" ? "on" : ""}">
          ✨ 方案 1（1:1 对标截图 2）：独立 3 圆钮 [ 头像 · 搜索 · 白底 + 新会话 ]（因外面已有 Her/概览胶囊）
        </button>
        <button data-sbstack="four4" class="${S.sidebarStack === "four4" ? "on" : ""}">
          🔘 方案 2：独立 4 圆钮 [ 头像 · 猫咪 Her · 概览 · 白底 + 新会话 ]（搜索与排序归顶栏）
        </button>
      </div>
    </div>
    <div class="ctl-row">
      <span class="ctl-lbl">页面与外观体验</span>
      <div class="seg">
        <button data-setpage="session" class="${S.activePage === "session" ? "on" : ""}">💬 会话页</button>
        <button data-setpage="her" class="${S.activePage === "her" ? "on" : ""}">🐱 Her 页</button>
        <button data-setpage="overview" class="${S.activePage === "overview" ? "on" : ""}">⏲ 概览页</button>
        <button data-togglerail="${S.railCollapsed ? "0" : "1"}" class="${S.railCollapsed ? "on" : ""}">↔️ 内屏窄栏：${S.railCollapsed ? "已收起（无头像）" : "展开态"}</button>
        <button data-themetoggle="1">${S.theme === "dark" ? "☀️ 浅色" : "🌙 深色"}</button>
      </div>
    </div>
  `;
}

function bindTabLensDrag(domId) {
  const bar = document.getElementById(domId);
  if (!bar) return;
  const items = [...bar.querySelectorAll(".vtab-btn")];
  if (!items.length) return;

  const idxFromClientY = (clientY) => {
    const rect = bar.getBoundingClientRect();
    const relY = clientY - rect.top - 5;
    return Math.max(0, Math.min(items.length - 1, Math.floor(relY / 56)));
  };

  const syncLensDOM = (idx) => {
    let lens = bar.querySelector(".lg-lens");
    if (!lens) {
      lens = document.createElement("div");
      lens.className = "lg-lens";
      bar.prepend(lens);
    }
    bar.classList.add("lens-active");
    lens.style.top = `${5 + idx * 58 - 7}px`;
    items.forEach((it, i) => it.classList.toggle("lens-focus", i === idx));
  };

  bar.addEventListener("pointerdown", (e) => {
    const idx = idxFromClientY(e.clientY);
    S.draggingId = domId;
    S.lensIndex = idx;
    bar.setPointerCapture(e.pointerId);
    syncLensDOM(idx);
  });

  bar.addEventListener("pointermove", (e) => {
    if (S.draggingId !== domId) return;
    const idx = idxFromClientY(e.clientY);
    if (idx !== S.lensIndex) {
      S.lensIndex = idx;
      syncLensDOM(idx);
    }
  });

  const finish = (e) => {
    if (S.draggingId !== domId) return;
    const idx = idxFromClientY(e.clientY);
    S.draggingId = null;
    const target = FEATURE_TABS[idx];
    if (target) S.activePage = target.id;
    render();
  };
  bar.addEventListener("pointerup", finish);
  bar.addEventListener("pointercancel", () => { S.draggingId = null; render(); });
}

function render() {
  document.documentElement.setAttribute("data-theme", S.theme);
  document.getElementById("ctl").innerHTML = renderControls();
  document.getElementById("stage").innerHTML = `
    <div class="row-stage">
      ${renderClosedNotSlid()}
      ${renderClosedSlidOut()}
    </div>
    <div class="row-stage">
      ${renderUnfoldedSplit()}
    </div>`;
  bindTabLensDrag("vtab-page");
  bindTabLensDrag("vtab-unfolded");
}

document.addEventListener("click", (e) => {
  const el = e.target.closest("button, [data-closemenuright], [data-closemenuunfolded]");
  if (!el) return;

  if (el.dataset.sbstack) {
    S.sidebarStack = el.dataset.sbstack;
    render();
  } else if (el.dataset.setpage) {
    S.activePage = el.dataset.setpage;
    S.menuOpenRight = false;
    S.menuOpenUnfolded = false;
    render();
  } else if (el.dataset.opensess) {
    S.selectedSession = el.dataset.opensess;
    S.activePage = "session";
    S.menuOpenRight = false;
    render();
  } else if (el.dataset.togglerail !== undefined) {
    S.railCollapsed = el.dataset.togglerail === "1";
    S.menuOpenUnfolded = false;
    render();
  } else if (el.dataset.themetoggle) {
    S.theme = S.theme === "dark" ? "light" : "dark";
    render();
  } else if (el.dataset.togglemenuright) {
    S.menuOpenRight = !S.menuOpenRight;
    render();
  } else if (el.dataset.closemenuright) {
    S.menuOpenRight = false;
    render();
  } else if (el.dataset.togglemenuunfolded) {
    S.menuOpenUnfolded = !S.menuOpenUnfolded;
    render();
  } else if (el.dataset.closemenuunfolded) {
    S.menuOpenUnfolded = false;
    render();
  } else if (el.dataset.toast) {
    S.menuOpenRight = false;
    S.menuOpenUnfolded = false;
    showToast(el.dataset.toast);
  }
});

render();
</script>
</body>
</html>

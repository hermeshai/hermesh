<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hermesh · 环境中的 Agent Provider</title>
<style>
:root{color-scheme:dark;--canvas:#131416;--side:#1a1b1e;--panel:#202124;--row:#26272b;--line:#36373c;--text:#f1f1f3;--muted:#b0b1b9;--sub:#94969f;--green:#88d5ae;--blue:#a7baff;--gold:#eac38b;--mono:"SFMono-Regular",Consolas,monospace}
*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--text);font:14px/1.5 "Inter",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,input{font:inherit}button{cursor:pointer;color:inherit;background:#35363b;border:1px solid #48494e;border-radius:8px;padding:7px 13px}button:hover:enabled{filter:brightness(1.18)}button:disabled{cursor:default;opacity:.44}button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.shell{max-width:1080px;margin:clamp(16px,7vh,84px) auto 0;border:1px solid #3a3b3f;border-radius:16px;overflow:hidden;background:var(--panel);box-shadow:0 20px 64px #0005}
.titlebar{height:45px;background:#232427;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 18px;gap:7px;color:var(--muted);font-size:12px}.titlebar i{width:10px;height:10px;border-radius:50%;background:#e3877f}.titlebar i:nth-child(2){background:#dcb66f}.titlebar i:nth-child(3){background:#82ba8a}.titlebar span{margin-left:12px}.titlebar small{margin-left:auto;color:var(--sub);font-size:12px}
.layout{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:566px}aside{padding:24px 12px;background:var(--side);border-right:1px solid var(--line)}aside h2{font-weight:550;font-size:12px;color:var(--muted);margin:0 10px 12px}.machine{width:100%;text-align:left;display:flex;align-items:center;gap:11px;padding:10px;margin:2px 0;background:transparent;border:1px solid transparent}.machine[aria-current=true]{background:#303137;border-color:#3e3f46}.machine strong,.machine small{display:block}.machine strong{font-weight:550;font-size:14px}.machine small{font-size:11px;color:var(--sub);margin-top:2px}.device{width:24px;height:24px;display:grid;place-items:center;color:#c6c8d0}.device svg{width:21px;height:21px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green)}.dot.off{background:#888991}.machine .dot{margin-left:auto}
main{padding:27px clamp(18px,4vw,44px) 32px;min-width:0}.crumb{color:var(--sub);font-size:12px}.crumb span{color:#686a73;margin:0 7px}h1{font-size:29px;font-weight:630;letter-spacing:-1px;margin:11px 0 3px}.meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;color:var(--muted);font-size:12px}.meta code{font:12px var(--mono)}.status{color:var(--green)}.offline{color:var(--gold)}h2{font-size:14px;font-weight:570;margin:23px 0 9px}.group{border-radius:11px;border:1px solid var(--line);overflow:hidden;background:var(--row)}.row{display:flex;align-items:center;gap:13px;padding:15px 16px;min-height:67px}.row+.row{border-top:1px solid var(--line)}.logo{height:33px;width:33px;border-radius:9px;background:#f4f4f5;object-fit:contain;padding:6px}.info{min-width:0;flex:1}.info b{font-size:15px;font-weight:570}.info small{display:block;color:var(--muted);font-size:12px;margin-top:2px;overflow-wrap:anywhere}.row button{font-size:12px;font-weight:550;white-space:nowrap}.install,.primary{background:#c6d2ff;color:#161e39;border-color:transparent}.quiet{background:transparent;border-color:#44464d;color:var(--muted)}.notice,.job{margin-top:16px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#292a2f;font-size:13px}.notice{color:var(--gold)}.job header{display:flex;align-items:center;justify-content:space-between}.job b{font-weight:550}.job small{color:var(--muted)}.job progress{width:100%;height:5px;accent-color:var(--blue);display:block;margin:8px 0 4px}.job details{margin-top:7px;color:var(--muted);font-size:12px}summary{cursor:pointer;width:fit-content}ol{padding-left:20px}.foot{color:var(--sub);font-size:12px;margin:12px 2px 0}
.tools{max-width:1080px;margin:13px auto 24px;color:var(--muted);font-size:12px}.tools summary{margin-left:4px}.controls{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:10px 4px}.controls button{font-size:12px}.controls label{display:flex;gap:6px;align-items:center}
dialog{width:min(450px,92vw);background:#27282c;color:var(--text);border:1px solid #45464d;border-radius:14px;padding:24px;box-shadow:0 30px 85px #0008}dialog::backdrop{background:#090a0caa}dialog h2{margin:0;font-size:20px}dialog p{color:var(--muted);font-size:13px}dl{background:#202125;border:1px solid var(--line);border-radius:9px;padding:6px 12px}dl div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:7px 0}dl div+div{border-top:1px solid var(--line)}dt{white-space:nowrap;color:var(--muted);font-size:12px}dd{margin:0;text-align:right;font-size:13px;overflow-wrap:anywhere}dialog footer{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}dialog code{font-family:var(--mono);font-size:12px}.option{display:flex;gap:8px;align-items:center;font-size:13px}input{accent-color:#a2b6ff}.soft{color:var(--blue)}
@media(max-width:1120px){.shell,.tools{margin-left:16px;margin-right:16px}}@media(max-width:720px){.shell{margin:8px}.layout{display:block;min-height:0}aside{padding:10px;border-right:0;border-bottom:1px solid var(--line)}aside h2{margin:0 4px 6px}nav{display:flex;gap:3px}.machine{flex:1;min-width:0;padding:6px;gap:4px}.machine strong{font-size:12px}.machine small{font-size:10px}.machine .device{display:none}.machine .dot{width:5px;height:5px}main{padding:18px 13px 24px}h1{font-size:25px}.row{padding:12px 10px;gap:9px}.tools{margin-left:12px}.meta{gap:5px}.titlebar{height:35px}.row button{padding:6px 9px}}
select{background:#28292d;color:var(--text);font:inherit;border:1px solid var(--line);padding:4px;border-radius:5px}
.job .badge{font-size:12px;color:var(--blue)}.job .badge.warn{color:var(--gold)}.job header{gap:12px}.job code,.events time{font-family:var(--mono)}.phases{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:0;margin:14px 0;list-style:none}.phases li{color:var(--sub);font-size:12px}.phases i{display:block;height:3px;border-radius:4px;background:#46474f;margin-bottom:6px}.phases .complete i{background:var(--green)}.phases .active i{background:var(--blue)}.phases .fault i{background:var(--gold)}.task-detail{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px}.task-detail button{flex:none;font-size:12px}.events{padding:0;list-style:none}.events time{color:var(--sub);padding-right:10px}.events li{margin:4px 0}
[hidden]{display:none!important}
.activity-nav{margin:20px 0 0;border-top:1px solid var(--line);padding-top:13px}.activity-nav button{display:flex;align-items:center;gap:11px;width:100%;padding:9px 12px;background:transparent;border:0;text-align:left;color:var(--muted)}.activity-nav button[aria-current=page]{background:#303137;color:var(--text)}.activity-nav svg{width:19px;height:19px}.activity-nav span{margin-left:auto;color:var(--gold);font:12px var(--mono)}
.row{min-height:76px}.row .menu-action{background:transparent;border:0;color:var(--muted);padding:6px;font-size:18px;line-height:1}.row .phase-link{background:none;border:0;color:var(--blue);padding:5px;font-weight:450}.row .attention{color:var(--gold)}.phase-link:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block;margin-right:6px}.row .info small{font-variant-numeric:tabular-nums}
.history-list{border-top:1px solid var(--line);margin-top:18px}.history-row{display:grid;grid-template-columns:32px minmax(0,1fr) auto 12px;align-items:center;gap:12px;text-align:left;width:100%;padding:14px 2px;background:none;border:0;border-bottom:1px solid var(--line);border-radius:0}.history-row:hover:enabled{background:var(--row)}.history-row strong{display:block;font-size:14px;font-weight:530}.history-row small,.history-row .chevron{color:var(--sub)}.history-row em{font-style:normal;color:var(--muted);font-size:12px}.history-row .attention{color:var(--gold)}.back{border:0;color:var(--blue);padding:4px 0;background:transparent}.job{background:transparent;border:0;border-top:1px solid var(--line);border-radius:0;padding:18px 0}.job header b{font-size:18px}.job .phases{margin:24px 0}.job details{border-top:1px solid var(--line);padding-top:12px;margin-top:18px}.empty{padding:28px 0;color:var(--sub)}
@media(max-width:720px){.activity-nav{margin:7px 0 0;padding:3px 0 0}.activity-nav button{width:auto;padding:4px 6px;font-size:12px}.activity-nav svg{width:15px;height:15px}.row{min-height:72px;gap:7px}.history-row{gap:6px}.row .phase-link{padding:4px}.row .info small{font-size:11px}}
</style>
</head>

const phaseMs = 1400;
function note(job, time, text) { job.events.push({ time, text }); }
function startAttempt(m, job, stage, message) {
  const now = Date.now();
  job.attempt++;
  job.stage = stage;
  job.since = now;
  job.status = 'running';
  job.issue = m.scenario;
  m.scenario = '';
  note(job, now, message);
  note(job, now, messages[stage]);
}
function begin(id, key, op, automatic = false) {
  const m = state.machines[id];
  if (!m.online || live(m)) return;
  const job = { id: crypto.getRandomValues(new Uint32Array(1))[0].toString(16), key, op, automatic, attempt: 0, stage: 0, events: [] };
  m.jobs.unshift(job);
  if (op === 'update' && m.busy) {
    job.status = 'waiting';
    note(job, Date.now(), '等待此机器上的活动会话结束');
  } else {
    startAttempt(m, job, m.needsCheck[key] ? 3 : 0, '目标机器已接收任务');
  }
  save(); render();
}
function advance(m, now) {
  const j = live(m);
  if (j?.status === 'waiting' && !m.busy) {
    startAttempt(m, j, 0, '会话已结束，开始更新');
    return true;
  }
  if (j?.status !== 'running') return false;
  let changed = false;
  while (j.status === 'running') {
    const duration = j.issue === 'timeout' && j.stage === 1 ? 3 * phaseMs : phaseMs;
    const end = j.since + duration;
    if (now < end) break;
    changed = true;
    if (issues[j.issue]?.stage === j.stage) {
      j.status = 'failed';
      note(j, end, issues[j.issue].reason);
    } else if (++j.stage === phases.length) {
      j.status = 'done';
      delete m.needsCheck[j.key];
      note(j, end, '已完成 · 已验证 CLI');
    } else {
      if (j.stage === 3) {
        m[j.key] = targetVersion[j.key];
        m.needsCheck[j.key] = true;
      }
      note(j, end, messages[j.stage]);
    }
    j.since = end;
  }
  return changed;
}
function tick() {
  let changed = false;
  for (const [id, m] of Object.entries(state.machines)) {
    // Keep the last report on disconnect. Catch up once this machine reconnects.
    if (!m.online) continue;
    if (advance(m, Date.now())) changed = true;
    const j = latest(m,'gemini');
    if (m.auto && !m.busy && m.gemini !== targetVersion.gemini &&
        !live(m) && !['failed','cancelled'].includes(j?.status)) {
      begin(id, 'gemini', 'update', true);
    }
  }
  if (changed) { save(); render(); }
}
function statusText(m,j) {
  switch (j.status) {
    case 'waiting': return m.online ? '等待会话结束' : '等待重连';
    case 'running': return m.online ? phases[j.stage] : '等待重连';
    case 'failed': return issues[j.issue].reason;
    case 'cancelled': return '已取消';
    default: return '已完成';
  }
}
function providerRow(id, key) {
  const m = state.machines[id], version = m[key], job = latest(m,key);
  let desc = '', button = '';
  const disabled = !m.online || live(m) ? ' disabled' : '';
  if (key === 'qoder') {
    desc = version ? 'v'+version+' · 待登录 · 厂商管理更新' : id === 'mac' ? '已发现桌面 App，还差命令行工具' : '官方命令行工具';
    if (!version) button = '<button class="install" data-install'+disabled+'>安装 CLI</button>';
  } else if (key === 'gemini') {
    const available = version !== targetVersion[key];
    desc = 'v'+version+' · '+channel(id)+(available?' · 可更新至 v'+targetVersion[key]:' · 已是最新');
    if (m.auto) desc += ' · 空闲时自动更新';
    if (available) button = '<button data-update'+disabled+'>'+(m.busy?'空闲时更新':'更新')+'</button>';
  } else {
    desc = 'v'+version+' · 由 Cursor 管理自动更新';
  }
  if (job && ['waiting','running','failed'].includes(job.status)) {
    const failed = job.status === 'failed';
    const label = job.status === 'running' && m.online ? actionName(job.op)+'中' : failed ? '需要处理' : statusText(m,job);
    if (job.status === 'running' && m.online) desc = (version ? 'v'+version+' · ' : '')+phases[job.stage];
    if (failed) desc = issues[job.issue].reason + (m.needsCheck[key] ? ' · CLI 已写入' : '');
    button = '<button class="phase-link '+(failed?'attention':'')+'" data-job="'+job.id+'">'+label+'</button>';
  }
  const settings = key === 'gemini' ? '<button class="menu-action" data-settings title="更新设置" aria-label="Gemini CLI 更新设置"'+(!m.online?' disabled':'')+'>⋯</button>' : '';
  return '<div class="row" data-provider="'+key+'"><img class="logo" alt="" src="'+logos[key]+'"><div class="info"><b>'+names[key]+'</b><small>'+desc+'</small></div>'+button+settings+'</div>';
}
function taskDetail(id, j) {
  const sys = systems[id], m = state.machines[id];
  const running = j.status === 'running', waiting = j.status === 'waiting';
  const frozen = (running || waiting) && !m.online, failed = j.status === 'failed';
  const badge = statusText(m,j);
  let detail = j.events.at(-1).text, action = '';
  if (frozen) {
    detail = '等待重新连接。最后一次回报：'+j.events.at(-1).text+'。';
  } else if (failed) {
    detail = issues[j.issue].help;
    if (m.online && latest(m,j.key) === j && !live(m) && !(j.op === 'update' && m.busy && j.stage < 3)) {
      action = '<button data-retry>' + (j.stage === 3 ? '重新检测' : '重试') + '</button>';
    }
  } else if (waiting || (running && j.stage < 2)) {
    action = '<button data-cancel>取消任务</button>';
  }
  const bars = phases.map((p,i) => {
    const active = i === j.stage, css = i < j.stage ? 'complete' : active && !waiting && j.status !== 'cancelled' ? (failed?'fault':'active') : '';
    return '<li class="' + css + '"><i></i>' + p + '</li>';
  }).join('');
  const logs = j.events.map(event => '<li><time>'+stamp(event.time)+'</time>'+event.text+'</li>').join('');
  return '<section class="job" aria-label="目标机器任务"><header><b>'+names[j.key]+' · '+(j.automatic?'自动':'')+actionName(j.op)+'</b><span class="badge '+(failed||frozen?'warn':'')+'">'+badge+'</span></header>'+
    '<small>'+sys.name+' · '+sys.user+' · 任务 <code>'+j.id+'</code>'+(j.attempt?' · 第 '+j.attempt+' 次执行':'')+'</small><ol class="phases">'+bars+'</ol>'+
    '<div class="task-detail"><span>'+detail+'</span>'+action+'</div><details '+(logOpen?'open':'')+'><summary>任务记录 · 最后回报 '+stamp(j.events.at(-1).time)+'</summary><ol class="events">'+logs+'</ol></details></section>';
}
function renderActivity() {
  const records = Object.entries(state.machines).flatMap(([id,m]) => m.jobs.map(j => ({id,m,j})));
  records.sort((a,b) => b.j.events[0].time - a.j.events[0].time);
  const count = records.filter(({m,j}) => live(m) === j || (j.status === 'failed' && latest(m,j.key) === j)).length;
  $('#counter').textContent = count || '';
  $('#show-activity').setAttribute('aria-current',view === 'activity' ? 'page' : 'false');
  $('#environment').hidden = view !== 'environment';
  $('#activity').hidden = view !== 'activity';
  if (view !== 'activity') return;
  const selected = records.find(({j}) => j.id === selectedJob);
  if (selected) {
    $('#ledger').innerHTML = '<button class="back" data-back>‹ 所有任务</button>' + taskDetail(selected.id,selected.j);
    return;
  }
  const rows = records.map(({id,m,j}) => '<button class="history-row" data-job="'+j.id+'"><img class="logo" alt="" src="'+logos[j.key]+'"><span><strong>'+names[j.key]+' · '+(j.automatic?'自动':'')+actionName(j.op)+'</strong><small>'+systems[id].name+' · '+stamp(j.events[0].time)+'</small></span><em class="'+(j.status==='failed'?'attention':'')+'">'+statusText(m,j)+'</em><span class="chevron">›</span></button>');
  $('#ledger').innerHTML = rows.length ? '<div class="history-list">'+rows.join('')+'</div>' : '<p class="empty">暂无安装或更新记录</p>';
}
function showActivity(job = '') {
  view = 'activity'; selectedJob = job; logOpen = false; render();
  $('#activity h1').focus({preventScroll:true});
}
function controlsTarget() {
  if (view === 'activity' && selectedJob) {
    return Object.keys(systems).find(id => state.machines[id].jobs.some(job => job.id === selectedJob));
  }
  return state.selected;
}
function render() {
  const id = state.selected, sys = systems[id], m = state.machines[id];
  $('nav').innerHTML = Object.entries(systems).map(([key, s]) => '<button class="machine" data-machine="'+key+'" aria-current="'+(key===id && view==='environment')+'"><span class="device"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">'+icons[key]+'</svg></span><span><strong>'+s.name+'</strong><small>'+s.place+' · '+s.os+'</small></span><i class="dot '+(state.machines[key].online?'':'off')+'"></i></button>').join('');
  $('#crumb').textContent = sys.name;
  $('#meta').innerHTML = '<i class="dot '+(m.online?'':'off')+'"></i><span class="'+(m.online?'status':'offline')+'">'+(m.online?'在线':'离线')+'</span> · '+sys.place+'环境 · <code>'+sys.user+'</code> · '+sys.os+' / '+sys.arch;
  let html = m.online ? '' : '<div class="notice">机器离线，以下是上次检测结果。重新连接后可操作。</div>';
  for (const installed of [true,false]) {
    const keys = Object.keys(names).filter(k => Boolean(m[k] && !(live(m)?.key === k && live(m).op === 'install')) === installed);
    if (keys.length) html += '<section><h2>'+(installed?'已安装':'可安装')+'</h2><div class="group">'+keys.map(k => providerRow(id,k)).join('')+'</div></section>';
  }
  $('#content').innerHTML = html + '<p class="foot">安装与更新由「'+sys.name+'」上的 Hermesh 执行。</p>';
  renderActivity();
  const controlId = controlsTarget(), target = state.machines[controlId];
  $('#connect').textContent = (target.online?'模拟断开':'模拟连接')+'「'+systems[controlId].name+'」';
  $('#busy').checked = target.busy;
  $('#scenario').value = target.scenario;
}
const dialog = $('dialog');
function openSheet(install) {
  const id = state.selected, sys = systems[id], m = state.machines[id];
  const method = install ? (id==='win'?'官方 PowerShell 安装程序':'官方用户级安装脚本') : (id==='mac'?'brew upgrade gemini-cli':'npm install -g @google/gemini-cli@latest');
  const line = (label,value) => '<div><dt>'+label+'</dt><dd>'+value+'</dd></div>';
  $('#sheet').innerHTML = '<h2 id="dialog-title">'+(install?'在「'+sys.name+'」安装 Qoder CLI？':'Gemini CLI 更新设置')+'</h2><dl>'+
    line('执行环境',sys.name+' · '+sys.place)+line('执行账户','<code>'+sys.user+'</code>')+line('安装来源',install?'Qoder 官方':channel(id))+line('执行方式',method)+'</dl>'+
    (install?'':'<label class="option"><input id="auto" type="checkbox" '+(m.auto?'checked':'')+'>此环境空闲时自动更新 Gemini CLI</label>')+
    '<footer><button data-close>取消</button><button class="primary" id="apply">'+(install?'在此机器安装':'保存更新设置')+'</button></footer>';
  $('#apply').onclick = () => {
    dialog.close();
    if (install) begin(id,'qoder','install');
    else { m.auto = $('#auto').checked; save(); render(); tick(); }
  };
  $('[data-close]').onclick = () => dialog.close();
  dialog.showModal();
}
document.addEventListener('click', e => {
  const machine = e.target.closest('[data-machine]');
  if (machine) {
    state.selected = machine.dataset.machine; view = 'environment'; save(); render();
    document.querySelector('[data-machine][aria-current="true"]').focus(); return;
  }
  const item = e.target.closest('[data-job]');
  if (item) { showActivity(item.dataset.job); return; }
  if (e.target.closest('#show-activity,[data-back]')) { showActivity(); return; }
  if (e.target.closest('[data-install]')) openSheet(true);
  if (e.target.closest('[data-update]')) begin(state.selected,'gemini','update');
  if (e.target.closest('[data-settings]')) openSheet(false);
  const control = e.target.closest('[data-retry],[data-cancel]');
  if (!control) return;
  const m = Object.values(state.machines).find(m => m.jobs.some(j => j.id === selectedJob));
  const j = m?.jobs.find(j => j.id === selectedJob);
  if (!j || !m.online) return;
  advance(m,Date.now());
  if (control.hasAttribute('data-retry') && j.status === 'failed' && latest(m,j.key) === j && !live(m) && !(m.busy && j.op === 'update' && j.stage < 3)) {
    startAttempt(m,j,j.stage === 3 ? 3 : 0,j.stage === 3 ? '重新检测已写入的 CLI' : '目标机器已接受重试');
  } else if (control.hasAttribute('data-cancel') && (j.status === 'waiting' || (j.status === 'running' && j.stage < 2))) {
    j.status = 'cancelled';
    note(j,Date.now(),'目标机器已停止任务，安装文件尚未写入');
  }
  save(); render();
});
$('#ledger').addEventListener('toggle', e => { if(e.target.tagName==='DETAILS' && e.target.isConnected) logOpen=e.target.open; }, true);
$('#connect').onclick = () => { const m = state.machines[controlsTarget()]; advance(m,Date.now()); m.online = !m.online; save(); render(); tick(); };
$('#busy').onchange = () => { state.machines[controlsTarget()].busy = $('#busy').checked; save(); render(); tick(); };
$('#scenario').onchange = () => { state.machines[controlsTarget()].scenario = $('#scenario').value; save(); };
$('#reset').onclick = () => { state = initial(); view = 'environment'; selectedJob = ''; logOpen = false; save(); render(); };
render(); tick(); setInterval(tick,250);
</script>
</body>
</html>

<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Her 文件 · 原型</title>
<style>
:root{
  --font-ios:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",system-ui,sans-serif;
  --font-mac:"Google Sans Flex","Google Sans",system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Monaco,monospace;
}
[data-theme=light]{
  --page:#e8eaf0;--page-fg:#1b1c22;--page-fg2:#62646f;--page-card:#fff;--page-bd:rgba(0,0,0,.08);
  /* iPhone (apps/ios Palette) */
  --i-bg:#fff;--i-l1:#000;--i-l2:rgba(60,60,67,.6);--i-l3:rgba(60,60,67,.3);--i-sep:rgba(0,0,0,.08);
  --i-fill:rgba(118,118,128,.12);--i-reply:#f4f4f7;--i-me:#3d5bff;--i-tint:#3d5bff;
  --i-glass:rgba(255,255,255,.78);--i-glass-bd:rgba(0,0,0,.07);--i-sheet:#f2f2f7;--i-pop:rgba(250,250,252,.94);--i-mark:rgba(255,204,0,.24);
  /* Mac (apps/desktop app.css) */
  --win:#fff;--win2:#f4f4f7;--side:#f4f4f7;
  --l1:rgba(0,0,0,.86);--l2:rgba(0,0,0,.54);--l3:rgba(0,0,0,.32);--l4:rgba(0,0,0,.14);
  --sep:rgba(0,0,0,.075);--fill:rgba(0,0,0,.045);--fill2:rgba(0,0,0,.075);
  --accent:#3d5bff;--accent-t:#3d5bff;--accent-bg:rgba(61,91,255,.10);
  --bot-reply:#f4f4f7;--pill:#fff;--pill-bd:rgba(0,0,0,.12);
  --glass:rgba(255,255,255,.86);--glass-sh:0 0 0 .5px rgba(0,0,0,.12),0 4px 14px rgba(0,0,0,.12);
  --shadow-win:0 0 0 .5px rgba(0,0,0,.20),0 24px 70px rgba(10,20,50,.30),0 8px 22px rgba(10,20,50,.14);
  --ka:.12;
}
[data-theme=dark]{
  --page:#0d0e12;--page-fg:#ececf1;--page-fg2:#9a9ca8;--page-card:#1a1b20;--page-bd:rgba(255,255,255,.08);
  --i-bg:#000;--i-l1:#fff;--i-l2:rgba(235,235,245,.6);--i-l3:rgba(235,235,245,.3);--i-sep:rgba(255,255,255,.1);
  --i-fill:rgba(118,118,128,.24);--i-reply:rgba(255,255,255,.06);--i-me:#4f6bff;--i-tint:#6f87ff;
  --i-glass:rgba(44,44,48,.78);--i-glass-bd:rgba(255,255,255,.1);--i-sheet:#1c1c1e;--i-pop:rgba(44,44,48,.95);--i-mark:rgba(255,214,10,.2);
  --win:#1e1e21;--win2:#29292d;--side:#25252a;
  --l1:rgba(255,255,255,.88);--l2:rgba(255,255,255,.55);--l3:rgba(255,255,255,.32);--l4:rgba(255,255,255,.14);
  --sep:rgba(255,255,255,.09);--fill:rgba(255,255,255,.05);--fill2:rgba(255,255,255,.085);
  --accent:#4f6bff;--accent-t:#8ea0ff;--accent-bg:rgba(91,121,255,.18);
  --bot-reply:rgba(255,255,255,.06);--pill:#2b2b30;--pill-bd:rgba(255,255,255,.12);
  --glass:rgba(58,58,64,.9);--glass-sh:0 0 0 .5px rgba(255,255,255,.12),0 4px 14px rgba(0,0,0,.4);
  --shadow-win:0 0 0 .5px rgba(255,255,255,.14),0 24px 70px rgba(0,0,0,.6),0 8px 22px rgba(0,0,0,.35);
  --ka:.22;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--page-fg);font:14px/1.5 var(--font-mac);min-height:100vh;padding-bottom:110px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{display:block}
.top{max-width:1520px;margin:0 auto;padding:20px 24px 4px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.top h1{font-size:19px;margin:0;font-weight:650}
.top span{color:var(--page-fg2);font-size:13px}
.wrap{max-width:1520px;margin:0 auto;padding:10px 24px;display:flex;gap:26px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
#stage{min-width:0;max-width:100%;display:flex;justify-content:center}
.notes{width:372px;max-width:100%;flex:none;background:var(--page-card);border:1px solid var(--page-bd);border-radius:14px;padding:16px 18px;font-size:13px;line-height:1.65}
.notes h3{margin:0 0 6px;font-size:14px}
.notes p{margin:0;color:var(--page-fg2)}
.notes ul,.notes ol{margin:6px 0 0;padding-left:19px}
.notes li{margin:4px 0}
.notes .tag{display:inline-block;font-size:11px;padding:0 7px;border-radius:99px;background:var(--accent-bg);color:var(--accent-t);margin-right:5px;font-weight:600}
.notes .blk{margin-top:14px;padding-top:12px;border-top:1px solid var(--page-bd)}
.notes pre{margin:8px 0 0;padding:8px 10px;border-radius:8px;background:var(--fill);font:11.5px/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;color:var(--page-fg)}
.notes li b{font-weight:600}
.notes li i{font-style:normal;color:var(--page-fg2)}
.ctl{position:fixed;left:0;right:0;bottom:0;background:var(--page-card);border-top:1px solid var(--page-bd);padding:9px 16px;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;font-size:12px;z-index:90}
.ctl .g{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.ctl .g b{color:var(--page-fg2);font-weight:500;margin-right:4px}
.ctl button{padding:3px 10px;border-radius:7px;background:var(--fill2);color:var(--page-fg)}
.ctl button.on{background:var(--accent);color:#fff}
.hide{display:none!important}
.av{border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd6e7,#ff7eb6 40%,#7b61ff 100%);flex:none;display:block}

/* What both platforms share is drawn in these: each sets them to its own palette. */
.scr{--c1:var(--i-l1);--c2:var(--i-l2);--c3:var(--i-l3);--csep:var(--i-sep);--cfill:var(--i-fill);--tint:var(--i-tint);--cbg:var(--i-bg);--cmark:var(--i-mark)}
.mac{--c1:var(--l1);--c2:var(--l2);--c3:var(--l3);--csep:var(--sep);--cfill:var(--fill2);--tint:var(--accent-t);--cbg:var(--win);--cmark:var(--accent-bg)}

/* ---------- a file's icon, by kind ---------- */
.fi{position:relative;flex:none;width:36px;height:44px;border-radius:7px;background:color-mix(in srgb,var(--k) calc(var(--ka)*100%),transparent);display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;font:700 8.5px/1 var(--font-ios);letter-spacing:.3px;color:var(--k);overflow:hidden}
.fi::before{content:"";position:absolute;left:8px;right:8px;top:9px;height:2px;border-radius:1px;background:var(--k);opacity:.42;box-shadow:0 5px 0 var(--k),0 10px 0 var(--k)}
.fi.img{padding:0}.fi.img::before{display:none}
.fi.sm{width:30px;height:36px;border-radius:6px;font-size:6.5px;letter-spacing:0;padding-bottom:4px}
.fi.sm::before{left:7px;right:7px;top:7px;box-shadow:0 4px 0 var(--k),0 8px 0 var(--k)}
.k-doc{--k:#2f6bff}.k-pdf{--k:#e5484d}.k-md{--k:#6b7280}.k-sheet{--k:#1a9d55}.k-slide{--k:#e8830c}.k-code{--k:#8e5bd6}.k-image{--k:#6b7280}
[data-theme=dark] .k-md,[data-theme=dark] .k-image{--k:#a3a8b4}
/* a picture Her made, drawn here in place of the file */
.shot{width:100%;height:100%;display:flex;gap:6%;align-items:flex-end;justify-content:center;padding:16% 10% 12%;background:linear-gradient(160deg,var(--a),var(--b))}
.shot i{flex:1;border-radius:8% 8% 4% 4%;background:rgba(255,255,255,.8);height:58%}
.shot i:nth-child(2){height:80%;background:#fff}
.shot.s1{--a:#c9d6ff;--b:#6f87ff}.shot.s2{--a:#ffe1c4;--b:#ff8f5a}.shot.s3{--a:#c8f1dc;--b:#2fb37a}
.shot.bar{--a:#eef1fb;--b:#dfe4f5;gap:5%}
.shot.bar i{background:#3d5bff;border-radius:6% 6% 0 0;height:34%}
.shot.bar i:nth-child(2){height:52%;background:#3d5bff}.shot.bar i:nth-child(3){height:44%}.shot.bar i:nth-child(4){height:76%}.shot.bar i:nth-child(5){height:92%}

/* ---------- the conversation (both) ---------- */
.row{display:flex}
.row.me{justify-content:flex-end}
.bub{overflow-wrap:anywhere}
.bub .tx{white-space:pre-wrap}
.hblk{display:flex;flex-direction:column;align-items:flex-start;gap:6px;border-radius:14px;transition:background .45s,box-shadow .45s;min-width:0}
.hblk.flash{background:var(--cmark);box-shadow:0 0 0 8px var(--cmark)}
.srcl{display:flex;align-items:center;gap:5px;color:var(--c2);font-size:12.5px;padding:0 4px}
.srcl svg{width:13px;height:13px}
.pics{display:flex;gap:6px;width:100%}
.cpic{flex:1;max-width:190px;aspect-ratio:4/3;border-radius:14px;overflow:hidden;cursor:pointer}
.cfl{border-radius:14px;background:var(--bubble);box-shadow:inset 0 0 0 .5px var(--csep);min-width:230px;max-width:100%;overflow:hidden}
.cf{display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:pointer;min-width:0}
.cf+.cf{border-top:.5px solid var(--csep)}
.cf:hover{background:var(--cfill)}
.cf .k{min-width:0}
.cf b{display:block;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cf .k span{color:var(--c2);font-size:12px}
.q{display:flex;gap:8px;text-align:left;width:calc(100% + 12px);margin:-2px -6px 7px;padding:6px 9px 6px 8px;border-radius:9px;background:rgba(255,255,255,.17);font-size:13px;line-height:1.45;cursor:pointer;color:#fff}
.q::before{content:"";width:2.5px;border-radius:2px;background:rgba(255,255,255,.8);flex:none}
.q b{display:block;font-size:12px;font-weight:600}
.q span{display:block;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.dots{display:flex;gap:4px;padding:5px 0}
.dots i{width:6px;height:6px;border-radius:3px;background:var(--c3);animation:bl 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,60%,100%{opacity:.3}30%{opacity:1}}

/* ---------- the list of what Her delivered (both) ---------- */
.srch{display:flex;align-items:center;gap:6px;border-radius:10px;background:var(--cfill);color:var(--c2);padding:0 9px}
.srch svg{width:15px;height:15px;flex:none}
.srch input{flex:1;min-width:0;border:0;outline:none;background:none;font:inherit;color:var(--c1);user-select:text;-webkit-user-select:text}
.srch input::placeholder{color:var(--c2)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border-radius:99px;background:var(--cfill);color:var(--c1);white-space:nowrap}
.chips button.on{background:var(--c1);color:var(--cbg)}
.gh{display:flex;align-items:baseline;gap:6px;color:var(--c2);font-weight:600}
.gh small{font-weight:400;color:var(--c3)}
.gh .sk{font-weight:400;color:var(--c2);margin-left:auto}
.frow{display:flex;gap:12px;align-items:flex-start;position:relative;cursor:pointer}
.frow.off{opacity:.45}
.fk{flex:1;min-width:0}
.fn{display:flex;align-items:center;font-weight:550;color:var(--c1)}
.fn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fn em{font-style:normal;flex:none}
.nd{flex:none;width:8px;height:8px;border-radius:4px;background:var(--tint);margin-left:7px}
.fs{color:var(--c2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fm{display:flex;align-items:center;gap:6px;color:var(--c2);white-space:nowrap;overflow:hidden}
.chip{display:inline-flex;align-items:center;gap:3px;padding:1px 7px;border-radius:99px;background:var(--cfill);color:var(--c2);flex:none;line-height:1.5}
.chip svg{width:11px;height:11px}
button.chip{color:var(--tint);background:color-mix(in srgb,var(--tint) 12%,transparent);font-weight:550}
button.chip svg{transition:transform .18s}
button.chip.open svg{transform:rotate(180deg)}
.vh{border-left:2px solid var(--csep);display:flex;flex-direction:column;animation:vin .2s ease-out}
@keyframes vin{from{opacity:0;transform:translateY(-4px)}}
.vr{display:flex;flex-direction:column;cursor:pointer;border-radius:8px}
.vr:hover{background:var(--cfill)}
.vr b{font-weight:550;color:var(--c1)}
.vr b small{font-weight:400;color:var(--c2);margin-left:6px}
.vr span{color:var(--c2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid{display:grid;grid-template-columns:repeat(3,1fr)}
.gi{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;cursor:pointer}
.gi .nd{position:absolute;top:7px;right:7px;box-shadow:0 0 0 2px #fff}
.banner{display:flex;gap:8px;align-items:flex-start;border-radius:12px;background:var(--cfill);color:var(--c2);line-height:1.45}
.banner svg{width:16px;height:16px;flex:none;margin-top:1px}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;color:var(--c2);gap:6px}
.empty svg{width:44px;height:44px;color:var(--c3);margin-bottom:6px}
.empty b{color:var(--c1);font-weight:600}

/* ---------- a file, opened (both) ---------- */
.pv{display:flex;flex-direction:column;min-height:0;height:100%}
.pv-top{display:flex;align-items:center;gap:10px;flex:none}
.pv-t{flex:1;min-width:0;text-align:center}
.pv-t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-t span{display:block;color:var(--c2);font-size:12px}
.pv-vers{display:flex;justify-content:center;gap:2px;flex:none;align-self:center;background:var(--cfill);border-radius:9px;padding:2px}
.pv-vers button{padding:3px 12px;border-radius:7px;font-size:12.5px;color:var(--c2)}
.pv-vers button.on{background:var(--cbg);color:var(--c1);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pv-body{flex:1;min-height:0;overflow:auto;user-select:text;-webkit-user-select:text}
.pv-ctx{flex:none;display:flex;flex-direction:column;gap:10px}
.pv-say{display:flex;gap:10px;align-items:flex-start}
.pv-say .k{flex:1;min-width:0}
.pv-say b{display:flex;align-items:center;gap:6px;font-weight:600;font-size:12.5px;color:var(--c2)}
.pv-say span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--c1)}
.pv-btns{display:flex;gap:8px}
.pv-btns button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:11px;background:var(--cfill);font-weight:550}
.pv-btns button.pri{background:var(--tint);color:#fff}
[data-theme=dark] .pv-btns button.pri{background:var(--i-me)}
.pv-btns svg{width:15px;height:15px}
.paper{background:#fff;color:#1b1c22;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.12),0 8px 24px rgba(0,0,0,.08);padding:26px 24px 30px;font:13px/1.7 var(--font-ios);max-width:580px;margin:0 auto}
.paper h1{font-size:19px;margin:0 0 2px}.paper h2{font-size:14.5px;margin:16px 0 4px}.paper p{margin:6px 0}
.paper .sub{color:#6b7280;font-size:12px}
.paper ul{margin:4px 0;padding-left:18px}
.paper table{border-collapse:collapse;width:100%;font-size:12px;margin:8px 0}
.paper td,.paper th{border:1px solid #d9dce3;padding:4px 7px;text-align:left}
.paper th{background:#f3f4f7;font-weight:600}
.paper .sum{background:#eef2ff;border-left:3px solid #3d5bff;padding:8px 12px;border-radius:4px;margin:10px 0}
.paper .sum b{color:#3d5bff}
.xl{background:#fff;color:#1b1c22;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.12),0 8px 24px rgba(0,0,0,.08);overflow:auto;max-width:620px;margin:0 auto}
.xl table{border-collapse:collapse;font:12px/1.5 var(--font-ios);min-width:100%}
.xl td,.xl th{border:1px solid #e1e3e8;padding:4px 10px;white-space:nowrap;text-align:left}
.xl th{background:#f3f4f7;color:#6b7280;font-weight:500;text-align:center}
.xl tr:nth-child(2) td{font-weight:600;background:#eaf6ef}
.xl .tab{padding:6px 10px;font-size:11.5px;color:#1a9d55;font-weight:600;border-top:1px solid #e1e3e8}
.sl{max-width:620px;margin:0 auto}
.sl .big{aspect-ratio:16/9;border-radius:8px;background:linear-gradient(135deg,#161b36,#3d5bff);color:#fff;padding:7% 7% 5%;display:flex;flex-direction:column;box-shadow:0 8px 24px rgba(0,0,0,.14)}
.sl .big small{opacity:.7;font-size:12px}
.sl .big b{font-size:26px;line-height:1.2;margin:4px 0}
.sl .big .bars{flex:1;display:flex;align-items:flex-end;gap:5%;margin-top:6%}
.sl .big .bars i{flex:1;background:rgba(255,255,255,.85);border-radius:4px 4px 0 0}
.sl .strip{display:flex;gap:8px;margin-top:12px}
.sl .strip i{flex:1;aspect-ratio:16/9;border-radius:5px;background:var(--cfill)}
.sl .strip i.on{background:linear-gradient(135deg,#161b36,#3d5bff);box-shadow:0 0 0 2px var(--tint)}
.pmd{max-width:580px;margin:0 auto;color:var(--c1);font-size:15px;line-height:1.62}
.pmd h1{font-size:21px;margin:0 0 8px}.pmd h2{font-size:16px;margin:18px 0 4px}.pmd ul{margin:4px 0;padding-left:20px}.pmd p{margin:6px 0}
.pmd code{font:12.5px var(--mono);background:var(--cfill);padding:1px 5px;border-radius:4px}
.pcode{max-width:620px;margin:0 auto;font:12px/1.65 var(--mono);color:var(--c1);white-space:pre-wrap;overflow-wrap:anywhere}
.pcode div{padding:0 8px;border-radius:3px}
.pcode .add{background:rgba(26,157,85,.16)}.pcode .del{background:rgba(229,72,77,.16)}.pcode .hd{color:var(--c2)}
.pimg{max-width:560px;margin:0 auto;aspect-ratio:4/3;border-radius:12px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.14)}

/* a menu, where it was asked for */
.pop-s{position:absolute;inset:0;z-index:80}
.pop{position:absolute;z-index:81;min-width:190px;border-radius:13px;overflow:hidden;background:var(--i-pop);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);box-shadow:0 10px 40px rgba(0,0,0,.24),0 0 0 .5px var(--csep);animation:mpop .16s cubic-bezier(.2,0,0,1);color:var(--c1)}
@keyframes mpop{from{opacity:0;transform:scale(.9)}}
.pop button{display:flex;align-items:center;gap:11px;width:100%;text-align:left}
.pop button span{flex:1}
.pop svg{width:17px;height:17px;flex:none}
.pop.p-phone button{padding:11px 15px;font-size:16.5px}
.pop.p-phone button+button{border-top:.5px solid var(--csep)}
.pop.p-mac{min-width:170px;border-radius:9px;padding:4px;background:var(--glass);box-shadow:var(--glass-sh),0 10px 30px rgba(0,0,0,.18)}
.pop.p-mac button{padding:5px 9px;border-radius:5px;font-size:13px}
.pop.p-mac button:hover{background:var(--accent);color:#fff}
.pop.p-mac svg{width:14px;height:14px}
.toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);z-index:85;padding:8px 14px;border-radius:99px;background:rgba(30,30,34,.92);color:#fff;font-size:13px;white-space:nowrap;animation:tin .2s ease-out;pointer-events:none}
@keyframes tin{from{opacity:0;transform:translate(-50%,6px)}}
.badge{position:absolute;min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--tint);color:#fff;font:700 11px/17px var(--font-ios);text-align:center;box-shadow:0 0 0 2px var(--cbg)}
[data-theme=dark] .badge{background:var(--i-me)}

/* ================= Mac ================= */
.mac{width:1040px;max-width:100%;height:740px;border-radius:12px;overflow:hidden;box-shadow:var(--shadow-win);display:flex;background:var(--win);color:var(--l1);font:13px/1.45 var(--font-mac);position:relative;--bubble:var(--bot-reply)}
.mside{width:196px;background:var(--side);border-right:.5px solid var(--sep);padding:46px 10px 10px;flex:none;position:relative}
.lights{position:absolute;top:16px;left:16px;display:flex;gap:8px}
.lights i{width:12px;height:12px;border-radius:6px;background:#ff5f57}
.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.mside .it{display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;border-radius:7px}
.mside .it.on{background:var(--fill2);font-weight:550}

}

/* ---------- what Her delivered, from the conversation: one a file, its sends newest first ---------- */
function items() {
  const by = new Map();
  S.msgs.forEach((m, ord) => {
    for (const [name, bytes] of m.files ?? []) {
      const d = by.get(name) ?? { name, ext: ext(name), kind: KIND[ext(name)] ?? "doc", vers: [] };
      d.vers.unshift({ msg: m.id, day: m.day, time: m.time, say: m.say, ask: m.ask, src: m.src, size: bytes, isNew: !!m.isNew, ord });
      by.set(name, d);
    }
  });
  return [...by.values()].sort((a, b) => b.vers[0].ord - a.vers[0].ord);
}
const item = (name) => items().find((d) => d.name === name);
const fresh = () => items().filter((d) => d.vers[0].isNew).length;
function shown() {
  if (S.state === "empty") return [];
  const q = S.q.trim().toLowerCase();
  return items().filter((d) => (S.filter === "all" || d.kind === S.filter) &&
    (!q || (d.name + d.vers.map((v) => v.say + (v.ask ?? "") + (v.src?.[1] ?? "")).join(" ")).toLowerCase().includes(q)));
}
function groups(list) {
  const out = new Map();
  for (const d of list) {
    const v = d.vers[0];
    const key = S.group === "time"
      ? (v.day === 0 ? "今天" : v.day === -1 ? "昨天" : v.day >= -7 ? "过去 7 天" : "更早")
      : (v.src ? v.src[1] : "对话里要的");
    const sub = S.group === "source" && v.src ? (v.src[0] === "routine" ? "定时任务" : "编程会话") : "";
    if (!out.has(key)) out.set(key, { sub, list: [] });
    out.get(key).list.push(d);
  }
  return [...out];
}

/* ---------- conversation ---------- */
function paintConv() {
  const out = [];
  let last = null;
  for (const m of S.msgs) {
    if (m.day !== last) out.push(`<div class="tdiv">${dayLabel(m.day)} ${m.time}</div>`), (last = m.day);
    if (m.ask) {
      const q = m.quote ? `<button class="q" data-jump="${m.quote.msg}"><div><b>Her</b><span>${esc(m.quote.name)}</span></div></button>` : "";
      out.push(`<div class="row me"><div class="bub">${q}<div class="tx">${esc(m.ask)}</div></div></div>`);
    }
    if (m.typing) { out.push(`<div class="row her"><div class="bub"><div class="dots"><i></i><i></i><i></i></div></div></div>`); continue; }
    const files = (m.files ?? []).map(([name]) => item(name));
    const vi = (d) => d.vers.findIndex((v) => v.msg === m.id);
    const pics = files.filter((d) => d.kind === "image"), others = files.filter((d) => d.kind !== "image");
    out.push(`<div class="row her"><div class="hblk" data-id="${m.id}">
      ${m.src ? `<div class="srcl">${m.src[0] === "routine" ? I.clock : I.code}${esc(m.src[1])}</div>` : ""}
      <div class="bub">${esc(m.say)}</div>
      ${pics.length ? `<div class="pics">${pics.map((d) => `<div class="cpic" data-f="${esc(d.name)}" title="${esc(d.name)}">${shot(d.name)}</div>`).join("")}</div>` : ""}
      ${others.length ? `<div class="cfl">${others.map((d) => `<div class="cf" data-f="${esc(d.name)}" data-v="${vi(d)}">${icon(d, true)}<div class="k"><b>${esc(d.name)}</b><span>${size(d.vers[vi(d)].size)}</span></div></div>`).join("")}</div>` : ""}
    </div></div>`);
  }
  $("#mcol").innerHTML = $("#iscroll").innerHTML = out.join("");
}
const toEnd = () => { for (const el of [$("#mconv"), $("#iscroll")]) el.scrollTop = el.scrollHeight; };
function jump(id) {

    if (!el || !box.offsetParent) continue;
    const top = el.getBoundingClientRect().top - box.getBoundingClientRect().top + box.scrollTop;
    box.scrollTo({ top: top - box.clientHeight / 2 + el.offsetHeight / 2, behavior: "smooth" });
    setTimeout(() => el.classList.add("flash"), 300);
    setTimeout(() => el.classList.remove("flash"), 2100);
  }
}
function paintQuote() {
  const q = S.quote, x = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>`;
  const body = q ? `<div class="k"><b>回复 Her</b><span>${esc(q.name)} · ${esc(q.say)}</span></div>` : "";
  $("#mq").innerHTML = q ? `<div class="cq">${body}<button class="x" data-unquote aria-label="取消回复">${x}</button></div>` : "";
  $("#iq").innerHTML = q ? `<div class="iq">${body}<button class="x" data-unquote aria-label="取消回复"><i>${x}</i></button></div>` : "";
  ready();
}
function ready() {
  $("#msend").disabled = $("#min").value.trim() === "";
  $("#isend").disabled = $("#iin").value.trim() === "";
}
function setQuote(q) {
  S.quote = q;
  paintQuote();
  if (q) (S.plat === "mac" ? $("#min") : $("#iin")).focus();
}
/* A reply to a delivery comes back as the same file, a version later: it shows as new at the entry. */
function send(inp) {
  const text = inp.value.trim();
  if (!text) return;
  const q = S.quote, m = { id: "n" + ++S.n, day: 0, time: `14:${S.min++}`, ask: text, quote: q, typing: true };
  S.msgs.push(m);
  $("#min").value = $("#iin").value = "";
  S.quote = null;
  paintConv(); paintQuote(); toEnd();
  setTimeout(() => {
    delete m.typing;
    if (q) {
      const d = item(q.name);
      m.say = `改好了，这是「${q.name}」的第 ${d.vers.length + 1} 版。`;
      m.files = [[q.name, Math.round(d.vers[0].size * 1.04)]];
      m.isNew = true;
    } else m.say = "收到。（演示回复）";
    paint(); toEnd();
  }, 1100);
}

/* ---------- the entry, the list, menus ---------- */
function paintShell() {
  const n = S.open ? 0 : fresh(), badge = n ? `<span class="badge">${n}</span>` : "";
  const files = `<button class="gbtn" data-entry aria-label="文件${n ? `，${n} 份新的` : ""}">${I.tray}${badge}</button>`;
  $("#ihead").innerHTML = `<div class="ihl"><button class="gbtn" aria-label="菜单">${I.menu}</button>${S.entry === "left" ? files : ""}</div>
    <div class="ihr">${S.entry === "right" ? files : ""}<button class="gbtn" aria-label="进度">${I.pulse}</button><button class="gbtn" aria-label="定时任务">${I.clock}</button></div>
    <span class="av iav" style="width:72px;height:72px"></span><div class="itag">Her<i></i><small>2 个在工作</small></div>`;
  $("#mtb").innerHTML = `<button class="tb" title="进度">${I.pulse}</button><button class="tb" title="定时任务">${I.clock}</button><button class="tb ${S.open ? "on" : ""}" data-entry title="文件" aria-pressed="${S.open}">${I.tray}${badge}</button><button class="tb" title="更多">${I.more}</button>`;
  $("#scr").classList.toggle("open", S.open);
  $("#mpanel").classList.toggle("hide", !S.open);
  const label = S.group === "time" ? "按时间" : "按来源";
  $("#igroup").innerHTML = `${I.sort}${label}`;
  $("#mgroup").innerHTML = `${I.sort}${label}`;
}
function paintList() {
  const chips = FILTERS.map(([k, s]) => `<button class="${S.filter === k ? "on" : ""}" data-filter="${k}">${s}</button>`).join("");
  for (const id of ["m", "i"]) {
    $(`#${id}chips`).innerHTML = chips;
    $(`#${id}list`).innerHTML = listHTML();
    if ($(`#${id}search`).value !== S.q) $(`#${id}search`).value = S.q;
  }
}
/* Closing the list is having seen it: nothing in it is new after. */
function setOpen(on) {
  if (S.open && !on) S.msgs.forEach((m) => delete m.isNew);
  S.open = on;
  paintShell();
  paintList();
}
function toast(text) {
  $(".toast")?.remove();
  const el = Object.assign(document.createElement("div"), { className: "toast", textContent: text });
  root().append(el);
  setTimeout(() => el.remove(), 1900);
}
function pop(x, y, items, pick) {
  $("#pop")?.remove();
  const r = root().getBoundingClientRect(), w = Object.assign(document.createElement("div"), { id: "pop" });
  w.innerHTML = `<div class="pop-s"></div><div class="pop p-${S.plat}">${items.map(([k, icn, label, on]) => `<button data-k="${k}">${icn}<span>${label}</span>${on ? I.check : ""}</button>`).join("")}</div>`;
  root().append(w);
  const m = w.lastChild;
  m.style.left = `${Math.max(8, Math.min(x - r.left, r.width - m.offsetWidth - 8))}px`;
  m.style.top = `${Math.max(8, Math.min(y - r.top, r.height - m.offsetHeight - 8))}px`;
  w.onclick = (e) => {
    e.stopPropagation();
    const b = e.target.closest("[data-k]");
    w.remove();
    if (b) pick(b.dataset.k);
  };
}
function rowMenu(name, x, y) {
  const mac = S.plat === "mac";
  pop(x, y, [["open", I.eye, mac ? "打开" : "预览"], ["locate", I.locate, "在对话中查看"], ["reply", I.reply, "回复，让 Her 接着改"], ["share", mac ? I.down : I.share, mac ? "下载" : "分享…"]], (k) => act(k, name, 0));
}
function act(k, name, vi = 0) {
  const d = item(name), v = d?.vers[vi];
  if (k === "open") return openPrev(name, vi);
  if (k === "share") return toast(S.plat === "mac" ? `已存到「下载」：${name}` : "系统的分享面板：存到「文件」、隔空投送、发给别人");
  if (k === "vers") { S.expanded.has(name) ? S.expanded.delete(name) : S.expanded.add(name); return paintList(); }
  S.prev = null;
  paintPrev();
  // The iPhone goes back to the conversation; on the Mac the list stays beside it.
  if (S.plat === "phone") setOpen(false);
  if (k === "locate") setTimeout(() => jump(v.msg), S.plat === "phone" ? 340 : 0);
  if (k === "reply") setQuote({ msg: v.msg, name, say: v.say });
}
document.addEventListener("click", (e) => {
  if (S.held) return void (S.held = false);
  const t = e.target.closest("[data-set],[data-act],[data-f],[data-entry],[data-back],[data-close],[data-filter],[data-jump],[data-unquote]");
  if (!t) return;
  const d = t.dataset;
  if (d.set) return setCtl(d.set);
  if (d.entry !== undefined) return setOpen(!S.open);
  if (d.back !== undefined) return setOpen(false);
  if (d.close !== undefined) { if (t !== e.target && t.classList.contains("mprev")) return; S.prev = null; return paintPrev(); }
  if (d.filter) { S.filter = d.filter; return paintList(); }
  if (d.jump) return jump(d.jump);
  if (d.unquote !== undefined) return setQuote(null);
  const r = t.closest("[data-f]"), name = r ? r.dataset.f : S.prev?.name, vi = r ? +(r.dataset.v ?? 0) : (S.prev?.vi ?? 0);
  if (d.act === "group") {
    const b = t.getBoundingClientRect();
    return pop(b.right - 190, b.bottom + 6, [["time", I.clock, "按时间", S.group === "time"], ["source", I.sort, "按来源", S.group === "source"]], (k) => { S.group = k; paint(); });
  }
  if (d.act?.startsWith("ver:")) return openPrev(S.prev.name, +d.act.slice(4), true);
  act(d.act ?? "open", name, vi);
});
/* Touch and hold a row (or the secondary click): its menu. */
function holdEvents() {
  let timer = null;
  const rowOf = (e) => e.target.closest("#ilist [data-f], #mlist [data-f]");
  document.addEventListener("pointerdown", (e) => {
    const r = rowOf(e);
    if (!r || S.plat !== "phone" || e.button) return;
    timer = setTimeout(() => { S.held = true; rowMenu(r.dataset.f, e.clientX - 40, e.clientY + 10); }, 430);
  });
  for (const ev of ["pointerup", "pointermove", "pointercancel"]) document.addEventListener(ev, (e) => { if (ev !== "pointermove" || Math.abs(e.movementX) + Math.abs(e.movementY) > 4) clearTimeout(timer); });
  document.addEventListener("contextmenu", (e) => {
    const r = rowOf(e);
    if (!r) return;
    e.preventDefault();
    clearTimeout(timer);
    rowMenu(r.dataset.f, e.clientX, e.clientY);
  });
}

/* ---------- notes and controls ---------- */
function record() {
  const p = S.last ?? { name: "Q3 竞品分析.docx", vi: 0 }, d = item(p.name), v = d?.vers[p.vi];
  if (!v) return "";
  const src = v.src ? `{ "kind": "${v.src[0]}", "name": "${v.src[1]}" }` : `{ "kind": "chat" }`;
  return `{
  "name": "${d.name}",
  "path": "~/.her/bots/her/files/${d.name}",
  "size": ${v.size},
  "sent_at": "2026-11-${16 + v.day}T${v.time}",
  "message": "${v.msg}",        // 哪一次 send_to_user
  "text": "${v.say}",
  "source": ${src},
  "snapshot": "~/.her/bots/her/sent/${(v.ord * 2654435761 >>> 0).toString(16)}…/${d.name}"  // 发出那一刻的副本
}`;
}
function paintNotes() {
  const mac = S.plat === "mac";
  const points = mac
    ? ["顶栏右侧多一个「文件」按钮，和「定时任务」一样在对话旁边开一栏（340pt），不离开对话", "悬停一行：在对话中查看 / 回复 / 下载；右键是同一组菜单", "点一行在窗口里打开预览（沿用现在的 FilePreview），底部是 Her 交付时说的话", "有新文件而这一栏没开着时，按钮上是数字"]
    : ["Her 页顶部多一个「文件」按钮，推入一页；有新文件时带数字", "一行三层：文件名 → Her 交付时说的那句话 → 时间、大小、来源、版本", "点开是预览（沿用 Quick Look 和 HerFilePage），底部一张卡：Her 的话 +「在对话中查看」「回复」", "长按一行：预览 / 在对话中查看 / 回复 / 分享"];
  const tryIt = [mac ? "点顶栏右侧带数字的托盘按钮" : "点左上角带数字的托盘按钮", "点「Q3 竞品分析」那行的「3 个版本」，再分别点开第 1、2、3 版", "点「在对话中查看」，看它回到那条消息并高亮", "点「回复」，写一句话发出去：Her 交回第 4 版，入口上出现数字", "搜「晨报」或「定价」；切到「图片」；右上角改成「按来源」", "底部把「状态」切到「离线」和「空」"];
  const ask = [
    ["收什么", "只收 Her 用 send_to_user 发给你的文件。<i>定时任务和子代理只能发文字，它们的文件由 Her 转交时进来；她工作目录里没发出来的中间文件不算；你发给她的文件不收。</i>"],
    ["同名文件", "同一路径再发一次算新版本，叠成一行。<i>Her 在发出时存一份副本（bots/&lt;id&gt;/sent/），旧版本和旧消息里的附件都按当时的内容打开。</i>"],
    ["iPhone 入口", "左边菜单按钮旁（左二右二）。<i>右边放三个会碰到头像，底部「入口」可以切过去看。</i>"],
    ["叫什么", "「文件」。<i>代码和协议里叫 deliveries，因为 files/* 已经是文件面板的请求。</i>"],
    ["大文件和清理", "超过 100 MB 的不存副本；旧版本这一版全留，在控制台的存储页显示占用。"],
    ["新的标记何时消", "关掉这一页（栏）就算看过。<i>和对话的未读分开计。</i>"],
  ];
  $("#notes").innerHTML = `<h3>${mac ? "Mac" : "iPhone"} · 文件</h3>
    <p>和聊天软件的「聊天文件」相比多三样：每份带着 Her 交付时说的话、同一份文件的多次修改叠成版本、能直接回复让她接着改。</p>
    <ul>${points.map((s) => `<li>${s}</li>`).join("")}</ul>
    <div class="blk"><h3>试试看</h3><ol>${tryIt.map((s) => `<li>${s}</li>`).join("")}</ol></div>
    <div class="blk"><h3>已经定的</h3><ol>${ask.map(([a, b]) => `<li><b>${a}：</b>${b}</li>`).join("")}</ol></div>
    <div class="blk"><h3>一条交付记录</h3><p>Her Server 在 send_to_user 送达时记一条（her.db），列表从这里读，不从对话里现扫：设备只留最近 100 条消息，清空对话后文件也还在。下面是你上一份点开的：</p><pre>${esc(record())}</pre></div>`;
}
function paintCtl() {
  const g = (label, key, opts) => `<div class="g"><b>${label}</b>${opts.map(([v, s]) => `<button class="${S[key] === v ? "on" : ""}" data-set="${key}:${v}">${s}</button>`).join("")}</div>`;
  $("#ctl").innerHTML = g("平台", "plat", [["phone", "iPhone"], ["mac", "Mac"]]) + g("入口（iPhone）", "entry", [["left", "菜单旁"], ["right", "右上三个"]]) +
    g("分组", "group", [["time", "按时间"], ["source", "按来源"]]) + g("状态", "state", [["ok", "正常"], ["offline", "离线"], ["empty", "空"]]) +
    g("外观", "theme", [["light", "浅色"], ["dark", "深色"]]) + `<div class="g"><button data-set="reset:1">重置</button></div>`;
}
function setCtl(s) {
  const [k, v] = s.split(":");
  if (k === "reset") reset(); else S[k] = v;
  if (k === "plat") S.prev = null;
  paint();
  if (k === "reset" || k === "plat") toEnd();
}
function paint() {
  document.documentElement.dataset.theme = S.theme;
  $("#mac").classList.toggle("hide", S.plat !== "mac");
  $("#phone").classList.toggle("hide", S.plat !== "phone");
  $("#pop")?.remove();
  paintConv(); paintShell(); paintList(); paintPrev(); paintQuote(); paintNotes(); paintCtl();
}
const want = new URLSearchParams(location.search);
reset(); build();
for (const k of ["plat", "theme", "entry", "group", "state", "filter"]) if (want.get(k)) S[k] = want.get(k);
S.open = want.get("open") === "1";
paint(); toEnd();
if (want.get("file")) openPrev(want.get("file"), +(want.get("v") ?? 0));
</script>
</body>

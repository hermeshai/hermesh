<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>会话文件侧面板 · iPhone Duo 规范改进版 Demo</title>
<style>
:root {
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
[data-theme="light"] {
  --page: #e7e8ee; --page-fg: #18191f; --page-fg2: #5e606c; --card: #ffffff; --card-bd: rgba(0,0,0,.08);
  --i-bg: #ffffff; --i-bg2: #f2f2f7; --i-rail: #f0f0f5; --i-vbar: #ececf2;
  --i-l1: #000000; --i-l2: rgba(60,60,67,.64); --i-l3: rgba(60,60,67,.34); --i-sep: rgba(0,0,0,.09);
  --i-fill: rgba(118,118,128,.10); --i-fill2: rgba(118,118,128,.18);
  --i-me: #3d5bff; --i-tint: #3d5bff; --i-tint-bg: rgba(61,91,255,.14);
  --i-glass: rgba(252,252,255,.78); --i-glass-hi: rgba(255,255,255,.65); --i-glass-bd: rgba(0,0,0,.09);
  --i-pop: rgba(250,250,253,.94); --scrim: rgba(0,0,0,.20);
  --target: rgba(214,162,0,.18); --target-bd: #d6a200;
  --syn-k: #1b36d9; --syn-s: #087f78; --syn-c: #686d7a; --syn-f: #7543ba; --syn-p: #1a5ce6; --syn-v: #b44b18;
  --warn-bg: rgba(230,90,40,.10); --warn-fg: #c94518; --ok-bg: rgba(32,163,90,.11); --ok-fg: #188648;
}
[data-theme="dark"] {
  --page: #0b0c10; --page-fg: #ededf2; --page-fg2: #9699a6; --card: #16171d; --card-bd: rgba(255,255,255,.08);
  --i-bg: #000000; --i-bg2: #161618; --i-rail: #08080a; --i-vbar: #050507;
  --i-l1: #f5f5f7; --i-l2: rgba(235,235,245,.62); --i-l3: rgba(235,235,245,.32); --i-sep: rgba(255,255,255,.11);
  --i-fill: rgba(118,118,128,.22); --i-fill2: rgba(118,118,128,.34);
  --i-me: #4a66ff; --i-tint: #7b93ff; --i-tint-bg: rgba(123,147,255,.20);
  --i-glass: rgba(38,38,43,.76); --i-glass-hi: rgba(255,255,255,.14); --i-glass-bd: rgba(255,255,255,.13);
  --i-pop: rgba(36,36,41,.95); --scrim: rgba(0,0,0,.46);
  --target: rgba(212,172,42,.20); --target-bd: #d4ac2a;
  --syn-k: #7ab0ff; --syn-s: #62d2be; --syn-c: #8e96a8; --syn-f: #c39bff; --syn-p: #8ec4ff; --syn-v: #f3a971;
  --warn-bg: rgba(255,105,65,.14); --warn-fg: #ff8c6b; --ok-bg: rgba(63,207,134,.14); --ok-fg: #5ce09b;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--page); color: var(--page-fg);
  font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased;
  min-height: 100vh; padding-bottom: 84px;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
svg { display: block; flex: none; }
code { font: 12px var(--mono); background: var(--i-fill); padding: 1px 5px; border-radius: 5px; }

/* ---------- Header & Top Switcher ---------- */
.hdr {
  max-width: 1480px; margin: 0 auto; padding: 16px 20px 8px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
}
.hdr-title { display: flex; flex-direction: column; gap: 2px; }
.hdr-title h1 { font-size: 18px; font-weight: 650; margin: 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.badge { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--ok-bg); color: var(--ok-fg); }
.badge.warn { background: var(--warn-bg); color: var(--warn-fg); }
.hdr-title p { margin: 0; font-size: 12.5px; color: var(--page-fg2); }

.mode-tabs {
  display: inline-flex; flex-wrap: wrap; gap: 3px; padding: 3px;
  background: var(--card); border: 1px solid var(--card-bd); border-radius: 12px;
}
.mode-tabs button {
  padding: 5px 11px; border-radius: 9px; font-size: 12.5px; font-weight: 500;
  color: var(--page-fg2); transition: background .15s, color .15s;
}
.mode-tabs button.on { background: var(--i-me); color: #fff; }

/* ---------- Stage & Responsive Scaler ---------- */
.stage {
  max-width: 1520px; margin: 0 auto; padding: 10px 16px 18px;
  display: flex; flex-direction: column; align-items: center; gap: 22px;
}
.row-stage {
  width: 100%; display: flex; gap: 24px; align-items: flex-start; justify-content: center; flex-wrap: wrap;
}
.fit-box {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  max-width: 100%; overflow: hidden;
}
.fit-inner { transform-origin: top center; display: flex; justify-content: center; }
.cap { font-size: 12px; color: var(--page-fg2); text-align: center; }

/* ---------- Icon helper ---------- */
.ic {
  width: 20px; height: 20px; fill: none; stroke: currentColor;
  stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round;
}

/* ---------- Liquid Glass Primitives ---------- */
.iglass {
  background: var(--i-glass);
  backdrop-filter: blur(26px) saturate(1.6); -webkit-backdrop-filter: blur(26px) saturate(1.6);
  box-shadow: inset 0 .5px 0 var(--i-glass-hi), 0 0 0 .5px var(--i-glass-bd), 0 6px 20px rgba(0,0,0,.16);
}
.igb {
  width: 42px; height: 42px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: var(--i-l1); transition: transform .12s, background .15s, color .15s; position: relative;
}
.igb:active { transform: scale(.93); }
.igb.on { background: var(--i-tint-bg); color: var(--i-tint); }
.igb.solid-on { background: var(--i-me); color: #fff; }

/* Vertical Liquid Glass Capsule (iPhone Duo Side Controls) */
.vcapsule {
  width: 46px; border-radius: 23px; padding: 3px;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.vcapsule .igb { width: 40px; height: 40px; box-shadow: none; background: transparent; backdrop-filter: none; }
.vcapsule .igb.on { background: var(--i-tint-bg); color: var(--i-tint); }
.vcapsule .vsep { width: 22px; height: .5px; background: var(--i-sep); margin: 1px 0; }

/* Horizontal Liquid Glass Capsule */
.hcapsule {
  height: 38px; border-radius: 19px; padding: 2px;
  display: inline-flex; align-items: center; gap: 2px;
}
.hcapsule .igb { width: 34px; height: 34px; box-shadow: none; background: transparent; backdrop-filter: none; }
.hcapsule .igb .ic { width: 17px; height: 17px; }
.hcapsule .igb.on { background: var(--i-tint-bg); color: var(--i-tint); }

/* ---------- Device Shells ---------- */
/* 1. iPhone Duo Open Landscape (Real aspect ~4:3 book unfolded: 920 x 656) */
.duo {
  width: 920px; height: 656px; border-radius: 38px; padding: 11px;
  background: #1a1b1f;
  box-shadow: 0 28px 75px rgba(0,0,0,.42), inset 0 0 0 1.5px #383a42;
  position: relative; user-select: none; flex: none;
}
/* Physical center hinge seam */
.duo::before {
  content: ""; position: absolute; left: 50%; top: 4px; bottom: 4px; width: 2px; margin-left: -1px;
  background: linear-gradient(to bottom, rgba(255,255,255,.16), rgba(255,255,255,.03) 14%, rgba(255,255,255,.03) 86%, rgba(255,255,255,.16));
  z-index: 96; pointer-events: none;
}
.duo .hinge-tag {
  position: absolute; top: -9px; left: 50%; transform: translateX(-50%);
  font-size: 10px; padding: 1px 7px; border-radius: 99px;
  background: #282a33; color: #a8acb8; border: .5px solid rgba(255,255,255,.14);
  z-index: 97; pointer-events: none; white-space: nowrap;
}
.scr {
  position: relative; width: 100%; height: 100%; border-radius: 28px;
  overflow: hidden; background: var(--i-bg); color: var(--i-l1);
  font: 15.5px/1.4 var(--font); letter-spacing: -.12px; display: flex;
}

/* 2. iPhone Duo Closed (Outer Display: wider & shorter aspect ~436 x 640, bars on right side!) */
.duo-outer {
  width: 448px; height: 648px; border-radius: 44px; padding: 11px;
  background: #1a1b1f;
  box-shadow: 0 28px 75px rgba(0,0,0,.42), inset 0 0 0 1.5px #383a42;
  position: relative; user-select: none; flex: none;
}
.duo-outer .scr { border-radius: 34px; }

/* 3. Standard Candy-bar iPhone (402 x 856) */
.phone {
  width: 406px; height: 850px; border-radius: 56px; padding: 11px;
  background: #1a1b1f;
  box-shadow: 0 28px 75px rgba(0,0,0,.42), inset 0 0 0 1.5px #383a42;
  position: relative; user-select: none; flex: none;
}
.phone .scr { border-radius: 46px; display: block; }
.island-top {
  position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
  width: 118px; height: 34px; border-radius: 20px; background: #000; z-index: 92;
}
.sb-top {
  position: absolute; top: 0; left: 0; right: 0; height: 50px;
  display: flex; justify-content: space-between; align-items: center;
  padding: 6px 30px 0 36px; font-size: 15px; font-weight: 600; z-index: 91; pointer-events: none;
}
.home-ind {
  position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
  width: 134px; height: 5px; border-radius: 3px; background: var(--i-l1); opacity: .75; z-index: 95; pointer-events: none;
}

/* ---------- iPhone Duo Left App Rail (72pt) ---------- */
.dmenu {
  flex: none; width: 256px; background: var(--i-rail); border-right: .5px solid var(--i-sep);
  padding: 16px 10px 14px; display: flex; flex-direction: column; gap: 3px; font-size: 14.5px; z-index: 15;
}
.dmenu.rail { width: 64px; align-items: center; padding: 16px 0 14px; gap: 10px; }
.dmenu .mi {
  display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px;
  border-radius: 12px; width: 100%; text-align: left; color: var(--i-l2); position: relative;
}
.dmenu.rail .mi { width: 44px; height: 44px; justify-content: center; padding: 0; }
.dmenu .mi.sel { background: var(--i-fill); color: var(--i-l1); }
.dmenu.rail .mi.sel::before {
  content: ""; position: absolute; left: -10px; top: 11px; bottom: 11px; width: 3px;
  border-radius: 2px; background: var(--i-tint);
}
.dmenu .mh { font-size: 12px; color: var(--i-l3); padding: 10px 10px 3px; }
.dmenu .avatar {
  margin-top: auto; width: 36px; height: 36px; border-radius: 50%;
  background: linear-gradient(135deg, #6cc6bd, #4a89a8);
  display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 13px;
  box-shadow: 0 0 0 2px rgba(123,147,255,.35);
}
.ag-badge {
  width: 24px; height: 24px; border-radius: 7px;
  background: linear-gradient(135deg, #353849, #1d1f2b);
  border: 1px solid rgba(255,255,255,.16);
  display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #ff9d5c;
}

/* ---------- iPhone Duo Right System Vertical Bar (iOS 27.1 toolbarVerticalEdge) ---------- */
.dvbar {
  flex: none; width: 66px; background: var(--i-vbar); border-left: .5px solid var(--i-sep);
  padding: 14px 0 16px; display: flex; flex-direction: column; align-items: center; gap: 10px;
  z-index: 50; position: relative;
}
.dvbar .vclock { font-size: 13.5px; font-weight: 650; letter-spacing: -.2px; color: var(--i-l1); }
/* Dynamic Island / Status Ring on Duo side bar (matching user screenshot!) */
.dvbar .vring {
  width: 44px; height: 44px; border-radius: 50%;
  border: 2.2px solid var(--i-l1); position: relative;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  opacity: .92; transition: height .2s, border-radius .2s;
}
.dvbar .vring.live {
  height: 82px; border-radius: 22px; background: #11131a; border-color: rgba(123,147,255,.55);
  gap: 4px; color: #fff;
}
.dvbar .vring .dots {
  position: absolute; bottom: -5px; font-size: 7px; letter-spacing: 1.5px; color: var(--i-l2);
  background: var(--i-vbar); padding: 0 2px;
}
.dvbar .vcontrols {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: flex-start; padding-top: 6px; gap: 10px; width: 100%;
}
.dvbar.kbd .vcontrols { justify-content: flex-start; gap: 6px; }
.dvbar .vtag {
  font-size: 9.5px; color: var(--i-l3); writing-mode: horizontal-tb; text-align: center;
  line-height: 1.15; padding: 0 4px; margin-top: auto;
}

/* ---------- Duo Workspace (Conversation + Hinge-Aligned Side Panel) ---------- */
.dwork {
  flex: 1; min-width: 0; display: flex; position: relative; overflow: hidden;
}
.dconv {
  flex: 1; min-width: 0; position: relative; display: flex; flex-direction: column;
}
.dwork.max .dconv { display: none; }
.dwork.max .dside { flex: 1; width: auto !important; border-left: 0; }

/* Session Title Capsule Bar (on Duo, buttons are in .dvbar so only centered capsule remains!) */
.inav {
  position: absolute; top: 10px; left: 0; right: 0; height: 46px;
  display: flex; align-items: center; gap: 8px; padding: 0 14px; z-index: 20;
  background: linear-gradient(var(--i-bg) 52%, transparent); pointer-events: none;
}
.phone .inav { top: 50px; }
.inav > * { pointer-events: auto; }
.inav .mid { flex: 1; display: flex; justify-content: center; min-width: 0; }
.itcap {
  height: 42px; max-width: 236px; min-width: 0; border-radius: 21px; padding: 0 16px;
  display: flex; flex-direction: column; justify-content: center; text-align: center; line-height: 1.18;
}
.itcap b { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.itcap small { font-size: 11px; color: var(--i-l2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }

/* Conversation Scroll */
.iscroll {
  flex: 1; overflow-y: auto; scrollbar-width: none;
  padding: 64px 18px 94px; display: flex; flex-direction: column; gap: 12px;
}
.phone .iscroll { position: absolute; inset: 0; padding: 106px 16px 104px; }
.iscroll::-webkit-scrollbar { display: none; }
.itl { align-self: center; font-size: 11.5px; color: var(--i-l3); }
.ume { align-self: flex-end; max-width: 86%; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.ium { background: var(--i-me); color: #fff; border-radius: 18px; padding: 9px 14px; font-size: 15px; line-height: 1.4; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 11px 0 9px;
  border-radius: 11px; background: var(--i-fill); font-size: 13.5px; color: var(--i-l1); cursor: pointer;
}
.chip .ic { width: 16px; height: 16px; color: var(--i-l2); }
.chip small { font-size: 11.5px; color: var(--i-l2); }
.iam { font-size: 15px; line-height: 1.55; color: var(--i-l1); }
.iam p { margin: 0 0 8px; }
.iam ol, .iam ul { margin: 4px 0 8px; padding-left: 20px; }
.iam li { margin: 5px 0; }
.ifref {
  padding: 1.5px 5px; border-radius: 5px; background: var(--i-fill); color: var(--i-tint);
  cursor: pointer; font-family: var(--mono); font-size: .88em; -webkit-box-decoration-break: clone;
}
.ifref .l { color: var(--i-l2); }
.ifref.open { background: var(--i-tint-bg); font-weight: 500; }

.idock { position: absolute; left: 12px; right: 12px; bottom: 14px; z-index: 20; }
.phone .idock { bottom: 24px; }
.ibox { height: 46px; border-radius: 23px; padding: 0 6px 0 8px; display: flex; align-items: center; gap: 8px; }
.ibox .cplus, .ibox .csend {
  width: 34px; height: 34px; border-radius: 50%; background: var(--i-fill);
  display: grid; place-items: center; color: var(--i-l1);
}
.ibox .csend { background: var(--i-me); color: #fff; }
.ibox .ph { flex: 1; color: var(--i-l3); font-size: 15px; }

/* ---------- Improved SessionSidePanel ---------- */
/* Hinge-aligned width: on 920px Duo (inner scr 898px), center hinge is at 449px from left.
   Right half = 449px; minus 66px dvbar = 383px! Left half = 64px rail + 385px conv = 449px!
   Exact 50/50 physical crease alignment! */
.dside {
  flex: none; width: 383px; position: relative; display: flex; flex-direction: column;
  border-left: .5px solid var(--i-sep); background: var(--i-bg);
  transition: transform .22s cubic-bezier(.2,.9,.3,1);
}
.dside.legacy { width: 432px; }

/* Interactive Edge Swipe-to-Hide Handle on Panel's Left Seam */
.edge-grip {
  position: absolute; left: -7px; top: 0; bottom: 0; width: 16px; z-index: 35;
  cursor: ew-resize; display: flex; align-items: center; justify-content: center;
}
.edge-grip i {
  width: 3.5px; height: 38px; border-radius: 3px; background: var(--i-l3); opacity: .45;
  transition: opacity .15s, height .15s, background .15s;
}
.edge-grip:hover i, .edge-grip.dragging i { opacity: 1; height: 52px; background: var(--i-tint); }

/* Single-row Slim Tab Strip (48pt instead of 98pt double bar!) */
.dstrip {
  flex: none; height: 50px; display: flex; align-items: center; gap: 6px;
  padding: 8px 10px 6px 12px; border-bottom: .5px solid var(--i-sep);
}
.dside.legacy .dstrip { border-bottom: 0; padding-top: 10px; }
.dtabs {
  display: flex; gap: 6px; min-width: 0; overflow-x: auto; scrollbar-width: none; flex: 1;
  align-items: center;
}
.dtabs::-webkit-scrollbar { display: none; }
.dtab {
  flex: none; max-width: 176px; height: 34px; border-radius: 17px;
  display: flex; align-items: center; gap: 6px; padding: 0 7px 0 11px;
  font-size: 13px; color: var(--i-l2); background: var(--i-fill); cursor: pointer;
}
.dtab.on {
  background: var(--i-glass); color: var(--i-l1); font-weight: 500;
  box-shadow: inset 0 .5px 0 var(--i-glass-hi), 0 0 0 .5px var(--i-glass-bd), 0 3px 10px rgba(0,0,0,.12);
}
.dtab .ic { width: 15px; height: 15px; }
.dtab .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dtab:not(.on) { padding-right: 12px; }
.dtab:not(.on) .x { display: none; }
.dtab .x {
  width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center;
  color: var(--i-l2);
}
.dtab .x:hover { background: var(--i-fill2); }
.dtab .x .ic { width: 12px; height: 12px; }

/* Subtle inline address bar ONLY for .html page tabs or legacy comparison */
.dbar {
  flex: none; height: 38px; display: flex; align-items: center; gap: 6px;
  padding: 0 10px 0 14px; border-bottom: .5px solid var(--i-sep);
}
.dbar .p {
  flex: 1; min-width: 0; font: 12px var(--mono); color: var(--i-l2);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.dbar .addr {
  height: 26px; line-height: 26px; padding: 0 10px; border-radius: 13px; background: var(--i-fill);
}
.dbar .tbb { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: var(--i-l1); }
.dbar .tbb.on { background: var(--i-fill2); }
.dbar .tbb .ic { width: 17px; height: 17px; }

.dbody { flex: 1; min-height: 0; display: flex; position: relative; overflow: hidden; }
.dmain { flex: 1; min-width: 0; overflow: auto; position: relative; scrollbar-width: none; }
.dmain::-webkit-scrollbar { display: none; }

/* Legacy deformed side-by-side tree (only shown when S.legacy == true to demonstrate the bug!) */
.dtree-bad {
  flex: none; width: 196px; border-left: .5px solid var(--i-sep); overflow: auto; padding: 6px 6px;
}
.dtree-bad .bad-row {
  display: flex; align-items: center; gap: 6px; height: 38px; padding-right: 6px; font-size: 14px;
}
.dtree-bad .bad-row .ic { width: 17px; height: 17px; color: var(--i-tint); }
.dtree-bad .bad-row span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- Code, Markdown & Web Views ---------- */
.code { font: 12.5px/1.68 var(--mono); padding: 10px 0 118px; }
.code .ln { display: flex; padding: 0 12px 0 0; }
.code.wrap-bad .ln span { white-space: pre-wrap; word-break: break-all; }
.code .ln i {
  flex: none; width: 38px; padding-right: 10px; text-align: right;
  font-style: normal; color: var(--i-l3); user-select: none;
}
.code .ln span { white-space: pre; }
.code .ln.tg { background: var(--target); box-shadow: inset 2.5px 0 0 var(--target-bd); }
.yk { color: var(--syn-k); } .ys { color: var(--syn-s); } .yc { color: var(--syn-c); font-style: italic; }
.yf { color: var(--syn-f); } .yp { color: var(--syn-p); } .yv { color: var(--syn-v); }

.md { padding: 14px 18px 136px; font-size: 15px; line-height: 1.62; }
.md h1 { font-size: 19px; line-height: 1.32; margin: 0 0 10px; }
.md h2 { font-size: 16px; margin: 16px 0 6px; }
.md p { margin: 0 0 10px; }
.src { font: 12px/1.62 var(--mono); white-space: pre-wrap; padding: 12px 16px 130px; margin: 0; }

.web {
  min-height: 100%; padding: 16px 18px 40px;
  background: var(--i-bg2); color: var(--i-l1); font: 14px/1.5 var(--font);
}
.web .wh b { font-size: 17px; display: block; }
.web .wh span { font-size: 12px; color: var(--i-l2); }
.web .wcard {
  margin-top: 12px; border-radius: 14px; background: var(--i-bg);

}

/* ---------- Unified Bottom Drawer Component ---------- */
function renderBottomDrawer(activePath, isOpen, isLarge, scope) {
  const folder = dirOf(activePath);
  const place = folder ? `hermesh/${folder}` : "hermesh";
  if (!isOpen) {
    return `<button class="drw-peek iglass" data-drw="${scope}:1" title="上拉或点击展开项目文件目录树">
      ${ic("tree")}
      <span class="dp-txt"><b>项目文件</b><small><span>${esc(place)}</span></small></span>
      ${ic("chevUp", "chev")}
    </button>`;
  }
  const rows = [];
  const walk = (dir, depth) => {
    for (const e of kids(dir)) {
      const open = S.dTreeOpen.has(e.p);
      const on = e.p === activePath;
      // 13px per depth so even depth=6 (78px) leaves >260px for full folder/file names!
      rows.push(`<div class="trow ${on ? "on" : ""}" style="padding-left:${10 + depth * 13}px" data-pick="${scope}:${e.d ? "dir:" : "file:"}${e.p}">
        ${e.d ? ic("chev", "disc " + (open ? "open" : "")) : '<span class="disc-sp"></span>'}
        ${ic(e.d ? "folder" : "doc", e.d ? "fld" : "doc")}
        <span class="nm">${esc(base(e.p))}</span>
        ${e.s ? `<span class="sz">${e.s}</span>` : ""}
      </div>`);
      if (e.d && open) walk(e.p, depth + 1);
    }
  };
  walk("", 0);
  return `
    <div class="drw-dim" data-drw="${scope}:0"></div>
    <div class="drw ${isLarge ? "large" : ""}" data-drw-box="${scope}">
      <div class="drw-grab" data-grab="${scope}" title="上下拖动调节高度或下拉收起"><i></i></div>
      <div class="drw-head">
        <div class="dh-txt">
          <b>项目文件</b>
          <small>${esc(place)}</small>
        </div>
        <button class="igb" data-drw="${scope}:0" title="收起">${ic("chevDown")}</button>
      </div>
      <div class="drw-list">${rows.join("")}</div>
    </div>`;
}

                  <div class="hcapsule iglass" title="非 Duo 宽屏无系统右侧竖栏：面板顶栏自带胶囊控制组（含一键收起）">
                    <button class="igb" data-toast="新建标签" title="新建标签">${ic("plus")}</button>
                    <button class="igb ${S.pmMax ? "on" : ""}" data-pmmax="1" title="${S.pmMax ? "还原分屏" : "放大面板"}">${ic(S.pmMax ? "shrink" : "expand")}</button>
                    <button class="igb on" data-pmtoggle="1" title="一键收起面板">${ic("panelHide")}</button>
                  </div>
                </div>
                <div class="dbody">
                  <div class="dmain">${renderCode(t.path || CSS_P, false)}</div>
                  ${renderBottomDrawer(t.path || CSS_P, S.pmDrawer, false, "pm")}
                </div>
              </aside>` : ""}
          </div>
          <div class="home-ind"></div>
        </div>
      </div>
    </div>
    <div class="cap">iPhone Pro Max 横屏（无右侧系统竖栏）· 面板顶栏右侧自带液态玻璃胶囊 <code>[+ | ⤢ | 收起]</code>（全屏放大时也能一键收起）+ 底部目录树抽屉</div>
  </div>`;

  return `<div class="row-stage">${proMaxHtml}${phoneHtml}</div>`;
}

/* ---------- 4. Apple HIG Duo Guidelines & Trade-off Cards ---------- */
function renderSpecCards() {
  return `
  <div class="spec-grid">
    <div class="scard">
      <h3>1. 查证：Apple HIG <code>iPhone Duo</code> 侧边按钮规范</h3>
      <ul>
        <li><b>Shared Vertical Bar（右侧共享竖栏）</b>：iOS 27.1 在 Duo 外屏与内屏横放时，通过 <code>toolbarVerticalEdge == .trailing</code> 将时钟、状态环与 <code>NavigationStack</code> 工具栏整体迁至右侧竖向拇指热区，把宝贵的纵向高度让给正文与代码。</li>
        <li><b>液态玻璃竖向胶囊分组</b>：使用 <code>ToolbarItemGroup(placement: .topBarPinnedTrailing)</code> 搭配 <code>.axisBehavior(.verticalPreferred)</code>，高频相关动作（收起面板 + 放大缩小）收纳进同一枚竖向玻璃胶囊，与次级操作自然分组。</li>
        <li><b>动态压缩优先级</b>：键盘弹起或灵动岛展开时，<code>visibilityPriority(.high)</code> 保证<b>「收起面板」永远置顶常驻</b>，低优先级项（新建、源码）自动收进 <code>ToolbarOverflowMenu</code>。</li>
        <li><b>折痕避让（Fold Displacement）</b>：内屏分屏分割线对齐物理折痕中轴（左页对话、右页代码），避免行号或可点按钮压在铰链折痕上。</li>
      </ul>
    </div>

    <div class="scard">
      <h3>2. 三个核心痛点的精准修复对比</h3>
      <table>
        <tr><th>痛点（真机截图）</th><th>改进方案</th></tr>
        <tr>
          <td><b>缺一键隐藏右侧面板</b><br><code>SessionSideItems</code> 漏加面板开关，只能关光标签</td>
          <td>① Duo 右侧竖栏顶部常驻 <code>sidebar.right</code> 一键收起/恢复（保留标签）<br>② 非 Duo 横屏在面板胶囊尾部配收起钮<br>③ 支持<b>面板左边缘向右滑动收起</b></td>
        </tr>
        <tr>
          <td><b>目录树严重挤压变形</b><br>420pt 面板再切 200pt 树，目录变单字母 <code>a/fi/h/s</code></td>
          <td><b>全手机形态统一为底部抽屉</b>：代码独享整列宽度；底部浮起「项目文件 · 所在路径」玻璃条，上拉半屏/大屏抽屉展示完整文件名与大小</td>
        </tr>
        <tr>
          <td><b>双顶栏占高 + 双 <code>⋯</code> 撞车</b><br>面板两排顶栏吃掉 98pt，且两个 <code>⋯</code> 紧挨</td>
          <td>面板顶部瘦身为<b>单层 48pt 标签条</b>（路径下移至底部抽屉条，省出 50pt 纵向代码区）；文件操作并入右侧竖栏上下文胶囊与分组菜单</td>
        </tr>
      </table>
    </div>

    <div class="scard">
      <h3>3. 抽屉与菜单的精简交互约定</h3>
      <ol>
        <li><b>原生抽屉手势</b>：抽屉顶栏仅保留标题、路径与右侧收起钮 <code>⌄</code>，不放多余切换按钮；通过<b>顶部横条上下拖拽</b>切换半屏/大屏或下拉收起，点选文件后自动落回底部看代码。</li>
        <li><b>右侧面板内就近弹起</b>：Duo 横放时抽屉仅在右侧面板列内升起（宽约 383pt），右手拇指就近点选且不遮挡左侧对话。</li>
        <li><b>单一 <code>⋯</code> 分组菜单</b>：当前文件的「分享… / 复制路径」作为第一分组并入右侧竖栏底部 <code>⋯</code>，消除双 <code>⋯</code> 撞车。</li>
      </ol>
    </div>
  </div>`;
}

/* ---------- Main Render & Auto-Fit Scaling ---------- */
function fitDevices() {
  const avail = Math.min(window.innerWidth - 28, 1460);
  document.querySelectorAll(".fit-box").forEach((box) => {
    const designW = +box.dataset.designW || 920;
    const inner = box.querySelector(".fit-inner");
    if (!inner) return;
    inner.style.transform = "none";
    box.style.height = "auto";
    const scale = avail < designW ? avail / designW : 1;
    if (scale < 0.995) {
      const rawH = inner.offsetHeight;
      inner.style.transform = `scale(${scale.toFixed(4)})`;
      box.style.width = `${Math.floor(designW * scale)}px`;
      box.style.height = `${Math.ceil(rawH * scale) + 28}px`;
    } else {
      box.style.width = "";
      box.style.height = "";
    }
  });
}

function render() {
  document.documentElement.dataset.theme = S.theme;
  const badge = document.getElementById("hdr-badge");
  if (S.legacy && S.view === "duo") {
    badge.className = "badge warn";
    badge.textContent = "⚠️ 旧版真机状态复现（缺收起按钮 · 200pt 侧树变形 · 双 ⋯ 撞车）";
  } else {
    badge.className = "badge";
    badge.textContent = "✦ Apple HIG · iOS 27.1 竖向侧栏规范改进版";
  }

  const views = [
    ["duo", "Duo 展开横放（改进核心）"],
    ["outer", "Duo 合上外屏"],
    ["phones", "Pro Max 横屏 & 直板机"],
    ["spec", "HIG 规范 & 待确认"],
  ];
  document.getElementById("view-tabs").innerHTML = views
    .map(([k, label]) => `<button class="${S.view === k ? "on" : ""}" data-view="${k}">${label}</button>`)
    .join("");

  const stage = document.getElementById("stage");
  if (S.view === "duo") stage.innerHTML = renderDuoOpen() + renderSpecCards();
  else if (S.view === "outer") stage.innerHTML = renderDuoOuter();
  else if (S.view === "phones") stage.innerHTML = renderPhones();
  else stage.innerHTML = renderSpecCards();

  document.getElementById("ctl").innerHTML = `
    <div class="g"><b>方案对比</b>
      <button class="${!S.legacy ? "on" : ""}" data-legacy="0">✦ 改进版（Duo 竖栏 + 底部抽屉）</button>
      <button class="warn ${S.legacy ? "on" : ""}" data-legacy="1">旧版截图痛点复现</button>
    </div>
    <div class="g"><b>Duo 状态</b>
      <button class="${S.panel ? "on" : ""}" data-dtoggle="1">${S.panel ? "收起右侧面板" : "展开右侧面板"}</button>
      <button class="${S.dDrawer && S.panel ? "on" : ""}" data-drw="duo:${S.dDrawer ? 0 : 1}">底部目录树抽屉</button>
      <button class="${S.compactVBar ? "on" : ""}" data-kbd="1">模拟键盘/竖栏压缩</button>
    </div>
    <div class="g"><b>外观</b>
      <button class="${S.theme === "dark" ? "on" : ""}" data-theme="dark">深色</button>
      <button class="${S.theme === "light" ? "on" : ""}" data-theme="light">浅色</button>
    </div>`;

  requestAnimationFrame(fitDevices);
  bindEdgeSwipe();
  bindDrawerGrab();
}

let toastTimer;
function showToast(msg) {
  S.toast = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { S.toast = null; render(); }, 1500);
}

/* Native iOS Sheet Grabber Drag (drag up -> large detent, drag down -> medium or dismiss) */
function bindDrawerGrab() {
  document.querySelectorAll("[data-grab]").forEach((grab) => {
    const scope = grab.dataset.grab;
    const drw = grab.closest(".drw");
    const host = drw && drw.parentElement;
    if (!drw || !host) return;
    let startY = null, startH = 0, moved = false;
    grab.onpointerdown = (ev) => {
      startY = ev.clientY;
      startH = drw.offsetHeight;
      moved = false;
      drw.classList.add("dragging");
      grab.setPointerCapture(ev.pointerId);
    };
    grab.onpointermove = (ev) => {
      if (startY === null) return;
      const dy = ev.clientY - startY;
      if (Math.abs(dy) > 4) moved = true;
      const maxH = host.offsetHeight * 0.92;
      const nextH = Math.max(80, Math.min(maxH, startH - dy));
      drw.style.height = `${nextH}px`;
    };
    const end = (ev) => {
      if (startY === null) return;
      const dy = ev.clientY - startY;
      const curRatio = drw.offsetHeight / host.offsetHeight;
      startY = null;
      drw.classList.remove("dragging");
      drw.style.height = "";
      const setState = (open, large) => {
        if (scope === "duo") { S.dDrawer = open; S.dDrawerLarge = large; }
        else if (scope === "outer") { const top = S.outerStack[S.outerStack.length - 1]; top.drawer = open; top.large = large; }
        else if (scope === "ip") { const top = S.ipStack[S.ipStack.length - 1]; top.drawer = open; top.large = large; }
        else if (scope === "pm") { S.pmDrawer = open; }
      };
      if (!moved) {
        const isLarge = drw.classList.contains("large");
        setState(true, !isLarge);
      } else if (curRatio < 0.36 || dy > 110) {
        setState(false, false);
      } else if (curRatio > 0.72 || dy < -45) {
        setState(true, true);
      } else {
        setState(true, false);
      }
      render();
    };
    grab.onpointerup = end;
    grab.onpointercancel = end;
  });
}

/* Interactive Swipe-Right on Side Panel's Left Edge to Hide Panel! */
function bindEdgeSwipe() {
  const grip = document.getElementById("duo-grip");
  const side = document.getElementById("duo-side");
  if (!grip || !side) return;
  let startX = null;
  grip.onpointerdown = (ev) => {
    startX = ev.clientX;
    grip.classList.add("dragging");
    side.style.transition = "none";
    grip.setPointerCapture(ev.pointerId);
  };
  grip.onpointermove = (ev) => {
    if (startX === null) return;
    const dx = Math.max(0, ev.clientX - startX);
    side.style.transform = `translateX(${dx}px)`;
    side.style.opacity = String(Math.max(0.35, 1 - dx / 320));
  };
  const end = (ev) => {
    if (startX === null) return;
    const dx = ev.clientX - startX;
    startX = null;
    grip.classList.remove("dragging");
    side.style.transition = "";
    side.style.transform = "";
    side.style.opacity = "";
    if (dx > 72) {
      S.panel = false;
      S.dMax = false;
      S.dDrawer = false;
      showToast("已手势收起侧面板（保留 3 个标签）");
      render();
    }
  };
  grip.onpointerup = end;
  grip.onpointercancel = end;
}

window.addEventListener("resize", fitDevices);

document.addEventListener("click", (e) => {
  const el = e.target.closest("button,[data-dtab],[data-dclose],[data-drw],[data-pick],[data-open]");
  const hadPop = S.dPop;
  S.dPop = null;
  if (!el) { if (hadPop) render(); return; }
  const d = el.dataset;

  if (d.view) S.view = d.view;
  else if (d.theme) S.theme = d.theme;
  else if (d.legacy !== undefined) { S.legacy = d.legacy === "1"; S.view = "duo"; if (S.legacy) S.panel = true; }
  else if (d.kbd) { S.compactVBar = !S.compactVBar; S.legacy = false; S.view = "duo"; }
  else if (d.dtoggle) {
    S.legacy = false;
    S.panel = !S.panel;
    if (!S.panel) { S.dMax = false; S.dDrawer = false; }
    else if (!S.tabs.length) initTabs();
  }
  else if (d.dmax) { S.dMax = !S.dMax; }
  else if (d.dmenuexp !== undefined) {
    S.menuExpanded = d.dmenuexp === "1";
    if (S.menuExpanded) { S.panel = false; S.dMax = false; }
  }
  else if (d.dpop) { S.dPop = hadPop === d.dpop ? null : d.dpop; }
  else if (d.dtab) { S.active = +d.dtab; const tab = S.tabs.find((x) => x.id === S.active); if (tab && tab.path) openAncestorDirs(tab.path); }
  else if (d.dclose) {
    e.stopPropagation();
    const id = +d.dclose, i = S.tabs.findIndex((x) => x.id === id);
    if (i >= 0) S.tabs.splice(i, 1);
    if (S.active === id) S.active = (S.tabs[i] || S.tabs[i - 1] || {}).id ?? null;
    if (!S.tabs.length) { S.panel = false; S.dMax = false; S.dDrawer = false; }
  }
  else if (d.dsrc) { const t = S.tabs.find((x) => x.id === S.active); if (t) t.source = !t.source; }
  else if (d.dnow !== undefined) { const t = S.tabs.find((x) => x.id === S.active); if (t) t.now = d.dnow === "1"; }
  else if (d.dopenproj) {
    S.legacy = false; S.panel = true; S.menuExpanded = false;
    if (!S.tabs.length) initTabs();
    const t = S.tabs.find((x) => x.id === S.active);
    if (t && t.kind === "page") S.active = S.tabs[0].id;
    S.dDrawer = true;
  }
  else if (d.drw) {
    const [scope, val] = d.drw.split(":");
    const open = val === "1";
    if (scope === "duo") { S.panel = true; S.legacy = false; S.dDrawer = open; if (!open) S.dDrawerLarge = false; }
    else if (scope === "outer") { const top = S.outerStack[S.outerStack.length - 1]; top.drawer = open; if (!open) top.large = false; }
    else if (scope === "ip") { const top = S.ipStack[S.ipStack.length - 1]; top.drawer = open; if (!open) top.large = false; }
    else if (scope === "pm") S.pmDrawer = open;
  }
  else if (d.pick) {
    const [scope, kind, ...rest] = d.pick.split(":");
    const p = rest.join(":");
    if (kind === "dir") {
      S.dTreeOpen.has(p) ? S.dTreeOpen.delete(p) : S.dTreeOpen.add(p);
    } else {
      if (scope === "duo") {
        const cur = S.tabs.find((x) => x.id === S.active);
        if (isPage(p)) {
          let pg = S.tabs.find((x) => x.kind === "page" && x.path === p);
          if (!pg) { pg = { id: seq++, kind: "page", path: p, source: false, now: false }; S.tabs.push(pg); }
          S.active = pg.id;
        } else if (cur && cur.kind === "files") {
          Object.assign(cur, { path: p, source: false, now: false });
        }
        S.dDrawer = false; S.dDrawerLarge = false;
      } else if (scope === "outer") {
        const top = S.outerStack[S.outerStack.length - 1];
        if (isPage(p)) { top.drawer = false; S.outerStack.push({ k: "page", path: p }); }
        else { Object.assign(top, { k: "file", path: p, source: false, drawer: false, large: false }); }
      } else if (scope === "ip") {
        const top = S.ipStack[S.ipStack.length - 1];
        if (isPage(p)) { top.drawer = false; S.ipStack.push({ k: "page", path: p }); }
        else { Object.assign(top, { k: "file", path: p, source: false, drawer: false, large: false }); }
      } else if (scope === "pm") {
        const cur = S.tabs.find((x) => x.id === S.active);
        if (cur && !isPage(p)) cur.path = p;
        S.pmDrawer = false;
      }
    }
  }
  else if (d.open) {
    const p = d.open, w = d.where;
    openAncestorDirs(p);
    if (w === "duo" || w === "pm") {
      const k = isPage(p) ? "page" : "files";
      let found = S.tabs.find((x) => x.kind === k && x.path === p);
      if (!found) { found = { id: seq++, kind: k, path: p, source: false, now: false }; S.tabs.push(found); }
      S.active = found.id; S.panel = true; S.pmPanel = true; S.menuExpanded = false; S.legacy = false;
    } else if (w === "outer") {
      S.outerStack.push({ k: isPage(p) ? "page" : "file", path: p, source: false, drawer: false, large: false });
    } else if (w === "ip") {
      S.ipStack.push({ k: isPage(p) ? "page" : "file", path: p, source: false, drawer: false, large: false });
    }
  }
  else if (d.outerback) { if (S.outerStack.length > 1) S.outerStack.pop(); else S.outerStack = [{ k: "chat" }]; }
  else if (d.outergo) { S.outerStack.push({ k: "file", path: d.outergo, source: false, drawer: false, large: false }); }
  else if (d.outersrc) { const top = S.outerStack[S.outerStack.length - 1]; top.source = !top.source; }
  else if (d.ipback) { if (S.ipStack.length > 1) S.ipStack.pop(); else S.ipStack = [{ k: "chat" }]; }
  else if (d.ipgo) { S.ipStack.push({ k: "file", path: d.ipgo, source: false, drawer: false, large: false }); }
  else if (d.ipsrc) { const top = S.ipStack[S.ipStack.length - 1]; top.source = !top.source; }
  else if (d.pmtoggle) { S.pmPanel = !S.pmPanel; if (!S.pmPanel) S.pmMax = false; }
  else if (d.pmmax) { S.pmMax = !S.pmMax; }
  else if (d.toast) { showToast(d.toast); }

  render();
});

render();
</script>

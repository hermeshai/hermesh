<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>会话内容区图片渲染与虚化灯箱 · 交互原型</title>
<style>
:root{
  --font-ios:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",system-ui,sans-serif;
  --font-mac:"Google Sans Flex","Google Sans",system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
  --mono:"Google Sans Code",ui-monospace,"SF Mono",Menlo,Monaco,monospace;
}
[data-theme=light]{
  --page:#e8eaf0;--page-fg:#1b1c22;--page-fg2:#62646f;--page-card:#ffffff;--page-bd:rgba(0,0,0,.08);
  /* iPhone tokens */
  --i-bg:#ffffff;--i-l1:#000000;--i-l2:rgba(60,60,67,.62);--i-l3:rgba(60,60,67,.34);--i-sep:rgba(0,0,0,.085);
  --i-fill:rgba(118,118,128,.09);--i-fill2:rgba(118,118,128,.15);--i-me:#3d5bff;--i-tint:#3d5bff;
  --i-glass:rgba(250,250,252,.78);--i-glass-bd:rgba(0,0,0,.08);--i-pop:rgba(250,250,252,.94);
  /* Mac tokens (app.css) */
  --win:#ffffff;--win2:#f4f4f7;--side:#f4f4f7;--code:#f6f7fa;
  --l1:rgba(0,0,0,.86);--l2:rgba(0,0,0,.54);--l3:rgba(0,0,0,.32);--l4:rgba(0,0,0,.14);
  --sep:rgba(0,0,0,.075);--fill:rgba(0,0,0,.045);--fill2:rgba(0,0,0,.075);--fill3:rgba(0,0,0,.12);
  --accent:#3d5bff;--accent-t:#2c4ae8;--accent-bg:rgba(61,91,255,.10);
  --pill:#ffffff;--pill-bd:rgba(0,0,0,.11);
  --glass:rgba(255,255,255,.78);--glass-sh:0 0 0 .5px rgba(0,0,0,.10),0 4px 16px rgba(0,0,0,.10);
  --shadow-win:0 0 0 .5px rgba(0,0,0,.20),0 24px 70px rgba(10,20,50,.28),0 8px 22px rgba(10,20,50,.12);
  --lb-scrim:rgba(12,14,20,.58);
  --warn:#d97706;--warn-bg:rgba(217,119,6,.11);--ok:#16934e;
}
[data-theme=dark]{
  --page:#0e1015;--page-fg:#ececf1;--page-fg2:#9a9ca8;--page-card:#181920;--page-bd:rgba(255,255,255,.08);
  --i-bg:#000000;--i-l1:#f5f5f7;--i-l2:rgba(235,235,245,.6);--i-l3:rgba(235,235,245,.32);--i-sep:rgba(255,255,255,.11);
  --i-fill:rgba(118,118,128,.20);--i-fill2:rgba(118,118,128,.30);--i-me:#4a66ff;--i-tint:#758dff;
  --i-glass:rgba(38,38,42,.76);--i-glass-bd:rgba(255,255,255,.12);--i-pop:rgba(42,42,46,.95);
  --win:#1e1e21;--win2:#29292d;--side:#25252a;--code:#18181b;
  --l1:rgba(255,255,255,.90);--l2:rgba(255,255,255,.56);--l3:rgba(255,255,255,.32);--l4:rgba(255,255,255,.14);
  --sep:rgba(255,255,255,.09);--fill:rgba(255,255,255,.05);--fill2:rgba(255,255,255,.085);--fill3:rgba(255,255,255,.14);
  --accent:#4a66ff;--accent-t:#94a8ff;--accent-bg:rgba(91,121,255,.18);
  --pill:#29292e;--pill-bd:rgba(255,255,255,.12);
  --glass:rgba(52,52,58,.78);--glass-sh:0 0 0 .5px rgba(255,255,255,.12),0 4px 16px rgba(0,0,0,.42);
  --shadow-win:0 0 0 .5px rgba(255,255,255,.14),0 24px 70px rgba(0,0,0,.62),0 8px 22px rgba(0,0,0,.35);
  --lb-scrim:rgba(6,7,10,.66);
  --warn:#f5a623;--warn-bg:rgba(245,166,35,.14);--ok:#3fcf86;
}
[data-theme=black]{
  --page:#050507;--page-fg:#f5f5f7;--page-fg2:#87888f;--page-card:#111115;--page-bd:rgba(255,255,255,.07);
  --i-bg:#000000;--i-l1:#f5f5f7;--i-l2:#a1a2ab;--i-l3:#686972;--i-sep:rgba(255,255,255,.08);
  --i-fill:rgba(255,255,255,.07);--i-fill2:rgba(255,255,255,.12);--i-me:#2f71e3;--i-tint:#8ab4f8;
  --i-glass:rgba(22,22,26,.84);--i-glass-bd:rgba(255,255,255,.10);--i-pop:rgba(26,26,30,.96);
  --win:#070709;--win2:#131317;--side:#111114;--code:#0d0d11;
  --l1:#f5f5f7;--l2:#bcbdc6;--l3:#87888f;--l4:rgba(255,255,255,.16);
  --sep:rgba(255,255,255,.07);--fill:rgba(255,255,255,.045);--fill2:rgba(255,255,255,.08);--fill3:rgba(255,255,255,.13);
  --accent:#2f71e3;--accent-t:#8ab4f8;--accent-bg:rgba(47,113,227,.16);
  --pill:#15151a;--pill-bd:rgba(255,255,255,.09);
  --glass:rgba(22,22,27,.88);--glass-sh:0 0 0 .5px rgba(255,255,255,.10),0 10px 30px rgba(0,0,0,.5);
  --shadow-win:0 0 0 .5px rgba(255,255,255,.11),0 24px 70px rgba(0,0,0,.75);
  --lb-scrim:rgba(0,0,0,.74);
  --warn:#f3c949;--warn-bg:rgba(243,201,73,.13);--ok:#7aae66;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--page-fg);font:13.5px/1.5 var(--font-mac);min-height:100vh;padding-bottom:108px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{display:block;flex:none}
code{font-family:var(--mono)}
.hide{display:none!important}

/* Header & Layout */
.top{max-width:1620px;margin:0 auto;padding:18px 24px 4px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.top h1{font-size:18.5px;margin:0;font-weight:650;letter-spacing:-.01em}
.top span{color:var(--page-fg2);font-size:13px}
.wrap{max-width:1620px;margin:0 auto;padding:12px 24px;display:flex;gap:24px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
#stage{display:flex;gap:24px;align-items:flex-start;justify-content:center;flex-wrap:wrap;min-width:0;max-width:100%}

/* Side Spec Notes */
.notes{width:356px;max-width:100%;flex:none;background:var(--page-card);border:1px solid var(--page-bd);border-radius:14px;padding:15px 17px;font-size:12.8px;line-height:1.62}
.notes h3{margin:0 0 6px;font-size:14px;font-weight:650}
.notes p{margin:0;color:var(--page-fg2)}
.notes ul{margin:6px 0 0;padding-left:18px}
.notes li{margin:4px 0}
.notes li b{color:var(--page-fg);font-weight:600}
.notes .blk{margin-top:13px;padding-top:11px;border-top:1px solid var(--page-bd)}
.notes .pill-tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:1px 8px;border-radius:99px;background:var(--accent-bg);color:var(--accent-t);font-weight:600;margin-right:5px}
.notes .pill-tag.warn{background:var(--warn-bg);color:var(--warn)}
.notes code{font-size:11.5px;padding:1px 5px;border-radius:4px;background:var(--fill2)}

/* Bottom Switcher Bar */
.ctl{position:fixed;left:0;right:0;bottom:0;background:var(--page-card);border-top:1px solid var(--page-bd);padding:9px 18px;display:flex;flex-wrap:wrap;gap:7px 18px;align-items:center;justify-content:center;font-size:12px;z-index:200;backdrop-filter:blur(16px)}
.ctl .g{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.ctl .g b{color:var(--page-fg2);font-weight:500;margin-right:3px}
.ctl button{padding:4px 10px;border-radius:7px;background:var(--fill2);color:var(--page-fg);transition:background .12s}
.ctl button:hover{background:var(--fill3)}
.ctl button.on{background:var(--accent);color:#fff;font-weight:500}

/* Shimmer Skeleton */
@keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.skel{position:relative;overflow:hidden;background:var(--fill2)}
.skel::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.16),transparent);animation:shimmer 1.35s infinite}
[data-theme=light] .skel::after{background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent)}

/* ================= MAC WINDOW ================= */
.mac{width:980px;max-width:100%;height:730px;border-radius:12px;overflow:hidden;box-shadow:var(--shadow-win);display:flex;background:var(--win);color:var(--l1);font:13px/1.45 var(--font-mac);position:relative;user-select:none}
.mside{width:214px;background:var(--side);border-right:.5px solid var(--sep);padding:44px 8px 10px;flex:none;position:relative;display:flex;flex-direction:column;gap:2px}
.lights{position:absolute;top:16px;left:16px;display:flex;gap:8px;z-index:90;pointer-events:none}
.lights i{width:12px;height:12px;border-radius:6px;background:#ff5f57}
.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.mside .nav-i{display:flex;align-items:center;gap:8px;height:30px;padding:0 9px;border-radius:7px;color:var(--l1);font-size:13.5px}
.mside .gh{font-size:11.5px;color:var(--l3);padding:12px 10px 4px;display:flex;justify-content:space-between}
.mside .srow{height:30px;padding:0 9px;border-radius:7px;display:flex;align-items:center;gap:8px;color:var(--l2);font-size:13px;white-space:nowrap;overflow:hidden;cursor:pointer}
.mside .srow:hover{background:var(--fill)}
.mside .srow.sel{background:var(--fill2);color:var(--l1);font-weight:500}
.mside .srow .dot{width:7px;height:7px;border-radius:50%;background:var(--l4);flex:none}
.mside .srow.sel .dot{background:var(--ok)}
.mside .srow span{overflow:hidden;text-overflow:ellipsis}

.mmain{flex:1;display:flex;flex-direction:column;min-width:0;position:relative;background:var(--win)}
.ctool{height:44px;border-bottom:.5px solid var(--sep);display:flex;align-items:center;padding:0 12px 0 18px;gap:10px;flex:none}
.ctitle{display:flex;align-items:baseline;gap:10px;min-width:0;flex:1}
.ctitle h2{margin:0;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th-where{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--l2);white-space:nowrap}
.th-where.off{color:var(--warn)}
.tb-btn{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--l2)}
.tb-btn:hover{background:var(--fill2);color:var(--l1)}

.mOfflineBar{display:flex;align-items:center;justify-content:center;gap:7px;height:30px;font-size:12px;color:var(--warn);background:var(--warn-bg);border-bottom:.5px solid var(--sep);flex:none}

.mscroll{flex:1;overflow-y:auto;padding:18px 28px 104px}
.mcol{max-width:710px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.tdiv{align-self:center;font-size:11.5px;color:var(--l3);margin:2px 0}
.um{align-self:flex-end;max-width:80%;background:var(--accent);color:#fff;padding:9px 14px;border-radius:12px;font-size:14.5px;line-height:1.55;user-select:text}
.tstep{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--l2);padding:2px 0}
.tstep code{font-size:12px;color:var(--l2);background:var(--fill);padding:1px 5px;border-radius:4px}

/* Markdown reply on Mac */
.am{font-size:14.5px;line-height:1.64;color:var(--l1);user-select:text}
.am p{margin:0}
.am p+p,.am p+ul,.am ul+p,.am .img-wrap+p,.am p+.img-wrap,.am ul+.img-wrap{margin-top:10px}
.am ul{margin:0;padding-left:20px}
.am li+li{margin-top:4px}
.am code.inline{font-size:.89em;padding:1px 5px;border-radius:4px;background:var(--fill);font-family:var(--mono)}

/* FileTag (.fref) */
.fref{display:inline-flex;align-items:center;gap:4px;padding:1px 6px;border-radius:5px;background:var(--fill);box-shadow:inset 0 0 0 .5px var(--sep);color:var(--accent-t);font-size:.93em;cursor:pointer;vertical-align:baseline;user-select:none;transition:background .12s}
.fref:hover{background:var(--fill2)}
.fref svg{width:13px;height:13px;color:var(--l2)}
.fref.mono{font-family:var(--mono);font-size:.88em}
.fref.gone{color:var(--l3);cursor:not-allowed}
.fref.gone svg{color:var(--l3)}
.fref.gone:hover{background:var(--fill)}

/* Inline Image Cards (Mac) — quiet, zero button clutter */
.img-wrap{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;user-select:none}
.md-shot{position:relative;border-radius:10px;overflow:hidden;background:var(--fill);box-shadow:0 0 0 .5px var(--sep),0 4px 16px rgba(0,0,0,.06);cursor:zoom-in;transition:transform .16s cubic-bezier(.2,0,0,1),box-shadow .16s;display:flex;flex-direction:column}
.md-shot:hover{transform:translateY(-1px);box-shadow:0 0 0 .5px var(--l4),0 8px 24px rgba(0,0,0,.11)}
.md-shot .pic{display:block;width:176px;height:382px;position:relative}
.md-shot.pair .pic{width:152px;height:330px}
.md-shot .pic svg{width:100%;height:100%;display:block}
.md-shot .cap-bar{padding:5px 9px;font-size:11.5px;color:var(--l2);background:var(--win2);border-top:.5px solid var(--sep);display:flex;align-items:center;justify-content:space-between;gap:8px}
.md-shot .cap-bar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.md-shot .cap-bar small{color:var(--l3);font-variant-numeric:tabular-nums;flex:none}

/* Offline Uncached Card */
.img-off{display:inline-flex;align-items:center;gap:12px;padding:12px 15px;border-radius:10px;background:var(--fill);box-shadow:inset 0 0 0 .5px var(--sep);color:var(--l2);font-size:13px;max-width:430px;user-select:none}
.img-off .ic-box{width:36px;height:36px;border-radius:8px;background:var(--warn-bg);color:var(--warn);display:flex;align-items:center;justify-content:center;flex:none}
.img-off b{display:block;color:var(--l1);font-weight:550;font-size:13px}
.img-off span{display:block;font-size:12px;color:var(--l2);margin-top:1px}
.img-off button{margin-left:auto;padding:4px 10px;border-radius:99px;background:var(--pill);box-shadow:0 0 0 .5px var(--pill-bd);color:var(--l1);font-size:12px;white-space:nowrap}

/* Mac Composer */
.mcmp-zone{position:absolute;left:0;right:0;bottom:0;padding:22px 28px 16px;background:linear-gradient(transparent,var(--win) 26px);pointer-events:none}
.mcmp{pointer-events:auto;max-width:710px;margin:0 auto;background:var(--pill);border-radius:16px;box-shadow:0 0 0 .5px var(--pill-bd),0 4px 14px rgba(0,0,0,.07);padding:8px 10px;display:flex;align-items:center;gap:8px;color:var(--l3);font-size:14px}
.mcmp .plus{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--l2)}
.mcmp .send{margin-left:auto;width:28px;height:28px;border-radius:50%;background:var(--fill2);display:flex;align-items:center;justify-content:center;color:var(--l3)}

/* ================= MAC BLURRED LIGHTBOX (Full Window, Centered Wide Header, ⋯ + ✕ only) ================= */
.mlb{position:absolute;inset:0;z-index:85;background:var(--lb-scrim);backdrop-filter:blur(22px) saturate(1.28);-webkit-backdrop-filter:blur(22px) saturate(1.28);display:flex;flex-direction:column;animation:fadeIn .16s ease-out;user-select:none}
@keyframes fadeIn{from{opacity:0}}
@keyframes lbZoomIn{from{transform:scale(.95);opacity:.6}to{transform:scale(1);opacity:1}}
.mlb-top{height:56px;padding:0 16px;display:grid;grid-template-columns:96px minmax(0,1fr) 96px;align-items:center;flex:none;z-index:3;background:linear-gradient(rgba(0,0,0,.28),transparent)}
.mlb-head{max-width:620px;width:100%;margin:0 auto;text-align:center;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px}
.mlb-head b{display:block;max-width:100%;font-size:13.5px;font-weight:550;color:rgba(255,255,255,.95);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.005em}
.mlb-head span{display:block;max-width:100%;font-size:11.5px;color:rgba(255,255,255,.60);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mlb-acts{display:flex;justify-content:flex-end;gap:6px;position:relative}
.mlb-ic{width:32px;height:32px;border-radius:50%;background:rgba(32,32,38,.58);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 .5px rgba(255,255,255,.15);transition:background .12s}
.mlb-ic:hover,.mlb-ic.on{background:rgba(56,56,66,.82)}
.mlb-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:4px 60px 22px}
.mlb-art{height:100%;aspect-ratio:1206/2622;max-height:644px;border-radius:16px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.55),0 0 0 .5px rgba(255,255,255,.18);animation:lbZoomIn .2s cubic-bezier(.2,0,0,1);transform-origin:center center;cursor:zoom-in;transition:transform .18s cubic-bezier(.2,0,0,1)}
.mlb-art.dragging{transition:none;cursor:grabbing!important}
.mlb-art.zoomed{cursor:grab}
.mlb-art svg{width:100%;height:100%;display:block}
.mlb-nav{position:absolute;top:50%;margin-top:-19px;width:38px;height:38px;border-radius:50%;background:rgba(32,32,38,.58);backdrop-filter:blur(20px);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 .5px rgba(255,255,255,.15)}
.mlb-nav:hover{background:rgba(56,56,66,.84)}
.mlb-nav.prev{left:16px}.mlb-nav.next{right:16px}

/* Anchored ⋯ Popover inside Lightbox */
.lb-pop{position:absolute;top:40px;right:0;min-width:168px;padding:4px;border-radius:10px;background:rgba(34,34,40,.92);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);box-shadow:0 14px 40px rgba(0,0,0,.45),0 0 0 .5px rgba(255,255,255,.15);animation:lbZoomIn .12s ease-out;z-index:10}
.lb-pop button{width:100%;display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:6px;font-size:13px;color:rgba(255,255,255,.92);text-align:left}
.lb-pop button:hover{background:var(--accent);color:#fff}
.lb-pop .sep{height:.5px;background:rgba(255,255,255,.12);margin:4px 6px}

/* ================= IPHONE 17 PRO ================= */
.phone{width:402px;height:856px;border-radius:56px;padding:11px;background:#18181b;box-shadow:0 28px 75px rgba(10,20,50,.32),inset 0 0 0 1.5px #38383d;flex:none;user-select:none}
.scr{position:relative;width:100%;height:100%;border-radius:46px;overflow:hidden;background:var(--i-bg);color:var(--i-l1);font:16px/1.38 var(--font-ios);letter-spacing:-.15px}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;border-radius:20px;background:#000;z-index:92}
.sb{position:absolute;top:0;left:0;right:0;height:50px;display:flex;justify-content:space-between;align-items:center;padding:6px 30px 0 38px;font-size:15.5px;font-weight:600;z-index:91;pointer-events:none;transition:color .15s}
.scr.lb-open .sb{color:#fff}
.home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:136px;height:5px;border-radius:3px;background:var(--i-l1);opacity:.82;z-index:95;pointer-events:none}
.scr.lb-open .home{background:#fff}

/* iPhone Top Floating Glass Nav */
.inav{position:absolute;top:52px;left:0;right:0;height:48px;display:flex;align-items:center;justify-content:center;z-index:20;background:linear-gradient(var(--i-bg) 58%,transparent);pointer-events:none}
.inav>*{pointer-events:auto}
.iglass{background:var(--i-glass);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);box-shadow:0 0 0 .5px var(--i-glass-bd),0 4px 16px rgba(0,0,0,.08)}
.igb{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--i-l1)}
.inav .back{position:absolute;left:14px}
.inav .more{position:absolute;right:14px}
.itcap{height:42px;max-width:248px;border-radius:21px;padding:0 16px;display:flex;flex-direction:column;justify-content:center;text-align:center;line-height:1.18}
.itcap b{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.itcap small{font-size:11px;color:var(--i-l2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.itcap small.off{color:var(--warn)}

.iscroll{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;padding:108px 18px 104px;display:flex;flex-direction:column;gap:12px}
.iscroll::-webkit-scrollbar{display:none}
.itl{align-self:center;font-size:12px;color:var(--i-l3)}
.ium{align-self:flex-end;max-width:82%;background:var(--i-me);color:#fff;border-radius:18px;padding:9px 14px;font-size:16px;line-height:1.38}
.itstep{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--i-l2)}

let loadTimer = null;
function triggerLoadIfRemote() {
  clearTimeout(loadTimer);
  if (S.net === "remote" && S.ver === "new") {
    S.loading = true;
    render();
    loadTimer = setTimeout(() => { S.loading = false; render(); }, 460);
  } else {
    S.loading = false;
  }
}

function setOpt(k, v) {
  S[k] = v;
  if (k === "theme") document.documentElement.dataset.theme = v;
  if (k === "scene") S.lb = null;
  if (k === "ver" && v === "old") S.lb = null;
  if (k === "net") {
    if (v === "offline") S.lb = null;
    triggerLoadIfRemote();
  }
  render();
}

  const box = document.getElementById("toastBox");
  box.innerHTML = `<div class="toast">${msg}</div>`;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { box.innerHTML = ""; }, 1800);
}

function curShots() { return SHOTS[S.scene]; }
function isLocal() { return S.net === "local"; }
function isOffline() { return S.net === "cached" || S.net === "offline"; }
function machineLabel() { return isLocal() ? "owner-mac" : "work-mac"; }

function openLB(target, idx) {
  if (S.ver === "old") {
    toast("现状：文件在会话目录外（FILE_REF_KIND_OUTSIDE），灰色不可点击");
    return;
  }
  if (S.net === "offline") {
    toast("work-mac 当前离线，尚未缓存该截图");
    return;
  }
  S.lb = { target, idx, zoom: 1, x: 0, y: 0, pullY: 0, more: false };
  render();
}

function closeLB() {
  S.lb = null;
  render();
}

function toggleMoreLB(e) {
  e.stopPropagation();
  if (!S.lb) return;
  S.lb.more = !S.lb.more;
  render();
}

function stepLB(delta) {
  if (!S.lb) return;
  const list = curShots();
  S.lb.idx = (S.lb.idx + delta + list.length) % list.length;
  S.lb.zoom = 1; S.lb.x = 0; S.lb.y = 0; S.lb.more = false;
  render();
}

function toggleZoomLB() {
  if (!S.lb) return;
  S.lb.more = false;
  if (S.lb.zoom > 1) { S.lb.zoom = 1; S.lb.x = 0; S.lb.y = 0; }
  else { S.lb.zoom = 2.4; S.lb.x = 0; S.lb.y = 40; }
  render();
}

function openMenu(e, shotIdx, platform) {
  e.preventDefault();
  e.stopPropagation();
  if (S.ver === "old") return;
  const shot = curShots()[shotIdx];
  const x = Math.min(window.innerWidth - 190, e.clientX);
  const y = Math.min(window.innerHeight - 190, e.clientY);
  const localItem = isLocal() && platform === "mac"
    ? `<button onclick="closeOverlay();toast('已在访达中定位 ${shot.name}')">${IC.folder}<span>在访达中显示</span></button>`
    : "";
  const saveLabel = platform === "iphone" ? "存储到相册" : "存储到“下载”";
  document.getElementById("overlay").innerHTML = `
    <div class="ctx-mask" onclick="closeOverlay()"></div>
    <div class="ctx-menu" style="left:${x}px;top:${y}px">
      <button onclick="closeOverlay();openLB('${platform}',${shotIdx})">${IC.zoom}<span>打开</span></button>
      <div class="sep"></div>
      <button onclick="closeOverlay();toast('已${saveLabel}：${shot.name}')">${IC.dl}<span>${saveLabel}</span></button>
      ${platform === "iphone" ? `<button onclick="closeOverlay();toast('已调起 iOS 系统分享面板')">${IC.share}<span>分享…</span></button>` : ""}
      ${localItem}
      <button onclick="closeOverlay();toast('已拷贝路径：${shot.path.slice(0, 34)}…')">${IC.copyPath}<span>拷贝路径</span></button>
    </div>
  `;
}

function renderControls() {
  const grp = (label, key, opts) => `<div class="g"><b>${label}</b>${opts.map(([v, t]) =>
    `<button class="${S[key] === v ? "on" : ""}" onclick="setOpt('${key}','${v}')">${t}</button>`
  ).join("")}</div>`;
  return [
    grp("平台", "plat", [["both", "Mac + iPhone 同屏"], ["mac", "Mac 桌面端"], ["iphone", "iPhone 端"]]),
    grp("内容场景", "scene", [["single", "真实会话：单图 + 去重"], ["pair", "长文件名 + 修复前/后双图"]]),
    grp("多机状态", "net", [["local", "本机 (owner-mac)"], ["remote", "远端在线 (中继加载)"], ["cached", "远端离线 · 已缓存"], ["offline", "远端离线 · 未缓存"]]),
    grp("方案对比", "ver", [["new", "新方案"], ["old", "现状"]]),
    grp("外观", "theme", [["light", "浅色"], ["dark", "深色"], ["black", "纯黑"]])
  ].join("");
}

function bindLightboxInteractions() {
  const mStage = document.getElementById("macLbStage");
  const mArt = document.getElementById("macLbArt");
  if (mStage && mArt) {
    mStage.onwheel = (e) => {
      e.preventDefault();
      if (S.lb.more) { S.lb.more = false; render(); return; }
      const next = Math.max(1, Math.min(4, S.lb.zoom * (e.deltaY < 0 ? 1.18 : 0.85)));
      S.lb.zoom = next < 1.08 ? 1 : Number(next.toFixed(2));
      if (S.lb.zoom === 1) { S.lb.x = 0; S.lb.y = 0; }
      mArt.style.transform = `translate(${S.lb.x}px,${S.lb.y}px) scale(${S.lb.zoom})`;
      mArt.classList.toggle("zoomed", S.lb.zoom > 1);
    };
    let drag = null;
    mArt.onpointerdown = (e) => {
      if (!S.lb || S.lb.zoom <= 1) return;
      e.preventDefault();
      mArt.setPointerCapture(e.pointerId);
      mArt.classList.add("dragging");
      drag = { sx: e.clientX - S.lb.x, sy: e.clientY - S.lb.y };
    };
    mArt.onpointermove = (e) => {
      if (!drag) return;
      S.lb.x = e.clientX - drag.sx;
      S.lb.y = e.clientY - drag.sy;
      mArt.style.transform = `translate(${S.lb.x}px,${S.lb.y}px) scale(${S.lb.zoom})`;
    };
    mArt.onpointerup = () => { drag = null; mArt.classList.remove("dragging"); };
  }

  const iArt = document.getElementById("iphoneLbArt");
  if (iArt) {
    let gesture = null;
    iArt.onpointerdown = (e) => {
      if (!S.lb) return;
      if (S.lb.more) { S.lb.more = false; render(); return; }
      e.preventDefault();
      iArt.setPointerCapture(e.pointerId);
      iArt.classList.add("dragging");
      gesture = { sx: e.clientX, sy: e.clientY, ox: S.lb.x, oy: S.lb.y };
    };
    iArt.onpointermove = (e) => {
      if (!gesture || !S.lb) return;
      const dx = e.clientX - gesture.sx;
      const dy = e.clientY - gesture.sy;
      if (S.lb.zoom > 1) {
        S.lb.x = gesture.ox + dx;
        S.lb.y = gesture.oy + dy;
        iArt.style.transform = `translate(${S.lb.x}px,${S.lb.y}px) scale(${S.lb.zoom})`;
      } else {
        S.lb.pullY = dy;
        const ratio = Math.min(1, Math.abs(dy) / 220);
        const sc = 1 - ratio * 0.18;
        iArt.style.transform = `translate(${dx * 0.35}px,${dy}px) scale(${sc})`;
        const lbEl = document.getElementById("iphoneLb");
        if (lbEl) {
          lbEl.style.setProperty("--ilb-a", (0.68 * (1 - ratio * 0.65)).toFixed(2));
          lbEl.style.setProperty("--ilb-b", Math.round(24 * (1 - ratio * 0.7)) + "px");
        }
      }
    };
    iArt.onpointerup = (e) => {
      if (!gesture || !S.lb) return;
      const dx = e.clientX - gesture.sx;
      iArt.classList.remove("dragging");
      if (S.lb.zoom === 1 && Math.abs(S.lb.pullY) > 95) {
        gesture = null;
        closeLB();
        return;
      }
      if (S.lb.zoom === 1 && Math.abs(dx) > 70 && Math.abs(S.lb.pullY) < 50 && curShots().length > 1) {
        gesture = null;
        stepLB(dx < 0 ? 1 : -1);
        return;
      }
      S.lb.pullY = 0;
      gesture = null;
      render();
    };
  }
}

function render() {
  const stage = document.getElementById("stage");
  stage.innerHTML =
    (S.plat === "mac" || S.plat === "both" ? renderMac() : "") +
    (S.plat === "iphone" || S.plat === "both" ? renderIPhone() : "");
  document.getElementById("notes").innerHTML = renderNotes();
  document.getElementById("ctl").innerHTML = renderControls();
  bindLightboxInteractions();
}

window.addEventListener("keydown", (e) => {
  if (!S.lb) return;
  if (e.key === "Escape") { e.preventDefault(); if (S.lb.more) { S.lb.more = false; render(); } else closeLB(); }
  else if (e.key === "ArrowLeft" && curShots().length > 1) { e.preventDefault(); stepLB(-1); }
  else if (e.key === "ArrowRight" && curShots().length > 1) { e.preventDefault(); stepLB(1); }
});

render();
</script>
</body>
</html>
